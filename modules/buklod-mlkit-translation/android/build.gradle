plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'org.mzbministry.buklod.mlkittranslation'
version = '0.1.0'

android {
  namespace "org.mzbministry.buklod.mlkittranslation"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}


//
// BUKLOD ML KIT TRANSLATION
//
dependencies {
    implementation 'com.google.mlkit:translate:17.0.3'
    implementation 'com.google.mlkit:language-id:17.0.6'
}