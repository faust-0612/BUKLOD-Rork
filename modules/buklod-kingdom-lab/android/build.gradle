plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'org.mzbministry.buklod'
version = '1.0.0'
android {
  namespace "expo.modules.buklodlab"
  defaultConfig {
    minSdkVersion 24
    versionCode 1
    versionName '1.0.0'
  }
}
dependencies {
  implementation 'androidx.core:core-ktx:1.17.0'
  implementation 'androidx.appcompat:appcompat:1.7.1'
}
