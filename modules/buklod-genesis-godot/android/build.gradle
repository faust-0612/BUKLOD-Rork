plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'org.mzbministry.buklod'
version = '1.0.0'
android {
  namespace 'expo.modules.buklodgenesisgodot'
  defaultConfig {
    minSdkVersion 24
    versionCode 1
    versionName '1.0.0'
  }
}
dependencies {
  // Maven Central, official engine binary: no runtime engine downloads.
  implementation 'org.godotengine:godot:4.7.2.stable'
}
