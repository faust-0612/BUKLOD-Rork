plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'org.mzbministry.buklod'
version = '1.0.0'
android {
  namespace 'expo.modules.buklodgenesisime'
  defaultConfig {
    minSdkVersion 24
    // Expo's Android module plugin reads these during configuration even for libraries.
    versionCode 1
    versionName '1.0.0'
  }
}
dependencies {
  // REQUIRED FIRST GENESIS APK: these are actual Android AARs, not Expo OTA code.
  implementation 'org.godotengine:godot:4.7.2.stable'
  implementation 'androidx.fragment:fragment:1.9.1'
  implementation 'androidx.core:core-splashscreen:1.2.0'
  implementation 'androidx.media3:media3-transformer:1.11.1'
  implementation 'androidx.media3:media3-common:1.11.1'
  implementation 'androidx.media3:media3-effect:1.11.1'
  implementation 'com.google.android.play:app-update:2.1.0'
  implementation 'com.google.android.gms:play-services-auth:22.0.0'
  implementation 'androidx.core:core-ktx:1.17.0'
  implementation 'androidx.appcompat:appcompat:1.7.1'
}
