# Build and validate a production-identity Android bundle. NO EAS OTA publication.
name: BUKLOD Train A Production RC Identity QA (NO OTA)
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.buklod/scopes/train-a-production-rc-20261118.json'
      - '.github/workflows/buklod-train-a-production-rc-qa-20261118.yml'
permissions:
  contents: read
jobs:
  production-rc-only:
    if: ${{ github.repository == 'faust-0612/BUKLOD-Rork' && github.head_ref == 'release/train-a-prod-rc-noauth-20261118' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      APP_VARIANT: production
      EXPO_PUBLIC_APP_ENV: production
      BUKLOD_APP_TARGET: main
      EXPO_PUBLIC_STREAM_ANDROID_PUSH_PROVIDER_NAME: firebase-video-production
      STAGE_SHA: 6a33d05e85121d3d8a0a6760ef6b2e84c6c6721e
      MAIN_SHA: d8ed8f696b2719c9f70e7797e9b541ab950d744d
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify byte-exact staged application source and unchanged login
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/release/train-a-prod-rc-noauth-20261118 | cut -f1)"
          git fetch --no-tags origin "$STAGE_SHA"
          git diff --exit-code "$STAGE_SHA" HEAD -- src/
          git diff --exit-code "$MAIN_SHA" HEAD -- 'src/app/(auth)/login.tsx' src/providers/AuthProvider.tsx
          GITHUB_REF=refs/heads/main GITHUB_SHA="$(git rev-parse HEAD)" node scripts/buklod-season2-production-embargo.cjs --production
          node <<'NODE'
          const a=require('node:assert/strict');
          const cfg=require('./app.config.js')({config:{}}),e=require('./eas.json');
          a.equal(cfg.android.package,'org.mzbministry.buklod');
          a.equal(cfg.runtimeVersion,'1.3.2');
          a.equal(cfg.extra.appEnvironment,'production');
          a.equal(cfg.extra.appTarget,'main');
          a.equal(e.build.production.channel,'production');
          a.notEqual(e.build.production.channel,e.build['staging-user'].channel);
          NODE
      - name: P0 AdMob, Android tabs, scoped playback, Connect and Bible regression
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node --experimental-strip-types --test \
            tests/train-a-production-stage-parity-20261118.test.mjs \
            tests/train-a-noauth-navigation-ads-20261118.test.mjs \
            tests/dashboard-instant-tabs-20261117.test.mjs \
            tests/dashboard-navigation-auth-20261117.test.mjs \
            tests/fullscreen-video-fair-exposure-20261118.test.cjs \
            tests/fullscreen-video-navigation-reactions-20261117.test.mjs \
            tests/fullscreen-video-session-navigation-20261118.test.mjs \
            tests/scoped-community-video-sidecar-recovery.test.mjs \
            tests/video-handoff-connect-navigation-ads-20261117.test.mjs \
            tests/video-handoff-connect-stability-20261117.test.mjs \
            tests/bible-henry-translation-recovery-20261117.test.cjs \
            tests/buklod-ads-appwide-permanent-lock-20261111.test.mjs \
            tests/buklod-admob-fill-finance-release-20261111.test.mjs \
            tests/production-ota-ads-regression.test.mjs \
            tests/ad-dashboard-focus-performance-20261116.test.mjs
          node scripts/buklod-ad-surface-audit.mjs --summary
          npx tsc --noEmit
          npm run compact:contract
      - name: Check EAS production live AdMob units and export production Hermes JS (NO OTA)
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          mkdir -p /tmp/train-a-production-rc
          npx --yes eas-cli@27.9.0 env:pull --environment production --path /tmp/train-a-production-rc/environment.env --non-interactive >/dev/null
          set -a
          . /tmp/train-a-production-rc/environment.env
          set +a
          export APP_VARIANT=production EXPO_PUBLIC_APP_ENV=production BUKLOD_APP_TARGET=main
          node scripts/verify-production-ads-env.cjs
          node <<'NODE'
          const a=require('node:assert/strict'),c=require('./app.config.js')({config:{}});
          a.equal(c.android.package,'org.mzbministry.buklod');
          a.equal(c.runtimeVersion,'1.3.2');
          a.equal(c.extra.appEnvironment,'production');
          a.equal(c.extra.eas.projectId,'23dad7d0-389a-406e-8dec-08965dab85d8');
          a.equal(process.env.EXPO_PUBLIC_SUPABASE_URL,'https://yhanxndaqbmuzbdqlblu.supabase.co');
          NODE
          EXPO_MAX_WORKERS=2 npx expo export --platform android --output-dir /tmp/train-a-production-rc/export --clear
          test -s /tmp/train-a-production-rc/export/metadata.json
          git diff --exit-code
          echo "PRODUCTION IDENTITY RC VERIFIED - NO PUBLISH. Actual Android AdMob fill/nav device QA still required."
