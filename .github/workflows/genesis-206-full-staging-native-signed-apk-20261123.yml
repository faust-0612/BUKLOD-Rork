name: Genesis 2.0.6 FULL BUKLOD staging — Godot OTA native signed APK
on:
  push:
    branches:
      - dev/genesis-full-staging-godot-ota-native-206-20261123
    paths:
      - '.github/workflows/genesis-206-full-staging-native-signed-apk-20261123.yml'
permissions:
  contents: read
concurrency:
  group: genesis-206-original-signed-full-staging-once
  cancel-in-progress: false
jobs:
  full-staging-original-signer:
    if: github.repository == 'faust-0612/BUKLOD-Rork' && startsWith(github.event.head_commit.message, 'GENESIS_206_SIGNED_STAGING_APK:')
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8" -Dorg.gradle.parallel=false -Dorg.gradle.workers.max=1 -Dorg.gradle.daemon=false'
      BUKLOD_APP_TARGET: main
      APP_VARIANT: staging
      EXPO_PUBLIC_APP_ENV: staging
      EXPO_PUBLIC_BUKLOD_SEASON2_GENESIS_PREVIEW: 'true'
      EXPO_PUBLIC_SOS_NATIVE_R3: 'true'
      EXPO_PUBLIC_BUKLOD_SOS_NATIVE_R3: 'true'
      EXPO_PUBLIC_BUKLOD_ARENA_GODOT_ENABLED: 'true'
      EXPO_PUBLIC_BUKLOD_GENESIS_GODOT_WORLDS: 'true'
      EXPO_PUBLIC_BUKLOD_ARENA_LIBRARY_BUNDLE: 'true'
      EXPO_PUBLIC_BUKLOD_GENESIS_GODOT_V205: 'true'
      EXPO_PUBLIC_BUKLOD_GENESIS_GODOT_V206: 'true'
      EXPO_PUBLIC_BUKLOD_ARENA_EXPERIMENTAL: 'true'
      EXPO_PUBLIC_BUKLOD_ARENA_RANKED_ENABLED: 'false'
      EXPO_PUBLIC_BUKLOD_GENESIS_SHARED_BACKEND_REVIEW: 'true'
      EXPO_PUBLIC_STREAM_ANDROID_PUSH_PROVIDER_NAME: firebase-video-staging
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      SIGNED_APK: /tmp/buklod-genesis-2.0.6-godot-ota-original-signed.apk
    steps:
      - name: Immutable DEV checkout, no production writes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Source ancestry and privileged identity guard
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 435e071da41c83071f545c9b209acb562863f7d2 HEAD
          test -n "$EXPO_TOKEN"
          test "$GITHUB_REF" = refs/heads/dev/genesis-full-staging-godot-ota-native-206-20261123
          git diff --quiet 435e071da41c83071f545c9b209acb562863f7d2 HEAD --             package.json package-lock.json             plugins/withBuklodPttHardwareFoundation.js plugins/withBuklodWebRTC.js             src/providers/AuthProvider.tsx src/providers/ComplianceProvider.tsx             src/components/BuklodConnectThread.tsx src/components/CommunityVideo.tsx
          echo 'EXISTING_STAGING_APP_AND_CRITICAL_FEATURES_PRESERVED'
      - name: Build exact OTA ZIP, pin sha256 and install locked npm dependencies
        run: |
          set -euo pipefail
          node scripts/genesis-prepare-godot-ota-pack.mjs
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/genesis-prepare-skia-binaries.mjs
          node scripts/genesis-assert-native-autolinking.mjs
      - name: Fail before Android release compilation on all critical QA
        run: |
          set -euo pipefail
          npm run release:gate
          npm run genesis:theme:gate
          npx tsc --noEmit
          node <<'NODE'
          const a=require('node:assert/strict'),fs=require('node:fs');
          const app=require('./app.config.js')({config:{}}), e=require('./eas.json');
          const profile=e.build['season2-genesis-godot-ota-native-staging'];
          a.equal(app.android.package,'org.mzbministry.buklod.staging');
          a.equal(app.android.versionCode,18);
          a.equal(app.version,'2.0.6');
          a.equal(app.runtimeVersion,'2.0.6-genesis-godot-ota');
          a.equal(profile.channel,'season2-genesis-library-206-preview');
          a.equal(profile.android.credentialsSource,'remote');
          a.equal(profile.autoIncrement,false);
          a.equal(e.build.production.channel,'production');
          a.equal(process.env.EXPO_PUBLIC_BUKLOD_ARENA_RANKED_ENABLED,'false');
          a.equal(app.plugins.find(p=>Array.isArray(p)&&p[0]==='react-native-google-mobile-ads')[1].androidAppId,
            'ca-app-pub-3940256099942544~3347511713');
          const manifest=fs.readFileSync('src/features/season2/genesis/godotPackManifest.generated.ts','utf8');
          a.match(manifest,/sha256: '[a-f0-9]{64}'/);
          const google=JSON.parse(fs.readFileSync('google-services.production.json','utf8'));
          google.client=google.client.filter(x=>x.client_info?.android_client_info?.package_name===app.android.package);
          a.equal(google.client.length,1,'Existing staging Firebase app registration missing');
          fs.writeFileSync('google-services.staging.json',JSON.stringify(google));
          console.log('GENESIS_206_ORIGINAL_STAGING_SIGNER_AND_GAME_PACK_SOURCE_READY');
          NODE
      - name: Real Godot 4.7.2 project and main scene headless before signing build
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          PACK=assets/season2/genesis/ota/empire-arena.zip
          mkdir -p /tmp/buklod-genesis206-project /tmp/godot472bin
          unzip -q "$PACK" -d /tmp/buklod-genesis206-project
          curl -fLsS --retry 2 --connect-timeout 20 --max-time 240             https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip             -o /tmp/buklod-godot472.zip
          unzip -q /tmp/buklod-godot472.zip -d /tmp/godot472bin
          GODOT=$(find /tmp/godot472bin -type f -name 'Godot_*linux.x86_64' -print -quit)
          test -n "$GODOT"
          chmod +x "$GODOT"
          "$GODOT" --version | grep -F '4.7.2'
          "$GODOT" --headless --path /tmp/buklod-genesis206-project --editor --quit 2>&1 | tee /tmp/genesis206-compile.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|Failed to load script' /tmp/genesis206-compile.log; then exit 1; fi
          for script in smoke.gd art_smoke.gd premium_smoke.gd world_smoke.gd; do
            "$GODOT" --headless --path /tmp/buklod-genesis206-project --script "res://tests/$script" 2>&1 | tee "/tmp/206-$script.log"
            if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|Failed to load script' "/tmp/206-$script.log"; then exit 1; fi
          done
          "$GODOT" --headless --main-pack "$PWD/$PACK" --quit-after 12 2>&1 | tee /tmp/genesis206-pack.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|Failed to load script' /tmp/genesis206-pack.log; then exit 1; fi
          echo 'GENESIS_206_GODOT_REAL_ENGINE_SMOKE_PASS'
      - name: Single original-keystore FULL staging APK compile — local runner, no cloud build
        shell: bash
        timeout-minutes: 95
        run: |
          set -euo pipefail
          MEM_MIB="$(awk '/MemTotal:/{printf "%d", $2 / 1024}' /proc/meminfo)"
          test "$MEM_MIB" -ge 6500 || { echo 'BLOCK: insufficient RAM for R8/Rive'; exit 1; }
          npx --yes eas-cli@27.9.0 whoami --non-interactive >/dev/null
          timeout --signal=TERM --kill-after=30s 90m             npx --yes eas-cli@27.9.0 build --platform android             --profile season2-genesis-godot-ota-native-staging             --local --non-interactive --output="$SIGNED_APK"
          test -s "$SIGNED_APK"
      - name: Verify original staging signing certificate, version code and actual Godot binary
        run: |
          set -euo pipefail
          node scripts/genesis-206-verify-local-eas-signed-apk.mjs             --apk="$SIGNED_APK" --receipt=buklod-genesis-206-signed-native-receipt.json
          sha256sum "$SIGNED_APK" > buklod-genesis-206-signed-apk.sha256
          echo 'GENESIS_206_FULL_STAGING_SIGNED_APK_VERIFIED_DEVICE_QA_PENDING'
      - name: Deliver installable staging APK and proof; NEVER release OTA or production
        uses: actions/upload-artifact@v4
        with:
          name: buklod-genesis-206-full-staging-godot-ota-original-signed-apk
          path: |
            /tmp/buklod-genesis-2.0.6-godot-ota-original-signed.apk
            buklod-genesis-206-signed-native-receipt.json
            buklod-genesis-206-signed-apk.sha256
          if-no-files-found: error
          retention-days: 7
