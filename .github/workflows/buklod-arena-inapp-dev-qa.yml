name: BUKLOD Arena In-App DEV QA
on:
  pull_request:
    paths:
      - 'src/app/games/empire-arena.tsx'
      - 'src/app/games/index.tsx'
      - 'src/features/games/empire/**'
      - 'scripts/ingest-buklod-visual-baseline.mjs'
      - 'tests/empire-arena-v2-*'
      - 'experiments/empire-arena-v2/**'
      - '.github/workflows/buklod-arena-inapp-dev-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test real Arena V2 engine and in-app visual pipeline
        run: |
          node --test \
            tests/empire-arena-v2-inapp-visual-baseline-20261121.test.mjs \
            tests/kingdom-empire-arena-inapp-regression-20261121.test.mjs \
            tests/empire-arena-v2-design-and-simulation.test.mjs \
            tests/empire-arena-v2-world-economy.test.mjs \
            tests/empire-arena-v2-connected-world-preview-20261121.test.mjs
