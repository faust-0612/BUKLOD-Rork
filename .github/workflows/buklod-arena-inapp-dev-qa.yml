name: BUKLOD Arena In-App DEV QA
on:
  pull_request:
    paths:
      - 'src/app/games/empire-arena.tsx'
      - 'src/app/games/index.tsx'
      - 'src/features/games/empire/**'
      - 'scripts/ingest-buklod-visual-baseline.mjs'
      - 'scripts/verify-buklod-arena-motion.py'
      - 'tests/empire-arena-v2-*'
      - 'tests/arena-*-20261121.test.mjs'
      - 'tests/season2-arena-responsive-navigation-20261121.test.mjs'
      - 'experiments/empire-arena-v2/**'
      - '.github/workflows/buklod-arena-inapp-dev-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test real Arena V2 engine and in-app visual pipeline
        run: |
          node --test \
            tests/arena-offline-solo-cpu-battle-20261121.test.mjs \
            tests/arena-premium-voice-motion-terrain-20261121.test.mjs \
            tests/arena-event-audio-graphics-20261121.test.mjs \
            tests/arena-kingdom-game-premium-20261121.test.mjs \
            tests/arena-protected-feature-lock-20261121.test.mjs \
            tests/season2-arena-responsive-navigation-20261121.test.mjs \
            tests/empire-arena-v2-inapp-visual-baseline-20261121.test.mjs \
            tests/kingdom-empire-arena-inapp-regression-20261121.test.mjs \
            tests/empire-arena-v2-presentation-20261121.test.mjs \
            tests/empire-arena-v2-packaged-art-20261121.test.mjs \
            tests/empire-arena-v2-premium-audio-motion-20261121.test.mjs \
            tests/empire-arena-v2-animated-bundle-20261121.test.mjs \
            tests/empire-arena-v2-ranked-reconnect-20261121.test.mjs \
            tests/empire-arena-v2-actor-pose-20261121.test.mjs \
            tests/empire-arena-v2-earned-diamond-claim-20261121.test.mjs \
            tests/empire-arena-v2-design-and-simulation.test.mjs \
            tests/empire-arena-v2-world-economy.test.mjs \
            tests/empire-arena-v2-connected-world-preview-20261121.test.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify decoded fullbody motion frames, pose differentiation, and asset hashes
        run: |
          python -m pip install --disable-pip-version-check --no-input Pillow==12.1.0
          python scripts/verify-buklod-arena-motion.py

  android-metro-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Export actual Android JS and packaged images (NOT APK or OTA)
        run: npx expo export --platform android --output-dir /tmp/buklod-arena-android --clear
      - name: Verify nonempty Android JavaScript/asset export
        run: |
          test -d /tmp/buklod-arena-android
          test "$(find /tmp/buklod-arena-android -type f | wc -l)" -gt 3
          echo "Android Metro export completed; device APK, landscape, audio, rendering and PvP are NOT verified."
