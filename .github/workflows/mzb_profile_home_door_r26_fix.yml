# R26 guarded source-only fix: MZB Ministry Inc profile door -> Organization Home
name: BUKLOD MZB Profile Home Door R26 Fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mzb_profile_home_door_r26_fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Protected rollback snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/buklod-r26-backup"
          cp 'src/components/BuklodProfileMembershipNav.tsx' "$RUNNER_TEMP/buklod-r26-backup/BuklodProfileMembershipNav.tsx.before"
          sha256sum 'src/components/BuklodProfileMembershipNav.tsx' | tee "$RUNNER_TEMP/buklod-r26-backup/BuklodProfileMembershipNav.tsx.before.sha256"
          git rev-parse HEAD | tee "$RUNNER_TEMP/buklod-r26-backup/rollback-commit.txt"

      - name: Patch only MZB root Organization tile
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/components/BuklodProfileMembershipNav.tsx')
          text = path.read_text(encoding='utf-8')

          marker = '/* PATCH_MZB_PROFILE_HOME_DOOR_R26 */'
          if marker not in text:
              text = text.replace(
                  '/* PATCH_169D_PROFILE_MEMBERSHIP_NAV */',
                  '/* PATCH_169D_PROFILE_MEMBERSHIP_NAV */\n' + marker,
                  1,
              )

          old = """    /* PATCH_ORG_PROFILE_SETUP_HUB_R24
     * Root Organization tiles in Profile are management/setup doors.
     * The Organization home is opened deliberately from the Organization
     * directory after the user chooses the exact organization.
     */
    if (tile.kind === 'organization') {
      router.push('/organizations' as any);
      return;
    }
"""

          new = """    /* PATCH_ORG_PROFILE_SETUP_HUB_R24
     * Non-MZB root Organization tiles remain management/setup doors.
     * MZB Ministry Inc is the protected exception: its Profile door opens
     * that exact Organization Home directly.
     */
    if (
      tile.kind === 'organization' &&
      tile.isMzb &&
      tile.scopeId
    ) {
      void enterScopedWorkspace(
        selectScope,
        tile.scopeId,
        { section: 'home' },
      ).catch((error) => {
        console.warn(
          'BUKLOD MZB organization home:',
          error,
        );
      });

      return;
    }

    if (tile.kind === 'organization') {
      router.push('/organizations' as any);
      return;
    }
"""

          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Expected root Organization profile-door anchor not found.')

          old_subtitle = """                    tile.kind === 'organization'
                      ? 'Organization · Setup & management'
                      : kindLabel(tile.kind)
"""
          new_subtitle = """                    tile.kind === 'organization'
                      ? tile.isMzb
                        ? 'Organization · Home'
                        : 'Organization · Setup & management'
                      : kindLabel(tile.kind)
"""

          if old_subtitle in text:
              text = text.replace(old_subtitle, new_subtitle, 1)
          elif new_subtitle not in text:
              raise SystemExit('Expected Organization subtitle anchor not found.')

          required = [
              marker,
              "tile.kind === 'organization' &&",
              'tile.isMzb &&',
              "{ section: 'home' },",
              "router.push('/organizations' as any);",
              "? 'Organization · Home'",
              "'Organization · Setup & management'",
          ]
          for item in required:
              if item not in text:
                  raise SystemExit(f'Missing protected verification anchor: {item}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify zero-regression route separation
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'PATCH_MZB_PROFILE_HOME_DOOR_R26' 'src/components/BuklodProfileMembershipNav.tsx'
          grep -F 'tile.isMzb &&' 'src/components/BuklodProfileMembershipNav.tsx'
          grep -F "{ section: 'home' }," 'src/components/BuklodProfileMembershipNav.tsx'
          grep -F "router.push('/organizations' as any);" 'src/components/BuklodProfileMembershipNav.tsx'
          grep -F "'Organization · Home'" 'src/components/BuklodProfileMembershipNav.tsx'
          grep -F "'Organization · Setup & management'" 'src/components/BuklodProfileMembershipNav.tsx'
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = 'src/components/BuklodProfileMembershipNav.tsx'

      - name: TypeScript QA
        run: |
          npm ci --ignore-scripts
          npx tsc --noEmit

      - name: Commit source fix only after gates pass
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- 'src/components/BuklodProfileMembershipNav.tsx'; then
            echo 'MZB profile Home-door fix is already installed.'
            exit 0
          fi
          git config user.name 'BUKLOD Production Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add 'src/components/BuklodProfileMembershipNav.tsx'
          git commit -m 'fix(profile): open MZB organization tile on Home'
          git push origin HEAD:main

      - name: Stability summary
        run: |
          echo 'WHAT CHANGES: only MZB root Organization Profile tile opens its exact section=home.'
          echo 'WHAT WILL NOT CHANGE: non-MZB Organization setup doors, Sub-org/Cluster routes, env, Supabase, auth, DB/RLS, data, Formation, Quiz, Classroom, APK/AAB/OTA.'
          echo 'VERIFICATION: one-file diff guard + route anchors + git diff --check + TypeScript.'
          echo 'ROLLBACK POINT: pre-patch main commit captured before source write.'
          echo 'NO PRODUCTION DEPLOY is performed by this source-fix workflow.'
