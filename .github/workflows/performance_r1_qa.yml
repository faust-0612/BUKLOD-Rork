name: BUKLOD Performance R1 QA

on:
  push:
    branches:
      - perf/r1-cache-dedupe
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Validate full Kingdom gameplay and account-isolated save/replay flow
        if: github.head_ref == 'dev/kingdom-consolidated-20261107'
        run: |
          node scripts/test-kingdom-game-platform-r1.mjs
          node --experimental-strip-types --test tests/kingdom-*.test.mjs

      - name: Performance R1 contract checks
        shell: bash
        run: |
          grep -F "export async function recordReferral" src/lib/buklodRewards.ts
          grep -F "cachedQuery" src/lib/buklodRewards.ts
          grep -F "acquireSharedRealtimeSubscription" 'src/app/(tabs)/messages.tsx'
          grep -F "clearRealtimeRegistry" src/lib/buklodAuthResilience.ts
          grep -F "get_client_runtime_config: 10_000" src/lib/buklodR4RequestShield.ts
          grep -F "buklod_connect_personal_threads: 10_000" src/lib/buklodR4RequestShield.ts
          grep -F "buklod_connect_community_rooms: 10_000" src/lib/buklodR4RequestShield.ts
          grep -F "buklod_connect_suggested_contacts_v1: 10_000" src/lib/buklodR4RequestShield.ts

      - name: Verify Marites video URL and offline fallback regression
        if: github.head_ref == 'fix/marites-video-blank-recovery-20261027'
        run: node scripts/test-marites-release.cjs

      - name: Unit tests when configured
        shell: bash
        run: |
          if [ -x node_modules/.bin/jest ]; then
            npm test
          else
            echo "Jest runner is not installed by the current repository dependencies; TypeScript and R1 contract checks remain authoritative for this gate."
          fi
