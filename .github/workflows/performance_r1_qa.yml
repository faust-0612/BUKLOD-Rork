name: BUKLOD Performance R1 QA

on:
  push:
    branches:
      - perf/r1-cache-dedupe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test
