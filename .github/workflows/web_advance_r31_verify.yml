name: BUKLOD Web Advance R31 Verify

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/web_advance_r31_verify.yml'

permissions:
  contents: read

jobs:
  verify-live-r31:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production alias matches exact R31 deployment
        shell: bash
        run: |
          set -euo pipefail
          PROD='https://buklod.expo.app'
          DEP='https://buklod--pl674gipyn.expo.app'
          stamp="$(date +%s)"

          curl -fsSL -H 'Cache-Control: no-cache' "$PROD/?verify=$stamp" -o prod.html
          curl -fsSL -H 'Cache-Control: no-cache' "$DEP/?verify=$stamp" -o dep.html

          grep -oE '_expo/static/js/web/[^"'"'"'< >]+\.js' prod.html | sort -u > prod.refs
          grep -oE '_expo/static/js/web/[^"'"'"'< >]+\.js' dep.html | sort -u > dep.refs
          test -s prod.refs
          test -s dep.refs
          diff -u dep.refs prod.refs

          : > prod-all.js
          : > dep-all.js
          i=0
          while read -r ref; do
            i=$((i+1))
            curl -fsSL -H 'Cache-Control: no-cache' "$PROD/$ref?verify=$stamp" -o "prod-$i.js"
            curl -fsSL -H 'Cache-Control: no-cache' "$DEP/$ref?verify=$stamp" -o "dep-$i.js"
            cmp "dep-$i.js" "prod-$i.js"
            cat "prod-$i.js" >> prod-all.js
            cat "dep-$i.js" >> dep-all.js
          done < prod.refs
          cmp dep-all.js prod-all.js

          for token in 'PREVIEW LOCKED' 'ACTIVE CHARACTER' 'Browse all 20 levels' 'CURRENT LEVEL' 'Use This Character'; do
            grep -F "$token" prod-all.js >/dev/null
            echo "$token: PASS"
          done

          for name in phan_r26 quin_r26 van_r26 christian_r26 lhen_r26; do
            grep -F "$name" prod-all.js >/dev/null
            echo "$name regenerated R31 asset reference: PASS"
          done

          echo 'PASS: production alias JS is byte-identical to exact R31 deployment and contains the R31 exact-stage UI + all five regenerated character asset references.'
