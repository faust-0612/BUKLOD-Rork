name: BUKLOD Classroom Identity Source Patch

on:
  push:
    branches:
      - hotfix/classroom-separate-app-identity-20260908-authoritative5

permissions:
  contents: write

jobs:
  patch-source:
    if: ${{ !contains(github.event.head_commit.message, '[classroom-identity-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/classroom-separate-app-identity-20260908-authoritative5
          fetch-depth: 0

      - name: Apply exact target-aware source edits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=None):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              found = text.count(old)
              if count is not None and found != count:
                  raise SystemExit(f'{path}: expected {count} matches, found {found}: {old[:80]!r}')
              if found == 0:
                  raise SystemExit(f'{path}: required pattern missing: {old[:80]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          login = 'src/app/(auth)/login.tsx'
          replace_exact(
              login,
              "import { colors } from '@/lib/theme';\nimport { useAuth } from '@/providers/AuthProvider';",
              "import { colors } from '@/lib/theme';\nimport {\n  BUKLOD_APP_DISPLAY_NAME,\n  BUKLOD_FRESH_LOGIN_HOME,\n  IS_BUKLOD_CLASSROOM,\n} from '@/lib/appTarget';\nimport { useAuth } from '@/providers/AuthProvider';",
              1,
          )
          replace_exact(
              login,
              "  await AsyncStorage.setItem(\n    BUKLOD_FRESH_LOGIN_PUBLIC_INTENT_KEY,\n    '1'\n  );",
              "  if (!IS_BUKLOD_CLASSROOM) {\n    await AsyncStorage.setItem(\n      BUKLOD_FRESH_LOGIN_PUBLIC_INTENT_KEY,\n      '1'\n    );\n  }",
              1,
          )
          replace_exact(
              login,
              "  if (result.error) {\n    await AsyncStorage.removeItem(\n      BUKLOD_FRESH_LOGIN_PUBLIC_INTENT_KEY\n    );\n  }",
              "  if (result.error && !IS_BUKLOD_CLASSROOM) {\n    await AsyncStorage.removeItem(\n      BUKLOD_FRESH_LOGIN_PUBLIC_INTENT_KEY\n    );\n  }",
              1,
          )
          replace_exact(
              login,
              "    router.replace(\n      '/(tabs)/home'\n    );",
              "    router.replace(\n      BUKLOD_FRESH_LOGIN_HOME as any\n    );",
              1,
          )
          replace_exact(
              login,
              "              source={require('../../../assets/release/buklod-generic-photo.jpg')}",
              "              source={\n                IS_BUKLOD_CLASSROOM\n                  ? require('../../../assets/classroom/app-icon.png')\n                  : require('../../../assets/release/buklod-generic-photo.jpg')\n              }",
              1,
          )
          replace_exact(
              login,
              '<Text style={styles.title}>BUKLOD</Text>',
              '<Text style={styles.title}>{BUKLOD_APP_DISPLAY_NAME}</Text>',
              1,
          )
          replace_exact(
              login,
              "              Samahang Binuklod ng Pag-ibig",
              "              {IS_BUKLOD_CLASSROOM\n                ? 'Dedicated teaching and learning'\n                : 'Samahang Binuklod ng Pag-ibig'}",
              1,
          )
          replace_exact(login, "        'BUKLOD',", "        BUKLOD_APP_DISPLAY_NAME,", 2)

          register = 'src/app/(auth)/register.tsx'
          replace_exact(
              register,
              "import { colors } from '@/lib/theme';\nimport { useBuklodDrawerBottomInset } from '@/lib/buklodSafeArea';",
              "import { colors } from '@/lib/theme';\nimport {\n  BUKLOD_FRESH_LOGIN_HOME,\n  IS_BUKLOD_CLASSROOM,\n} from '@/lib/appTarget';\nimport { useBuklodDrawerBottomInset } from '@/lib/buklodSafeArea';",
              1,
          )
          replace_exact(
              register,
              "        router.replace(\n          '/(tabs)/home'\n        );",
              "        router.replace(\n          BUKLOD_FRESH_LOGIN_HOME as any\n        );",
              1,
          )
          replace_exact(
              register,
              "      router.replace('/(tabs)/home');",
              "      router.replace(BUKLOD_FRESH_LOGIN_HOME as any);",
              1,
          )
          replace_exact(
              register,
              "            source={require('../../../assets/release/buklod-generic-photo.jpg')}",
              "            source={\n              IS_BUKLOD_CLASSROOM\n                ? require('../../../assets/classroom/app-icon.png')\n                : require('../../../assets/release/buklod-generic-photo.jpg')\n            }",
              1,
          )
          replace_exact(
              register,
              "            Create BUKLOD Account",
              "            {IS_BUKLOD_CLASSROOM\n              ? 'Create BUKLOD Account for Classroom'\n              : 'Create BUKLOD Account'}",
              1,
          )
          replace_exact(
              register,
              "          'Your BUKLOD account and private onboarding were saved, but Local assignment could not finish. You may continue to Public Home and retry your address setup later.'",
              "          IS_BUKLOD_CLASSROOM\n            ? 'Your BUKLOD account and private onboarding were saved, but Local assignment could not finish. You may continue to BUKLOD Classroom and retry your address setup later.'\n            : 'Your BUKLOD account and private onboarding were saved, but Local assignment could not finish. You may continue to Public Home and retry your address setup later.'",
              1,
          )
          replace_exact(
              register,
              "        'Your BUKLOD account is ready. You can enter the Public Community immediately. Local, Cluster, Church, and Organization memberships can be added separately.'",
              "        IS_BUKLOD_CLASSROOM\n          ? 'Your BUKLOD account is ready. Continue to BUKLOD Classroom. Your account remains usable across approved BUKLOD apps.'\n          : 'Your BUKLOD account is ready. You can enter the Public Community immediately. Local, Cluster, Church, and Organization memberships can be added separately.'",
              1,
          )

          layout = 'src/app/_layout.tsx'
          replace_exact(
              layout,
              "import RorkAvatarOnboardingGate from '@/components/character/RorkAvatarOnboardingGate';",
              "import RorkAvatarOnboardingGate from '@/components/character/RorkAvatarOnboardingGate';\nimport {\n  BUKLOD_APP_DISPLAY_NAME,\n  IS_BUKLOD_CLASSROOM,\n} from '@/lib/appTarget';",
              1,
          )
          replace_exact(
              layout,
              "        Loading BUKLOD...",
              "        Loading {BUKLOD_APP_DISPLAY_NAME}...",
              1,
          )
          replace_exact(
              layout,
              "        <RorkAvatarOnboardingGate />",
              "        {!IS_BUKLOD_CLASSROOM ? <RorkAvatarOnboardingGate /> : null}",
              1,
          )
          replace_exact(
              layout,
              "        <BuklodFormationEntryScopeTracker />",
              "        {!IS_BUKLOD_CLASSROOM ? <BuklodFormationEntryScopeTracker /> : null}",
              1,
          )
          replace_exact(
              layout,
              "              <BuklodPublishBanner />\n              <BuklodEntitlementRouteGuard />\n              <BuklodFocusAppRouteGuard />\n              <BuklodCanonicalNavigationGuard />\n              <BuklodClusterInviteDeepLinkHandler />\n              <BuklodAttendanceDeepLinkHandler />",
              "              {!IS_BUKLOD_CLASSROOM ? <BuklodPublishBanner /> : null}\n              {!IS_BUKLOD_CLASSROOM ? <BuklodEntitlementRouteGuard /> : null}\n              {!IS_BUKLOD_CLASSROOM ? <BuklodFocusAppRouteGuard /> : null}\n              {!IS_BUKLOD_CLASSROOM ? <BuklodCanonicalNavigationGuard /> : null}\n              {!IS_BUKLOD_CLASSROOM ? <BuklodClusterInviteDeepLinkHandler /> : null}\n              {!IS_BUKLOD_CLASSROOM ? <BuklodAttendanceDeepLinkHandler /> : null}",
              1,
          )
          replace_exact(
              layout,
              "                <Stack.Screen name=\"index\" />",
              "                <Stack.Screen name=\"index\" />\n                <Stack.Screen name=\"classroom\" />",
              1,
          )
          replace_exact(
              layout,
              "            <BuklodGuideAvatar />",
              "            {!IS_BUKLOD_CLASSROOM ? <BuklodGuideAvatar /> : null}",
              1,
          )
          PY

      - name: Commit exact source patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BUKLOD Classroom Identity Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/index.tsx src/app/classroom.tsx src/lib/appTarget.ts src/app/'(auth)'/login.tsx src/app/'(auth)'/register.tsx src/app/_layout.tsx
          git diff --cached --check
          git commit -m "[classroom-identity-patch] classroom: isolate runtime shell and auth routing"
          git push origin HEAD:hotfix/classroom-separate-app-identity-20260908-authoritative5
