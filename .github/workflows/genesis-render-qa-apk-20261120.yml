name: BUKLOD Genesis Real Staging Native Render Preview APK - NO BACKEND NO OTA
on:
  push:
    branches:
      - dev/genesis-silent-ota-native-integration-20261120
    paths:
      - .github/workflows/genesis-render-qa-apk-20261120.yml
      - app.config.js
      - index.js
      - src/features/season2/genesis/GenesisRenderQaEntry.tsx
      - tests/genesis-render-qa-isolation-20261120.test.mjs
      - tests/genesis-staging-release-render-identity-20261120.test.mjs
permissions:
  contents: read
concurrency:
  group: buklod-genesis-staging-render-review-20261120
  cancel-in-progress: true
jobs:
  build-genesis-staging-render-review:
    if: ${{ github.repository == 'faust-0612/BUKLOD-Rork' && github.ref == 'refs/heads/dev/genesis-silent-ota-native-integration-20261120' && startsWith(github.event.head_commit.message, 'BUKLOD_GENESIS_RENDER_QA_BUILD:') }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      APP_VARIANT: staging
      EXPO_PUBLIC_APP_ENV: staging
      EXPO_PUBLIC_BUKLOD_SEASON2_GENESIS_PREVIEW: 'true'
      EXPO_PUBLIC_BUKLOD_GENESIS_RENDER_QA: 'true'
      BUKLOD_APP_TARGET: main
      EXPO_PUBLIC_SUPABASE_URL: https://genesis-render-qa.invalid
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_OFFLINE_QA_ONLY_NOT_A_CREDENTIAL
      EXPO_PUBLIC_STREAM_ANDROID_PUSH_PROVIDER_NAME: firebase-video-staging
      GRADLE_OPTS: -Xmx2g -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Create disposable OFFLINE QA Google Services client (not a real Firebase project)
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const cfg=require('./app.config.js')({config:{}});
          assert.equal(cfg.android.package,'org.mzbministry.buklod.staging');
          assert.equal(cfg.updates.enabled,false);
          assert.ok(cfg.android.blockedPermissions.includes('android.permission.INTERNET'));
          const fake={
            project_info:{project_number:'000000000000',project_id:'buklod-genesis-stage-render-offline',storage_bucket:'buklod-genesis-stage-render-offline.invalid'},
            client:[{client_info:{mobilesdk_app_id:'1:000000000000:android:0000000000000000000000',
              android_client_info:{package_name:'org.mzbministry.buklod.staging'}},
              api_key:[{current_key:'AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA'}]}],
            configuration_version:'1'
          };
          fs.writeFileSync('google-services.staging.json',JSON.stringify(fake));
          console.log('STAGING visual review only: no working Supabase, no real Firebase keys, Expo updates disabled, Internet denied');
          NODE
      - name: Locked native source, security and true Genesis rendering components QA
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/genesis-prepare-skia-binaries.mjs
          node scripts/genesis-assert-native-autolinking.mjs
          node --test tests/genesis-render-qa-isolation-20261120.test.mjs tests/genesis-staging-release-render-identity-20261120.test.mjs
          npm run genesis:theme:gate
          node --test tests/genesis-drive-native-foundation-20261120.test.mjs tests/genesis-media3-native-foundation-20261120.test.mjs tests/genesis-godot-native-foundation-20261120.test.mjs tests/genesis-play-core-native-foundation-20261120.test.mjs
          npx tsc --noEmit
      - name: Build self-contained ARM64 RELEASE APK, signed with local TEST key only
        shell: bash
        run: |
          set -euo pipefail
          npx expo prebuild --platform android --clean --no-install
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a --stacktrace
      - name: Verify signed APK, embedded JS and zero INTERNET permission
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          sdk="$ANDROID_HOME/build-tools"
          tools_version="$(ls -1v "$sdk" | tail -1)"
          aapt="$sdk/$tools_version/aapt"
          apksigner="$sdk/$tools_version/apksigner"
          "$apksigner" verify --verbose --print-certs "$apk" > /tmp/genesis-qa-signer.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/genesis-qa-signer.txt
          "$aapt" dump badging "$apk" > /tmp/genesis-qa-badging.txt
          grep -q "package: name='org.mzbministry.buklod.staging'" /tmp/genesis-qa-badging.txt
          "$aapt" dump permissions "$apk" > /tmp/genesis-qa-permissions.txt
          if grep -q 'android.permission.INTERNET' /tmp/genesis-qa-permissions.txt; then
            echo 'BLOCK: offline QA APK has INTERNET permission'; exit 1
          fi
          unzip -Z1 "$apk" > /tmp/genesis-stage-apk-entries.txt
          grep -qx 'assets/index.android.bundle' /tmp/genesis-stage-apk-entries.txt
          test "$(unzip -Z1 "$apk" | grep -c '^lib/arm64-v8a/.*\.so$')" -gt 0
          mkdir -p /tmp/genesis-qa-out
          cp "$apk" /tmp/genesis-qa-out/BUKLOD-Genesis-Staging-Render-Preview-arm64.apk
          sha256sum "$apk" | awk '{print $1}' > /tmp/genesis-qa-out/apk.sha256
          node <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const file='/tmp/genesis-qa-out/BUKLOD-Genesis-Staging-Render-Preview-arm64.apk';
          const hash=crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const signer=fs.readFileSync('/tmp/genesis-qa-signer.txt','utf8');
          const cert=signer.match(/Signer #1 certificate SHA-256 digest: ([0-9a-f]{64})/i);
          if(!cert)throw Error('No QA APK signing certificate');
          fs.writeFileSync('/tmp/genesis-qa-out/receipt.json',JSON.stringify({
            sourceSha:process.env.GITHUB_SHA,package:'org.mzbministry.buklod.staging',
            runtime:'2.0.0-genesis-preview',artifactSha256:hash,signatureSha256:cert[1],
            networkPermission:false,expoOta:false,abi:'arm64-v8a',
            stagingVisualReviewOnly:true,functionalStagingReady:false,
            testSigningOnly:true,production:false,deviceRenderingVerified:false,
            features:'offline visual-only rendering of original Genesis components; no live backend or functionality'
          },null,2)+'\n');
          console.log('VERIFIED OFFLINE QA ARM64 APK:',hash,'TEST CERT:',cert[1]);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: buklod-genesis-staging-render-preview-arm64
          path: /tmp/genesis-qa-out/
          if-no-files-found: error
          retention-days: 7
      - name: No OTA or production release
        if: success()
        run: echo 'Actual staging package, visual-review-only; test signing key, no user data, OTA, Play, Supabase or production changes.'
