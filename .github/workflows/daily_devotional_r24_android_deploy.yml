name: BUKLOD Daily Devotional R24 Android Deploy

on:
  workflow_dispatch:

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  EXPO_PUBLIC_APP_ENV: production
  EXPO_PUBLIC_STREAM_ANDROID_PUSH_PROVIDER_NAME: firebase-video-production
  CI: '1'

permissions:
  contents: read

jobs:
  qa-and-publish:
    if: ${{ false }} # Legacy production publisher retired; use the exact-RC Android workflow.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify Daily Devotional R24
        shell: bash
        run: |
          grep -F 'get_my_daily_devotional' 'src/app/(tabs)/home.tsx'
          grep -F 'BUKLOD_DAILY_DEVOTIONAL_R24_DETAIL' 'src/app/devotional/[id].tsx'
          grep -F 'STORY / ILLUSTRATION' 'src/app/devotional/[id].tsx'
          grep -F 'QUOTATION' 'src/app/devotional/[id].tsx'
          grep -F 'PRACTICAL TODAY' 'src/app/devotional/[id].tsx'
          if grep -F 'OPEN WEEKLY DEVOTIONAL' 'src/app/(tabs)/home.tsx'; then
            echo 'Old weekly devotional UI remains.'
            exit 1
          fi

      - name: TypeScript QA
        run: npx tsc --noEmit

      - name: Expo credential preflight
        run: |
          test -n "$EXPO_TOKEN"
          npx eas-cli@latest whoami --non-interactive

      - name: Publish Android production OTA
        run: |
          npx eas-cli@latest update \
            --channel production \
            --platform android \
            --environment production \
            --message 'BUKLOD Daily Devotional R24' \
            --non-interactive

      - name: Final status
        run: |
          echo 'BUKLOD DAILY DEVOTIONAL R24 ANDROID OTA PUBLISHED'
          echo 'No APK / no AAB / no DB reset.'
