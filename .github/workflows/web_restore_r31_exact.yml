name: BUKLOD Web Restore R31 Exact

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/web_restore_r31_exact.yml'

permissions:
  contents: read

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  promote-exact-r31:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository identity
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies for Expo config resolution
        run: npm ci --ignore-scripts

      - name: Verify restore target
        shell: bash
        run: |
          test "${{ github.repository }}" = "faust-0612/BUKLOD-Rork"
          echo 'Restore target: exact R31 deployment pl674gipyn'
          echo 'Expected immutable URL: https://buklod--pl674gipyn.expo.app'
          echo 'Web alias only; no Android OTA, no DB migration, no source artifact rebuild.'

      - name: Expo credential preflight
        shell: bash
        run: |
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo 'EXPO_TOKEN repository secret is missing.'
            exit 1
          fi

      - name: Promote exact historical R31 deployment to production
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli@latest deploy:alias --prod --id=pl674gipyn --non-interactive

      - name: Restore status
        shell: bash
        run: |
          echo 'Exact R31 deployment promoted to https://buklod.expo.app'
          echo 'Immutable deployment: https://buklod--pl674gipyn.expo.app'
