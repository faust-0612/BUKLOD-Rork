name: BUKLOD V28 Runtime132 Production OTA Status — read only
# Poll exact RC after corrected Expo channel parser (release 725b7173)
on:
  push:
    branches: [codex/v28-action-feedback-cumulative132-20261022]
    paths: ['.github/workflows/v28_feedback_ota_status_readonly.yml']
  pull_request:
    branches: [main]
    paths: ['.github/workflows/v28_feedback_ota_status_readonly.yml']

permissions:
  contents: read
  actions: read

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  EXPO_PUBLIC_APP_ENV: production
  BUKLOD_APP_TARGET: main

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Inspect production workflow execution
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=release/v28-create-feedback-runtime132-20261022&per_page=30" \
            --jq '[.workflow_runs[] | {name, id, status, conclusion, head_sha, created_at}]'
      - name: Read current Expo Android production runtime 1.3.2 OTA
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}"
          npx eas-cli@latest update:list --all --platform android --runtime-version 1.3.2 --limit 3 --json > "$RUNNER_TEMP/current-ota.json"
          node - "$RUNNER_TEMP/current-ota.json" <<'NODE'
          const fs = require('fs');
          const json = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const rows = Array.isArray(json) ? json : (json?.updates ?? json?.data ?? []);
          console.log(JSON.stringify(rows.map(({group, message, runtimeVersion, branch, platforms}) => ({group, message, runtimeVersion, branch, platforms})), null, 2));
          NODE
          echo 'READ_ONLY_NO_UPDATE_PUBLISHED'
