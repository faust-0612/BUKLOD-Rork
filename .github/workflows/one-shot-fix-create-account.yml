name: One-shot Create Account Touch Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-fix-create-account.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make CREATE ACCOUNT independent from login busy state
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/app/(auth)/login.tsx')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r"(<Pressable\s+onPress=\{\(\) => router\.push\('/\(auth\)/register'\)\}\s+)disabled=\{busy\}(\s+style=\{styles\.secondary\})",
              re.MULTILINE,
          )

          replacement = (
              "{/* PATCH_CREATE_ACCOUNT_TOUCH_R1 */}\n"
              "          "+r"\1"+
              "accessibilityRole=\"button\"\n"
              "            accessibilityLabel=\"Create BUKLOD account\"\n"
              "            hitSlop={8}"+
              r"\2"
          )

          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected exactly one CREATE ACCOUNT busy gate; found {count}. No file changed.')

          path.write_text(updated, encoding='utf-8')

      - name: Verify targeted repair
        shell: bash
        run: |
          set -euo pipefail
          grep -F "PATCH_CREATE_ACCOUNT_TOUCH_R1" "src/app/(auth)/login.tsx"
          grep -A10 -F "PATCH_CREATE_ACCOUNT_TOUCH_R1" "src/app/(auth)/login.tsx" | grep -F "router.push('/(auth)/register')"
          if grep -A10 -F "PATCH_CREATE_ACCOUNT_TOUCH_R1" "src/app/(auth)/login.tsx" | grep -F "disabled={busy}"; then
            echo "CREATE ACCOUNT is still tied to busy state" >&2
            exit 1
          fi
          git diff --check
          git diff -- "src/app/(auth)/login.tsx"

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-fix-create-account.yml
          git config user.name "BUKLOD Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "src/app/(auth)/login.tsx" .github/workflows/one-shot-fix-create-account.yml
          git commit -m "fix(auth): keep Create Account button clickable"
          git push origin HEAD:main
