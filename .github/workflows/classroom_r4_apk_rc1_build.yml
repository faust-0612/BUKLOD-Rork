name: BUKLOD Classroom R4 APK RC1 Build

on:
  push:
    branches:
      - release/classroom-r4-apk-rc1-20260908
    paths:
      - '.github/workflows/classroom_r4_apk_rc1_build.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  BUKLOD_APP_TARGET: classroom
  APP_VARIANT: production
  EXPO_PUBLIC_APP_ENV: production
  CLASSROOM_GOOGLE_SERVICES_FILE: ./google-services.classroom.json
  APP_SOURCE_SHA: 7e4c17717b372ae623629ff1d7e4f10ab705fd81

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact Classroom release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SOURCE_SHA }}
          fetch-depth: 1

      - name: Exact source guard
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "APP_SOURCE_SHA=${actual}"
          test "$actual" = "$APP_SOURCE_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify Firebase Classroom client
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const assert = require('node:assert/strict');
          const j = JSON.parse(fs.readFileSync('google-services.classroom.json','utf8'));
          assert.equal(j.project_info?.project_id, 'buklod-efa4a');
          const packages = (j.client || []).map(c => c.client_info?.android_client_info?.package_name).filter(Boolean);
          assert(packages.includes('org.mzbministry.buklod.classroom'));
          assert(packages.includes('org.mzbministry.buklod'));
          assert(packages.includes('org.mzbministry.buklod.staging'));
          console.log('CLASSROOM_FIREBASE_CLIENT=PASS');
          NODE

      - name: Expo auth and isolated Classroom config
        shell: bash
        run: |
          test -n "${EXPO_TOKEN:-}"
          npx eas-cli@latest whoami --non-interactive
          npx expo config --type public --json > /tmp/classroom-config.json
          node <<'NODE'
          const fs = require('fs');
          const assert = require('node:assert/strict');
          const c = JSON.parse(fs.readFileSync('/tmp/classroom-config.json','utf8'));
          assert.equal(c.name, 'BUKLOD Classroom');
          assert.equal(c.slug, 'buklod-classroom');
          assert.equal(c.scheme, 'buklod-classroom');
          assert.equal(c.android.package, 'org.mzbministry.buklod.classroom');
          assert.equal(c.android.googleServicesFile, './google-services.classroom.json');
          assert.equal(c.extra?.eas?.projectId, '14100ed1-7f25-4551-9627-09d280498241');
          assert.equal(c.extra?.appTarget, 'classroom');
          console.log('CLASSROOM_CONFIG=PASS');
          NODE

      - name: TypeScript gate
        run: npx tsc --noEmit

      - name: Fresh web export regression gate
        run: npx expo export --platform web --output-dir dist-classroom-rc1

      - name: Existing production web runtime smoke
        shell: bash
        run: |
          status="$(curl -L -sS --retry 12 --retry-delay 5 --retry-all-errors -o /tmp/classroom-live.html -w '%{http_code}' https://buklod-classroom.expo.app/)"
          echo "CLASSROOM_WEB_HTTP=${status}"
          test "$status" = '200'
          test -s /tmp/classroom-live.html
          grep -Eq '<script|_expo' /tmp/classroom-live.html

      - name: Clean Android prebuild and native Firebase verification
        shell: bash
        run: |
          rm -rf android
          npx expo prebuild --platform android --clean --no-install
          test -f android/app/google-services.json
          node <<'NODE'
          const fs = require('fs');
          const assert = require('node:assert/strict');
          const j = JSON.parse(fs.readFileSync('android/app/google-services.json','utf8'));
          const packages = (j.client || []).map(c => c.client_info?.android_client_info?.package_name).filter(Boolean);
          assert(packages.includes('org.mzbministry.buklod.classroom'));
          console.log('ANDROID_GOOGLE_SERVICES=PASS');
          NODE
          grep -R -F 'org.mzbministry.buklod.classroom' android/app/build.gradle android/app/src/main/AndroidManifest.xml android/app/src/main/java android/app/src/main/kotlin 2>/dev/null | head -20
          grep -R -E 'google-services|com.google.gms.google-services' android/app/build.gradle android/build.gradle android/settings.gradle 2>/dev/null | head -20 || true

      - name: TypeScript recheck after prebuild
        run: npx tsc --noEmit

      - name: Build Classroom production APK on EAS
        id: eas_build
        shell: bash
        run: |
          set -o pipefail
          npx eas-cli@latest build --platform android --profile classroom-production-apk --non-interactive --wait 2>&1 | tee classroom-apk-build.txt

      - name: Capture Classroom build metadata
        if: always()
        shell: bash
        run: |
          npx eas-cli@latest build:list --platform android --limit 5 --json --non-interactive > classroom-builds.json || true
          cat classroom-builds.json || true

      - name: Preserve release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classroom-r4-apk-rc1-${{ github.run_number }}
          path: |
            classroom-apk-build.txt
            classroom-builds.json
          if-no-files-found: ignore
