name: BUKLOD Staging Android APK (Gradle, no EAS)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_VARIANT: staging
      EXPO_PUBLIC_APP_ENV: staging
      BUKLOD_APP_TARGET: main
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      STAGING_FIREBASE_JSON_B64: ${{ secrets.STAGING_FIREBASE_JSON_B64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Reject missing staging isolation (before costly build)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || { echo 'Missing STAGING_SUPABASE_URL'; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || { echo 'Missing STAGING_SUPABASE_PUBLISHABLE_KEY'; exit 1; }
          test -n "$STAGING_FIREBASE_JSON_B64" || { echo 'Missing STAGING_FIREBASE_JSON_B64'; exit 1; }
          case "$EXPO_PUBLIC_SUPABASE_URL" in
            *yhanxndaqbmuzbdqlblu*) echo 'Production Supabase is forbidden'; exit 1;;
            https://*.supabase.co) ;;
            *) echo 'Invalid staging Supabase URL'; exit 1;;
          esac
          printf '%s' "$STAGING_FIREBASE_JSON_B64" | base64 -d > google-services.staging.json
          node -e "const c=require('./google-services.staging.json');if(!c.client?.some(x=>x.client_info?.android_client_info?.package_name==='org.mzbministry.buklod.staging'))process.exit(1)"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm ci --ignore-scripts
      - name: Verify runtime and identity
        run: |
          node - <<'NODE'
          const cfg=require('./app.config.js')({config:{extra:{}}});
          if(cfg.runtimeVersion!=='1.3.2'||cfg.android.package!=='org.mzbministry.buklod.staging')throw Error('Staging identity/runtime mismatch');
          console.log('Staging identity/runtime verified');
          NODE
      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build unsigned staging debug APK locally
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --max-workers=2
      - name: Preserve installable APK
        uses: actions/upload-artifact@v4
        with:
          name: buklod-staging-runtime-1.3.2-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
