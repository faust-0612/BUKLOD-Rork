name: One-time R4 TypeScript QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one_time_r4_qa.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript QA
        run: npx tsc --noEmit
      - name: Verify R4 wiring
        shell: bash
        run: |
          grep -F "createBuklodR4RequestShield" src/lib/supabase.ts
          grep -F "buklod_cluster_home_notices" src/lib/buklodR4RequestShield.ts
          grep -F "buklod_scope_social_feed_v1" src/lib/buklodR4RequestShield.ts
      - name: Record QA pass and remove workflow
        shell: bash
        run: |
          git config user.name "BUKLOD Automation"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/one_time_r4_qa.yml
          git add .github/workflows/one_time_r4_qa.yml
          git commit -m "chore: confirm BUKLOD R4 TypeScript QA"
          git pull --rebase origin main
          git push origin HEAD:main
