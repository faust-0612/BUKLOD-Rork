name: Rork Media Import

on:
  push:
    branches:
      - feature/rork-home-kingdom-native-integration-r1
    paths:
      - .github/workflows/rork_asset_import.yml

permissions:
  contents: write

jobs:
  import-media:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: feature/rork-home-kingdom-native-integration-r1

      - name: Download approved Rork media
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://kp3ge50a5t6chyb7gv3jn-web.rork.live"
          mkdir -p assets/kingdom/rork/bg assets/kingdom/rork/audio

          for f in             citadel_hall.webp council_terrace.webp forest_trail.webp frontier_camp.webp             harbour_quay.webp harvest_terrace.webp resonance_stage.webp sunspire_ruins.webp             treasury_vault.webp village_yard.webp
          do
            curl -fL --retry 3 --connect-timeout 15 "$BASE/kingdom/bg/$f" -o "assets/kingdom/rork/bg/$f"
            test -s "assets/kingdom/rork/bg/$f"
          done

          for f in             amb_desert.mp3 amb_forest.mp3 amb_hall.mp3 amb_harbour.mp3 amb_market.mp3             beat_combo.mp3 beat_hit.mp3 build_hit.mp3 coins.mp3 game_enter.mp3 mission_go.mp3             pickup.mp3 retry.mp3 success.mp3 ui_confirm.mp3 ui_tap.mp3 unlock.mp3
          do
            curl -fL --retry 3 --connect-timeout 15 "$BASE/kingdom/audio/$f" -o "assets/kingdom/rork/audio/$f"
            test -s "assets/kingdom/rork/audio/$f"
          done

          echo "Imported $(find assets/kingdom/rork/bg -type f | wc -l) backgrounds."
          echo "Imported $(find assets/kingdom/rork/audio -type f | wc -l) audio files."

      - name: Commit imported media
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "buklod-rork-integration"
          git config user.email "actions@users.noreply.github.com"
          git add assets/kingdom/rork
          if git diff --cached --quiet; then
            echo "Assets already present; nothing to commit."
            exit 0
          fi
          git commit -m "feat(rork): add Kingdom visual and audio assets [rork-assets]"
          git push origin HEAD:feature/rork-home-kingdom-native-integration-r1
