name: BUKLOD Classroom Identity Restore + Web Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - feature/classroom-harmonized-r4-current-main-20260908
    paths:
      - '.github/workflows/classroom_identity_web_restore.yml'

permissions:
  contents: write

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  BUKLOD_APP_TARGET: classroom
  EXPO_PUBLIC_BUKLOD_APP_TARGET: classroom
  APP_VARIANT: production
  EXPO_PUBLIC_APP_ENV: production
  CLASSROOM_GOOGLE_SERVICES_FILE: ./google-services.classroom.json

jobs:
  restore-classroom-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Classroom source
        uses: actions/checkout@v4
        with:
          ref: feature/classroom-harmonized-r4-current-main-20260908
          fetch-depth: 0

      - name: Apply deterministic Classroom identity repair
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-classroom-identity-restore.py
          # The GitHub App token intentionally has no workflows scope. Keep
          # the existing R4 QA workflow unchanged here; this release executor
          # independently runs the required identity/type/test/export/runtime gates.
          git checkout -- .github/workflows/classroom_r4_qa.yml

      - name: Commit repaired Classroom source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.config.js package.json src/app/index.tsx 'src/app/(tabs)/_layout.tsx' 'src/app/(auth)/login.tsx' src/app/+html.tsx src/app/classroom/index.tsx src/lib/appTarget.ts scripts/verify-classroom-identity.mjs .classroom-source-lock
          git diff --cached --check
          git commit -m 'classroom: permanently restore standalone app identity'
          git push origin HEAD:feature/classroom-harmonized-r4-current-main-20260908
          echo "CLASSROOM_REPAIR_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify Classroom source/config/Firebase identity
        run: node scripts/verify-classroom-identity.mjs

      - name: Expo authentication
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          npx eas-cli@latest whoami --non-interactive >/dev/null

      - name: Pull Classroom production public environment
        shell: bash
        run: |
          set -euo pipefail
          rm -f .env.local
          npx eas-cli@latest env:pull --environment production --path .env.local --non-interactive
          test -s .env.local
          set -a
          . ./.env.local
          set +a
          test -n "${EXPO_PUBLIC_SUPABASE_URL:-}"
          test -n "${EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}"
          test "$EXPO_PUBLIC_SUPABASE_URL" = 'https://yhanxndaqbmuzbdqlblu.supabase.co'
          while IFS='=' read -r name _; do
            case "$name" in
              EXPO_PUBLIC_*)
                value="${!name-}"
                {
                  echo "${name}<<__CLASSROOM_ENV__"
                  printf '%s\n' "$value"
                  echo '__CLASSROOM_ENV__'
                } >> "$GITHUB_ENV"
                ;;
            esac
          done < <(grep -E '^[A-Za-z_][A-Za-z0-9_]*=' .env.local)

      - name: TypeScript and Classroom live-state tests
        shell: bash
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npx jest src/lib/education/classroomLiveState.test.ts --runInBand

      - name: Expo Classroom identity audit
        shell: bash
        run: |
          set -euo pipefail
          npx expo config --type public --json > /tmp/classroom-expo.json
          node <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('/tmp/classroom-expo.json','utf8'));
          const ok=c.name==='BUKLOD Classroom' && c.slug==='buklod-classroom' && c.scheme==='buklod-classroom' && c.android?.package==='org.mzbministry.buklod.classroom' && c.extra?.appTarget==='classroom' && c.extra?.eas?.projectId==='14100ed1-7f25-4551-9627-09d280498241';
          if(!ok){ console.error(c); process.exit(1); }
          console.log('EXPO_CLASSROOM_IDENTITY=PASS');
          NODE

      - name: Export Classroom web
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          npx expo export --platform web --output-dir dist
          test -s dist/index.html
          grep -RFl --include='*.js' 'BUKLOD Classroom' dist >/dev/null
          echo 'CLASSROOM_WEB_EXPORT=PASS'

      - name: Deploy Classroom web production
        run: npx eas-cli@latest deploy --prod --environment production --non-interactive

      - name: Verify live Classroom web runtime
        shell: bash
        run: |
          set -euo pipefail
          URL='https://buklod-classroom.expo.app/'
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          sleep 4
          curl -fsSIL --max-time 30 "$URL" >/dev/null
          timeout 50s "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-extensions --no-first-run --window-size=390,844 --virtual-time-budget=22000 --enable-logging=stderr --v=0 --dump-dom "$URL" > /tmp/classroom-dom.html 2> /tmp/classroom-browser.log
          ! grep -qi 'supabaseUrl is required' /tmp/classroom-browser.log
          ! grep -Eqi 'Uncaught (Error|TypeError|ReferenceError|SyntaxError)' /tmp/classroom-browser.log
          grep -q '<div id="root"><' /tmp/classroom-dom.html
          grep -q 'BUKLOD Classroom' /tmp/classroom-dom.html
          ! grep -q 'Samahang Binuklod ng Pag-ibig' /tmp/classroom-dom.html
          echo 'LIVE_BUKLOD_CLASSROOM_RUNTIME=PASS'

      - name: Final status
        run: |
          echo "CLASSROOM_REPAIR_SHA=$CLASSROOM_REPAIR_SHA"
          echo 'BUKLOD Classroom source/config/web identity restore: VERIFIED'
