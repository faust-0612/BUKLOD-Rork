name: BUKLOD Genesis Full Functional Staging APK - No OTA No Prod
on:
  push:
    branches:
      - dev/genesis-season-wordmark-appwide-20261120
      - dev/genesis-silent-ota-native-integration-20261120
    paths:
      - .github/workflows/genesis-season2-staging-release-apk-20261120.yml
      - tests/genesis-staging-live-backend-review-20261120.test.mjs
      - tests/genesis-staging-native-apk-release-20261120.test.mjs
      - tests/genesis-apk-binary-proof-20261120.test.mjs
permissions:
  contents: read
concurrency:
  group: buklod-genesis-season2-staging-native-apk-20261120
  cancel-in-progress: false
jobs:
  genesis-staging-apk:
    if: ${{ github.repository == 'faust-0612/BUKLOD-Rork' && (github.ref == 'refs/heads/dev/genesis-season-wordmark-appwide-20261120' || github.ref == 'refs/heads/dev/genesis-silent-ota-native-integration-20261120') && startsWith(github.event.head_commit.message, 'BUKLOD_GENESIS_STAGING_APK_START:') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      APP_VARIANT: staging
      EXPO_PUBLIC_APP_ENV: staging
      EXPO_PUBLIC_BUKLOD_SEASON2_GENESIS_PREVIEW: 'true'
      BUKLOD_APP_TARGET: main
      EXPO_PUBLIC_STREAM_ANDROID_PUSH_PROVIDER_NAME: firebase-video-staging
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      STAGING_FIREBASE_JSON_B64: ${{ secrets.STAGING_FIREBASE_JSON_B64 }}
    steps:
      - name: Exact isolated Genesis source; never change main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked Expo dependencies before EAS env pull
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/genesis-prepare-skia-binaries.mjs
          node scripts/genesis-assert-native-autolinking.mjs
          node --test tests/genesis-native-autolinking-reality-20261120.test.mjs tests/genesis-staging-live-backend-review-20261120.test.mjs
          node --test tests/genesis-apk-binary-proof-20261120.test.mjs
          node --test tests/genesis-skia-native-binary-install-20261120.test.mjs
          node --test tests/genesis-play-core-native-foundation-20261120.test.mjs tests/genesis-media3-native-foundation-20261120.test.mjs tests/genesis-godot-native-foundation-20261120.test.mjs tests/genesis-drive-native-foundation-20261120.test.mjs
      - name: Resolve exact Firebase staging client and authorized shared live BUKLOD backend
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}" || { echo 'BLOCK: Expo token absent'; exit 1; }
          if [ -n "${STAGING_FIREBASE_JSON_B64:-}" ]; then
            printf '%s' "$STAGING_FIREBASE_JSON_B64" | base64 -d > google-services.staging.json
          else
            node <<'NODE'
          const fs=require('node:fs'), assert=require('node:assert/strict');
          const data=JSON.parse(fs.readFileSync('google-services.production.json','utf8'));
          const clients=(data.client||[]).filter(c=>c.client_info?.android_client_info?.package_name==='org.mzbministry.buklod.staging');
          assert.equal(clients.length,1,'Registered Android staging Firebase client missing');
          data.client=clients;
          fs.writeFileSync('google-services.staging.json',JSON.stringify(data));
          NODE
          fi
          node <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const eas=JSON.parse(fs.readFileSync('eas.json','utf8'));
          const env=eas.build['season2-genesis-preview'].env;
          assert.equal(env.EXPO_PUBLIC_BUKLOD_GENESIS_SHARED_BACKEND_REVIEW,'true');
          assert.equal(env.EXPO_PUBLIC_APP_ENV,'staging');
          assert.equal(env.EXPO_PUBLIC_BUKLOD_SEASON2_GENESIS_PREVIEW,'true');
          assert.equal(env.EXPO_PUBLIC_SUPABASE_URL,'https://yhanxndaqbmuzbdqlblu.supabase.co');
          assert.match(env.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY,/^sb_publishable_[a-zA-Z0-9_-]+$/);
          assert.equal(eas.build.production.env.EXPO_PUBLIC_BUKLOD_GENESIS_SHARED_BACKEND_REVIEW,undefined);
          assert.equal(eas.build.production.env.EXPO_PUBLIC_SUPABASE_URL,undefined);
          fs.appendFileSync(process.env.GITHUB_ENV,
            'EXPO_PUBLIC_SUPABASE_URL='+env.EXPO_PUBLIC_SUPABASE_URL+'\n'+
            'EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY='+env.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY+'\n'+
            'EXPO_PUBLIC_BUKLOD_GENESIS_SHARED_BACKEND_REVIEW=true\n');
          console.log('Authorized Genesis staging shares existing BUKLOD production-live account/data APIs; no backend mutation.');
          NODE
      - name: Fail closed unless signed full-functionality Genesis staging identity is exact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git merge-base HEAD 06db398e0dc936250dd680fac160d2bfe7b116eb)" = 06db398e0dc936250dd680fac160d2bfe7b116eb
          test -n "${EXPO_TOKEN:-}" || { echo 'BLOCK: no Expo staging token; no APK'; exit 1; }
          test -s google-services.staging.json || { echo 'BLOCK: no staging Firebase client; no APK'; exit 1; }
          test -n "${EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}" || { echo 'BLOCK: no staging publishable key'; exit 1; }
          [[ "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" == sb_publishable_* ]] || { echo 'BLOCK: no public staging key'; exit 1; }
          [[ "$EXPO_PUBLIC_SUPABASE_URL" =~ ^https://[a-z0-9-]+\.supabase\.co$ ]] || { echo 'BLOCK: malformed staging backend'; exit 1; }
          # OWNER-AUTHORIZED SHARED LIVE BACKEND FOR EXISTING FUNCTIONALITY, NOT SEASON 2 REWARD ACTIVATION.
          [[ "$EXPO_PUBLIC_BUKLOD_GENESIS_SHARED_BACKEND_REVIEW" == true ]] || { echo 'BLOCK: no explicit staging shared-backend opt-in'; exit 1; }
          [[ "$EXPO_PUBLIC_SUPABASE_URL" == https://yhanxndaqbmuzbdqlblu.supabase.co ]] || { echo 'BLOCK: unexpected Supabase project'; exit 1; }
          [[ "$EXPO_PUBLIC_SUPABASE_URL" != *oppswibwjrruxkrpiwej* && "$EXPO_PUBLIC_SUPABASE_URL" != *cjtehbfspgimyhifnjon* ]] || { echo 'BLOCK: wrong secondary BUKLOD project'; exit 1; }
          node <<'NODE'
          const assert=require('node:assert/strict');
          const firebase=require('./google-services.staging.json');
          assert.ok(firebase.client?.some(c=>c.client_info?.android_client_info?.package_name==='org.mzbministry.buklod.staging'),
            'Missing exact Android staging Firebase client');
          const cfg=require('./app.config.js')({config:{}});
          const eas=require('./eas.json');
          assert.equal(cfg.android.package,'org.mzbministry.buklod.staging');
          assert.equal(cfg.runtimeVersion,'2.0.0-genesis-preview');
          assert.equal(cfg.name,'BUKLOD Staging');
          assert.equal(cfg.version,'2.0.0');
          assert.equal(cfg.extra.appTarget,'main');
          assert.equal(cfg.extra.appEnvironment,'staging');
          assert.equal(cfg.plugins.find(p=>Array.isArray(p)&&p[0]==='react-native-google-mobile-ads')[1].androidAppId,
            'ca-app-pub-3940256099942544~3347511713');
          assert.equal(eas.build['season2-genesis-preview'].channel,'season2-genesis-preview');
          assert.equal(eas.build['season2-genesis-preview'].env.EXPO_PUBLIC_SUPABASE_URL,'https://yhanxndaqbmuzbdqlblu.supabase.co');
          assert.equal(eas.build['season2-genesis-preview'].env.EXPO_PUBLIC_BUKLOD_GENESIS_SHARED_BACKEND_REVIEW,'true');
          assert.equal(eas.build['season2-genesis-preview'].environment,'preview');
          assert.equal(eas.build['season2-genesis-preview'].android.buildType,'apk');
          assert.equal(eas.build.production.channel,'production');
          assert.notEqual(cfg.runtimeVersion,'1.3.2','Never push Genesis JS to old production native runtime');
          console.log('Genesis staging package/version/runtime/channel, public backend and AdMob test ID PASS; production release remains isolated');
          NODE
      - name: Install exact npm lock and run prior source gates
        shell: bash
        run: |
          set -euo pipefail
          npm run genesis:theme:gate
          node --test tests/genesis-staging-native-apk-release-20261120.test.mjs tests/genesis-staging-live-backend-review-20261120.test.mjs tests/genesis-android-native-gif-drawer-backup-20261120.test.mjs tests/genesis-native-build-inventory-20261120.test.mjs
          node --experimental-strip-types --test tests/buklod-silent-ota-policy.test.mjs tests/buklod-mandatory-update-runtime.test.mjs tests/ota-restart-safe-area.test.cjs
          node scripts/season2-native-capability-gate.mjs --mode=source
          npx tsc --noEmit
      - name: Bundle Android preview JS before native signing
        shell: bash
        run: |
          set -euo pipefail
          npx expo export --platform android --output-dir /tmp/buklod-genesis-preview-export
          test -n "$(find /tmp/buklod-genesis-preview-export -type f -print -quit)"
      - name: Authoritative Expo credentials and remote signing
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@27.9.0 whoami --non-interactive >/dev/null
          # Remote staging versionCode avoids local autoIncrement mismatch; runner-only edit.
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const p='eas.json',e=JSON.parse(fs.readFileSync(p,'utf8'));
          assert.equal(e.build['season2-genesis-preview'].autoIncrement,true);
          e.cli.appVersionSource='remote';
          fs.writeFileSync(p,JSON.stringify(e,null,2)+'\n');
          NODE
          npx --yes eas-cli@27.9.0 build --platform android --profile season2-genesis-preview --non-interactive --wait --json > /tmp/buklod-genesis-stage-apk.json
      - name: Validate actual EAS build receipt (no release claim without artifact)
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs'),a=require('node:assert/strict');
          const raw=JSON.parse(fs.readFileSync('/tmp/buklod-genesis-stage-apk.json','utf8'));
          const b=Array.isArray(raw)?raw[0]:raw;
          a.equal(String(b.status).toLowerCase(),'finished');
          a.equal(String(b.platform).toLowerCase(),'android');
          a.match(String(b.id),/^[0-9a-f-]{36}$/i);
          if(b.gitCommitHash)a.equal(String(b.gitCommitHash).toLowerCase(),process.env.GITHUB_SHA.toLowerCase());
          const url=b.artifacts?.buildUrl??b.artifacts?.applicationArchiveUrl;
          a.match(String(url||''),/^https:\/\//);
          fs.writeFileSync('buklod-genesis-stage-build-receipt.json',JSON.stringify({
            sourceSha:process.env.GITHUB_SHA,easBuildId:b.id,status:b.status,artifactUrl:url,
            expectedPackage:'org.mzbministry.buklod.staging',expectedRuntime:'2.0.0-genesis-preview',
            channel:'season2-genesis-preview',sharedBackend:'EXISTING_BUKLOD_MAIN_FOR_PROD_LIVE_FEATURES_ONLY',
            nativeDeviceQA:'PENDING',otaPublished:false,
          },null,2)+'\n');
          console.log('Staging APK EAS receipt exists; NOT an installed-device or OTA verification');
          NODE
      - name: Inspect actual signed staging APK SHA256, cert, identity and universal ABIs
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/genesis-apk-binary-proof-20261120.test.mjs
          node scripts/genesis-verify-signed-apk.mjs --receipt=buklod-genesis-stage-build-receipt.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: buklod-genesis-staging-apk-build-receipt
          path: buklod-genesis-stage-build-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: OTA is intentionally not published by an APK build
        if: success()
        run: |
          echo 'New Genesis runtime requires installed staging APK and device acceptance before any season2-genesis-preview OTA.'
          echo 'No production / Play / web / Supabase / OTA publication performed by this workflow.'
