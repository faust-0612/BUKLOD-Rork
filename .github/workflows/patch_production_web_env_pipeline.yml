name: BUKLOD Patch Production Web Env Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch_production_web_env_pipeline.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch production web workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/production_web_deploy.yml')
          text = path.read_text(encoding='utf-8-sig')

          marker = "      - name: Export production web\n"
          if marker not in text:
              raise SystemExit('Export production web marker not found.')

          if 'Pull EAS production environment' not in text:
              insert = '''      - name: Pull EAS production environment
        if: steps.expo.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .env.local
          npx eas-cli@latest env:pull --environment production --path .env.local --non-interactive
          test -s .env.local
          set -a
          . ./.env.local
          set +a
          test -n "${EXPO_PUBLIC_SUPABASE_URL:-}"
          test -n "${EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}"
          case "$EXPO_PUBLIC_SUPABASE_URL" in
            https://*.supabase.co) ;;
            *) echo 'Invalid production Supabase URL shape.'; exit 1 ;;
          esac
          echo 'EAS production Supabase public config: READY'

'''
              text = text.replace(marker, insert + marker, 1)

          old = '          npx eas-cli@latest deploy --prod --non-interactive\n'
          new = '          npx eas-cli@latest deploy --prod --environment production --non-interactive\n'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('EAS deploy command marker not found.')

          path.write_text(text, encoding='utf-8')
          PY

          grep -F 'Pull EAS production environment' .github/workflows/production_web_deploy.yml
          grep -F 'EXPO_PUBLIC_SUPABASE_URL' .github/workflows/production_web_deploy.yml
          grep -F 'EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY' .github/workflows/production_web_deploy.yml
          grep -F 'deploy --prod --environment production --non-interactive' .github/workflows/production_web_deploy.yml

      - name: Commit permanent pipeline fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows/production_web_deploy.yml; then
            echo 'Production web workflow already patched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/production_web_deploy.yml
          git commit -m 'Fix production web Supabase environment loading'
          git push origin HEAD:main
