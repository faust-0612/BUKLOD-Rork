name: BUKLOD Home Kingdom Standalone Web QA

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/app/personal-home/**'
      - 'src/app/games/**'
      - 'src/standalone/**'
      - 'src/components/standalone/**'
      - 'src/lib/buklodStandaloneEntry.ts'
      - 'supabase/functions/buklod-surface-main-entry-v1/**'
      - 'scripts/*standalone-web.mjs'
      - 'app.config.js'
      - 'package.json'
      - '.github/workflows/home_kingdom_standalone_web_qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-web-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Target isolation contract
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const factory = require('./app.config.js');

          const keys = [
            'BUKLOD_APP_TARGET',
            'APP_VARIANT',
            'EXPO_PUBLIC_APP_ENV',
            'EAS_PROJECT_ID',
            'EXPO_PUBLIC_EAS_PROJECT_ID',
            'BUKLOD_HOME_EAS_PROJECT_ID',
            'BUKLOD_KINGDOM_EAS_PROJECT_ID',
            'CLASSROOM_GOOGLE_SERVICES_FILE',
          ];
          for (const key of keys) delete process.env[key];

          const main = factory({ config: { extra: {} } });
          assert.equal(main.name, 'BUKLOD');
          assert.equal(main.slug, 'buklod');
          assert.equal(main.extra.appTarget, 'main');
          assert.equal(main.extra.eas.projectId, '23dad7d0-389a-406e-8dec-08965dab85d8');
          assert.equal(main.android.package, 'org.mzbministry.buklod');

          process.env.BUKLOD_APP_TARGET = 'home';
          const home = factory({ config: { extra: {} } });
          assert.equal(home.name, 'BUKLOD Home');
          assert.equal(home.slug, 'buklod-home');
          assert.equal(home.scheme, 'buklod-home');
          assert.equal(home.extra.appTarget, 'home');
          assert.equal(home.extra.eas, undefined);
          assert.equal(home.android.package, 'org.mzbministry.buklod.home');
          assert.equal(home.android.googleServicesFile, undefined);
          assert.deepEqual(
            home.plugins.find((item) => Array.isArray(item) && item[0] === 'expo-router'),
            ['expo-router', { root: './src/standalone/home' }],
          );

          process.env.BUKLOD_APP_TARGET = 'kingdom';
          const kingdom = factory({ config: { extra: {} } });
          assert.equal(kingdom.name, 'BUKLOD Kingdom');
          assert.equal(kingdom.slug, 'buklod-kingdom');
          assert.equal(kingdom.scheme, 'buklod-kingdom');
          assert.equal(kingdom.extra.appTarget, 'kingdom');
          assert.equal(kingdom.extra.eas, undefined);
          assert.equal(kingdom.android.package, 'org.mzbministry.buklod.kingdom');
          assert.equal(kingdom.android.googleServicesFile, undefined);
          assert.deepEqual(
            kingdom.plugins.find((item) => Array.isArray(item) && item[0] === 'expo-router'),
            ['expo-router', { root: './src/standalone/kingdom' }],
          );

          console.log('HOME_KINGDOM_TARGET_ISOLATION=PASS');
          NODE

      - name: Main launch-only contract
        shell: bash
        run: |
          grep -F 'target="home"' src/app/personal-home/_layout.web.tsx
          grep -F 'target="kingdom"' src/app/games/_layout.web.tsx
          grep -F 'buklod-surface-main-entry-v1' src/lib/buklodStandaloneEntry.ts
          grep -F 'buklod_surface_token_hash' src/components/standalone/BuklodStandaloneSessionGate.tsx
          grep -F 'verifyOtp' src/components/standalone/BuklodStandaloneSessionGate.tsx
          grep -F 'admin.auth.getUser' supabase/functions/buklod-surface-main-entry-v1/index.ts
          grep -F 'admin.auth.admin.generateLink' supabase/functions/buklod-surface-main-entry-v1/index.ts

      - name: Export Home standalone web
        env:
          EXPO_NO_TELEMETRY: '1'
        run: node scripts/export-standalone-web.mjs home dist-home-qa

      - name: Export Kingdom standalone web
        env:
          EXPO_NO_TELEMETRY: '1'
        run: node scripts/export-standalone-web.mjs kingdom dist-kingdom-qa

      - name: Verify standalone outputs
        shell: bash
        run: |
          test -f dist-home-qa/index.html
          test -f dist-kingdom-qa/index.html
          test -n "$(find dist-home-qa/_expo/static/js -type f -name '*.js' -print -quit)"
          test -n "$(find dist-kingdom-qa/_expo/static/js -type f -name '*.js' -print -quit)"
          echo "HOME_KINGDOM_STANDALONE_EXPORT=PASS"
