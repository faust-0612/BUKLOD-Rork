name: BUKLOD Train A Prod Legacy Media Contract QA (NO OTA)
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/community-video-playback-recovery.test.mjs'
      - 'tests/unified-social-media-rendering.test.mjs'
      - '.buklod/scopes/train-a-prod-legacy-media-tests-20261118.json'
      - '.github/workflows/train-a-prod-legacy-video-contracts-20261118.yml'
permissions:
  contents: read
jobs:
  media-contract:
    if: github.repository == 'faust-0612/BUKLOD-Rork' && github.head_ref == 'fix/train-a-prod-legacy-media-gates-20261118'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact production legacy media tests and playback/Ads contracts
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test tests/unified-social-media-rendering.test.mjs tests/community-video-playback-recovery.test.mjs
          node --experimental-strip-types --test tests/video-handoff-connect-navigation-ads-20261117.test.mjs tests/scoped-community-video-sidecar-recovery.test.mjs tests/fullscreen-video-session-navigation-20261118.test.mjs
          node --test tests/buklod-ads-appwide-permanent-lock-20261111.test.mjs
          node scripts/buklod-season2-production-embargo.cjs --production
