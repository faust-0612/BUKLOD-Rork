name: BUKLOD Web RC Preview Runtime Gate

on:
  pull_request:
    branches:
      - release/buklod-main-final-rc-20260923
    paths:
      - 'src/**'
      - 'assets/**'
      - 'app.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web_rc_preview_runtime_gate.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  web-preview-runtime-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify candidate lineage
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          git status --short
          test -z "$(git status --porcelain)"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --include=dev

      - name: Expo authentication
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}"
          npx eas-cli@latest whoami --non-interactive

      - name: Pull production public environment
        shell: bash
        run: |
          set -euo pipefail
          rm -f .env.local
          npx eas-cli@latest env:pull --environment production --path .env.local --non-interactive
          test -s .env.local
          set -a
          . ./.env.local
          set +a
          test -n "${EXPO_PUBLIC_SUPABASE_URL:-}"
          test -n "${EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}"
          test "${EXPO_PUBLIC_SUPABASE_URL}" = 'https://yhanxndaqbmuzbdqlblu.supabase.co'

          while IFS='=' read -r name _; do
            case "$name" in
              EXPO_PUBLIC_*)
                value="${!name-}"
                {
                  echo "${name}<<__BUKLOD_ENV__"
                  printf '%s\n' "$value"
                  echo '__BUKLOD_ENV__'
                } >> "$GITHUB_ENV"
                ;;
            esac
          done < <(grep -E '^[A-Za-z_][A-Za-z0-9_]*=' .env.local)

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Export web candidate
        shell: bash
        env:
          NODE_ENV: production
          EXPO_PUBLIC_APP_ENV: production
          BUKLOD_WEB_OUTPUT: single
        run: |
          set -euo pipefail
          rm -rf dist
          npx expo export --platform web --output-dir dist --clear
          test -s dist/index.html
          find dist -type f | head -100 > web-files.txt
          grep -RFl --include='*.js' 'yhanxndaqbmuzbdqlblu.supabase.co' dist/_expo/static/js/web >/dev/null
          echo 'WEB_EXPORT_PASS'

      - name: Deploy preview only
        id: preview
        shell: bash
        env:
          NODE_ENV: production
          EXPO_PUBLIC_APP_ENV: production
          BUKLOD_WEB_OUTPUT: single
        run: |
          set -euo pipefail
          npx eas-cli@latest deploy --environment production --non-interactive 2>&1 | tee preview-deploy.txt
          PREVIEW_URL="$(grep -Eo 'https://buklod--[A-Za-z0-9-]+\.expo\.app' preview-deploy.txt | tail -1)"
          test -n "$PREVIEW_URL"
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "Preview: $PREVIEW_URL"

      - name: Install Chromium runtime gate
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser cold-start + logo + sign-in gate
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/buklod-web-runtime-gate.cjs <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const base = process.env.PREVIEW_URL;
            if (!base) throw new Error('PREVIEW_URL missing');

            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({
              viewport: { width: 390, height: 844 },
            });

            const pageErrors = [];
            const consoleErrors = [];
            page.on('pageerror', e => pageErrors.push(String(e?.stack || e)));
            page.on('console', msg => {
              if (msg.type() === 'error') consoleErrors.push(msg.text());
            });

            const response = await page.goto(base, {
              waitUntil: 'domcontentloaded',
              timeout: 60000,
            });

            if (!response || response.status() >= 400) {
              throw new Error('Root HTTP failure: ' + (response?.status() ?? 'no-response'));
            }

            await page.waitForTimeout(350);
            const earlyText = await page.locator('body').innerText().catch(() => '');
            const earlyHtml = await page.locator('body').innerHTML().catch(() => '');
            await page.screenshot({ path: 'web-rc-cold-start.png', fullPage: true });

            const brandSeen =
              /Your Daily Companion in Life/i.test(earlyText) ||
              /BUKLOD/i.test(earlyText) ||
              /app-icon/i.test(earlyHtml);

            await page.waitForTimeout(3000);
            const rootText = (await page.locator('body').innerText().catch(() => '')).trim();
            const rootHtml = (await page.locator('body').innerHTML().catch(() => '')).trim();

            if (!rootText && rootHtml.length < 200) {
              throw new Error('WHITE_SCREEN_ROOT: body has no meaningful rendered content');
            }

            if (!brandSeen) {
              throw new Error('BRAND_STARTUP_NOT_OBSERVED');
            }

            if (pageErrors.length) {
              throw new Error('ROOT_PAGEERROR: ' + pageErrors.join(' || '));
            }

            const loginUrl = base.replace(/\/$/, '') + '/login';
            const loginResponse = await page.goto(loginUrl, {
              waitUntil: 'domcontentloaded',
              timeout: 60000,
            });
            if (!loginResponse || loginResponse.status() >= 400) {
              throw new Error('Login HTTP failure: ' + (loginResponse?.status() ?? 'no-response'));
            }

            await page.waitForTimeout(2500);
            await page.screenshot({ path: 'web-rc-login.png', fullPage: true });

            const loginText = (await page.locator('body').innerText().catch(() => '')).trim();
            const inputCount = await page.locator('input').count().catch(() => 0);

            if (!loginText || inputCount < 1) {
              throw new Error('LOGIN_RUNTIME_NOT_RENDERED');
            }

            if (pageErrors.length) {
              throw new Error('LOGIN_PAGEERROR: ' + pageErrors.join(' || '));
            }

            console.log(JSON.stringify({
              previewUrl: base,
              rootTextLength: rootText.length,
              loginTextLength: loginText.length,
              loginInputCount: inputCount,
              consoleErrors: consoleErrors.slice(0, 20),
              pageErrors,
              brandSeen,
            }, null, 2));

            await browser.close();
          })().catch(error => {
            console.error(error?.stack || error);
            process.exit(1);
          });
          NODE

          node /tmp/buklod-web-runtime-gate.cjs | tee web-runtime-gate.txt

      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buklod-web-rc-runtime-${{ github.run_id }}
          path: |
            preview-deploy.txt
            web-runtime-gate.txt
            web-rc-cold-start.png
            web-rc-login.png
            web-files.txt
          if-no-files-found: ignore

      - name: Production guard
        shell: bash
        run: |
          echo 'PREVIEW ONLY — production alias was not changed.'
