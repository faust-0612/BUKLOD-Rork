name: BUKLOD Recovery OTP Provider Probe

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/recovery_otp_provider_probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_VERIFY_SERVICE_SID: ${{ secrets.TWILIO_VERIFY_SERVICE_SID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RECOVERY_FROM_EMAIL: ${{ secrets.RECOVERY_FROM_EMAIL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Fetch recovery service status
        id: status
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl --fail --silent --show-error \
            -X POST 'https://yhanxndaqbmuzbdqlblu.supabase.co/functions/v1/account-recovery-otp-v1' \
            -H 'content-type: application/json' \
            --data '{"action":"service_status"}')"
          node -e "const x=JSON.parse(process.argv[1]); if(!x.ok) process.exit(2);" "$BODY"
          SMS_READY="$(node -e "const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.smsReady===true))" "$BODY")"
          EMAIL_READY="$(node -e "const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.emailReady===true))" "$BODY")"
          echo "sms_ready=$SMS_READY" >> "$GITHUB_OUTPUT"
          echo "email_ready=$EMAIL_READY" >> "$GITHUB_OUTPUT"

      - name: SMS provider ready
        if: steps.status.outputs.sms_ready == 'true'
        run: echo 'SMS provider is configured in Supabase.'

      - name: SMS provider not ready
        if: steps.status.outputs.sms_ready != 'true'
        run: echo 'SMS provider is not configured in Supabase.'

      - name: Email provider ready
        if: steps.status.outputs.email_ready == 'true'
        run: echo 'Email provider is configured in Supabase.'

      - name: Email provider not ready
        if: steps.status.outputs.email_ready != 'true'
        run: echo 'Email provider is not configured in Supabase.'

      - name: GitHub Twilio secrets present
        if: env.TWILIO_ACCOUNT_SID != '' && env.TWILIO_AUTH_TOKEN != '' && env.TWILIO_VERIFY_SERVICE_SID != ''
        run: echo 'GitHub has all Twilio recovery secrets.'

      - name: GitHub Twilio secrets missing
        if: env.TWILIO_ACCOUNT_SID == '' || env.TWILIO_AUTH_TOKEN == '' || env.TWILIO_VERIFY_SERVICE_SID == ''
        run: echo 'GitHub does not have the complete Twilio recovery secret set.'

      - name: GitHub Resend secrets present
        if: env.RESEND_API_KEY != '' && env.RECOVERY_FROM_EMAIL != ''
        run: echo 'GitHub has all Resend recovery secrets.'

      - name: GitHub Resend secrets missing
        if: env.RESEND_API_KEY == '' || env.RECOVERY_FROM_EMAIL == ''
        run: echo 'GitHub does not have the complete Resend recovery secret set.'

      - name: GitHub Supabase access token present
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: echo 'GitHub has a Supabase access token.'

      - name: GitHub Supabase access token missing
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo 'GitHub does not have a Supabase access token.'
