name: One-time formation submission R2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one_time_fix_formation_submission_r2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Fix lesson submit flow
        run: echo '' | base64 -d | python3
      - name: Install dependencies
        run: npm ci
      - name: TypeScript QA
        run: npx tsc --noEmit
      - name: Commit source fix and remove one-time workflow
        run: |
          git config user.name "BUKLOD Automation"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/one_time_fix_formation_submission_r2.yml
          git add src/components/LearningQuestionResponse.tsx .github/workflows/one_time_fix_formation_submission_r2.yml
          git commit -m "fix(formation): submit directly to Cluster Admin validation"
          git push origin HEAD:main
