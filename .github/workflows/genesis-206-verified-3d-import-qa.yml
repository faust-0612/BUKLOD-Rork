name: Genesis 2.0.6 verified CC0 3D imports — consolidated offline QA
on:
  push:
    branches:
      - dev/genesis-206-verified-3d-import-20261124
    paths:
      - '.github/workflows/genesis-206-verified-3d-import-qa.yml'
permissions:
  contents: read
concurrency:
  group: genesis-206-verified-3d-import-source
  cancel-in-progress: true
jobs:
  real-3d-content:
    if: github.repository == 'faust-0612/BUKLOD-Rork'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_VARIANT: staging
      EXPO_PUBLIC_APP_ENV: staging
      BUKLOD_APP_TARGET: main
      BUKLOD_GENESIS_PREMIUM_3D: 'true'
      EXPO_PUBLIC_BUKLOD_ARENA_RANKED_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Immutable native staging source, no prod/ads/auth/Connect edits
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 83e744e66c60a43917d6d048794d4d83de80bc3a HEAD
          test -z "$(git diff --name-only 83e744e66c60a43917d6d048794d4d83de80bc3a HEAD -- modules app.config.js eas.json package.json package-lock.json src plugins)"
          node --test tests/genesis-premium-world-content-ota-20261123.test.mjs tests/genesis-206-3d-import.test.mjs \
            tests/dashboard-ad-navigation-prewarm-20261116.test.mjs tests/ad-dashboard-focus-performance-20261116.test.mjs
      - name: Import 20 Git-blob-pinned CC0 GLB binaries and build exact Godot OTA ZIP
        run: |
          set -euo pipefail
          node scripts/genesis-import-verified-3d.mjs
          node scripts/genesis-prepare-godot-ota-pack.mjs
          python3 - <<'PY'
          import json,zipfile,hashlib
          a='assets/season2/genesis/ota/empire-arena.zip'
          with zipfile.ZipFile(a) as z:
              m=json.loads(z.read('data/3d_manifest.json'))
              assert len(m['models'])==20 and m['license']=='CC0-1.0'
              for model in m['models']:
                  b=z.read('3d/kenney/'+model['id']+'.glb')
                  assert b[:4]==b'glTF' and len(b)==model['bytes']
                  assert hashlib.sha256(b).hexdigest()==model['sha256']
              x=json.loads(z.read('data/audio_manifest.json'))
              assert x['count']==70 and x['prototype'] is False
          print('20_REAL_CC0_GLB_70_REAL_SFX_OTA_ZIP_HASH_AND_LICENSE_READY')
          PY
          unzip -t assets/season2/genesis/ota/empire-arena.zip | tail -2
      - name: Real Godot 4.7.2 import and 3D runtime locomotion test
        run: |
          set -euo pipefail
          mkdir -p /tmp/godot472 /tmp/3dproject
          curl -fLsS --retry 2 --connect-timeout 20 --max-time 240 \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            -o /tmp/godot472.zip
          unzip -q /tmp/godot472.zip -d /tmp/godot472
          GODOT="$(find /tmp/godot472 -type f -name 'Godot_*linux.x86_64' -print -quit)"
          test -n "$GODOT"
          chmod +x "$GODOT"
          "$GODOT" --version | grep -F '4.7.2'
          unzip -q assets/season2/genesis/ota/empire-arena.zip -d /tmp/3dproject
          "$GODOT" --headless --path /tmp/3dproject --editor --import --quit 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|Failed to load script' /tmp/import.log; then exit 1; fi
          for test_script in art_smoke.gd premium_smoke.gd world_smoke.gd premium_content_smoke.gd premium_3d_import_smoke.gd; do
            "$GODOT" --headless --path /tmp/3dproject -s "res://tests/$test_script" 2>&1 | tee "/tmp/$test_script.log"
            if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|Failed to load script' "/tmp/$test_script.log"; then exit 1; fi
          done
          "$GODOT" --headless --main-pack "$PWD/assets/season2/genesis/ota/empire-arena.zip" --quit-after 12 \
            2>&1 | tee /tmp/packed.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|Failed to load script' /tmp/packed.log; then exit 1; fi
          echo 'GENESIS_206_3D_REAL_MODEL_IMPORT_DEV_QA_PASS_NO_OTA_PUBLISHED'
      - name: Preserve exact 2.0.6 staging game ZIP for eventual OTA compatibility review
        uses: actions/upload-artifact@v4
        with:
          name: buklod-genesis-206-real-3d-kenney-cc0-content-dev-only
          path: |
            assets/season2/genesis/ota/empire-arena.zip
            src/features/season2/genesis/godotPackManifest.generated.ts
          if-no-files-found: error
          retention-days: 7
