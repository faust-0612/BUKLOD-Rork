name: Genesis Dimensional Map DEV Source & Android (NO OTA)
on:
  push:
    branches:
      - dev/genesis-dimensional-map-motion-20261121
permissions:
  contents: read
concurrency:
  group: genesis-dimensional-entry-motion-qa
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      APP_VARIANT: staging
      BUKLOD_APP_TARGET: main
      EXPO_PUBLIC_APP_ENV: staging
      EXPO_PUBLIC_BUKLOD_SEASON2_GENESIS_PREVIEW: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Approved-map routing and motion regressions
        run: |
          node --test tests/genesis-dimensional-entry-map-motion-20261121.test.mjs
          node --test tests/season2-approved-portrait-art-20261121.test.mjs tests/season2-special-events-welcome-20261121.test.mjs tests/genesis-world-navigation-regression-20261121.test.mjs tests/season2-one-tap-kingdom-guide-20261121.test.mjs
          node scripts/genesis-map-reconstruction-preflight.mjs
      - name: Existing immutable Expo dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full TypeScript
        run: npx tsc --noEmit
      - name: Android Metro bundle with existing JPEG rescue
        run: node scripts/season2-android-bundle-compatibility.mjs --compile
      - name: Nothing deploys
        run: echo "No OTA, Android APK release, Supabase or production writes."
