name: BUKLOD AdMob Firebase read-only gate
# Manual only. Lists the existing Firebase project, billing flag, and Hosting
# sites. It does not deploy, create a channel, or change the Expo alias.
on:
  workflow_dispatch:
    inputs:
      project_number:
        description: Numeric project number from Firebase Project settings. Not a secret.
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  readonly-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require a numeric project number
        env:
          PROJECT_NUMBER: ${{ inputs.project_number }}
        run: python3 -c 'import os,re,sys; sys.exit(0 if re.fullmatch(r"[0-9]{6,20}", os.environ.get("PROJECT_NUMBER","")) else 1)'
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: buklod-connect
          workload_identity_provider: projects/${{ inputs.project_number }}/locations/global/workloadIdentityPools/buklod-github-actions/providers/github
          service_account: buklod-hosting-reader@buklod-connect.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
      - name: Read project, Spark billing flag, and Hosting sites
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          FIREBASE_PROJECT_ID: buklod-connect
        run: python3 scripts/admob-firebase-readonly-gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admob-firebase-readonly-gate
          path: admob-evidence/firebase-readonly-gate.json
          retention-days: 30
          if-no-files-found: warn
