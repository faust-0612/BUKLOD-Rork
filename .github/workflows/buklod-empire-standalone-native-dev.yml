name: BUKLOD Empire standalone Android — local Gradle DEV APK
on:
  push:
    branches:
      - dev/buklod-empire-standalone-native-20261124
    paths:
      - '.github/workflows/buklod-empire-standalone-native-dev.yml'
      - 'apps/buklod-empire/**'
      - 'scripts/build-buklod-empire-standalone.mjs'
      - 'scripts/verify-buklod-empire-android.sh'
      - 'scripts/verify-buklod-empire-frame.py'
      - 'tests/buklod-empire-standalone-contract.test.mjs'
      - 'tests/buklod-empire-ota.test.mjs'
      - 'scripts/build-buklod-empire-ota.mjs'
      - 'scripts/verify-buklod-empire-ota-godot.sh'
      - 'scripts/prepare-buklod-empire-ota-fixture.mjs'
      - 'scripts/buklod-empire-storage.mjs'
      - 'scripts/setup-buklod-empire-dev-trust.sh'
      - 'tests/buklod-empire-release-trust.test.mjs'
permissions:
  contents: read
concurrency:
  group: buklod-empire-standalone-dev
  cancel-in-progress: true
jobs:
  native-empire:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BUKLOD_GENESIS_PREMIUM_3D: 'true'
      BUKLOD_EMPIRE_OTA_CHANNEL: dev
      BUKLOD_EMPIRE_OTA_PUBLIC_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Source contract and original reviewed game content
        run: |
          set -euo pipefail
          node --test tests/buklod-empire-standalone-contract.test.mjs tests/buklod-empire-ota.test.mjs tests/buklod-empire-release-trust.test.mjs
          bash -n scripts/setup-buklod-empire-dev-trust.sh
          node --check scripts/buklod-empire-storage.mjs
          node scripts/genesis-import-verified-3d.mjs
          node scripts/build-buklod-empire-standalone.mjs
      - name: Real Godot engine signature, delta mount, interruption recovery and rollback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/empire-godot
          curl -fLsS --retry 2 --connect-timeout 20 --max-time 240 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/empire-godot.zip
          unzip -q /tmp/empire-godot.zip -d /tmp/empire-godot
          GODOT="$(find /tmp/empire-godot -type f -name 'Godot_*linux.x86_64' -print -quit)"
          chmod +x "$GODOT"
          "$GODOT" --version | grep -F '4.7.2'
          bash scripts/verify-buklod-empire-ota-godot.sh "$GODOT"
          # Verify the exact generated APK project parses and boots before Android compilation.
          timeout 60s "$GODOT" --headless --path apps/buklod-empire/app/src/main/assets --quit-after 60 2>&1 | tee /tmp/empire-exact-boot.log
          grep -F 'BUKLOD_EMPIRE_MENU_RENDERED' /tmp/empire-exact-boot.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error' /tmp/empire-exact-boot.log; then exit 1; fi
      - name: Native Gradle build and binary identity, no Expo or Vercel
        run: |
          set -euo pipefail
          gradle -p apps/buklod-empire :app:assembleRelease --no-daemon
          APK=apps/buklod-empire/app/build/outputs/apk/release/app-release.apk
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          TOOLS="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$TOOLS/aapt" dump badging "$APK" > build/buklod-empire/apk-badging.txt
          grep -F "package: name='org.mzbministry.buklod.empire'" build/buklod-empire/apk-badging.txt
          "$TOOLS/apksigner" verify --print-certs "$APK" > build/buklod-empire/signing.txt
          unzip -Z1 "$APK" > build/buklod-empire/apk-entries.txt
          grep -Fx 'assets/project.godot' build/buklod-empire/apk-entries.txt
          grep -Fx 'assets/scenes/EmpireMenu.tscn' build/buklod-empire/apk-entries.txt
          grep -Fx 'assets/scenes/EmpireBoot.tscn' build/buklod-empire/apk-entries.txt
          grep -Fx 'assets/scripts/empire_ota.gd' build/buklod-empire/apk-entries.txt
          grep -Fx 'assets/empire-ota/config.json' build/buklod-empire/apk-entries.txt
          grep -E '^lib/arm64-v8a/.*godot.*\.so$' build/buklod-empire/apk-entries.txt
          grep -E '^lib/x86_64/.*godot.*\.so$' build/buklod-empire/apk-entries.txt
          if grep -E 'assets/index.android.bundle|lib/[^/]+/libhermes.so' build/buklod-empire/apk-entries.txt; then exit 1; fi
          sha256sum "$APK" > build/buklod-empire/apk-sha256.txt
          stat -c %s "$APK" > build/buklod-empire/apk-bytes.txt
      - name: Enable KVM and visual proof dependency
        run: |
          python3 -m pip install --disable-pip-version-check Pillow
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual Android launch and four game worlds, battle and return
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/verify-buklod-empire-android.sh
      - name: Deliver Android-tested QA-only APK (not owner-signed, remote OTA disabled)
        uses: actions/upload-artifact@v4
        with:
          name: BUKLOD-Empire-QA-ONLY-not-release-signed
          path: |
            apps/buklod-empire/app/build/outputs/apk/release/app-release.apk
            build/buklod-empire/content-receipt.json
            build/buklod-empire/ota-baseline.json
            build/buklod-empire/apk-badging.txt
            build/buklod-empire/signing.txt
            build/buklod-empire/apk-sha256.txt
            build/buklod-empire/apk-bytes.txt
            build/buklod-empire/android-qa/
          if-no-files-found: error
          retention-days: 7
      - name: Diagnostics only when failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BUKLOD-Empire-failed-qa-diagnostics
          path: |
            build/buklod-empire/android-qa/
            build/buklod-empire/content-receipt.json
          if-no-files-found: ignore
          retention-days: 7
