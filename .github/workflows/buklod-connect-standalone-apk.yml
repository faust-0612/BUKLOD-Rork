name: BUKLOD Connect — Production-Package QA APK

on:
  push:
    branches:
      - feature/buklod-connect-standalone-apple-green-20261115
    paths:
      - '.github/workflows/buklod-connect-standalone-apk.yml'
      - 'src/components/BuklodConnectStandaloneHome.tsx'
      - 'src/components/BuklodConnectStandaloneRoot.tsx'
      - 'src/app/(tabs)/messages.tsx'
      - 'src/app/personal-home/ptt.tsx'
      - 'src/lib/buklodConnectStandalone.ts'
      - 'tests/buklod-connect-standalone.test.mjs'
      - 'assets/connect/**'
      - 'app.config.js'
      - 'eas.json'
      - 'scripts/connect-native-identity-preflight.cjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buklod-connect-qa-apk-only
  cancel-in-progress: false

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exact source and independent native app identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --test tests/buklod-connect-standalone.test.mjs
          node --check scripts/connect-native-identity-preflight.cjs
          echo 'CONNECT_SOURCE_CONTRACT_OK'
      - name: Install dependencies for native JS and TypeScript validation
        run: npm ci --ignore-scripts
      - name: Verify compiler and Android JavaScript bundle in isolated Connect mode
        shell: bash
        env:
          BUKLOD_APP_TARGET: connect
          EXPO_PUBLIC_BUKLOD_APP_TARGET: connect
          APP_VARIANT: staging
          EXPO_PUBLIC_APP_ENV: staging
        run: |
          set -euo pipefail
          npx tsc --noEmit
          node <<'NODE' >> "$GITHUB_ENV"
          const c = require('./eas.json').build['connect-qa-apk'].env;
          console.log('EXPO_PUBLIC_SUPABASE_URL='+c.EXPO_PUBLIC_SUPABASE_URL);
          console.log('EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY='+c.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY);
          NODE
      - name: Android JS bundle smoke (no EAS credits)
        env:
          BUKLOD_APP_TARGET: connect
          EXPO_PUBLIC_BUKLOD_APP_TARGET: connect
          APP_VARIANT: staging
          EXPO_PUBLIC_APP_ENV: staging
        run: |
          set -euo pipefail
          npx expo export --platform android --output-dir /tmp/connect-js-android-export
          echo 'CONNECT_ANDROID_JS_BUNDLE_OK'

  qa-apk:
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CONNECT_EAS_PROJECT_ID: fbc71093-6abb-43e6-9493-14b2c8117df8
      CONNECT_FIREBASE_JSON_B64: ${{ secrets.CONNECT_FIREBASE_JSON_B64 }}
      BUKLOD_APP_TARGET: connect
      EXPO_PUBLIC_BUKLOD_APP_TARGET: connect
      APP_VARIANT: staging
      EXPO_PUBLIC_APP_ENV: staging
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm dedicated credentials before costly installs or builds
        run: |
          set -euo pipefail
          node scripts/connect-native-identity-preflight.cjs
      - name: Install once after prerequisite gate
        run: npm ci
      - name: Compile and verify standalone Expo config
        shell: bash
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npx expo config --json > /tmp/connect-qa-apk-expo-config.json
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const c = JSON.parse(fs.readFileSync('/tmp/connect-qa-apk-expo-config.json','utf8'));
          assert.equal(c.android.package, 'org.mzbministry.buklod.connect');
          assert.equal(c.name, 'BUKLOD Connect');
          assert.equal(c.runtimeVersion, 'connect-1.0.0');
          assert.equal(c.extra?.appTarget, 'connect');
          assert.equal(c.extra?.eas?.projectId, 'fbc71093-6abb-43e6-9493-14b2c8117df8');
          assert.equal(c.android.googleServicesFile, './google-services.connect.json');
          assert.equal(c.scheme, 'buklod-connect');
          assert.equal(c.updates.url, 'https://u.expo.dev/fbc71093-6abb-43e6-9493-14b2c8117df8');
          console.log('CONNECT_NATIVE_IDENTITY_OK');
          NODE
      - name: Build signed independent APK - never publish main OTA
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli@latest whoami --non-interactive > /dev/null
          npx eas-cli@latest build --platform android --profile connect-qa-apk --non-interactive --wait
          echo 'CONNECT_APK_EAS_FINISHED'
