name: BUKLOD Godot Approved Visual Art Native QA
on:
  push:
    branches:
      - dev/arena-godot-approved-asset-intake-20261122
    paths:
      - .github/workflows/arena-godot-art-native-qa-20261122.yml
      - godot/empire-arena/**
      - scripts/build-empire-godot-pack.mjs
permissions:
  contents: read
jobs:
  native-art-headless:
    if: github.repository == 'faust-0612/BUKLOD-Rork' && startsWith(github.event.head_commit.message, 'BUKLOD_GODOT_ART_QA:')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Package canonical 68 images without network, verify export inventory
        run: |
          set -euo pipefail
          node scripts/build-empire-godot-pack.mjs --out=/tmp/buklod-approved-art.zip
          unzip -t /tmp/buklod-approved-art.zip | tail -2
          test "$(unzip -Z -1 /tmp/buklod-approved-art.zip | grep -Ec '^art/(fullbody|sprite|scene)/')" = 68
          mkdir -p /tmp/buklod-godot-art-project
          unzip -q /tmp/buklod-approved-art.zip -d /tmp/buklod-godot-art-project
          sha256sum /tmp/buklod-approved-art.zip
      - name: Headless Godot compiles actual art-enabled renderer and decodes real images
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 --connect-timeout 20 --max-time 240 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          mkdir -p /tmp/godotbin
          unzip -q /tmp/godot.zip -d /tmp/godotbin
          GODOT=$(find /tmp/godotbin -type f -name 'Godot_*linux.x86_64' -print -quit)
          test -n "$GODOT"
          chmod +x "$GODOT"
          "$GODOT" --headless --path /tmp/buklod-godot-art-project --editor --quit 2>&1 | tee /tmp/art-source.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|Failed to load script' /tmp/art-source.log; then exit 1; fi
          "$GODOT" --headless --path /tmp/buklod-godot-art-project --script res://tests/art_smoke.gd 2>&1 | tee /tmp/art-load.log
          grep -F 'BUKLOD_GODOT_ART_PASS' /tmp/art-load.log
          "$GODOT" --headless --path /tmp/buklod-godot-art-project --script res://tests/smoke.gd 2>&1 | tee /tmp/art-match.log
          grep -F 'BUKLOD_GODOT_SMOKE_PASS' /tmp/art-match.log
      - name: No APK publish, backend, Play, EAS or OTA mutation
        run: echo 'Godot-approved-art tests only; production unchanged.'
