name: One-time BUKLOD Registration Hardening 193A

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one_time_registration_hardening_193a.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply registration hardening
        run: python3 scripts/patch_registration_193a.py

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript QA
        run: npx tsc --noEmit

      - name: Verify registration anchors
        shell: bash
        run: |
          grep -F "buklod_registration_version:" 'src/app/(auth)/register.tsx'
          grep -F "createAccountInFlight.current" 'src/app/(auth)/register.tsx'
          grep -F "buklod_complete_registration_v1" 'src/app/(auth)/register.tsx'
          if grep -Fq "const onboardingDb" 'src/app/(auth)/register.tsx'; then
            echo "193A STOPPED legacy direct onboarding writes remain"
            exit 1
          fi

      - name: Commit hardened registration source
        shell: bash
        run: |
          git config user.name "BUKLOD Automation"
          git config user.email "actions@users.noreply.github.com"
          git add 'src/app/(auth)/register.tsx'
          git commit -m "fix(auth): harden Create Account registration 193A"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish production Android OTA when Expo token exists
        id: ota
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "status=missing_expo_token" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! npx eas-cli@latest whoami --non-interactive; then
            echo "status=expo_auth_failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          npx eas-cli@latest update --channel production --platform android --environment production --message "BUKLOD Create Account Hardening 193A" --non-interactive
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=eas_update_failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Cleanup one-time registration files
        if: always()
        shell: bash
        env:
          OTA_STATUS: ${{ steps.ota.outputs.status }}
        run: |
          git config user.name "BUKLOD Automation"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin main || true
          rm -f .github/workflows/one_time_registration_hardening_193a.yml
          rm -f scripts/patch_registration_193a.py
          git add .github/workflows/one_time_registration_hardening_193a.yml scripts/patch_registration_193a.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: registration 193A Android OTA ${OTA_STATUS:-workflow_failed}"
          git pull --rebase origin main
          git push origin HEAD:main
