name: One-time BUKLOD Registration Hardening 193A

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one_time_registration_hardening_193a.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply registration hardening 193A
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/app/(auth)/register.tsx')
          text = path.read_text(encoding='utf-8')

          old_import = """import {
            useEffect,
            useMemo,
            useState,
          } from 'react';""".replace('          ', '')
          new_import = """import {
            useEffect,
            useMemo,
            useRef,
            useState,
          } from 'react';""".replace('          ', '')
          if text.count(old_import) != 1:
            raise SystemExit(f'193A STOPPED: react import anchor count={text.count(old_import)}')
          text = text.replace(old_import, new_import, 1)

          busy_anchor = """  const [busy, setBusy] =
            useState(false);""".replace('            ', '    ')
          busy_replacement = """  const [busy, setBusy] =
            useState(false);
          const createAccountInFlight =
            useRef(false);

          const finishCreateAccount = () => {
            createAccountInFlight.current = false;
            setBusy(false);
          };""".replace('          ', '')
          if text.count(busy_anchor) != 1:
            raise SystemExit(f'193A STOPPED: busy anchor count={text.count(busy_anchor)}')
          text = text.replace(busy_anchor, busy_replacement, 1)

          start_anchor = """      setBusy(true);

      const { data, error } ="""
          start_replacement = """      if (createAccountInFlight.current) {
        return;
      }

      createAccountInFlight.current = true;
      setBusy(true);

      const { data, error } ="""
          if text.count(start_anchor) != 1:
            raise SystemExit(f'193A STOPPED: create start anchor count={text.count(start_anchor)}')
          text = text.replace(start_anchor, start_replacement, 1)

          metadata_anchor = """                member_note:
                  null,
"""
          metadata_replacement = """                member_note:
                  null,
                /* PATCH_193A_ATOMIC_REGISTRATION */
                buklod_registration_version:
                  '193A',
                registration_barangay:
                  barangay.trim(),
                registration_city_municipality:
                  cityMunicipality.trim(),
                registration_province:
                  province.trim(),
                registration_country:
                  country.trim() ||
                  'Philippines',
                registration_postal_code:
                  postalCode.trim() ||
                  null,
                registration_faith_identity:
                  faithIdentity,
                registration_show_faith_content:
                  showFaithContent,
"""
          if text.count(metadata_anchor) != 1:
            raise SystemExit(f'193A STOPPED: metadata anchor count={text.count(metadata_anchor)}')
          text = text.replace(metadata_anchor, metadata_replacement, 1)

          early_busy = """      setBusy(false);

      if (error) {
"""
          error_busy = """      if (error) {
        finishCreateAccount();
"""
          if text.count(early_busy) != 1:
            raise SystemExit(f'193A STOPPED: early busy anchor count={text.count(early_busy)}')
          text = text.replace(early_busy, error_busy, 1)

          no_session_anchor = """      if (!data.session) {
        return Alert.alert(
"""
          no_session_replacement = """      if (!data.session) {
        finishCreateAccount();
        return Alert.alert(
"""
          if text.count(no_session_anchor) != 1:
            raise SystemExit(f'193A STOPPED: no-session anchor count={text.count(no_session_anchor)}')
          text = text.replace(no_session_anchor, no_session_replacement, 1)

          block_start_marker = """      /*
       * PATCH_164A_REG2B_PRIVATE_ONBOARDING
"""
          block_end_marker = """      Alert.alert(
        'Account created',
        'Your BUKLOD account is ready. You can enter the Public Community immediately. Local, Cluster, Church, and Organization memberships can be added separately.'
      );
"""
          start = text.find(block_start_marker)
          end = text.find(block_end_marker, start)
          if start < 0 or end < 0:
            raise SystemExit(f'193A STOPPED: onboarding block markers start={start} end={end}')

          canonical = """      /*
       * PATCH_193A_REGISTRATION_HARDENING
       *
       * The Auth insert now atomically persists private address + faith
       * onboarding when the 193A metadata marker is present. This RPC is the
       * single idempotent completion path for local-scope synchronization.
       * Keep Create Account locked until this core path is finished.
       */
      let localSetupError: any = null;

      for (
        let attempt = 0;
        attempt < 2;
        attempt += 1
      ) {
        const result = await (
          supabase as any
        ).rpc(
          'buklod_complete_registration_v1',
          {
            p_barangay:
              barangay.trim(),
            p_city_municipality:
              cityMunicipality.trim(),
            p_province:
              province.trim(),
            p_country:
              country.trim() ||
              'Philippines',
            p_postal_code:
              postalCode.trim() ||
              null,
            p_faith_identity:
              faithIdentity,
            p_show_faith_content:
              showFaithContent,
            p_country_code: null,
            p_province_code: null,
            p_city_municipality_code:
              null,
            p_barangay_code: null,
          }
        );

        localSetupError =
          result.error;

        if (!localSetupError) {
          break;
        }

        if (attempt === 0) {
          await new Promise(
            (resolve) =>
              setTimeout(resolve, 350)
          );
        }
      }

      if (localSetupError) {
        finishCreateAccount();

        Alert.alert(
          'Account created - local setup pending',
          'Your BUKLOD account and private onboarding were saved, but Local assignment could not finish. You may continue to Public Home and retry your address setup later.'
        );

        router.replace(
          '/(tabs)/home'
        );

        return;
      }

      if (referralCode.trim()) {
        try {
          await recordReferral(
            referralCode
          );
        } catch (
          referralError: unknown
        ) {
          console.warn(
            'Referral record failed:',
            referralError instanceof Error
              ? referralError.message
              : referralError,
          );
        }
      }

      finishCreateAccount();

"""
          text = text[:start] + canonical + text[end:]

          path.write_text(text, encoding='utf-8')
          print('Registration hardening 193A source patch applied.')
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript QA
        run: npx tsc --noEmit

      - name: Verify registration anchors
        shell: bash
        run: |
          grep -F "buklod_registration_version:" 'src/app/(auth)/register.tsx'
          grep -F "'193A'" 'src/app/(auth)/register.tsx'
          grep -F "createAccountInFlight.current" 'src/app/(auth)/register.tsx'
          grep -F "buklod_complete_registration_v1" 'src/app/(auth)/register.tsx'
          if grep -Fq "const onboardingDb" 'src/app/(auth)/register.tsx'; then
            echo "193A STOPPED: legacy direct onboarding writes still present"
            exit 1
          fi

      - name: Commit hardened registration source
        shell: bash
        run: |
          git config user.name "BUKLOD Automation"
          git config user.email "actions@users.noreply.github.com"
          git add 'src/app/(auth)/register.tsx'
          git commit -m "fix(auth): harden Create Account registration 193A"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish production Android OTA when Expo token exists
        id: ota
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "status=missing_expo_token" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! npx eas-cli@latest whoami --non-interactive; then
            echo "status=expo_auth_failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          npx eas-cli@latest update \
            --channel production \
            --platform android \
            --environment production \
            --message "BUKLOD Create Account Hardening 193A" \
            --non-interactive
          code=$?
          set -e

          if [ "$code" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=eas_update_failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove one-time workflow and record OTA result
        if: always()
        shell: bash
        env:
          OTA_STATUS: ${{ steps.ota.outputs.status }}
        run: |
          git config user.name "BUKLOD Automation"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin main || true
          rm -f .github/workflows/one_time_registration_hardening_193a.yml
          git add .github/workflows/one_time_registration_hardening_193a.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: registration 193A Android OTA ${OTA_STATUS:-workflow_failed}"
          git pull --rebase origin main
          git push origin HEAD:main
