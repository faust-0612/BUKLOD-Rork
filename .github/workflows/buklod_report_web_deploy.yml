name: BUKLOD Report Web Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'src/app/reports/**'
      - 'src/components/BuklodWeeklyReportForm.tsx'
      - 'src/components/BuklodReportDoorCard.tsx'
      - 'src/components/BuklodClusterHomeCommandCenter.tsx'
      - 'src/components/BuklodScopeHomeDashboard.tsx'
      - 'src/lib/buklodReportDomain.ts'
      - 'src/lib/buklodReportFiles.ts'
      - 'src/lib/buklodReportBranding.ts'
      - '.github/workflows/buklod_report_web_deploy.yml'
  workflow_dispatch:

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  CI: '1'

permissions:
  contents: read

jobs:
  qa-export-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify BUKLOD Report source anchors
        shell: bash
        run: |
          grep -F 'IMPORT & AUTO-DETECT' 'src/components/BuklodWeeklyReportForm.tsx'
          grep -F 'MARK REMINDER DONE' 'src/components/BuklodWeeklyReportForm.tsx'
          grep -F 'PDF / PRINT' 'src/components/BuklodWeeklyReportForm.tsx'
          grep -F 'buklod-report-import-v1' 'src/lib/buklodReportFiles.ts'
          grep -F 'buklod-report-api-v1' 'src/lib/buklodReportDomain.ts'
          grep -F 'BUKLOD_REPORT_ICON_URI' 'src/lib/buklodReportBranding.ts'
          grep -F 'BUKLOD_REPORT_ICON_URI' 'src/app/reports/index.tsx'

      - name: TypeScript QA
        run: npx tsc --noEmit

      - name: Expo credential preflight
        run: |
          test -n "$EXPO_TOKEN"
          npx eas-cli@latest whoami --non-interactive

      - name: Export web inside EAS production environment
        shell: bash
        run: |
          npx eas-cli@latest env:exec production \
            'rm -rf dist && npx expo export --platform web --output-dir dist --clear && node scripts/inject-adsense-web-head.cjs dist' \
            --non-interactive

      - name: Verify production web bundle
        shell: bash
        run: |
          test -f dist/index.html
          grep -R -F 'yhanxndaqbmuzbdqlblu' dist/_expo/static/js/web >/dev/null
          grep -R -F 'IMPORT & AUTO-DETECT' dist/_expo/static/js/web >/dev/null
          grep -R -F 'MARK REMINDER DONE' dist/_expo/static/js/web >/dev/null
          grep -R -F 'buklod-report-import-v1' dist/_expo/static/js/web >/dev/null
          grep -F 'google-adsense-account' dist/index.html

      - name: Deploy production web
        run: npx eas-cli@latest deploy --prod --non-interactive

      - name: Verify live production web
        shell: bash
        run: |
          LIVE_INDEX="$(mktemp)"
          LIVE_BUNDLE="$(mktemp)"
          for attempt in {1..12}; do
            if curl --compressed -fsSL --max-time 20 \
              "https://buklod.expo.app/?verify=${GITHUB_SHA}-${attempt}" \
              -o "$LIVE_INDEX"; then
              break
            fi
            sleep 5
          done
          test -s "$LIVE_INDEX"
          grep -F 'google-adsense-account' "$LIVE_INDEX" >/dev/null
          BUNDLE_PATH="$(grep -oE '/_expo/static/js/web/[^\" ]+\.js' "$LIVE_INDEX" | head -n 1)"
          test -n "$BUNDLE_PATH"
          curl --compressed -fsSL --max-time 40 \
            "https://buklod.expo.app${BUNDLE_PATH}?verify=${GITHUB_SHA}" \
            -o "$LIVE_BUNDLE"
          grep -F 'IMPORT & AUTO-DETECT' "$LIVE_BUNDLE" >/dev/null
          grep -F 'MARK REMINDER DONE' "$LIVE_BUNDLE" >/dev/null
          grep -F 'PDF / PRINT' "$LIVE_BUNDLE" >/dev/null
          grep -F 'buklod-report-import-v1' "$LIVE_BUNDLE" >/dev/null
          grep -F 'buklod-report-api-v1' "$LIVE_BUNDLE" >/dev/null
          echo "LIVE_PRODUCTION_VERIFIED https://buklod.expo.app${BUNDLE_PATH}"

      - name: Final status
        run: |
          echo 'BUKLOD REPORT WEB DEPLOYED AND LIVE-VERIFIED'
          echo 'Production URL: https://buklod.expo.app'
