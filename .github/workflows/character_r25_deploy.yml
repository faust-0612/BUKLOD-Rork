name: BUKLOD Character R25 Legacy Guard

# BUKLOD_CHARACTER_R25_LEGACY_DISABLED_FOR_V2_WEB_RELEASE
# R25 is retained only as history. Character V2 is released through the
# source-locked Production Web workflow. This legacy workflow must never
# auto-publish Android OTA or compete with the V2 production release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-guard:
    runs-on: ubuntu-latest
    steps:
      - name: R25 legacy pipeline disabled
        run: |
          echo 'BUKLOD Character R25 automatic Web/Android deploy is disabled.'
          echo 'Use BUKLOD Production Web Deploy for Character V2.'
