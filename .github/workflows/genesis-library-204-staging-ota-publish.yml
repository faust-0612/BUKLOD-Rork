name: BUKLOD Genesis 2.0.4 Android STAGING OTA verified publish
on:
  push:
    branches:
      - release/genesis-library-204-conso-ota-20261122
    paths:
      - '.github/workflows/genesis-library-204-staging-ota-publish.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: buklod-genesis-library-204-staging-ota
  cancel-in-progress: false
jobs:
  android-staging-ota:
    if: github.repository == 'faust-0612/BUKLOD-Rork' && startsWith(github.event.head_commit.message, 'BUKLOD_GENESIS_204_STAGING_OTA_PUBLISH:')
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      APP_VARIANT: staging
      EXPO_PUBLIC_APP_ENV: staging
      BUKLOD_APP_TARGET: main
      EXPO_PUBLIC_BUKLOD_SEASON2_GENESIS_PREVIEW: 'true'
      EXPO_PUBLIC_BUKLOD_SOS_NATIVE_R3: 'true'
      EXPO_PUBLIC_BUKLOD_ARENA_GODOT_ENABLED: 'true'
      EXPO_PUBLIC_BUKLOD_GENESIS_GODOT_WORLDS: 'true'
      EXPO_PUBLIC_BUKLOD_ARENA_LIBRARY_BUNDLE: 'true'
      EXPO_PUBLIC_BUKLOD_ARENA_EXPERIMENTAL: 'true'
      EXPO_PUBLIC_BUKLOD_ARENA_RANKED_ENABLED: 'false'
      EXPO_PUBLIC_BUKLOD_GENESIS_SHARED_BACKEND_REVIEW: 'true'
      EXPO_PUBLIC_STREAM_ANDROID_PUSH_PROVIDER_NAME: firebase-video-staging
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      APK_SHA: c413c1ec2e23f151af0123cefbd4209fbf612d1f
      APK_PROOF_RUN: '45031011586'
      RC_SHA: __OTA_RC_SOURCE__
      CHANNEL: season2-genesis-library-preview
      RUNTIME: 2.0.4-genesis-library-godot
      PACKAGE_NAME: org.mzbministry.buklod.staging
      EVIDENCE: /tmp/buklod-genesis-library-204-ota-evidence
      EXPORT: /tmp/buklod-genesis-library-204-ota-export
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prove exact immutable JS-only candidate and old APK native parity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/release/genesis-library-204-conso-ota-20261122'
          test "$RC_SHA" != '__OTA_RC_SOURCE__'
          [[ "$RC_SHA" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$APK_SHA" "$RC_SHA"
          git merge-base --is-ancestor "$RC_SHA" HEAD
          test "$(git diff --name-only "$RC_SHA" HEAD)" = '.github/workflows/genesis-library-204-staging-ota-publish.yml'
          test -z "$(git diff --name-only "$APK_SHA" HEAD -- app.config.js eas.json package.json package-lock.json godot modules plugins scripts/build-empire-godot-pack.mjs scripts/arena-library-audio-pack.mjs assets/season2/arena)"
          node <<'NODE'
          const fs=require('node:fs'),a=require('node:assert/strict'),cp=require('node:child_process');
          const m=JSON.parse(fs.readFileSync('.buklod/scopes/genesis-library-204-conso-ota-20261122.json','utf8'));
          a.equal(m.contractVersion,2);
          const changed=cp.execFileSync('git',['diff','--name-only',process.env.APK_SHA,'HEAD'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          for(const p of changed)a.ok(m.allowedPaths.includes(p),'Unapproved OTA file '+p);
          const c=require('./app.config.js')({config:{}}),e=require('./eas.json');
          a.equal(c.android.package,process.env.PACKAGE_NAME);
          a.equal(c.runtimeVersion,process.env.RUNTIME);
          a.equal(c.version,'2.0.4');
          a.equal(c.extra.appTarget,'main');
          a.ok(c.plugins.includes('./plugins/withBuklodGodotArenaPack.js'));
          a.equal(c.plugins.find(p=>Array.isArray(p)&&p[0]==='react-native-google-mobile-ads')[1].androidAppId,'ca-app-pub-3940256099942544~3347511713');
          a.equal(e.build['season2-genesis-library-staging'].channel,process.env.CHANNEL);
          a.equal(e.build.production.channel,'production');
          a.equal(process.env.EXPO_PUBLIC_BUKLOD_ARENA_RANKED_ENABLED,'false');
          console.log('EXACT_SIGNED_APK_NATIVE_JS_OTA_PARITY',changed.length);
          NODE
      - name: Independently require prior signed APK and OTA RC source workflow success
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          node <<'NODE'
          const a=require('node:assert/strict');
          const root='https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY;
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','User-Agent':'buklod-204-ota-proof'};
          async function get(path){const r=await fetch(root+path,{headers});a.equal(r.status,200,path);return r.json();}
          (async()=>{
            const apk=await get('/actions/runs/'+process.env.APK_PROOF_RUN);
            a.equal(apk.head_sha,process.env.APK_SHA);a.equal(apk.status,'completed');a.equal(apk.conclusion,'success');
            const job=await get('/actions/runs/'+apk.id+'/jobs?per_page=100');
            const passed=(job.jobs||[]).flatMap(x=>x.steps||[]).filter(x=>x.conclusion==='success').map(x=>x.name);
            for(const name of ['Locally compile and EAS-sign complete Android APK WITHOUT cloud build credits','Verify original EAS certificate, versionCode, four worlds and APK provenance','Upload install candidate and verification receipt without Play/OTA publication'])
              a.ok(passed.includes(name),'Prior original signing proof missing '+name);
            const artifact=await get('/actions/runs/'+apk.id+'/artifacts?per_page=100');
            a.ok((artifact.artifacts||[]).some(x=>x.name==='buklod-genesis-2.0.4-eas-local-signed-staging-apk'&&!x.expired&&x.size_in_bytes>100000000));
            const runs=await get('/actions/runs?branch=release%2Fgenesis-library-204-conso-ota-20261122&event=pull_request&per_page=100');
            const qa=(runs.workflow_runs||[]).find(x=>x.head_sha===process.env.RC_SHA&&x.name==='BUKLOD Genesis 2.0.4 consolidated staging OTA source QA');
            a.ok(qa&&qa.status==='completed'&&qa.conclusion==='success','Exact signed-source OTA QA not passed');
            console.log('SIGNED_NATIVE_AND_RC_QA_PASS',JSON.stringify({apkRun:apk.id,source:apk.head_sha,qaRun:qa.id}));
          })().catch(e=>{console.error('OTA_PREP_BLOCK',e.message);process.exitCode=1});
          NODE
      - name: Locked mandatory AdMob, navigation, video, comments, security and TypeScript QA
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/genesis-library-204-ota-source-parity-20261122.test.mjs tests/genesis-library-native-runtime-release-20261122.test.mjs tests/dashboard-ad-navigation-prewarm-20261116.test.mjs tests/ad-dashboard-focus-performance-20261116.test.mjs tests/buklod-prod-native-ad-recovery-circuit-20261122.test.cjs tests/community-wall-layout-stability-20261122.test.mjs tests/community-wall-navigation-scope-layout-stability-20261122.test.mjs tests/genesis-conso-ui-legibility-reliability-20261122.test.mjs tests/genesis-conso-video-regression-gate-20261122.test.mjs tests/genesis-dashboard-navigation-safearea-20261122.test.mjs tests/genesis-dashboard-safearea-encouragement-scroll-20261122.test.mjs tests/genesis-restored-topbar-navigation-safearea-20261122.test.mjs tests/video-thumbnail-first-frame-20261122.test.mjs tests/genesis-entry-ptt-audio-continuity-20261122.test.mjs tests/buklod-call-token-expiry-20261122.test.mjs tests/wall-comment-navigation-compact-20261122.test.mjs tests/wall-comments-progressive-loading-20261122.test.mjs
          npm run release:gate
          npm run genesis:theme:gate
          npx tsc --noEmit
      - name: Verify real EAS preview backend and export exact Android 2.0.4 JS bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          npx --yes eas-cli@27.9.0 env:pull --environment preview --path /tmp/genesis-library-204-preview.env --non-interactive >/dev/null
          set -a
          . /tmp/genesis-library-204-preview.env
          set +a
          export APP_VARIANT=staging EXPO_PUBLIC_APP_ENV=staging BUKLOD_APP_TARGET=main
          export EXPO_PUBLIC_BUKLOD_SEASON2_GENESIS_PREVIEW=true EXPO_PUBLIC_BUKLOD_SOS_NATIVE_R3=true
          export EXPO_PUBLIC_BUKLOD_ARENA_GODOT_ENABLED=true EXPO_PUBLIC_BUKLOD_GENESIS_GODOT_WORLDS=true
          export EXPO_PUBLIC_BUKLOD_ARENA_LIBRARY_BUNDLE=true EXPO_PUBLIC_BUKLOD_ARENA_EXPERIMENTAL=true
          export EXPO_PUBLIC_BUKLOD_ARENA_RANKED_ENABLED=false EXPO_PUBLIC_BUKLOD_GENESIS_SHARED_BACKEND_REVIEW=true
          export EXPO_PUBLIC_STREAM_ANDROID_PUSH_PROVIDER_NAME=firebase-video-staging
          node <<'NODE'
          const a=require('node:assert/strict'),e=require('./eas.json'),c=require('./app.config.js')({config:{}});
          const original=e.build['season2-genesis-preview'].env;
          a.equal(process.env.EXPO_PUBLIC_SUPABASE_URL,original.EXPO_PUBLIC_SUPABASE_URL);
          a.equal(process.env.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY,original.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY);
          a.equal(process.env.EXPO_PUBLIC_SUPABASE_URL,'https://yhanxndaqbmuzbdqlblu.supabase.co');
          a.equal(c.android.package,process.env.PACKAGE_NAME);
          a.equal(c.runtimeVersion,process.env.RUNTIME);
          a.equal(c.extra.eas.projectId,'23dad7d0-389a-406e-8dec-08965dab85d8');
          console.log('EXACT_INSTALLED_RUNTIME_AND_EXISTING_BUKLOD_BACKEND_OK');
          NODE
          EXPO_MAX_WORKERS=2 npx expo export --platform android --output-dir "$EXPORT" --clear
          test -s "$EXPORT/metadata.json"
      - name: Read exact staging and production channel mappings before publish
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@27.9.0 channel:view "$CHANNEL" --json --non-interactive > "$EVIDENCE/stage-before.json"
          npx --yes eas-cli@27.9.0 channel:view production --json --non-interactive > "$EVIDENCE/prod-before.json"
          node <<'NODE'
          const fs=require('node:fs'),a=require('node:assert/strict'),d=process.env.EVIDENCE;
          const read=n=>JSON.parse(fs.readFileSync(d+'/'+n+'.json','utf8'));
          const branch=(raw,name)=>{
            const c=raw.currentPage??raw;a.equal(c.name,name);a.notEqual(c.isPaused,true);
            const m=typeof c.branchMapping==='string'?JSON.parse(c.branchMapping):c.branchMapping;
            a.equal(m?.data?.length,1);
            const b=c.updateBranches?.find(x=>x.id===m.data[0].branchId);
            a.ok(b?.id&&b?.name,'Missing EAS branch '+name);return b;
          };
          const s=branch(read('stage-before'),process.env.CHANNEL),p=branch(read('prod-before'),'production');
          a.notEqual(s.id,p.id);a.notEqual(s.name,p.name);
          fs.writeFileSync(d+'/targets.json',JSON.stringify({stageBranch:s.name,stageId:s.id,prodId:p.id,prodBranch:p.name}));
          console.log('EXACT_STAGING_CHANNEL_SEPARATE_FROM_PRODUCTION',s.name);
          NODE
      - name: Idempotent Android-only Expo OTA on installed 2.0.4 staging channel
        shell: bash
        run: |
          set -euo pipefail
          STAGE_BRANCH=$(node -p "require(process.env.EVIDENCE+'/targets.json').stageBranch")
          npx --yes eas-cli@27.9.0 update:list --branch "$STAGE_BRANCH" --limit 30 --json --non-interactive > "$EVIDENCE/prior.json"
          node <<'NODE'
          const fs=require('node:fs'),a=require('node:assert/strict'),d=process.env.EVIDENCE;
          const raw=JSON.parse(fs.readFileSync(d+'/prior.json','utf8'));
          const list=raw.currentPage??raw;a.ok(Array.isArray(list));
          const marker='BUKLOD_GENESIS_204_CONSO_'+process.env.GITHUB_SHA;
          const match=list.filter(x=>x.message===marker);a.ok(match.length<=1,'Ambiguous earlier OTA');
          fs.writeFileSync(d+'/group.txt',match[0]?.group??'');
          NODE
          if [ ! -s "$EVIDENCE/group.txt" ]; then
            npx --yes eas-cli@27.9.0 update --channel "$CHANNEL" --platform android --environment preview --skip-bundler --input-dir "$EXPORT" --non-interactive --json --message "BUKLOD_GENESIS_204_CONSO_$GITHUB_SHA" > "$EVIDENCE/published.json"
            node <<'NODE'
          const fs=require('node:fs'),a=require('node:assert/strict'),d=process.env.EVIDENCE;
          const rows=JSON.parse(fs.readFileSync(d+'/published.json','utf8'));
          a.ok(Array.isArray(rows)&&rows.length===1&&rows[0].group,'EAS OTA group missing');
          fs.writeFileSync(d+'/group.txt',rows[0].group);
          NODE
          fi
          npx --yes eas-cli@27.9.0 update:view "$(cat "$EVIDENCE/group.txt")" --json > "$EVIDENCE/update-view.json"
      - name: Verify remote OTA group, native runtime and production mapping untouched
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@27.9.0 channel:view "$CHANNEL" --json --non-interactive > "$EVIDENCE/stage-after.json"
          npx --yes eas-cli@27.9.0 channel:view production --json --non-interactive > "$EVIDENCE/prod-after.json"
          node <<'NODE'
          const fs=require('node:fs'),a=require('node:assert/strict'),d=process.env.EVIDENCE;
          const read=n=>JSON.parse(fs.readFileSync(d+'/'+n+'.json','utf8'));
          const target=read('targets'),u=read('update-view');a.ok(Array.isArray(u)&&u.length===1);
          const item=u[0];
          a.equal(item.platform,'android');a.equal(item.runtimeVersion,process.env.RUNTIME);
          a.equal(item.branch,target.stageBranch);a.equal(item.gitCommitHash,process.env.GITHUB_SHA);
          a.equal(item.group,fs.readFileSync(d+'/group.txt','utf8').trim());
          a.ok(item.id&&item.group&&!item.isRollBackToEmbedded);
          for(const [key,id] of [['stage-after',target.stageId],['prod-after',target.prodId]]){
            const c=read(key).currentPage??read(key);
            const m=typeof c.branchMapping==='string'?JSON.parse(c.branchMapping):c.branchMapping;
            a.equal(m?.data?.length,1);a.equal(m.data[0].branchId,id,'EAS channel remapped unexpectedly');
          }
          const result={status:'BUKLOD_GENESIS_204_STAGING_OTA_SERVER_VERIFIED',runtime:process.env.RUNTIME,
            package:process.env.PACKAGE_NAME,channel:process.env.CHANNEL,platform:'android',
            sourceSha:process.env.GITHUB_SHA,installedNativeSha:process.env.APK_SHA,
            updateId:item.id,groupId:item.group,createdAt:item.createdAt,
            productionBranchPreserved:true,stagingAnnouncement:'NONE',
            physicalDeviceAdMobNavAcceptance:'NOT_YET_REVERIFIED',productionPublished:false};
          fs.writeFileSync(d+'/verification.json',JSON.stringify(result,null,2));
          console.log('GENESIS_204_STAGING_OTA_VERIFIED',JSON.stringify(result));
          NODE
      - name: Keep exact source and OTA receipt, never announce staging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buklod-genesis-204-staging-ota-proof
          path: |
            /tmp/buklod-genesis-library-204-ota-evidence/*.json
            /tmp/buklod-genesis-library-204-ota-evidence/*.txt
          if-no-files-found: ignore
          retention-days: 14
