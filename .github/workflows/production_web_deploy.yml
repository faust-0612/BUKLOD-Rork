name: BUKLOD Production Web Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/production_web_deploy.yml'
      - 'scripts/patch-web-community-post.cjs'
      - 'scripts/patch-home-identity-action-row.cjs'
      - 'scripts/inject-adsense-web-head.cjs'
      - 'src/app/+html.tsx'
      - 'src/app/index.tsx'
      - 'src/app/onboarding/index.tsx'
      - 'src/app/(tabs)/home.tsx'
      - 'src/components/BuklodPublicWordShortcut.tsx'
      - 'src/components/BuklodExclusiveScopeCommunity.tsx'
      - 'src/components/BuklodCommunityPhotoCollage.tsx'
      - 'src/app/(auth)/login.tsx'
      - 'src/lib/buklodAuthResilience.ts'
      - 'src/app/(auth)/forgot-password.tsx'
      - 'src/app/account/recovery-pin.tsx'
      - 'src/app/account/security.tsx'
      - 'src/app/admin/account-recovery.tsx'
      - 'src/app/scope/index.tsx'
      - 'src/app/scope/bulletin-editor.tsx'
      - 'src/components/BuklodClusterHomeCommandCenter.tsx'
      - 'src/components/BuklodClusterHomeCommandCenterImpl.tsx'
      - 'src/lib/buklodClusterFormationGate.ts'
      - 'src/app/(tabs)/me.tsx'
      - 'src/app/(tabs)/prayer.tsx'
      - 'src/app/(tabs)/messages.tsx'
      - 'src/providers/NotificationProvider.tsx'
      - 'src/app/profile/buklod-faculty-class.tsx'
      - 'src/app/profile/buklod-classroom*.tsx'
      - 'src/components/classroom/**'
      - 'src/components/BuklodNavSafeShell.web.tsx'
      - 'src/components/BuklodMobileWebShell.tsx'
      - 'src/components/BuklodDesktopWebShell.tsx'
      - 'src/components/BuklodSponsorSlot.tsx'
      - 'src/components/BuklodAdMobBanner.web.tsx'
      - 'src/components/BuklodScreenBottomBanner.web.tsx'
      - 'src/components/BuklodCommunityInlineAd.web.tsx'
      - 'src/components/BuklodReelsInlineAd.web.tsx'
      - 'src/components/BuklodWebAdSlot.web.tsx'
      - 'src/components/BuklodFocusAppAdStrip.tsx'
      - 'src/lib/buklodAdUnits.web.ts'
      - 'src/components/connect/ConnectThreadHeader.tsx'
      - 'src/components/connect/ConnectThreadHeader.web.tsx'
      - 'src/components/connect/ConnectComposerPicker.tsx'
      - 'src/lib/buklodConnectGifCatalog.ts'
      - 'src/components/BuklodAcceptedCallContent.web.tsx'
      - 'src/components/BuklodScopeCallLauncher.web.tsx'
      - 'src/components/BuklodConnectThread.tsx'
      - 'src/components/RingingCalls.web.tsx'
      - 'src/lib/buklodStreamVideoClient.web.ts'
      - 'src/lib/streamVideoSdk.web.ts'
      - 'src/lib/buklodStreamCall.ts'
      - 'src/lib/buklodCallLifecycle.ts'
      - 'src/providers/StreamVideoProvider.web.tsx'
      - 'src/lib/buklodAwsWallVideo.ts'
      - 'src/lib/uploadCommunityVideoFile.ts'
      - 'src/lib/buklodCommunityPostMedia.ts'
      - 'src/lib/buklodMediaUrl.ts'
      - 'supabase/migrations/*community_external_video_storage_aws*.sql'
      - 'supabase/migrations/*buklod_5k_scale_hardening*.sql'

permissions:
  contents: read

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  qa-export-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply web Community Post hotfix
        run: node scripts/patch-web-community-post.cjs

      - name: Verify web Community Post hotfix
        shell: bash
        run: |
          grep -F "setBusy(true);" 'src/components/BuklodExclusiveScopeCommunity.tsx'
          grep -F "disabled={busy}" 'src/components/BuklodExclusiveScopeCommunity.tsx'
          grep -F "Post to this community" 'src/components/BuklodExclusiveScopeCommunity.tsx'

      - name: Apply Home identity action row
        run: node scripts/patch-home-identity-action-row.cjs

      - name: Verify Classroom and Home separation
        shell: bash
        run: |
          grep -F 'HOME_IDENTITY_ACTION_ROW_R2' 'src/app/(tabs)/home.tsx'
          grep -F 'BUKLOD_CLASSROOM_ACCOUNT_ISOLATION_R2' 'src/app/profile/buklod-classrooms.tsx'
          grep -F "row.role_key === 'STUDENT'" 'src/app/profile/buklod-classrooms.tsx'
          if grep -F "row.role_key === 'FACULTY'" 'src/app/profile/buklod-classrooms.tsx'; then
            echo 'Faculty rows are still rendered in student My Classroom.'
            exit 1
          fi

      - name: TypeScript QA
        run: npx tsc --noEmit

      - name: Verify production safety anchors
        shell: bash
        run: |
          grep -F "HIGH_CONCURRENCY_LOGIN_R1" 'src/app/(auth)/login.tsx'
          grep -F "loginInFlightRef.current" 'src/app/(auth)/login.tsx'
          grep -F "HIGH_CONCURRENCY_LOGIN_R1" 'src/lib/buklodAuthResilience.ts'
          test "$(grep -c "supabase.auth.signInWithPassword(" 'src/lib/buklodAuthResilience.ts')" -eq 1
          grep -F 'BUKLOD_LEGACY_VERIFICATION_REMOVAL_R22' 'src/app/index.tsx'
          grep -F 'BUKLOD_LEGACY_VERIFICATION_REMOVAL_R22' 'src/app/onboarding/index.tsx'
          if grep -F 'WAITING FOR ADMIN VERIFICATION' 'src/app/onboarding/index.tsx'; then
            echo 'Legacy verification interstitial text is still present.'
            exit 1
          fi
          if grep -F 'Redirect href="/onboarding"' 'src/app/index.tsx'; then
            echo 'Legacy verification redirect is still present in app boot.'
            exit 1
          fi
          grep -F "account-recovery-v3" 'src/app/(auth)/forgot-password.tsx'
          grep -F "action: 'recover_with_pin'" 'src/app/(auth)/forgot-password.tsx'
          grep -F "account-recovery-v4" 'src/app/(auth)/forgot-password.tsx'
          grep -F "action: 'request_admin_recovery'" 'src/app/(auth)/forgot-password.tsx'
          grep -F "action: 'recovery_request_status'" 'src/app/(auth)/forgot-password.tsx'
          grep -F "action: 'recover_with_admin_code'" 'src/app/(auth)/forgot-password.tsx'
          grep -F "I forgot my login too" 'src/app/(auth)/forgot-password.tsx'
          grep -F "account-recovery-v4" 'src/app/admin/account-recovery.tsx'
          grep -F "action: 'admin_verify_request'" 'src/app/admin/account-recovery.tsx'
          grep -F "auto_delivery_ready" 'src/app/admin/account-recovery.tsx'
          grep -F "VERIFY ACCOUNT — AUTO DELIVER CODE" 'src/app/admin/account-recovery.tsx'
          grep -F "admin_reject_request" 'src/app/admin/account-recovery.tsx'
          grep -F "recovery_status" 'src/app/account/recovery-pin.tsx'
          grep -F "MANAGE CLUSTER" 'src/components/BuklodClusterHomeCommandCenter.tsx'
          grep -F "constrainContextToOrganization" 'src/lib/buklodClusterFormationGate.ts'
          grep -F "readMediaForUpload" 'src/app/scope/bulletin-editor.tsx'
          grep -F "Title and message are required before publishing." 'src/app/scope/bulletin-editor.tsx'
          grep -F "key: 'classrooms'" 'src/app/(tabs)/me.tsx'
          grep -F "import { FacultyClassroomHeader } from '@/components/classroom/FacultyClassroomHeader';" 'src/app/profile/buklod-faculty-class.tsx'
          grep -F 'BUKLOD_CLASSROOM_AUTO_GRADE_R1' 'src/app/profile/buklod-classroom-work.tsx'
          grep -F 'buklod_classroom_start_live_v1' 'src/app/profile/buklod-classroom.tsx'
          grep -F 'The full BUKLOD Classroom video room uses the native BUKLOD app' 'src/components/classroom/ClassroomLiveView.web.tsx'
          grep -F 'buklod_classroom_record_performance_v1' 'src/app/profile/buklod-classroom-monitor.tsx'
          grep -F 'BUKLOD_WEB_RESPONSIVE_SPLIT_R3' 'src/components/BuklodNavSafeShell.web.tsx'
          grep -F 'BUKLOD_DESKTOP_WEB_MIN_WIDTH = 1100' 'src/components/BuklodNavSafeShell.web.tsx'
          grep -F 'BuklodMobileWebShell' 'src/components/BuklodNavSafeShell.web.tsx'
          grep -F 'BuklodDesktopWebShell' 'src/components/BuklodNavSafeShell.web.tsx'
          grep -F 'BUKLOD_MOBILE_WEB_SHELL_R3' 'src/components/BuklodMobileWebShell.tsx'
          grep -F 'BuklodPersistentBottomNav' 'src/components/BuklodMobileWebShell.tsx'
          grep -F 'BUKLOD_DESKTOP_WEB_SHELL_R3' 'src/components/BuklodDesktopWebShell.tsx'
          grep -F 'BuklodSponsorSlot' 'src/components/BuklodDesktopWebShell.tsx'
          grep -F 'BUKLOD_WEB_ADS_R1' 'src/components/BuklodWebAdSlot.web.tsx'
          grep -F 'EXPO_PUBLIC_ADSENSE_CLIENT_ID' 'src/components/BuklodWebAdSlot.web.tsx'
          grep -F 'pagead2.googlesyndication.com/pagead/js/adsbygoogle.js' 'src/components/BuklodWebAdSlot.web.tsx'
          grep -F 'BUKLOD_ADSENSE_SITE_VERIFICATION_R1' 'src/app/+html.tsx'
          grep -F 'ca-pub-6260135521836249' 'src/app/+html.tsx'
          grep -F 'google-adsense-account' 'src/app/+html.tsx'
          grep -F 'BUKLOD_ADSENSE_EXPORT_INJECTION_R2' 'scripts/inject-adsense-web-head.cjs'
          grep -F 'ca-pub-6260135521836249' 'scripts/inject-adsense-web-head.cjs'
          grep -F 'BUKLOD_WEB_ADMOB_BRIDGE_R1' 'src/components/BuklodAdMobBanner.web.tsx'
          grep -F 'BUKLOD_FOCUS_APP_ADS_R1' 'src/components/BuklodFocusAppAdStrip.tsx'
          grep -F 'placement="focus"' 'src/components/BuklodFocusAppAdStrip.tsx'
          grep -F "placement=\"community\"" 'src/components/BuklodCommunityInlineAd.web.tsx'
          grep -F "placement=\"reels\"" 'src/components/BuklodReelsInlineAd.web.tsx'
          grep -F 'BUKLOD_WEB_CALLING_R1' 'src/lib/buklodStreamVideoClient.web.ts'
          grep -F "from '@stream-io/video-client'" 'src/lib/buklodStreamVideoClient.web.ts'
          grep -F 'call.bindVideoElement' 'src/components/BuklodAcceptedCallContent.web.tsx'
          grep -F 'await call.join()' 'src/components/RingingCalls.web.tsx'
          grep -F 'buildBuklodScopeCallId' 'src/components/BuklodScopeCallLauncher.web.tsx'
          grep -F 'installBuklodCallLifecycle' 'src/providers/StreamVideoProvider.web.tsx'
          grep -F 'BUKLOD_WEB_DIRECT_VOICE_CALL_R2' 'src/components/connect/ConnectThreadHeader.web.tsx'
          grep -F 'buklod-web-direct-audio-call' 'src/components/connect/ConnectThreadHeader.web.tsx'
          if grep -F 'buklod-direct-video-call' 'src/components/connect/ConnectThreadHeader.web.tsx'; then
            echo 'Unexpected direct video-call control found in web header.'
            exit 1
          fi
          grep -F 'PATCH_191D_LIVE_GIPHY_COMPACT_PICKER' 'src/components/connect/ConnectComposerPicker.tsx'
          grep -F 'searchConnectGifs' 'src/lib/buklodConnectGifCatalog.ts'
          grep -F 'CONNECT_GIF_CATEGORIES' 'src/lib/buklodConnectGifCatalog.ts'
          grep -F 'BUKLOD_AWS_WALL_VIDEO_R2_FAST_MULTIPART' 'src/lib/buklodAwsWallVideo.ts'
          grep -F 'BUKLOD_AWS_WALL_VIDEO_ROUTE_R1' 'src/lib/uploadCommunityVideoFile.ts'
          grep -F 'set_buklod_post_media_v5' 'src/lib/buklodCommunityPostMedia.ts'
          grep -F 'BUKLOD_AWS_SIGNED_MEDIA_CACHE_R2_BATCHED' 'src/lib/buklodMediaUrl.ts'
          grep -F 'BUKLOD_5K_SCALE_R1_NOTIFICATION_NO_CDC' 'src/providers/NotificationProvider.tsx'
          grep -F 'BUKLOD_5K_SCALE_R1_PRAYER_NO_CDC' 'src/app/(tabs)/prayer.tsx'
          grep -F 'BUKLOD 5K SCALE HARDENING R1' 'supabase/migrations/20260904131000_buklod_5k_scale_hardening_r1.sql'

      - name: Expo credential preflight
        id: expo
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Expo web deploy not published: repository secret EXPO_TOKEN is not configured."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx eas-cli@latest whoami --non-interactive
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Export production web
        if: steps.expo.outputs.ready == 'true'
        shell: bash
        env:
          NODE_ENV: production
          EXPO_PUBLIC_APP_ENV: production
        run: |
          npx expo export --platform web --output-dir dist
          node scripts/inject-adsense-web-head.cjs dist

      - name: Deploy production web
        id: deploy
        if: steps.expo.outputs.ready == 'true'
        shell: bash
        env:
          NODE_ENV: production
          EXPO_PUBLIC_APP_ENV: production
        run: |
          set +e
          npx eas-cli@latest deploy --prod --non-interactive
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Preserve deploy result
        shell: bash
        env:
          EXPO_READY: ${{ steps.expo.outputs.ready }}
          DEPLOY_RC: ${{ steps.deploy.outputs.rc }}
        run: |
          echo "EXPO_READY=$EXPO_READY" > /tmp/buklod_web_deploy_status
          echo "DEPLOY_RC=${DEPLOY_RC:-not-run}" >> /tmp/buklod_web_deploy_status

      - name: Deployment status
        shell: bash
        env:
          EXPO_READY: ${{ steps.expo.outputs.ready }}
          DEPLOY_RC: ${{ steps.deploy.outputs.rc }}
        run: |
          if [ "$EXPO_READY" != "true" ]; then
            echo "BUKLOD production web deploy skipped because EXPO_TOKEN is unavailable."
            exit 0
          fi
          if [ "$DEPLOY_RC" != "0" ]; then
            echo "BUKLOD production web deploy failed (eas deploy rc=$DEPLOY_RC)."
            exit 1
          fi
          echo "BUKLOD production web deployed successfully."
