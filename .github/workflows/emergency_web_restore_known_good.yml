# Emergency restore retriggered 2026-09-05 for web-only production recovery.
name: BUKLOD Emergency Web Restore Known Good

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/emergency_web_restore_known_good.yml'

permissions:
  contents: read

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  restore-known-good:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact last-known-good web revision
        uses: actions/checkout@v4
        with:
          ref: c18460ed3a618aa193d77f5399ac8bc98b2a78b6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript QA
        run: npx tsc --noEmit

      - name: Expo credential preflight
        shell: bash
        run: |
          test -n "$EXPO_TOKEN"
          npx eas-cli@latest whoami --non-interactive

      - name: Export exact known-good production web
        shell: bash
        env:
          NODE_ENV: production
          EXPO_PUBLIC_APP_ENV: production
        run: |
          rm -rf dist
          npx expo export --platform web --output-dir dist
          node scripts/inject-adsense-web-head.cjs dist

      - name: Promote exact known-good web to production
        shell: bash
        env:
          NODE_ENV: production
          EXPO_PUBLIC_APP_ENV: production
        run: |
          npx eas-cli@latest deploy --prod --non-interactive

      - name: Restore status
        run: echo 'BUKLOD emergency exact known-good web restore deployed successfully.'
