name: BUKLOD KL Reader Gate DEV QA (no publish)

on:
  push:
    branches:
      - codex/v28-web-sync
    paths:
      - 'src/lib/kabihasnang-ligaw/gates.ts'
      - 'src/components/kabihasnang-ligaw/KlReaderScreen.tsx'
      - '__tests__/kabihasnangLigawR5.test.ts'
      - '.github/workflows/kl_reader_gate_dev_qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reader-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout DEV commit
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install lockfile dependencies
        run: npm ci --ignore-scripts
      - name: Run Kabihasnang Ligaw targeted regressions
        run: node --experimental-strip-types scripts/run-kl-r5-checks.mjs
      - name: Compile-check affected TypeScript in project context
        run: npx tsc --noEmit --pretty false
