# Pre-publish source E2E: consolidate tests that the canonical production
# workflow invokes AFTER the historically stale Social media suite.
# No EAS token, update, or production modification.
name: BUKLOD Train A Complete Legacy RC Source QA (NO OTA)
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/community-video-navigation-scroll.test.mjs'
      - 'tests/navigation-scroll-compact-public-wall.test.mjs'
      - '.buklod/scopes/train-a-prod-complete-legacy-rc-20261118.json'
      - '.github/workflows/train-a-prod-complete-legacy-rc-no-publish-20261118.yml'
permissions:
  contents: read
jobs:
  full-nopublish-regression:
    if: github.repository == 'faust-0612/BUKLOD-Rork' && github.head_ref == 'fix/train-a-prod-complete-legacy-nav-gates-20261118'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      APP_VARIANT: production
      EXPO_PUBLIC_APP_ENV: production
      BUKLOD_APP_TARGET: main
      EXPO_PUBLIC_STREAM_ANDROID_PUSH_PROVIDER_NAME: firebase-video-production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # V28 native-compat regression reads historical pinned source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Exact revised legacy media/nav assertions + complete Social source suite
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node --experimental-strip-types --test tests/unified-social-media-rendering.test.mjs tests/community-video-persistent-preview.test.mjs tests/community-video-playback-recovery.test.mjs tests/community-media-aspect-ratio-20261103.test.mjs tests/community-wall-media-navigation-scroll.test.mjs tests/buklod-word-schedule.test.mjs
          node --test tests/weak-media-rendering.test.cjs tests/community-media-weak-signal.test.cjs tests/community-wall-no-blank-photo.test.cjs tests/compact-public-wall-header-20261104.test.mjs tests/navigation-scroll-compact-public-wall.test.mjs tests/community-video-navigation-scroll.test.mjs tests/the-word-safe-area-20261106.test.mjs tests/dzas-signal-deck-implementation.test.mjs
      - name: AdMob source policy, first-view and finance and video lifecycle
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/buklod-ads-appwide-permanent-lock-20261111.test.mjs
          node --test tests/buklod-ads-production-release-contract-20261111.test.mjs
          node scripts/buklod-ad-surface-audit.mjs --summary
          node --test tests/buklod-admob-fill-finance-release-20261111.test.mjs
          node --test tests/production-ota-ads-regression.test.mjs
          node --test tests/reels-ads-fullscreen-ota-20261111.test.mjs tests/igpat-fast-start-video-20261110.test.mjs
          node --experimental-strip-types --test tests/video-handoff-connect-navigation-ads-20261117.test.mjs tests/scoped-community-video-sidecar-recovery.test.mjs
      - name: Additional production safety/Kingdom/native/config and UI gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/community-help-sos-release-contract.mjs
          node --test tests/sos-r1-r2-notification-deeplink-20261107.test.mjs
          node --test tests/sos-r1-r2-notification-navigation-20261107.test.mjs tests/sos-r1-r2-production-ota-release-20261107.test.mjs
          node scripts/test-marites-release.cjs
          node --experimental-strip-types --test tests/nov14-profile-navigation-rank-refresh.test.mjs tests/nov14-profile-top-ten-ranked-list-20261114.test.mjs tests/nov14-profile-navigation-personal-activity-report.test.mjs tests/nov14-connect-green-profile-posts-ota.test.mjs tests/sponsor-ad-video-fast-start-20261114.test.mjs tests/marites-wall-scroll-video-navigation-20261113.test.mjs
          node scripts/buklod-home-map-regression.cjs
          node --test tests/scoped-header-safe-area-production-ota-20261107.test.mjs
          node --test tests/native-expo-config-compat.test.cjs
          node scripts/game-kingdom-release-contract.mjs
          node --experimental-strip-types --test tests/kingdom-*.test.mjs
          node scripts/test-kingdom-game-platform-r1.mjs
          GITHUB_REF=refs/heads/main GITHUB_SHA="$(git rev-parse HEAD)" node scripts/buklod-season2-production-embargo.cjs --production
          npx tsc --noEmit
