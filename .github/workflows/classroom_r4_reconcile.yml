name: Classroom R4 Reconcile Latest Main

on:
  push:
    branches:
      - feature/classroom-student-native-r4-sync

permissions:
  contents: write

jobs:
  reconcile-and-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest-main sync branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Import additive Classroom R4 source
        shell: bash
        run: |
          git fetch origin feature/classroom-student-native-r4
          git checkout origin/feature/classroom-student-native-r4 -- \
            '.github/workflows/classroom_r4_runner.yml' \
            'apps/buklod-classroom' \
            'scripts/classroom_r4_integrate.py' \
            'scripts/classroom_r4_finalize.py' \
            'src/app/profile/buklod-faculty-academic-control.tsx' \
            'src/app/profile/buklod-faculty-rle.tsx' \
            'src/app/profile/buklod-faculty-syllabus.tsx'

      - name: Apply surgical R4 integration to latest main files
        run: |
          python scripts/classroom_r4_integrate.py
          python scripts/classroom_r4_finalize.py

      - name: Preserve latest production workflows and add R4 gates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          for raw_path in [
              '.github/workflows/production_android_ota.yml',
              '.github/workflows/production_web_deploy.yml',
          ]:
              p = Path(raw_path)
              s = p.read_text(encoding='utf-8')

              path_anchor = "      - 'src/app/profile/buklod-faculty-class.tsx'\n"
              path_rows = (
                  "      - 'src/app/profile/buklod-faculty-academic-control.tsx'\n"
                  "      - 'src/app/profile/buklod-faculty-syllabus.tsx'\n"
                  "      - 'src/app/profile/buklod-faculty-rle.tsx'\n"
              )
              if "buklod-faculty-academic-control.tsx" not in s:
                  if path_anchor not in s:
                      raise SystemExit(f'{raw_path}: faculty path anchor missing')
                  s = s.replace(path_anchor, path_anchor + path_rows, 1)

              old = "          grep -F \"key: 'classrooms'\" 'src/app/(tabs)/me.tsx'\n"
              gate = (
                  "          if grep -F \"key: 'classrooms'\" 'src/app/(tabs)/me.tsx'; then\n"
                  "            echo \"My Classrooms must remain removed from the BUKLOD Main Profile dashboard.\"\n"
                  "            exit 1\n"
                  "          fi\n"
                  "          grep -F 'BUKLOD_CLASSROOM_R4_ACADEMIC_CONTROL' 'src/app/profile/buklod-faculty-class.tsx'\n"
                  "          grep -F 'buklod_classroom_faculty_apply_academic_setup_v1' 'src/app/profile/buklod-faculty-academic-control.tsx'\n"
                  "          grep -F 'buklod-classroom-syllabus-plan' 'src/app/profile/buklod-faculty-syllabus.tsx'\n"
                  "          grep -F 'buklod_classroom_faculty_review_journal_v1' 'src/app/profile/buklod-faculty-rle.tsx'\n"
              )
              if "My Classrooms must remain removed" not in s:
                  if old not in s:
                      raise SystemExit(f'{raw_path}: My Classrooms production gate anchor missing')
                  s = s.replace(old, gate, 1)

              if raw_path.endswith('production_android_ota.yml'):
                  s = s.replace(
                      '--message "BUKLOD Classroom R1 + latest production fixes"',
                      '--message "BUKLOD Faculty Classroom R4 + latest production fixes"',
                  )

              p.write_text(s, encoding='utf-8')
          PY

      - name: Verify latest-main production fixes survived reconciliation
        shell: bash
        run: |
          grep -F 'bulletin' '.github/workflows/production_android_ota.yml'
          grep -F 'bulletin' '.github/workflows/production_web_deploy.yml'
          test -f 'src/lib/buklodCallLifecycle.ts'
          test -f 'src/app/scope/bulletin-editor.tsx'

      - name: Install QA dependencies
        run: |
          npm ci --ignore-scripts
          npm install --no-save --ignore-scripts --legacy-peer-deps --package-lock=false tus-js-client@4.3.1

      - name: Main TypeScript
        run: npx tsc --noEmit

      - name: Student app TypeScript
        run: npx tsc -p apps/buklod-classroom/tsconfig.json --noEmit

      - name: R4 and production anchor QA
        shell: bash
        run: |
          git diff --check
          if grep -F "key: 'classrooms'" 'src/app/(tabs)/me.tsx'; then exit 1; fi
          grep -F 'BUKLOD_CLASSROOM_R4_ACADEMIC_CONTROL' 'src/app/profile/buklod-faculty-class.tsx'
          grep -F 'buklod_classroom_faculty_apply_academic_setup_v1' 'src/app/profile/buklod-faculty-academic-control.tsx'
          grep -F '/profile/buklod-faculty-syllabus' 'src/app/profile/buklod-faculty-academic-control.tsx'
          grep -F '/profile/buklod-faculty-rle' 'src/app/profile/buklod-faculty-academic-control.tsx'
          grep -F 'buklod-classroom-syllabus-plan' 'src/app/profile/buklod-faculty-syllabus.tsx'
          grep -F 'buklod_classroom_faculty_review_journal_v1' 'src/app/profile/buklod-faculty-rle.tsx'
          grep -F 'buklod-classroom-journal-auto-grade' 'apps/buklod-classroom/app/class/[id]/journal.tsx'
          grep -F 'buklod_classroom_student_released_grade_items_v2' 'apps/buklod-classroom/src/core.ts'
          grep -F 'exam_ids: examIds' 'apps/buklod-classroom/src/core.ts'
          grep -F 'TERM BREAKDOWN R4' 'apps/buklod-classroom/app/class/[id]/[section].tsx'
          grep -F 'My Classrooms must remain removed' '.github/workflows/production_android_ota.yml'
          grep -F 'My Classrooms must remain removed' '.github/workflows/production_web_deploy.yml'

      - name: Commit reconciled Classroom R4
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            '.github/workflows/classroom_r4_runner.yml' \
            '.github/workflows/production_android_ota.yml' \
            '.github/workflows/production_web_deploy.yml' \
            'apps/buklod-classroom' \
            'scripts/classroom_r4_integrate.py' \
            'scripts/classroom_r4_finalize.py' \
            'src/app/(tabs)/me.tsx' \
            'src/app/profile/buklod-faculty-class.tsx' \
            'src/app/profile/buklod-faculty-academic-control.tsx' \
            'src/app/profile/buklod-faculty-rle.tsx' \
            'src/app/profile/buklod-faculty-syllabus.tsx'
          if git diff --cached --quiet; then
            echo 'Reconciliation already applied.'
            exit 0
          fi
          git commit -m 'feat(classroom): reconcile R4 onto latest production main [skip ci]'
          git push origin HEAD:feature/classroom-student-native-r4-sync
