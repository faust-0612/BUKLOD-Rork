name: BUKLOD Emergency Staging Visual Restore 20261114
on:
  push:
    branches: [dev/nav2-wall-stability-integration-20261113]
    paths: [.github/workflows/buklod-staging-emergency-rollback-20261114.yml]
permissions:
  contents: read
concurrency:
  group: buklod-navigation-v2-staging-user
  cancel-in-progress: false
jobs:
  visual-staging-restore:
    if: ${{ github.repository == 'faust-0612/BUKLOD-Rork' && github.ref == 'refs/heads/dev/nav2-wall-stability-integration-20261113' && startsWith(github.event.head_commit.message, 'BUKLOD_STAGING_EMERGENCY_RESTORE_20261114:') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      APP_VARIANT: staging
      EXPO_PUBLIC_APP_ENV: staging
      BUKLOD_APP_TARGET: main
      EVIDENCE_DIR: /tmp/buklod-staging-rollback-20261114
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Assert exact staging branch and scoped rollback source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/dev/nav2-wall-stability-integration-20261113'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$EXPO_TOKEN"
          mkdir -p "$EVIDENCE_DIR"
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/navigation-v2-staging-rollback-release-20261114.test.mjs
      - name: Verify immediately previous Visual Staging update and production isolation
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@27.9.0 channel:view staging-user --json --non-interactive > "$EVIDENCE_DIR/staging-before.json"
          npx --yes eas-cli@27.9.0 channel:view production --json --non-interactive > "$EVIDENCE_DIR/production-before.json"
          npx --yes eas-cli@27.9.0 update:list --branch staging-user --platform android --limit 10 --json --non-interactive > "$EVIDENCE_DIR/list-before.json"
          npx --yes eas-cli@27.9.0 update:view 4549f879-a9b6-4577-86a0-585eabafd224 --json > "$EVIDENCE_DIR/visual-prior.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {verifyChannels,manifest} from './scripts/navigation-v2-owner-staging-policy.mjs';
          const dir=process.env.EVIDENCE_DIR;
          const read=p=>JSON.parse(fs.readFileSync(dir+'/'+p,'utf8'));
          const rows=v=>Array.isArray(v)?v:v.currentPage;
          const prior=rows(read('visual-prior.json'));
          assert.equal(prior.length,1);
          assert.equal(prior[0].id,'01a1d606-ce68-79db-8fc3-211db8a41305');
          assert.equal(prior[0].group,'4549f879-a9b6-4577-86a0-585eabafd224');
          assert.equal(prior[0].gitCommitHash,'e1551b09ad180e81a889d39615aea6257688ddea');
          assert.equal(prior[0].platform,'android');
          assert.equal(prior[0].runtimeVersion,'1.3.2');
          assert.equal(prior[0].branch,'staging-user');
          const first=rows(read('list-before.json'))[0];
          assert.equal(first.platforms,'android');
          assert.match(first.message,/BUKLOD_NAV_V2_OWNER_STAGING_42e8280f49a1dc9b6c1bdb7f61964264be09d6ef/);
          assert.equal(first.group,'1d374d1b-7d44-4ec8-9d2b-91dfe24024b8');
          const b=verifyChannels(read('staging-before.json'),read('production-before.json'));
          const stage=await manifest('staging-user');
          assert.equal(stage.id.toLowerCase(),'01a1d7e7-3895-7867-b913-42f4a273a348');
          assert.equal(stage.extra?.expoClient?.android?.package,'org.mzbministry.buklod.staging');
          const production=await manifest('production');
          assert.equal(production.extra?.expoClient?.android?.package,'org.mzbministry.buklod');
          fs.writeFileSync(dir+'/before.json',JSON.stringify({stagingId:'01a1d7e7-3895-7867-b913-42f4a273a348',productionId:production.id,branchId:b.id,priorGroup:prior[0].group,priorSource:prior[0].gitCommitHash},null,2));
          NODE
      - name: Republish only the immediately preceding Android Visual Staging OTA
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@27.9.0 update:list --branch staging-user --platform android --limit 5 --json --non-interactive > "$EVIDENCE_DIR/list-recheck.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const d=JSON.parse(fs.readFileSync(process.env.EVIDENCE_DIR+'/list-recheck.json','utf8'));
          const rows=Array.isArray(d)?d:d.currentPage;
          assert.match(rows[0].message,/BUKLOD_NAV_V2_OWNER_STAGING_42e8280f49a1dc9b6c1bdb7f61964264be09d6ef/,'Unexpected staging publication; refuse to overwrite');
          assert.equal(rows[0].platforms,'android');
          assert.equal(rows[0].group,'1d374d1b-7d44-4ec8-9d2b-91dfe24024b8');
          NODE
          npx --yes eas-cli@27.9.0 update:republish --group 4549f879-a9b6-4577-86a0-585eabafd224 --destination-branch staging-user --platform android --message "BUKLOD_RESTORE_VISUAL_STAGING_20261114" --non-interactive --json > "$EVIDENCE_DIR/republished.json"
      - name: Verify exact rollback delivery and unchanged production OTA
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const p=process.env.EVIDENCE_DIR;
          const d=JSON.parse(fs.readFileSync(p+'/republished.json','utf8'));
          const u=Array.isArray(d)?d[0]:Array.isArray(d.currentPage)?d.currentPage[0]:d;
          assert.ok(u.id&&u.group);
          assert.notEqual(u.id,'01a1d7e7-3895-7867-b913-42f4a273a348');
          assert.equal(u.branch,'staging-user');
          assert.equal(u.platform,'android');
          assert.equal(u.runtimeVersion,'1.3.2');
          fs.writeFileSync(p+'/new-group.txt',u.group);
          NODE
          npx --yes eas-cli@27.9.0 update:view "$(cat "$EVIDENCE_DIR/new-group.txt")" --json > "$EVIDENCE_DIR/new-view.json"
          npx --yes eas-cli@27.9.0 update:list --branch staging-user --platform android --limit 5 --json --non-interactive > "$EVIDENCE_DIR/list-after.json"
          npx --yes eas-cli@27.9.0 channel:view staging-user --json --non-interactive > "$EVIDENCE_DIR/staging-after.json"
          npx --yes eas-cli@27.9.0 channel:view production --json --non-interactive > "$EVIDENCE_DIR/production-after.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {verifyChannels,manifest} from './scripts/navigation-v2-owner-staging-policy.mjs';
          const p=process.env.EVIDENCE_DIR;
          const get=n=>JSON.parse(fs.readFileSync(p+'/'+n+'.json','utf8'));
          const row=d=>Array.isArray(d)?d[0]:Array.isArray(d.currentPage)?d.currentPage[0]:d;
          const u=row(get('republished'));
          const v=row(get('new-view'));
          const latest=row(get('list-after'));
          assert.equal(u.id,v.id);
          assert.equal(u.group,v.group);
          assert.equal(latest.platforms,'android');
          assert.match(latest.message,/BUKLOD_RESTORE_VISUAL_STAGING_20261114/);
          assert.equal(latest.group,u.group);
          const before=get('before');
          const after=verifyChannels(get('staging-after'),get('production-after'));
          assert.equal(after.id,before.branchId);
          const stage=await manifest('staging-user');
          assert.equal(stage.id.toLowerCase(),u.id.toLowerCase());
          assert.equal(stage.extra?.expoClient?.android?.package,'org.mzbministry.buklod.staging');
          const production=await manifest('production');
          assert.equal(production.id,before.productionId,'Production OTA changed');
          assert.equal(production.extra?.expoClient?.android?.package,'org.mzbministry.buklod');
          const out={status:'VERIFIED SERVER-SIDE STAGING VISUAL ROLLBACK',sourceUpdateId:'01a1d606-ce68-79db-8fc3-211db8a41305',sourceSha:before.priorSource,restoredGroup:before.priorGroup,newUpdateId:u.id,newGroupId:u.group,channel:'staging-user',runtime:'1.3.2',package:'org.mzbministry.buklod.staging',productionUnchanged:production.id,deviceVerification:'NOT PERFORMED',verifiedAt:new Date().toISOString()};
          fs.writeFileSync(p+'/verification.json',JSON.stringify(out,null,2));
          console.log(out);
          NODE
      - name: Preserve rollback receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buklod-staging-visual-rollback-${{ github.sha }}
          path: /tmp/buklod-staging-rollback-20261114/*.json
          retention-days: 14
          if-no-files-found: ignore
