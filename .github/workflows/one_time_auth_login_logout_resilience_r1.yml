name: One-time BUKLOD auth resilience R1

on:
  push:
    paths:
      - '.github/workflows/one_time_auth_login_logout_resilience_r1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Patch login and logout resilience
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          login_path = Path('src/app/(auth)/login.tsx')
          provider_path = Path('src/providers/AuthProvider.tsx')

          login = login_path.read_text(encoding='utf-8-sig')
          provider = provider_path.read_text(encoding='utf-8-sig')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          login = replace_once(
              login,
              "import { useAuth } from '@/providers/AuthProvider';\n",
              "import { useAuth } from '@/providers/AuthProvider';\nimport {\n  isBuklodInvalidCredentialsError,\n  isBuklodTransientAuthError,\n  resolveBuklodAccountLifecycleAfterLogin,\n  signInWithPasswordResilient,\n  signOutBuklodResilient,\n} from '@/lib/buklodAuthResilience';\n",
              'login auth resilience import',
          )

          login = replace_once(
              login,
              "function suggestedLoginPasswordKey(\n  userId: string\n) {\n  return `buklod.suggested_login.password.${userId}`;\n}\n",
              "function suggestedLoginPasswordKey(\n  userId: string\n) {\n  return `buklod.suggested_login.password.${userId}`;\n}\n\n/* PATCH_AUTH_RESILIENCE_R1_WEB_SECRET_STORAGE\n * SecureStore is native-only. Web uses the app's existing AsyncStorage\n * adapter so Suggested Login never crashes the browser login screen.\n */\nasync function readLoginSecret(key: string) {\n  if (Platform.OS === 'web') {\n    return AsyncStorage.getItem(key);\n  }\n\n  return SecureStore.getItemAsync(key);\n}\n\nasync function writeLoginSecret(\n  key: string,\n  value: string\n) {\n  if (Platform.OS === 'web') {\n    await AsyncStorage.setItem(key, value);\n    return;\n  }\n\n  await SecureStore.setItemAsync(key, value);\n}\n\nasync function deleteLoginSecret(key: string) {\n  if (Platform.OS === 'web') {\n    await AsyncStorage.removeItem(key);\n    return;\n  }\n\n  await SecureStore.deleteItemAsync(key);\n}\n",
              'web secret storage helpers',
          )

          login = login.replace('SecureStore.getItemAsync(', 'readLoginSecret(')
          login = login.replace('SecureStore.setItemAsync(', 'writeLoginSecret(')
          login = login.replace('SecureStore.deleteItemAsync(', 'deleteLoginSecret(')

          old_signin = """  const result =\n    await supabase.auth\n      .signInWithPassword(\n        credentials\n      );\n"""
          new_signin = """  const result =\n    await signInWithPasswordResilient(\n      credentials\n    );\n"""
          login = replace_once(
              login,
              old_signin,
              new_signin,
              'resilient sign in helper',
          )

          login = replace_once(
              login,
              "        // Patch 147 backward compatibility.\n        if (result.error) {\n",
              "        // Patch 147 backward compatibility. Only probe the legacy\n        // identifier after a real credential miss. Do not double auth traffic\n        // when Supabase itself is returning a transient 5xx/timeout.\n        if (\n          result.error &&\n          isBuklodInvalidCredentialsError(\n            result.error\n          )\n        ) {\n",
              'mobile legacy fallback guard',
          )

          old_error = """    if (error) {\n      setBusy(false);\n      triggerShake();\n\n      return Alert.alert(\n        'Login failed',\n        'Invalid login identifier or password.'\n      );\n    }\n"""
          new_error = """    if (error) {\n      setBusy(false);\n      triggerShake();\n\n      const temporaryFailure =\n        isBuklodTransientAuthError(error);\n\n      return Alert.alert(\n        temporaryFailure\n          ? 'BUKLOD is temporarily busy'\n          : 'Login failed',\n        temporaryFailure\n          ? 'Your password was not rejected. The BUKLOD server did not finish the sign-in request. Please try again in a moment.'\n          : 'Invalid login identifier or password.'\n      );\n    }\n"""
          login = replace_once(
              login,
              old_error,
              new_error,
              'login error classification',
          )

          old_lifecycle = """    const {\n      data: accountLifecycle,\n      error: accountLifecycleError,\n    } = await (supabase as any).rpc('buklod_my_account_lifecycle');\n\n    if (accountLifecycleError) {\n      await supabase.auth.signOut();\n      setBusy(false);\n      Alert.alert(\n        'Account Status',\n        'BUKLOD could not verify this account status. Sign-in was stopped safely. Please try again.'\n      );\n      return;\n    }\n"""
          new_lifecycle = """    const {\n      data: accountLifecycle,\n      error: accountLifecycleError,\n    } =\n      await resolveBuklodAccountLifecycleAfterLogin();\n\n    if (accountLifecycleError) {\n      await signOutBuklodResilient();\n      setBusy(false);\n\n      const temporaryFailure =\n        isBuklodTransientAuthError(\n          accountLifecycleError\n        );\n\n      Alert.alert(\n        temporaryFailure\n          ? 'BUKLOD is temporarily busy'\n          : 'Account Status',\n        temporaryFailure\n          ? 'Your password was accepted, but BUKLOD could not safely finish the account-status check. Please try again in a moment.'\n          : 'BUKLOD could not verify this account status. Sign-in was stopped safely. Please try again.'\n      );\n      return;\n    }\n"""
          login = replace_once(
              login,
              old_lifecycle,
              new_lifecycle,
              'resilient lifecycle gate',
          )

          # All deactivated-account exits should be local/resilient too.
          login = login.replace(
              'supabase.auth.signOut()',
              'signOutBuklodResilient()',
          )

          provider = replace_once(
              provider,
              "import { withBuklodTimeout } from '@/lib/buklodAsyncTimeout';\n",
              "import { withBuklodTimeout } from '@/lib/buklodAsyncTimeout';\nimport { signOutBuklodResilient } from '@/lib/buklodAuthResilience';\n",
              'provider resilience import',
          )

          provider = replace_once(
              provider,
              """      signOut: async () => {\n        await supabase.auth.signOut();\n      },\n""",
              """      signOut: async () => {\n        const currentUserId =\n          session?.user?.id ?? null;\n\n        // Make logout immediate in the UI even when Supabase /logout is slow.\n        // The helper also clears the persisted browser/app auth token.\n        sessionUserIdRef.current = null;\n        setSession(null);\n        setProfile(null);\n        setRoles([]);\n        setMembershipState('none');\n        setLoading(false);\n\n        await clearAuthSnapshot(\n          currentUserId\n        );\n\n        const { error } =\n          await signOutBuklodResilient();\n\n        if (error) {\n          console.warn(\n            'BUKLOD sign out fallback:',\n            String(\n              error?.message ??\n                error ??\n                'Local sign out fallback used.'\n            )\n          );\n        }\n      },\n""",
              'provider immediate local logout',
          )

          login_path.write_text(login, encoding='utf-8')
          provider_path.write_text(provider, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript QA
        run: npx tsc --noEmit

      - name: Verify auth hardening markers
        shell: bash
        run: |
          grep -q "signInWithPasswordResilient" "src/app/(auth)/login.tsx"
          grep -q "isBuklodInvalidCredentialsError" "src/app/(auth)/login.tsx"
          grep -q "resolveBuklodAccountLifecycleAfterLogin" "src/app/(auth)/login.tsx"
          grep -q "readLoginSecret" "src/app/(auth)/login.tsx"
          grep -q "signOutBuklodResilient" "src/providers/AuthProvider.tsx"

      - name: Commit auth fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one_time_auth_login_logout_resilience_r1.yml
          git add src/app/'(auth)'/login.tsx src/providers/AuthProvider.tsx src/lib/buklodAuthResilience.ts .github/workflows/one_time_auth_login_logout_resilience_r1.yml
          git commit -m "fix(auth): harden web login and immediate logout"
          git push origin HEAD:main
