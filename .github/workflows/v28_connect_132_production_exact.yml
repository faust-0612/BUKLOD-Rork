name: BUKLOD Connect V28 runtime 1.3.2 Production OTA exact RC
on:
  push:
    branches:
      - release/v28-runtime132-connect-43092995-20261022
    paths:
      - '.github/workflows/v28_connect_132_production_exact.yml'
permissions:
  contents: read
concurrency:
  group: buklod-connect-132-one-shot
  cancel-in-progress: false
env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  EXPO_PUBLIC_APP_ENV: production
  APP_VARIANT: production
  BUKLOD_APP_TARGET: main
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact approved RC
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Fail-closed native runtime and source gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '43092995e8777a2a485a95d350937e6685949175'
          test "$(git rev-parse HEAD^^)" = 'b07e3042643f88387d8cf6f83ee3dd5aa5355d13'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/v28_connect_132_production_exact.yml'
          test -z "$(git diff --name-only b07e3042643f88387d8cf6f83ee3dd5aa5355d13 HEAD -- android ios eas.json package.json package-lock.json assets/release/app-icon.png)"
          grep -F "version: '1.3.4'" app.config.js
          grep -F "versionCode: isStaging ? undefined : 28" app.config.js
          grep -F "runtimeVersion: isClassroom ? '1.3.0' : '1.3.2'" app.config.js
          node -e "const c=require('./app.config.js')({config:{}});if(c.android.package!=='org.mzbministry.buklod'||c.android.versionCode!==28||c.runtimeVersion!=='1.3.2'||c.version!=='1.3.4')process.exit(1);"
          test -f src/lib/connectHistoryLoader.ts
          test -f src/lib/connectScopeReaders.ts
          test -f supabase/review-only/20261021160000_connect_history_page_and_scope_reads.sql
          test ! -f supabase/migrations/20261021160000_connect_history_page_and_scope_reads.sql
          echo 'FROZEN_RUNTIME_132_RC=PASS'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Expo production credential check
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}"
          npx eas-cli@latest whoami --non-interactive
      - name: Publish only Android runtime 1.3.2 to Production
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli@latest update \
            --channel production \
            --platform android \
            --environment production \
            --message "V28 runtime 1.3.2 Connect chat latest-history and photo-collage 43092995" \
            --non-interactive
      - name: Write release summary
        run: |
          echo 'Android runtime 1.3.2 Production OTA published from source 43092995e8777a2a485a95d350937e6685949175' >> "$GITHUB_STEP_SUMMARY"
          echo 'No APK/AAB build or live database migration.' >> "$GITHUB_STEP_SUMMARY"
