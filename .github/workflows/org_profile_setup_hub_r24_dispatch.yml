name: BUKLOD Organization Setup Hub R24 Dispatch

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/org_profile_setup_hub_r24_dispatch.yml'
      - 'src/app/organizations/**'
      - 'src/components/BuklodFoundationWorkspaceNav.tsx'
      - 'src/components/BuklodProfileMembershipNav.tsx'

permissions:
  actions: write
  contents: read

jobs:
  dispatch-production:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch vetted production web workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run production_web_deploy.yml --repo faust-0612/BUKLOD-Rork --ref main

      - name: Dispatch vetted production Android OTA workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run production_android_ota.yml --repo faust-0612/BUKLOD-Rork --ref main

      - name: Summary
        run: |
          echo 'BUKLOD Organization Setup Hub R24 production workflows dispatched.'
          echo 'Web and Android will use the existing production QA/safety gates.'
