# Retired R24 source-change auto-dispatch. Production web publication is only
# authorized by production_web_deploy.yml's protected release-marker push.
# The target workflow has no workflow_dispatch trigger: do not reintroduce
# a gh workflow run call or any push trigger here.
name: BUKLOD Organization Setup Hub R24 Legacy Dispatch (Retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-dispatch-retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain retired production shortcut
        run: |
          echo "R24 legacy web auto-dispatch is retired."
          echo "Use the single reviewed Main release-marker workflow for production publication."
          echo "This workflow never deploys or triggers another workflow."
