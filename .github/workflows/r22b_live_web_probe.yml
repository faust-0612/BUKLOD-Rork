name: BUKLOD R22-B Live Web Probe

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/r22b_live_web_probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live production HTML and bundles
        shell: bash
        run: |
          node <<'NODE'
          async function main() {
            const base = 'https://buklod.expo.app';
            const r = await fetch(base, { cache: 'no-store' });
            console.log('HTML_STATUS=' + r.status);
            const html = await r.text();
            const srcs = [...html.matchAll(/<script[^>]+src=["']([^"']+)["']/g)].map(m => m[1]);
            console.log('SCRIPT_COUNT=' + srcs.length);
            console.log('SCRIPTS=' + JSON.stringify(srcs));
            let all = html;
            for (const src of srcs) {
              const url = new URL(src, base).href;
              const rr = await fetch(url, { cache: 'no-store' });
              console.log('SCRIPT_STATUS ' + rr.status + ' ' + url);
              if (rr.ok) all += '\n' + await rr.text();
            }
            for (const marker of [
              'yhanxndaqbmuzbdqlblu',
              'buklod_set_formation_entry_scope_v1',
              'buklod_scope_formation_approval_queue_v2',
              'buklod_review_scope_formation_approval_v2',
              'buklod_scope_faith_monitoring_summary_v2'
            ]) {
              console.log('MARKER ' + marker + '=' + all.includes(marker));
            }
          }
          main().catch(e => { console.error(e); process.exit(1); });
          NODE
