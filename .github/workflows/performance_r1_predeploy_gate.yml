name: BUKLOD Performance R1 Predeploy Gate

on:
  push:
    branches:
      - perf/r1-cache-dedupe
    paths:
      - '.github/workflows/performance_r1_predeploy_gate.yml'

permissions:
  contents: read

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  CI: '1'

jobs:
  android-bundle-continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact performance branch
        uses: actions/checkout@v4
        with:
          ref: perf/r1-cache-dedupe

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies required for export
        run: npm ci --ignore-scripts

      - name: Resume failed Android export gate only
        shell: bash
        run: |
          test -n "$EXPO_TOKEN"
          npx eas-cli@latest env:exec production \
            'rm -rf dist-android && npx expo export --platform android --output-dir dist-android --clear' \
            --non-interactive

      - name: Verify Android Hermes bundle authority
        shell: bash
        run: |
          BUNDLE="$(find dist-android -type f -name '*.hbc' -print -quit)"
          test -n "$BUNDLE"
          grep -a -F 'yhanxndaqbmuzbdqlblu' "$BUNDLE" >/dev/null
          grep -a -F 'sb_publishable_' "$BUNDLE" >/dev/null
          if grep -a -E 'cjtehbfspgimyhifnjon|oppswibwjrruxkrpiwej' "$BUNDLE" >/dev/null; then
            echo 'STOP: non-Main Supabase project reference found in Android Hermes bundle.'
            exit 1
          fi

      - name: Final no-deploy gate
        shell: bash
        run: |
          echo 'ANDROID CONTINUATION GATE PASSED'
          echo 'Combined with run 33988036222: Main env, protected anchors, TypeScript, web export, web authority and Android export already passed.'
          echo 'NO DEPLOY / NO OTA / NO APK / NO AAB performed.'
