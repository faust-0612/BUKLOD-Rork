name: BUKLOD Web Live Atmosphere R1 Deploy

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/web_live_atmosphere_r1_deploy.yml'
      - 'src/app/+html.tsx'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  CI: '1'

jobs:
  web-only-qa-export-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact production trigger
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify exact trigger SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "Expected trigger SHA: ${GITHUB_SHA}"
          echo "Checked out SHA:      ${actual}"
          test "${actual}" = "${GITHUB_SHA}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify web-only Live Atmosphere anchor
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'BUKLOD_WEB_LIVE_ATMOSPHERE_R1' 'src/app/+html.tsx'
          grep -F 'prefers-reduced-motion: reduce' 'src/app/+html.tsx'
          grep -F 'pointer-events: none' 'src/app/+html.tsx'

      - name: TypeScript QA
        run: npx tsc --noEmit

      - name: Universal production release gate
        run: npm run release:gate

      - name: Expo credential preflight
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}"
          npx eas-cli@latest whoami --non-interactive

      - name: Export production web
        run: npx expo export --platform web --output-dir dist

      - name: Verify exported web artifact
        shell: bash
        run: |
          set -euo pipefail
          test -d dist
          test -f dist/index.html
          grep -F 'buklod-web-ambient-drift' dist/index.html
          grep -F 'google-adsense-account' dist/index.html

      - name: Verify exported protected contracts
        run: |
          npm run character:contract:dist
          npm run game:contract:dist

      - name: Deploy production web only
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          npx eas-cli@latest deploy --prod --non-interactive 2>&1 | tee web-live-atmosphere-deploy-output.txt

      - name: Preserve deploy result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buklod-web-live-atmosphere-r1-${{ github.run_number }}
          path: web-live-atmosphere-deploy-output.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Deployment status
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.deploy.outcome }}" != "success" ]; then
            echo 'BUKLOD web-only Live Atmosphere deployment did not succeed.'
            exit 1
          fi
          echo "BUKLOD web-only Live Atmosphere deployment succeeded for ${GITHUB_SHA}."
