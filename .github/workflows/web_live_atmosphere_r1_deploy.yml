name: BUKLOD Web Live Atmosphere R1 Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Explicitly deploy the verified web-only Live Atmosphere candidate to production'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  CI: '1'

jobs:
  web-only-qa-export-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact manual trigger
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify exact trigger SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify web-only Live Atmosphere anchor
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'BUKLOD_WEB_LIVE_ATMOSPHERE_R1' 'src/app/+html.tsx'
          grep -F 'BUKLOD_PERF_DELTA_MOBILE_WEB_R1' 'src/app/+html.tsx'
          grep -F 'prefers-reduced-motion: reduce' 'src/app/+html.tsx'
          grep -F 'pointer-events: none' 'src/app/+html.tsx'

      - name: TypeScript QA
        run: npx tsc --noEmit

      - name: Universal production release gate
        run: npm run release:gate

      - name: Expo credential preflight
        if: ${{ inputs.deploy_production == true }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}"
          npx eas-cli@latest whoami --non-interactive

      - name: Export production web candidate
        run: npx expo export --platform web --output-dir dist

      - name: Verify exported web artifact
        shell: bash
        run: |
          set -euo pipefail
          test -d dist
          test -f dist/index.html
          grep -F 'buklod-web-ambient-drift' dist/index.html
          grep -F 'google-adsense-account' dist/index.html

      - name: Deploy production web only
        id: deploy
        if: ${{ inputs.deploy_production == true }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          npx eas-cli@latest deploy --prod --non-interactive 2>&1 | tee web-live-atmosphere-deploy-output.txt

      - name: Preserve deploy result
        if: ${{ always() && inputs.deploy_production == true }}
        uses: actions/upload-artifact@v4
        with:
          name: buklod-web-live-atmosphere-r1-${{ github.run_number }}
          path: web-live-atmosphere-deploy-output.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Deployment status
        if: always()
        shell: bash
        env:
          DEPLOY_PRODUCTION: ${{ inputs.deploy_production }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          if [ "$DEPLOY_PRODUCTION" != "true" ]; then
            echo 'BUKLOD Live Atmosphere QA completed. Production deployment was not requested.'
          elif [ "$DEPLOY_OUTCOME" != "success" ]; then
            echo 'BUKLOD web-only Live Atmosphere deployment did not succeed.'
            exit 1
          else
            echo 'BUKLOD web-only Live Atmosphere deployment succeeded.'
          fi
