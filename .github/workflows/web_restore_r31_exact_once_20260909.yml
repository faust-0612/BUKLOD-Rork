name: Web Restore R31 Exact One Shot 20260909

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/web_restore_r31_exact_once_20260909.yml'

permissions:
  contents: read

concurrency:
  group: buklod-web-restore-r31-one-shot
  cancel-in-progress: true

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install EAS CLI
        run: npm install --global eas-cli@latest

      - name: Verify exact R31 target and restore production web alias
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PROJECT_ID: c8e6c6a7-95ff-44a5-8678-baa0d515b271
          R31_DEPLOYMENT_ID: pl674gipyn
          R31_URL: https://buklod--pl674gipyn.expo.app
          PROD_URL: https://buklod-main.expo.app
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "EXPO_TOKEN is missing"
            exit 1
          fi
          curl -fsSL --retry 4 --retry-delay 3 "$R31_URL" -o /tmp/r31.html
          test -s /tmp/r31.html
          grep -q 'expo-root' /tmp/r31.html
          eas deploy --prod --id "$R31_DEPLOYMENT_ID" --non-interactive
          sleep 8
          curl -fsSL --retry 6 --retry-delay 5 "$PROD_URL" -o /tmp/prod.html
          test -s /tmp/prod.html
          grep -q 'expo-root' /tmp/prod.html
          echo "Exact R31 web alias restore completed and production shell verified."
