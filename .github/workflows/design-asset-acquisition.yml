name: Design asset acquisition
on:
  push:
    branches: [dev/asset-acquisition-recovery-20261128]
    paths: ['.github/workflows/design-asset-acquisition.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: design-assets-${{ github.ref }}
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Acquire and validate official archives
        shell: bash
        run: |
          mkdir -p acquired
          python3 - <<'PY'
          import urllib.request, urllib.parse, re, html, pathlib, hashlib, json, zipfile, time, socket
          root=pathlib.Path('acquired')
          sources=['ui-pack-sci-fi','ui-pack','particle-pack','interface-sounds','digital-audio','rpg-audio','music-jingles','impact-sounds','music-loops','smoke-particles']
          results=[]
          def fetch(url, limit):
              if urllib.parse.urlsplit(url).scheme!='https' or urllib.parse.urlsplit(url).hostname not in {'kenney.nl','www.kenney.nl'}: raise ValueError('unapproved host')
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'BUKLOD-Asset-Acquisition/1.0'}),timeout=20) as r:
                          if urllib.parse.urlsplit(r.geturl()).hostname not in {'kenney.nl','www.kenney.nl'}: raise ValueError('unexpected redirect')
                          data=r.read(limit+1)
                          if len(data)>limit: raise ValueError('size limit')
                          return data
                  except (OSError,TimeoutError) as e:
                      if attempt==2: raise
                      time.sleep(2**attempt)
          for host in ['kenney.nl','github.com','opengameart.org']:
              try: print('DNS',host,len(socket.getaddrinfo(host,443)))
              except OSError as e: print('DNS_FAIL',host,str(e))
          for slug in sources:
              page='https://kenney.nl/assets/'+slug
              record={'id':slug,'source':page,'status':'failed'}
              try:
                  text=fetch(page,2_000_000).decode('utf-8')
                  links=[urllib.parse.urljoin(page,html.unescape(x)) for x in re.findall(r'href=["\']([^"\']+\.zip(?:\?[^"\']*)?)["\']',text,re.I)]
                  links=[x for x in links if urllib.parse.urlsplit(x).hostname in {'kenney.nl','www.kenney.nl'}]
                  if not links: raise ValueError('no official ZIP link')
                  url=links[0]
                  data=fetch(url,100_000_000)
                  p=root/(slug+'.zip')
                  p.write_bytes(data)
                  try:
                      with zipfile.ZipFile(p) as z:
                          entries=z.infolist()
                          if not entries or len(entries)>20000 or sum(x.file_size for x in entries)>500_000_000: raise ValueError('archive limits')
                          for x in entries:
                              n=pathlib.PurePosixPath(x.filename.replace(chr(92),'/'))
                              if n.is_absolute() or '..' in n.parts or ':' in x.filename or (x.external_attr>>16)&0o170000==0o120000: raise ValueError('unsafe member')
                          if z.testzip(): raise ValueError('CRC failure')
                          licenses=[x for x in entries if 'license' in x.filename.lower() and x.file_size<100000]
                          if not any(b'cc0' in z.read(x).lower() or b'creative commons zero' in z.read(x).lower() for x in licenses): raise ValueError('CC0 license evidence missing')
                      record.update(status='verified_archive',download=url,sha256=hashlib.sha256(data).hexdigest(),bytes=len(data),author='Kenney',license='CC0')
                  except Exception:
                      p.unlink(missing_ok=True)
                      raise
              except Exception as e: record['error']=str(e)
              results.append(record)
              print(json.dumps(record))
          (root/'manifest.json').write_text(json.dumps(results,indent=2))
          if any(x['status']!='verified_archive' for x in results): raise SystemExit(1)
          PY
      - name: Preserve evidence and verified archives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-assets-verified
          path: acquired/
          retention-days: 30
