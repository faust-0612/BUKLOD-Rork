name: One-time include Points screen in production deploy watchers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one_time_watch_points_for_prod_deploy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add Points screen to Web and Android OTA watched paths
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('.github/workflows/production_web_deploy.yml'),
              Path('.github/workflows/production_android_ota.yml'),
          ]
          target = "      - 'src/app/points/index.tsx'\n"
          anchor = "      - 'src/app/(tabs)/home.tsx'\n"

          for path in files:
              text = path.read_text(encoding='utf-8')
              if target in text:
                  print(f'{path}: Points path already present')
                  continue
              if text.count(anchor) != 1:
                  raise SystemExit(f'{path}: expected one Home path anchor, found {text.count(anchor)}')
              text = text.replace(anchor, anchor + target, 1)
              path.write_text(text, encoding='utf-8')
              print(f'{path}: added Points production watcher')
          PY

      - name: Verify production watcher anchors
        shell: bash
        run: |
          grep -F "src/app/points/index.tsx" .github/workflows/production_web_deploy.yml >/dev/null
          grep -F "src/app/points/index.tsx" .github/workflows/production_android_ota.yml >/dev/null

      - name: Commit watcher fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name "BUKLOD Automation"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/one_time_watch_points_for_prod_deploy.yml
          git add .github/workflows/production_web_deploy.yml .github/workflows/production_android_ota.yml .github/workflows/one_time_watch_points_for_prod_deploy.yml
          git commit -m "ci: deploy Points screen changes to production web and OTA"
          git push origin HEAD:main
