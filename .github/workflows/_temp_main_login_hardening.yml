name: Temporary Main Login Hardening

on:
  push:
    branches:
      - feature/main-login-singleflight-r1

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply bounded login hardening
        run: node scripts/_temp_main_login_hardening.cjs

      - name: Keep authenticated user assignment type-safe
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c 'result.data?.session?.user ??' 'src/app/(auth)/login.tsx')" -eq 3
          sed -i '/result.data?.session?.user ??/d' 'src/app/(auth)/login.tsx'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Hardening anchors
        shell: bash
        run: |
          set -euo pipefail
          grep -q "HIGH_CONCURRENCY_LOGIN_R1" 'src/app/(auth)/login.tsx'
          grep -q "loginInFlightRef.current" 'src/app/(auth)/login.tsx'
          ! sed -n '/const saveSuggestedLogin =/,/async function login(/p' 'src/app/(auth)/login.tsx' | grep -q "auth.getUser"
          ! sed -n '/const saveSuggestedLogin =/,/async function login(/p' 'src/app/(auth)/login.tsx' | grep -q "from('profiles')"
          test "$(grep -c "supabase.auth.signInWithPassword(" src/lib/buklodAuthResilience.ts)" -eq 1
          git diff --check

      - name: Commit verified hardening
        shell: bash
        run: |
          rm -f .github/workflows/_temp_main_login_hardening.yml
          rm -f scripts/_temp_main_login_hardening.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/app/(auth)/login.tsx' src/lib/buklodAuthResilience.ts .github/workflows/_temp_main_login_hardening.yml scripts/_temp_main_login_hardening.cjs
          git diff --cached --check
          git commit -m "Harden Main login against request storms"
          git push origin "HEAD:${GITHUB_REF_NAME}"
