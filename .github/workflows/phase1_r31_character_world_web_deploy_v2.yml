name: BUKLOD R31 Emergency Restore via Proven Runner

on:
  push:
    branches:
      - phase1/r31-character-world-v2
    paths:
      - '.github/workflows/phase1_r31_character_world_web_deploy_v2.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  web-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1/r31-character-world-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install existing dependencies
        run: npm ci --ignore-scripts
      - name: Restore exact R31 production alias
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${EXPO_TOKEN:-}" ] || { echo 'EXPO_TOKEN missing'; exit 1; }
          npx eas-cli@latest deploy:alias --prod --id=pl674gipyn --non-interactive
      - name: Verify production alias is exact R31
        shell: bash
        run: |
          set -euo pipefail
          PROD='https://buklod.expo.app'
          R31='https://buklod--pl674gipyn.expo.app'
          ok=0
          for i in $(seq 1 48); do
            stamp="$(date +%s)-$i"
            curl -fsSL -H 'Cache-Control: no-cache' "$PROD/?restore=$stamp" -o /tmp/prod.html || true
            curl -fsSL -H 'Cache-Control: no-cache' "$R31/?restore=$stamp" -o /tmp/r31.html || true
            grep -oE '_expo/static/js/web/[^"'"'"'< >]+\.js' /tmp/prod.html | sort -u > /tmp/prod.refs || true
            grep -oE '_expo/static/js/web/[^"'"'"'< >]+\.js' /tmp/r31.html | sort -u > /tmp/r31.refs || true
            if [ -s /tmp/prod.refs ] && cmp -s /tmp/prod.refs /tmp/r31.refs; then
              ok=1
              break
            fi
            sleep 5
          done
          [ "$ok" -eq 1 ] || { echo 'Production alias did not converge to R31'; exit 1; }
          while read -r ref; do
            [ -n "$ref" ] || continue
            curl -fsSL -H 'Cache-Control: no-cache' "$PROD/$ref?restore=$(date +%s)" -o /tmp/prod.js
            curl -fsSL -H 'Cache-Control: no-cache' "$R31/$ref?restore=$(date +%s)" -o /tmp/r31.js
            cmp /tmp/prod.js /tmp/r31.js
          done < /tmp/r31.refs
          echo 'PASS: production is exact R31.'
