name: BUKLOD Classroom Integration QA

on:
  push:
    branches:
      - integration/buklod-classroom-r1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/buklod-classroom-r1
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply conflict-safe Classroom doorways
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          me_path = Path('src/app/(tabs)/me.tsx')
          me = me_path.read_text(encoding='utf-8')
          if "key: 'classrooms'" not in me:
              anchor = (
                  "      {\n"
                  "        key: 'attendance-qr',\n"
                  "        icon: 'qrcode',\n"
                  "        label: 'Attendance QR',\n"
                  "        onPress: () => router.push('/profile/attendance-qr' as any),\n"
                  "      },\n"
                  "      {\n"
                  "        key: 'organization',\n"
              )
              replacement = (
                  "      {\n"
                  "        key: 'attendance-qr',\n"
                  "        icon: 'qrcode',\n"
                  "        label: 'Attendance QR',\n"
                  "        onPress: () => router.push('/profile/attendance-qr' as any),\n"
                  "      },\n"
                  "      {\n"
                  "        key: 'classrooms',\n"
                  "        icon: 'google-classroom',\n"
                  "        label: 'My Classrooms',\n"
                  "        onPress: () => router.push('/profile/buklod-classrooms' as any),\n"
                  "      },\n"
                  "      {\n"
                  "        key: 'organization',\n"
              )
              if me.count(anchor) != 1:
                  raise SystemExit(f'My BUKLOD anchor count was {me.count(anchor)}, expected 1')
              me = me.replace(anchor, replacement, 1)
              me_path.write_text(me, encoding='utf-8')

          faculty_path = Path('src/app/profile/buklod-faculty-class.tsx')
          faculty = faculty_path.read_text(encoding='utf-8')
          marker = 'BUKLOD_CLASSROOM_R1_FACULTY_ENTRY'
          if marker not in faculty:
              anchor = (
                  "          <View style={styles.metricCard}><Text style={styles.metricValue}>{gradeItems.length}</Text><Text style={styles.metricLabel}>Grade Items</Text></View>\n"
                  "        </View>\n"
                  "\n"
                  "        <View style={styles.sectionHeader}>\n"
              )
              replacement = (
                  "          <View style={styles.metricCard}><Text style={styles.metricValue}>{gradeItems.length}</Text><Text style={styles.metricLabel}>Grade Items</Text></View>\n"
                  "        </View>\n"
                  "\n"
                  "        {/* BUKLOD_CLASSROOM_R1_FACULTY_ENTRY */}\n"
                  "        <Pressable\n"
                  "          onPress={() =>\n"
                  "            router.push({\n"
                  "              pathname: '/profile/buklod-classroom' as any,\n"
                  "              params: { id: classroomId, name: classroomName },\n"
                  "            })\n"
                  "          }\n"
                  "          style={({ pressed }) => ({\n"
                  "            backgroundColor: '#174c2b',\n"
                  "            borderRadius: 18,\n"
                  "            padding: 16,\n"
                  "            marginBottom: 18,\n"
                  "            flexDirection: 'row',\n"
                  "            alignItems: 'center',\n"
                  "            gap: 12,\n"
                  "            opacity: pressed ? 0.84 : 1,\n"
                  "          })}\n"
                  "        >\n"
                  "          <View style={{ width: 48, height: 48, borderRadius: 15, backgroundColor: '#e7f4e9', alignItems: 'center', justifyContent: 'center' }}>\n"
                  "            <MaterialCommunityIcons name=\"google-classroom\" size={27} color=\"#1f7a3f\" />\n"
                  "          </View>\n"
                  "          <View style={{ flex: 1 }}>\n"
                  "            <Text style={{ color: '#fff', fontWeight: '900', fontSize: 17 }}>Open BUKLOD Classroom</Text>\n"
                  "            <Text style={{ color: '#d4e5d8', lineHeight: 17, fontSize: 11, marginTop: 3 }}>Live class, discussions, messages, activities, submissions, materials and asynchronous monitoring.</Text>\n"
                  "          </View>\n"
                  "          <MaterialCommunityIcons name=\"chevron-right\" size={23} color=\"#fff\" />\n"
                  "        </Pressable>\n"
                  "\n"
                  "        <View style={styles.sectionHeader}>\n"
              )
              if faculty.count(anchor) != 1:
                  raise SystemExit(f'Faculty anchor count was {faculty.count(anchor)}, expected 1')
              faculty = faculty.replace(anchor, replacement, 1)
              faculty_path.write_text(faculty, encoding='utf-8')
          PY

      - name: Verify Classroom wiring anchors
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c "key: 'classrooms'" 'src/app/(tabs)/me.tsx')" -eq 1
          test "$(grep -c 'BUKLOD_CLASSROOM_R1_FACULTY_ENTRY' src/app/profile/buklod-faculty-class.tsx)" -eq 1
          test -f src/app/profile/buklod-classroom.tsx
          test -f src/app/profile/buklod-classrooms.tsx
          test -f src/components/classroom/ClassroomLiveView.native.tsx
          test -f src/components/classroom/ClassroomLiveView.web.tsx

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript QA
        run: npx tsc --noEmit

      - name: Commit validated doorways and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/classroom_integration_qa.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'src/app/(tabs)/me.tsx' src/app/profile/buklod-faculty-class.tsx .github/workflows/classroom_integration_qa.yml
          if git diff --cached --quiet; then
            echo 'No integration changes to commit.'
            exit 0
          fi
          git commit -m 'feat(classroom): wire Classroom R1 into current UI'
          git push origin HEAD:integration/buklod-classroom-r1
