name: BUKLOD Performance R2 Realtime Audit

on:
  push:
    branches:
      - perf/r2-realtime-publication-audit
    paths:
      - '.github/workflows/performance_r2_realtime_audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact audit branch
        uses: actions/checkout@v4
        with:
          ref: perf/r2-realtime-publication-audit

      - name: Inventory client postgres_changes subscriptions
        shell: bash
        run: |
          echo '=== POSTGRES_CHANGES LOCATIONS ==='
          grep -RIn --exclude-dir=node_modules --exclude-dir=.git --include='*.ts' --include='*.tsx' "postgres_changes" src || true
          echo '=== SUPABASE CHANNEL LOCATIONS ==='
          grep -RIn --exclude-dir=node_modules --exclude-dir=.git --include='*.ts' --include='*.tsx' "supabase.channel" src || true
          echo '=== PUBLICATION TABLE NAME REFERENCES IN CLIENT SOURCE ==='
          for t in \
            buklod_connect_direct_message_reactions \
            buklod_connect_direct_messages \
            buklod_connect_scope_message_reactions \
            buklod_connect_scope_messages \
            comment_reactions \
            comments \
            community_photo_reactions \
            community_post_media \
            community_posts \
            direct_conversation_user_state \
            direct_message_hidden \
            direct_message_reactions \
            direct_message_reads \
            direct_messages \
            follow_ups \
            post_share_requests \
            reactions
          do
            count="$((grep -RIl --exclude-dir=node_modules --exclude-dir=.git --include='*.ts' --include='*.tsx' "$t" src || true) | wc -l | tr -d ' ')"
            echo "$t files=$count"
            if [ "$count" -gt 0 ]; then
              grep -RIn --exclude-dir=node_modules --exclude-dir=.git --include='*.ts' --include='*.tsx' "$t" src || true
            fi
          done

      - name: No deploy marker
        run: echo 'AUDIT ONLY — NO DEPLOY / NO OTA / NO APK / NO AAB / NO DB CHANGE'
