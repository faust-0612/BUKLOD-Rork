name: BUKLOD Points Manual Claim Staging Source QA (No OTA)
on:
  push:
    branches:
      - dev/points-manual-claim-staging-compatible-20261124
permissions:
  contents: read
concurrency:
  group: buklod-points-staging-source-qa
  cancel-in-progress: false
jobs:
  manual-claim-ota-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_VARIANT: staging
      EXPO_PUBLIC_APP_ENV: staging
      BUKLOD_APP_TARGET: main
      EXPO_PUBLIC_POINTS_REWARDED_BONUS_ENABLED: 'false'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify exact staging-only source delta and immutable native baseline
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const a=require('node:assert/strict');
          const cp=require('node:child_process');
          const base='9aed7d6ad8b6d0ad80aa71daaf66962e9d49de04';
          const current=process.env.GITHUB_SHA;
          a.equal(cp.execFileSync('git',['rev-parse',current+'^'],{encoding:'utf8'}).trim(),base,'Parent is not current reviewed main');
          const changed=cp.execFileSync('git',['diff-tree','--no-commit-id','--name-only','-r',current],{encoding:'utf8'}).trim().split('\n').filter(Boolean).sort();
          const allowed=[
            'src/components/points/BuklodPointsRewardsScreen.tsx',
            'src/lib/buklodRewards.ts',
            'src/lib/buklodPointsAdBonus.ts',
            'src/lib/buklodPointsRewardedAd.native.ts',
            'src/lib/buklodPointsRewardedAd.ts',
            'src/lib/buklodPointsRewardedAd.web.ts',
            'tests/buklod-ad-opportunities.test.cjs',
            'tests/cluster-connect-notifications-points-20261108.test.mjs',
            'tests/buklod-points-live-backend-compatible-staging-20261124.test.mjs',
            'docs/release/BUKLOD_POINTS_STAGING_NO_NEW_SUPABASE_20261124.md',
            '.github/workflows/buklod-points-manual-claims-staging-source-qa.yml',
          ].sort();
          a.deepEqual(changed,allowed,'Staging source contains unrelated or backend mutations');
          const config=require('./app.config.js')({config:{}});
          const eas=require('./eas.json');
          a.equal(config.android.package,'org.mzbministry.buklod.staging');
          a.equal(config.runtimeVersion,'1.3.2');
          a.equal(eas.build['staging-user'].channel,'staging-user');
          a.notEqual(eas.build['staging-user'].channel,eas.build.production.channel);
          console.log('Native fingerprint unchanged; no Supabase migration, production channel or financial code changed');
          NODE
      - name: Individual claim and existing AdMob lifecycle contracts
        run: |
          node --experimental-strip-types --test \
            tests/buklod-points-live-backend-compatible-staging-20261124.test.mjs \
            tests/buklod-ad-opportunities.test.cjs \
            tests/cluster-connect-notifications-points-20261108.test.mjs \
            tests/buklod-ad-restoration-locked-20261107.test.mjs
      - name: Compile check using exact package-lock (no native build)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx tsc --noEmit
      - name: No OTA publication from unverified backend-connected candidate
        run: echo 'Source QA only. No OTA or live backend mutation.'
