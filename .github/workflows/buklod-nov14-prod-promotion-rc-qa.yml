# Isolated production preflight ONLY. Never merges, deploys, or alters Expo channels.
# Final RC recheck: Android-only promotion with immutable staging Kingdom and Profile/Connect tests.
# Protected release/buklod-prod-rank-ads-performance-20261114 PR: V2 scope contract + rank/ads/performance regression proof.
# Exact final RC: canonical Philippine monthly/top-10 and all-time Top 10 Profile rendering, no fake ranks; production native-safe export required.
# Staging source was verified on Android preview; this job checks production config
# and protected product regressions before any main/production promotion.
name: BUKLOD Nov14 Production Promotion RC QA - NO PUBLISH
on:
  push:
    branches:
      - release/buklod-prod-rank-ads-performance-20261114
    paths:
      - '.github/workflows/buklod-nov14-prod-promotion-rc-qa.yml'
permissions:
  contents: read
concurrency:
  group: buklod-nov14-production-rc-preflight
  cancel-in-progress: false
jobs:
  production-rc-no-publish:
    if: ${{ github.repository == 'faust-0612/BUKLOD-Rork' && github.ref == 'refs/heads/release/buklod-prod-rank-ads-performance-20261114' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_VARIANT: production
      EXPO_PUBLIC_APP_ENV: production
      BUKLOD_APP_TARGET: main
      EXPO_PUBLIC_STREAM_ANDROID_PUSH_PROVIDER_NAME: firebase-video-production
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Immutable source, main ancestry and complete native/DB isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin main --no-tags
          expected_main='859b96d6cc15696fffd6ef33bfaf16f0424c9f67'
          test "$(git rev-parse origin/main)" = "$expected_main" || {
            echo 'STOP: production main changed; re-reconcile exact live baseline.'; exit 1;
          }
          git merge-base --is-ancestor "$expected_main" "$GITHUB_SHA"
          test -z "$(git diff --name-only "$expected_main" "$GITHUB_SHA" -- package.json package-lock.json app.config.js eas.json android ios plugins supabase)" || {
            echo 'STOP: native, secrets, backend, dependencies or app identity drift from production.'; exit 1;
          }
          node <<'NODE'
          const assert=require('node:assert/strict');
          const cfg=require('./app.config.js')({config:{}});
          const eas=require('./eas.json');
          const release=require('./release/nov14-staging-conso-excluding-health-saliksik.json');
          assert.equal(cfg.android.package,'org.mzbministry.buklod');
          assert.equal(cfg.runtimeVersion,'1.3.2');
          assert.equal(cfg.extra.appEnvironment,'production');
          assert.equal(cfg.extra.appTarget,'main');
          assert.equal(cfg.extra.eas.projectId,'23dad7d0-389a-406e-8dec-08965dab85d8');
          assert.equal(eas.build.production.channel,'production');
          assert.equal(eas.build['staging-user'].channel,'staging-user');
          assert.equal(release.otaPublished,false,'Do not forge source manifest state');
          assert.equal(release.productionPublished,false,'Do not forge production state');
          assert(release.excluded.some(x=>x.includes('Health Center')));
          assert(release.excluded.some(x=>x.includes('SALIKSIK')));
          console.log('PASS: production identity with staging exclusions; no backend writes');
          NODE
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Production critical releases and regression suites
        run: |
          set -euo pipefail
          node --test tests/native-expo-config-compat.test.cjs
          node --experimental-strip-types --test \
            tests/nov14-connect-green-profile-posts-ota.test.mjs \
            tests/nov14-profile-navigation-personal-activity-report.test.mjs \
            tests/nov14-profile-top-ten-ranked-list-20261114.test.mjs \
            tests/wall-life-kl-navigation-20261114.test.mjs \
            tests/kingdom-r9-39-cinematic-scenes-staging-20261114.test.mjs \
            tests/buklod-comment-menu-android-20261113.test.mjs \
            tests/marites-wall-scroll-video-navigation-20261113.test.mjs \
            tests/sponsor-ad-video-fast-start-20261114.test.mjs \
            tests/auth-registration-offline-recovery.test.cjs \
            tests/registration-network-recovery.test.cjs \
            tests/buklod-igpat-retirement-release-marker-20261111.test.mjs \
            tests/buklod-ads-appwide-permanent-lock-20261111.test.mjs \
            tests/buklod-ads-production-release-contract-20261111.test.mjs \
            tests/production-ota-ads-regression.test.mjs
          node --test tests/buklod-prod-android-only-release-20261114.test.mjs
          node scripts/game-kingdom-release-contract.mjs
          node scripts/buklod-ad-surface-audit.mjs --summary
      - name: Production type safety
        run: npx tsc --noEmit
      - name: Export PRODUCTION Android RC with existing signed-client ABI - NEVER publish
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}" || { echo 'STOP: missing Expo credential'; exit 1; }
          npx --yes eas-cli@27.9.0 env:pull --environment production --path /tmp/buklod-nov14-production-rc.env --non-interactive
          set -a
          . /tmp/buklod-nov14-production-rc.env
          set +a
          export APP_VARIANT=production EXPO_PUBLIC_APP_ENV=production BUKLOD_APP_TARGET=main EXPO_PUBLIC_STREAM_ANDROID_PUSH_PROVIDER_NAME=firebase-video-production
          npx expo config --json > /tmp/buklod-nov14-production-config.json
          node <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync('/tmp/buklod-nov14-production-config.json','utf8'));
          assert.equal(c.android.package,'org.mzbministry.buklod');
          assert.equal(c.runtimeVersion,'1.3.2');
          assert.equal(c.extra.appEnvironment,'production');
          assert.equal(c.extra.appTarget,'main');
          assert.equal(c.extra.eas.projectId,'23dad7d0-389a-406e-8dec-08965dab85d8');
          assert.match(process.env.EXPO_PUBLIC_SUPABASE_URL||'',/^https:\/\/[a-z0-9]+\.supabase\.co$/);
          assert.ok(process.env.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY);
          NODE
          EXPO_MAX_WORKERS=2 npx expo export --platform android --output-dir /tmp/buklod-nov14-prod-rc --clear
          test -s /tmp/buklod-nov14-prod-rc/metadata.json
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo 'PRODUCTION RC SOURCE COMPILED, NOT PUBLISHED. Requires owner-governed full acceptance and exact main promotion.'
