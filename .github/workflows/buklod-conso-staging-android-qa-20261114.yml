name: BUKLOD Consolidated Staging Android No-Publish Export QA
on:
  pull_request:
    paths:
      - 'src/app/(tabs)/buklod.tsx'
      - 'src/app/admin/saliksik-library.tsx'
      - 'supabase/migrations/20261114150000_buklod_hc_consultation_r1.sql'
      - 'tests/wall-life-kl-navigation-20261114.test.mjs'
      - 'tests/nov14-health-backend-rls-security.test.mjs'
      - '.github/workflows/buklod-conso-staging-android-qa-20261114.yml'
permissions:
  contents: read
jobs:
  staging-android-source:
    if: ${{ github.repository == 'faust-0612/BUKLOD-Rork' && github.head_ref == 'integration/buklod-conso-staging-20261114-r1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      APP_VARIANT: staging
      EXPO_PUBLIC_APP_ENV: staging
      BUKLOD_APP_TARGET: main
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact locked dependencies without native mutations
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Assert preview Android identity and preserve production channel
        run: |
          node <<'NODE'
          const a=require('node:assert/strict');
          const config=require('./app.config.js')({config:{}});
          const eas=require('./eas.json');
          a.equal(config.android.package,'org.mzbministry.buklod.staging');
          a.equal(config.runtimeVersion,'1.3.2');
          a.equal(config.extra.appEnvironment,'staging');
          a.equal(eas.build['staging-user'].channel,'staging-user');
          a.equal(eas.build['staging-user'].environment,'preview');
          a.equal(eas.build.production.channel,'production');
          NODE
      - name: Focused Wall Health Saliksik and protected media tests
        run: |
          node --experimental-strip-types --test \
            tests/wall-life-kl-navigation-20261114.test.mjs \
            tests/nov14-health-backend-rls-security.test.mjs \
            tests/saliksik-backend-security-20261112.test.mjs \
            tests/nov14-imci-health-flow.test.mjs \
            tests/buklod-igpat-retirement-release-marker-20261111.test.mjs
      - name: Exact staging Android JS export and TypeScript verification (no OTA)
        run: |
          npx tsc --noEmit
          EXPO_MAX_WORKERS=2 npx expo export --platform android --output-dir /tmp/buklod-conso-staging-android --clear
          test -s /tmp/buklod-conso-staging-android/metadata.json
      - name: Confirm no build, publish or source checkout mutations
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo 'Source SHA mismatch'; exit 1; }
          test -z "$(git status --porcelain --untracked-files=no)"
          echo 'Non-publishing Android source export verified; not a signed APK, installed test or staging OTA.'
