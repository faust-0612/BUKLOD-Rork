name: One-shot Add Login Web Deploy Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-add-login-web-gate.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add login.tsx to production web deploy paths
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/production_web_deploy.yml')
          text = path.read_text(encoding='utf-8')
          target = "      - 'src/app/(auth)/login.tsx'\n"

          if target not in text:
              anchor = "      - 'src/app/(auth)/forgot-password.tsx'\n"
              if anchor not in text:
                  raise SystemExit('Production web auth path anchor not found.')
              text = text.replace(anchor, target + anchor, 1)
              path.write_text(text, encoding='utf-8')

          if target not in path.read_text(encoding='utf-8'):
              raise SystemExit('login.tsx deploy path was not installed.')

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          grep -F "src/app/(auth)/login.tsx" .github/workflows/production_web_deploy.yml
          git diff --check
          rm -f .github/workflows/one-shot-add-login-web-gate.yml
          git config user.name "BUKLOD Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/production_web_deploy.yml .github/workflows/one-shot-add-login-web-gate.yml
          git commit -m "fix(web): deploy production when login screen changes"
          git push origin HEAD:main
