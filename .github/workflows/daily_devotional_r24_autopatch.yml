name: BUKLOD Daily Devotional R24 Auto Patch

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  EXPO_PUBLIC_APP_ENV: production
  CI: '1'

jobs:
  patch-test-commit-deploy:
    if: ${{ false }} # Legacy production publisher retired; use the exact-RC Android workflow.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply Daily Devotional R24
        run: python scripts/apply-daily-devotional-r24.py

      - name: Verify exact scope
        shell: bash
        run: |
          git diff --exit-code -- . ':!src/app/(tabs)/home.tsx' ':!src/app/devotional/[id].tsx' || {
            echo 'R24 changed an unexpected file.'
            exit 1
          }
          grep -F 'get_my_daily_devotional' 'src/app/(tabs)/home.tsx'
          if grep -F 'OPEN WEEKLY DEVOTIONAL' 'src/app/(tabs)/home.tsx'; then
            echo 'Old weekly devotional button remains.'
            exit 1
          fi
          grep -F 'BUKLOD_DAILY_DEVOTIONAL_R24_DETAIL' 'src/app/devotional/[id].tsx'
          grep -F 'STORY / ILLUSTRATION' 'src/app/devotional/[id].tsx'
          grep -F 'QUOTATION' 'src/app/devotional/[id].tsx'
          grep -F 'PRACTICAL TODAY' 'src/app/devotional/[id].tsx'

      - name: TypeScript QA
        run: npx tsc --noEmit

      - name: Commit patched source to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'src/app/(tabs)/home.tsx' 'src/app/devotional/[id].tsx'
          if git diff --cached --quiet; then
            echo 'R24 source is already present on main.'
          else
            git commit -m 'Make faith devotional fresh daily with richer content'
            git push origin HEAD:main
          fi

      - name: Expo credential preflight
        id: expo
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo 'EXPO_TOKEN is unavailable; source is committed but deploy cannot run.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx eas-cli@latest whoami --non-interactive
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Export production web
        if: steps.expo.outputs.ready == 'true'
        env:
          NODE_ENV: production
        run: |
          rm -rf dist
          npx expo export --platform web --output-dir dist --clear
          node scripts/inject-adsense-web-head.cjs dist

      - name: Deploy production web
        if: steps.expo.outputs.ready == 'true'
        env:
          NODE_ENV: production
        run: npx eas-cli@latest deploy --prod --non-interactive

      - name: Publish Android production OTA
        if: steps.expo.outputs.ready == 'true'
        run: |
          npx eas-cli@latest update \
            --channel production \
            --platform android \
            --environment production \
            --message 'BUKLOD Daily Devotional R24' \
            --non-interactive

      - name: Final status
        shell: bash
        run: |
          echo 'BUKLOD DAILY DEVOTIONAL R24 COMPLETE'
          echo 'Daily Manila-midnight rotation + richer biblical content.'
          echo 'No DB reset / no APK / no AAB.'
