name: Classroom Restore Exact Locked 37uiyahswg

on:
  push:
    branches:
      - ops/restore-classroom-golden-37uiyahswg-20260909
    paths:
      - '.github/workflows/classroom_restore_locked_37uiyahswg.yml'

permissions:
  contents: read

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  restore-exact-locked-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Expo credential preflight
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          npx eas-cli@latest whoami --non-interactive

      - name: Prepare exact Classroom EAS project context
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/buklod-classroom-restore
          mkdir -p /tmp/buklod-classroom-restore
          cat > /tmp/buklod-classroom-restore/package.json <<'JSON'
          {"name":"buklod-classroom-restore-context","version":"1.0.0","private":true,"dependencies":{"expo":"^54.0.0","react":"19.1.0","react-native":"0.81.4"}}
          JSON
          cat > /tmp/buklod-classroom-restore/app.json <<'JSON'
          {"expo":{"name":"BUKLOD Classroom","slug":"buklod-classroom","owner":"faust_0612","extra":{"eas":{"projectId":"14100ed1-7f25-4551-9627-09d280498241"}}}}
          JSON
          cd /tmp/buklod-classroom-restore
          git init -q
          npx eas-cli@latest project:info --non-interactive

      - name: Read locked golden asset
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 "https://buklod-classroom--37uiyahswg.expo.app/?verify=$(date +%s)" -o /tmp/golden.html
          GOLDEN_JS=$(grep -oE 'src="[^"]+\.js[^"]*"' /tmp/golden.html | head -1 | sed -E 's/^src="|"$//g')
          test -n "$GOLDEN_JS"
          echo "GOLDEN_JS=$GOLDEN_JS" >> "$GITHUB_ENV"
          echo "Locked golden JS: $GOLDEN_JS"
          curl -fsSL --retry 3 --retry-delay 2 "https://buklod-classroom--37uiyahswg.expo.app${GOLDEN_JS}" -o /tmp/golden.js

      - name: Validate locked Faculty Classroom UI contract
        shell: bash
        run: |
          set -euo pipefail
          for required in 'FACULTY CLASSROOM' 'Active Students' 'Active Faculty' 'ENROLL STUDENT' 'ADD FACULTY' 'Faculty Team' 'Classroom Tools' 'Materials' 'Assessments' 'Group Activities'; do
            grep -Fq "$required" /tmp/golden.js || { echo "Missing locked UI marker: $required" >&2; exit 1; }
          done
          for forbidden in 'BUKLOD EXTENSION APP' 'Open BUKLOD Main' 'Return to the Main BUKLOD ecosystem' 'BUKLOD Main is the structure, doorway and session authority'; do
            if grep -Fq "$forbidden" /tmp/golden.js; then
              echo "Forbidden Main/Extension marker found in locked deployment: $forbidden" >&2
              exit 1
            fi
          done
          sha256sum /tmp/golden.js
          echo 'PASS: locked deployment matches the direct Faculty Classroom contract and excludes Main/Extension shell markers.'

      - name: Reassert exact locked deployment as production
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/buklod-classroom-restore
          npx eas-cli@latest deploy:alias --prod --id=37uiyahswg --non-interactive

      - name: Verify production serves locked golden asset
        shell: bash
        run: |
          set -euo pipefail
          echo "Expected golden asset: $GOLDEN_JS"
          for i in $(seq 1 12); do
            BUST="restore-37uiyahswg-$(date +%s)-$i"
            curl -fsSL --retry 2 --retry-delay 1 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "https://buklod-classroom.expo.app/?$BUST" -o /tmp/prod.html
            PROD_JS=$(grep -oE 'src="[^"]+\.js[^"]*"' /tmp/prod.html | head -1 | sed -E 's/^src="|"$//g' || true)
            echo "Attempt $i production JS: $PROD_JS"
            if [ "$PROD_JS" = "$GOLDEN_JS" ]; then
              curl -fsSL --retry 3 --retry-delay 2 "https://buklod-classroom.expo.app${PROD_JS}?$BUST" -o /tmp/prod.js
              if cmp -s /tmp/golden.js /tmp/prod.js; then
                echo "PASS: production now serves the exact locked deployment 37uiyahswg asset byte-for-byte."
                exit 0
              fi
            fi
            sleep 10
          done
          echo "FAIL: production did not expose the locked asset within verification window." >&2
          exit 1
