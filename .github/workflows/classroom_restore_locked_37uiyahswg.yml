name: Classroom Restore Exact Locked 37uiyahswg

on:
  push:
    branches:
      - ops/restore-classroom-golden-37uiyahswg-20260909
    paths:
      - '.github/workflows/classroom_restore_locked_37uiyahswg.yml'

permissions:
  contents: read

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  restore-exact-locked-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Expo credential preflight
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          npx eas-cli@latest whoami --non-interactive

      - name: Prepare exact Classroom EAS project context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/buklod-classroom-restore
          cat > /tmp/buklod-classroom-restore/app.json <<'JSON'
          {
            "expo": {
              "name": "BUKLOD Classroom",
              "slug": "buklod-classroom",
              "owner": "faust_0612",
              "extra": {
                "eas": {
                  "projectId": "14100ed1-7f25-4551-9627-09d280498241"
                }
              }
            }
          }
          JSON
          cd /tmp/buklod-classroom-restore
          npx eas-cli@latest project:info --non-interactive

      - name: Verify locked immutable deployment is reachable
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 'https://buklod-classroom--37uiyahswg.expo.app/' -o /tmp/golden.html
          test -s /tmp/golden.html
          echo "Locked deployment 37uiyahswg is reachable."

      - name: Promote exact locked deployment to Classroom production
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/buklod-classroom-restore
          npx eas-cli@latest deploy:alias --prod --id=37uiyahswg --non-interactive

      - name: Verify production resolves to exact locked deployment assets
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          curl -fsSL --retry 3 --retry-delay 2 'https://buklod-classroom.expo.app/' -o /tmp/prod.html
          GOLDEN_ASSETS=$(grep -oE 'src="[^"]+\.js[^"]*"|href="[^"]+\.(js|css)[^"]*"' /tmp/golden.html | sort -u || true)
          PROD_ASSETS=$(grep -oE 'src="[^"]+\.js[^"]*"|href="[^"]+\.(js|css)[^"]*"' /tmp/prod.html | sort -u || true)
          printf '%s\n' "$GOLDEN_ASSETS" > /tmp/golden-assets.txt
          printf '%s\n' "$PROD_ASSETS" > /tmp/prod-assets.txt
          echo 'Golden assets:'
          cat /tmp/golden-assets.txt
          echo 'Production assets:'
          cat /tmp/prod-assets.txt
          diff -u /tmp/golden-assets.txt /tmp/prod-assets.txt
          echo 'PASS: production references the exact same JS/CSS assets as locked deployment 37uiyahswg.'
