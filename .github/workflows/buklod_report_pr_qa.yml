# MAIN-SIDE INTEGRATION QA ONLY.
# BUKLOD Report is a standalone Focus App. This workflow must never deploy it,
# use BUKLOD Main's Expo project as its release target, or promote it to buklod.expo.app.
name: BUKLOD Main - Report Door and Legacy Integration PR QA

on:
  pull_request:
    paths:
      - 'src/app/reports/**'
      - 'src/components/BuklodWeeklyReportForm.tsx'
      - 'src/lib/buklodReportDomain.ts'
      - 'src/lib/buklodReportFiles.ts'
      - 'src/lib/buklodReportBranding.ts'
      - '.github/workflows/buklod_report_*'
      - '.buklod/**'
      - 'scripts/verify-buklod-app-boundaries.cjs'

permissions:
  contents: read

jobs:
  main-report-integration-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Enforce product boundary before Main-side Report QA
        run: node scripts/verify-buklod-app-boundaries.cjs
      - run: npm ci --ignore-scripts
      - name: Main-side source contract
        run: |
          grep -F 'IMPORT & AUTO-DETECT' src/components/BuklodWeeklyReportForm.tsx
          grep -F 'MARK REMINDER DONE' src/components/BuklodWeeklyReportForm.tsx
          grep -F 'PDF / PRINT' src/components/BuklodWeeklyReportForm.tsx
          grep -F 'buklod-report-import-v1' src/lib/buklodReportFiles.ts
          grep -F 'buklod-report-api-v1' src/lib/buklodReportDomain.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Main-side web compatibility export - NOT a Report deployment
        run: npx expo export --platform web --output-dir dist --clear
      - name: Main-side bundle compatibility contract
        run: |
          test -f dist/index.html
          grep -R -F 'IMPORT & AUTO-DETECT' dist/_expo/static/js/web >/dev/null
          grep -R -F 'MARK REMINDER DONE' dist/_expo/static/js/web >/dev/null
          grep -R -F 'buklod-report-import-v1' dist/_expo/static/js/web >/dev/null
