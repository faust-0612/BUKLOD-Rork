# Exact-source, Android-only, one-shot BUKLOD Bible Story + Pakinggan staging-user OTA.
# No production OTA, database writes, Play Store, new APK/AAB, or web deployment.
name: BUKLOD Bible Stories + Audio staging Android OTA 1.3.2 (NO PROD)
on:
  push:
    branches: [integration/children-bible-audio-staging-132-20261115]
    paths:
      - release/children-bible-audio-stage-132-20261115.json
permissions:
  contents: read
  actions: read
  pull-requests: write
concurrency:
  group: buklod-children-bible-audio-one-shot-staging-132
  cancel-in-progress: false
jobs:
  publish-reviewed-android-staging:
    if: ${{ github.repository == 'faust-0612/BUKLOD-Rork' && github.ref == 'refs/heads/integration/children-bible-audio-staging-132-20261115' && startsWith(github.event.head_commit.message, 'BUKLOD_CHILD_BIBLE_AUDIO_STAGE_132_20261115:') }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      APP_VARIANT: staging
      EXPO_PUBLIC_APP_ENV: staging
      BUKLOD_APP_TARGET: main
      EXPO_PUBLIC_STREAM_ANDROID_PUSH_PROVIDER_NAME: firebase-video-staging
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EVIDENCE_DIR: /tmp/buklod-bible-audio-staging-132-evidence
    steps:
      - name: Checkout exact Android staged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Gate stage draft PR and original Android story audio QA
        uses: actions/github-script@v7
        with:
          script: |
            const branch='integration/children-bible-audio-staging-132-20261115';
            const base='integration/life-human-first-executive-stage-132-20261115';
            const parent='ea9a72c687c0885ea6a3c14a883503204f83dad4';
            const audioHead='9310f5b20c50ae7bbbc488cb573294d2d211714f';
            const required=[
              'Engineering Accountability',
              'BUKLOD Main - Report Door and Legacy Integration PR QA'
            ];
            for(let i=0;i<75;i++){
              const {data:prs}=await github.rest.pulls.list({...context.repo,
                state:'open',head:'faust-0612:'+branch,base,per_page:30});
              const exact=prs.find(p=>p.draft&&p.head.ref===branch&&p.head.sha===context.sha&&p.base.sha===parent);
              if(!exact){
                if(i<5){await new Promise(resolve=>setTimeout(resolve,10000));continue;}
                throw Error('Reviewed draft staging PR missing, wrong source, or target moved');
              }
              const {data:qa}=await github.rest.actions.listWorkflowRunsForRepo({
                ...context.repo,head_sha:audioHead,per_page:100});
              const android=qa.workflow_runs.find(w=>w.name==='BUKLOD Children Bible + Narration Android 1.3.2 QA (NO OTA)'&&w.head_sha===audioHead&&w.event==='pull_request');
              if(android?.status==='completed'&&android.conclusion!=='success')throw Error('Original audio Android QA failed');
              const {data}=await github.rest.actions.listWorkflowRunsForRepo({
                ...context.repo,head_sha:context.sha,per_page:100});
              const checks=required.map(name=>data.workflow_runs.find(w=>
                w.name===name&&w.event==='pull_request'&&w.head_sha===context.sha));
              if(checks.some(w=>w?.status==='completed'&&w.conclusion!=='success'))
                throw Error('Mandatory exact-head PR check failed');
              if(android?.status==='completed'&&android.conclusion==='success'&&
                checks.every(w=>w?.status==='completed'&&w.conclusion==='success')){
                core.info('Original Android QA and exact-head stage PR gates successful');
                return;
              }
              await new Promise(resolve=>setTimeout(resolve,10000));
            }
            throw Error('Source QA or PR checks missing/timeout; no OTA');
      - name: Verify approved audio blobs and exact stage source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git diff --name-only 9310f5b20c50ae7bbbc488cb573294d2d211714f HEAD -- src/app/children-stories src/features/childrenStories | wc -l)" -eq 0
          node scripts/children-bible-audio-staging-release-20261115.mjs source "$GITHUB_SHA"
          npm ci --ignore-scripts --no-audit --no-fund
          node --experimental-strip-types --test \
            tests/children-bible-expanded-catalog-20261115.test.mjs \
            tests/children-story-narration-20261115.test.mjs \
            tests/children-stories-contract.test.mjs \
            tests/children-bible-audio-stage-release-20261115.test.mjs
      - name: Signed staging client and production channel preflight
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}" || { echo 'Missing credential; do not publish'; exit 1; }
          mkdir -p "$EVIDENCE_DIR"
          npx --yes eas-cli@27.9.0 build:view bc4be208-bfb0-42f3-95cb-358353d0600f --json > "$EVIDENCE_DIR/build.json"
          npx --yes eas-cli@27.9.0 channel:view staging-user --json --non-interactive > "$EVIDENCE_DIR/stage-channel-before.json"
          npx --yes eas-cli@27.9.0 channel:view production --json --non-interactive > "$EVIDENCE_DIR/prod-channel-before.json"
          npx --yes eas-cli@27.9.0 update:list --branch staging-user --limit 20 --json --non-interactive > "$EVIDENCE_DIR/stage-updates-before.json"
          node scripts/children-bible-audio-staging-release-20261115.mjs preflight "$GITHUB_SHA" "$EVIDENCE_DIR"
      - name: Android staged source TypeScript and Hermes export with preview environment
        run: |
          set -euo pipefail
          npx --yes eas-cli@27.9.0 env:pull --environment preview --path /tmp/buklod-bible-audio-preview.env --non-interactive
          set -a
          . /tmp/buklod-bible-audio-preview.env
          set +a
          export APP_VARIANT=staging EXPO_PUBLIC_APP_ENV=staging BUKLOD_APP_TARGET=main EXPO_PUBLIC_STREAM_ANDROID_PUSH_PROVIDER_NAME=firebase-video-staging
          npx tsc --noEmit
          EXPO_MAX_WORKERS=2 npx expo export --platform android --output-dir /tmp/buklod-bible-audio-132-export --clear
          test -s /tmp/buklod-bible-audio-132-export/metadata.json
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Final live EAS stage recheck, fail closed on concurrent OTA
        run: |
          set -euo pipefail
          npx --yes eas-cli@27.9.0 update:list --branch staging-user --limit 20 --json --non-interactive > "$EVIDENCE_DIR/stage-updates-recheck.json"
          node scripts/children-bible-audio-staging-release-20261115.mjs recheck "$GITHUB_SHA" "$EVIDENCE_DIR"
      - name: Exactly once publish Android staging-user, never production
        run: |
          set -euo pipefail
          npx --yes eas-cli@27.9.0 update --channel staging-user --platform android --environment preview \
            --skip-bundler --input-dir /tmp/buklod-bible-audio-132-export \
            --non-interactive --json --message "BUKLOD_CHILD_BIBLE_AUDIO_STAGE_132_${GITHUB_SHA}" \
            > "$EVIDENCE_DIR/publish.json"
          node <<'NODE'
          const fs=require('node:fs');
          const rows=JSON.parse(fs.readFileSync(process.env.EVIDENCE_DIR+'/publish.json','utf8'));
          if(!Array.isArray(rows)||rows.length!==1||rows[0].platform!=='android'||!rows[0].group)
            throw Error('Ambiguous staging publish receipt; NEVER retry automatically');
          fs.writeFileSync('/tmp/buklod-bible-audio-published-group',rows[0].group);
          NODE
          npx --yes eas-cli@27.9.0 update:view "$(cat /tmp/buklod-bible-audio-published-group)" --json > "$EVIDENCE_DIR/update-view.json"
      - name: Verify staging manifest and unchanged production independently
        run: |
          set -euo pipefail
          npx --yes eas-cli@27.9.0 channel:view staging-user --json --non-interactive > "$EVIDENCE_DIR/stage-channel-after.json"
          npx --yes eas-cli@27.9.0 channel:view production --json --non-interactive > "$EVIDENCE_DIR/prod-channel-after.json"
          node scripts/children-bible-audio-staging-release-20261115.mjs postpublish "$GITHUB_SHA" "$EVIDENCE_DIR"
          cat "$EVIDENCE_DIR/verification.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Record independently verified EAS receipt on the exact staging PR
        uses: actions/github-script@v7
        env:
          EVIDENCE_DIR: /tmp/buklod-bible-audio-staging-132-evidence
        with:
          script: |
            const fs=require('node:fs');
            const data=JSON.parse(fs.readFileSync(process.env.EVIDENCE_DIR+'/verification.json','utf8'));
            if(data.status!=='VERIFIED CHILD BIBLE + AUDIO ANDROID STAGING OTA' ||
              data.sourceSha!==context.sha || !data.updateId ||
              data.productionOtaPublished!==false || !data.productionUpdateIdUnchanged)
              throw Error('Independent Expo staging receipt incomplete; refuse PR verification');
            const {data:prs}=await github.rest.pulls.list({
              ...context.repo,state:'open',
              head:'faust-0612:integration/children-bible-audio-staging-132-20261115',
              base:'integration/life-human-first-executive-stage-132-20261115',
              per_page:20});
            const pr=prs.find(p=>p.head.sha===context.sha && p.draft);
            if(!pr)throw Error('Cannot attach receipt to exact draft RC');
            const body=[
              '**VERIFIED STAGING ANDROID OTA — Children Bible + Pakinggan**',
              'Source SHA: `'+data.sourceSha+'`',
              'EAS Android update ID: `'+data.updateId+'`',
              'EAS update group: `'+data.updateGroup+'`',
              'Channel: `'+data.channel+'`; Runtime: `'+data.runtimeVersion+'`',
              'Signed staging build: `'+data.buildId+'`',
              'Production unchanged: `'+data.productionUpdateIdUnchanged+'`',
              'Actual handset audio: NOT TESTED; existing owner waiver',
              'Source: '+data.publisherRun
            ].join('\n');
            await github.rest.issues.createComment({
              ...context.repo,issue_number:pr.number,body
            });
      - name: Store exact readback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buklod-bible-audio-android-stage-${{ github.sha }}
          path: /tmp/buklod-bible-audio-staging-132-evidence/*.json
          retention-days: 14
          if-no-files-found: ignore
