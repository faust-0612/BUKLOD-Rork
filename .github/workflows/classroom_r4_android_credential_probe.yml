name: BUKLOD Classroom R4 Android Credential Probe

on:
  push:
    branches:
      - release/classroom-r4-assets-20260908-r1
    paths:
      - '.github/workflows/classroom_r4_android_credential_probe.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  BUKLOD_APP_TARGET: classroom
  APP_VARIANT: production
  EXPO_PUBLIC_APP_ENV: production
  EXPECTED_SOURCE_SHA: e02f68fb8162aa79b4da51ebc71ccbf3516cc550
  CLASSROOM_SOURCE_BRANCH: feature/classroom-harmonized-r4-current-main-20260908
  FIREBASE_TOKEN_PROBE: ${{ secrets.FIREBASE_TOKEN }}
  GCP_SA_KEY_PROBE: ${{ secrets.GCP_SA_KEY }}
  GOOGLE_CREDENTIALS_PROBE: ${{ secrets.GOOGLE_CREDENTIALS }}
  FIREBASE_SERVICE_ACCOUNT_PROBE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
  FIREBASE_SERVICE_ACCOUNT_BUKLOD_PROBE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BUKLOD_EFA4A }}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact protected Classroom source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CLASSROOM_SOURCE_BRANCH }}
          fetch-depth: 1
      - name: Exact source guard
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "protected_branch_sha=${actual}"
          test "$actual" = "$EXPECTED_SOURCE_SHA"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Expo auth and Classroom identity
        shell: bash
        run: |
          test -n "${EXPO_TOKEN:-}"
          npx eas-cli@latest whoami --non-interactive
          npx expo config --type public --json > /tmp/classroom-config.json
          node -e "const fs=require('fs'),a=require('node:assert/strict'),c=JSON.parse(fs.readFileSync('/tmp/classroom-config.json','utf8'));a.equal(c.android.package,'org.mzbministry.buklod.classroom');a.equal(c.extra?.eas?.projectId,'14100ed1-7f25-4551-9627-09d280498241');console.log('CLASSROOM_IDENTITY=PASS')"
      - name: Probe EAS credential metadata without values
        shell: bash
        run: |
          npx eas-cli@latest env:list production --format long > /tmp/eas-env.txt
          echo EAS_CREDENTIAL_NAME_SCAN_START
          grep -Eio 'CLASSROOM_GOOGLE_SERVICES_FILE|GOOGLE_SERVICES_JSON|GOOGLE_SERVICES_FILE|[A-Z0-9_]*FIREBASE[A-Z0-9_]*' /tmp/eas-env.txt | sort -u || true
          echo EAS_CREDENTIAL_NAME_SCAN_END
          for name in CLASSROOM_GOOGLE_SERVICES_FILE GOOGLE_SERVICES_JSON GOOGLE_SERVICES_FILE; do
            if npx eas-cli@latest env:get production --variable-name "$name" --format short --non-interactive >/dev/null 2>&1; then
              echo "EAS_VAR_${name}=PRESENT"
            else
              echo "EAS_VAR_${name}=ABSENT"
            fi
          done
      - name: Validate any known EAS file variable against Classroom package
        shell: bash
        run: |
          npx eas-cli@latest env:exec production "node -e 'const fs=require(\"fs\");const vars=[\"CLASSROOM_GOOGLE_SERVICES_FILE\",\"GOOGLE_SERVICES_JSON\",\"GOOGLE_SERVICES_FILE\"];for(const n of vars){const p=process.env[n]||\"\";const f=!!p&&fs.existsSync(p);let match=false,count=0;if(f){try{const j=JSON.parse(fs.readFileSync(p,\"utf8\"));const names=(j.client||[]).map(c=>c.client_info?.android_client_info?.package_name).filter(Boolean);count=names.length;match=names.includes(\"org.mzbministry.buklod.classroom\")}catch{}}console.log(n+\"_PRESENT=\"+(p?\"YES\":\"NO\"));console.log(n+\"_IS_FILE=\"+(f?\"YES\":\"NO\"));console.log(n+\"_PACKAGE_MATCH=\"+(match?\"YES\":\"NO\"));console.log(n+\"_CLIENT_COUNT=\"+count)}'" --non-interactive
      - name: Probe Firebase management auth presence only
        shell: bash
        run: |
          for name in FIREBASE_TOKEN_PROBE GCP_SA_KEY_PROBE GOOGLE_CREDENTIALS_PROBE FIREBASE_SERVICE_ACCOUNT_PROBE FIREBASE_SERVICE_ACCOUNT_BUKLOD_PROBE; do
            if [ -n "${!name:-}" ]; then
              echo "${name}=PRESENT"
            else
              echo "${name}=ABSENT"
            fi
          done
