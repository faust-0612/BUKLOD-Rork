name: BUKLOD Classroom R4 Android Credential Probe

on:
  push:
    branches:
      - release/classroom-r4-assets-20260908-r1
    paths:
      - '.github/workflows/classroom_r4_android_credential_probe.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  BUKLOD_APP_TARGET: classroom
  APP_VARIANT: production
  EXPO_PUBLIC_APP_ENV: production
  EXPECTED_SOURCE_SHA: e02f68fb8162aa79b4da51ebc71ccbf3516cc550
  CLASSROOM_SOURCE_BRANCH: feature/classroom-harmonized-r4-current-main-20260908

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact protected Classroom source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CLASSROOM_SOURCE_BRANCH }}
          fetch-depth: 1
      - name: Exact source guard
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "protected_branch_sha=${actual}"
          test "$actual" = "$EXPECTED_SOURCE_SHA"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Expo auth and Classroom identity
        shell: bash
        run: |
          test -n "${EXPO_TOKEN:-}"
          npx eas-cli@latest whoami --non-interactive
          npx expo config --type public --json > /tmp/classroom-config.json
          node -e "const fs=require('fs'),a=require('node:assert/strict'),c=JSON.parse(fs.readFileSync('/tmp/classroom-config.json','utf8'));a.equal(c.android.package,'org.mzbministry.buklod.classroom');a.equal(c.extra?.eas?.projectId,'14100ed1-7f25-4551-9627-09d280498241');console.log('CLASSROOM_IDENTITY=PASS')"
      - name: List production environment variable metadata only
        shell: bash
        run: |
          npx eas-cli@latest env:list --environment production --json --non-interactive > /tmp/eas-env.json
          node -e "const fs=require('fs');const raw=JSON.parse(fs.readFileSync('/tmp/eas-env.json','utf8'));const rows=Array.isArray(raw)?raw:(raw.variables||raw.environmentVariables||[]);const safe=rows.map(x=>({name:x.name||x.key||x.variableName||'',type:x.type||x.valueType||'',visibility:x.visibility||'',environment:x.environment||x.environments||''})).filter(x=>x.name);console.log('EAS_ENV_METADATA_START');for(const x of safe)console.log(JSON.stringify(x));console.log('EAS_ENV_METADATA_END');const wanted=safe.filter(x=>/CLASSROOM_GOOGLE_SERVICES_FILE|GOOGLE_SERVICES|FIREBASE/i.test(x.name));console.log('CLASSROOM_CREDENTIAL_CANDIDATE_COUNT='+wanted.length);for(const x of wanted)console.log('CANDIDATE='+JSON.stringify(x));"
      - name: Probe expected file variable without exposing credential
        shell: bash
        run: |
          npx eas-cli@latest env:exec --environment production --non-interactive -- node -e 'const fs=require("fs");const p=process.env.CLASSROOM_GOOGLE_SERVICES_FILE||"";console.log("CLASSROOM_GOOGLE_SERVICES_FILE_PRESENT="+(p?"YES":"NO"));const ok=p&&fs.existsSync(p);console.log("CLASSROOM_GOOGLE_SERVICES_FILE_IS_FILE="+(ok?"YES":"NO"));if(ok){const j=JSON.parse(fs.readFileSync(p,"utf8"));const names=(j.client||[]).map(c=>c.client_info?.android_client_info?.package_name).filter(Boolean);console.log("ANDROID_CLIENT_PACKAGE_MATCH="+(names.includes("org.mzbministry.buklod.classroom")?"YES":"NO"));console.log("ANDROID_CLIENT_COUNT="+names.length)}'
