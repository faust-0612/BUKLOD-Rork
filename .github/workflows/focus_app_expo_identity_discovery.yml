name: BUKLOD Focus App Expo Identity Discovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/focus_app_expo_identity_discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  CI: '1'

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Expo auth gate
        run: |
          test -n "$EXPO_TOKEN"
          npx eas-cli@latest whoami --non-interactive

      - name: Resolve original BUKLOD Report project by full name
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          endpoint='https://api.expo.dev/graphql'
          names=[
            '@faust_0612/BUKLOD_Report',
            '@faust_0612/buklod_report',
            '@faust_0612/buklod-report',
            '@faust_0612/buklodreport',
            '@faust_0612/BUKLOD-Report',
          ]
          token=os.environ['EXPO_TOKEN']
          query='query Lookup($fullName:String!){ app { byFullName(fullName:$fullName){ id fullName name ownerAccount { name } } } }'
          found=[]
          for full in names:
              payload=json.dumps({'query':query,'variables':{'fullName':full}}).encode()
              req=urllib.request.Request(endpoint,data=payload,headers={'Content-Type':'application/json','Authorization':'Bearer '+token})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      data=json.load(r)
              except urllib.error.HTTPError as e:
                  print('LOOKUP_HTTP_ERROR',full,e.code)
                  continue
              except Exception as e:
                  print('LOOKUP_ERROR',full,type(e).__name__)
                  continue
              app=((data.get('data') or {}).get('app') or {}).get('byFullName')
              errors=data.get('errors') or []
              if app:
                  print('FOUND',json.dumps(app,sort_keys=True))
                  found.append(app)
              elif errors:
                  clean=[{'message':x.get('message','')} for x in errors[:2]]
                  print('NOT_FOUND_OR_ERROR',full,json.dumps(clean))
              else:
                  print('NOT_FOUND',full)
          print('FOUND_COUNT',len(found))
          PY

      - name: Show available project commands
        shell: bash
        run: |
          npx eas-cli@latest help project --nested-commands | head -160 || true

      - name: Safety statement
        run: |
          echo 'READ ONLY: no init, no deploy, no update, no build, no project mutation.'
          echo 'BUKLOD Main production was not touched.'
