name: BUKLOD Focus App Expo Identity Discovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/focus_app_expo_identity_discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  CI: '1'

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Expo auth gate
        run: |
          test -n "$EXPO_TOKEN"
          npx eas-cli@latest whoami --non-interactive

      - name: Read recent Expo account audit for Focus App identities
        shell: bash
        run: |
          set +e
          npx eas-cli@latest account:audit faust_0612 --json > /tmp/eas-audit.json 2>/tmp/eas-audit.err
          rc=$?
          set -e
          echo "account:audit exit=$rc"
          if [ -s /tmp/eas-audit.err ]; then
            sed -E 's/(token|authorization|secret|key)[^ ]*/[REDACTED]/Ig' /tmp/eas-audit.err | head -80
          fi
          if [ "$rc" -eq 0 ] && [ -s /tmp/eas-audit.json ]; then
            python - <<'PY'
          import json,re
          p='/tmp/eas-audit.json'
          try:
              data=json.load(open(p,encoding='utf-8'))
          except Exception as e:
              print('AUDIT_JSON_PARSE_ERROR',e)
              raise SystemExit(0)
          rows=data if isinstance(data,list) else data.get('auditLogs') or data.get('data') or data.get('items') or []
          print('AUDIT_ROWS',len(rows) if isinstance(rows,list) else 'unknown')
          needles=('report','classroom','quiz','attendance','project')
          count=0
          for row in rows if isinstance(rows,list) else []:
              s=json.dumps(row,ensure_ascii=False)
              if any(n in s.lower() for n in needles):
                  # print only non-sensitive project/audit metadata; redact token-like fields
                  for k in list(row.keys()) if isinstance(row,dict) else []:
                      if any(x in k.lower() for x in ('token','secret','key','authorization')):
                          row[k]='[REDACTED]'
                  print(json.dumps(row,ensure_ascii=False,sort_keys=True))
                  count+=1
                  if count>=120: break
          print('MATCHED_ROWS',count)
          PY
          fi

      - name: Show available project/account commands
        shell: bash
        run: |
          npx eas-cli@latest --help | grep -Ei 'project|account' | head -80 || true

      - name: Safety statement
        run: |
          echo 'READ ONLY: no init, no deploy, no update, no build, no project mutation.'
          echo 'BUKLOD Main production was not touched.'
