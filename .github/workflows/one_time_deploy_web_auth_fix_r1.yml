name: One-time deploy BUKLOD web auth fix R1

on:
  push:
    paths:
      - '.github/workflows/one_time_deploy_web_auth_fix_r1.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript QA
        run: npx tsc --noEmit

      - name: Check Expo authentication
        id: expo_auth
        shell: bash
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            npx eas-cli@latest whoami --non-interactive
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "EXPO_TOKEN is not configured in this repository."
          fi

      - name: Export production web
        if: steps.expo_auth.outputs.available == 'true'
        shell: bash
        run: |
          npx eas-cli@latest env:exec production "npx expo export --platform web" --non-interactive
          test -f dist/index.html

      - name: Deploy production web
        if: steps.expo_auth.outputs.available == 'true'
        shell: bash
        run: |
          npx eas-cli@latest deploy --prod --non-interactive --environment production --export-dir=dist --json | tee eas-deploy.json

      - name: Preserve deploy result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buklod-web-auth-deploy-result
          path: |
            eas-deploy.json
            dist/metadata.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Remove one-time workflow
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one_time_deploy_web_auth_fix_r1.yml
          git add .github/workflows/one_time_deploy_web_auth_fix_r1.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: remove one-time BUKLOD web auth deploy workflow"
          git pull --rebase origin main
          git push origin HEAD:main
