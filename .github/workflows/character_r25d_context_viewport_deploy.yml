name: BUKLOD Character R25D Context Viewport Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/character_r25d_context_viewport_deploy.yml'
      - 'scripts/apply-character-r25d-context-viewport.cjs'

permissions:
  contents: write

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  EXPO_PUBLIC_APP_ENV: production

jobs:
  patch-qa-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply R25D context viewport
        run: node scripts/apply-character-r25d-context-viewport.cjs

      - name: Verify context contracts
        shell: bash
        run: |
          grep -F 'BUKLOD_CHARACTER_R25D_CONTEXT_VIEWPORT' 'src/components/points/BuklodCharacterLayeredArt.tsx'
          grep -F 'viewportWidth?: number;' 'src/components/points/BuklodCharacterLayeredArt.tsx'
          grep -F 'resolvedViewportWidth' 'src/components/points/BuklodCharacterLayeredArt.tsx'
          grep -F 'BUKLOD_CHARACTER_R25D_PROFILE_VIEWPORT' 'src/components/points/BuklodProfileCharacterCard.tsx'
          grep -F 'viewportWidth={82}' 'src/components/points/BuklodProfileCharacterCard.tsx'
          grep -A9 -F 'artPress: {' 'src/components/points/BuklodProfileCharacterCard.tsx' | grep -F "overflow: 'hidden'"
          grep -F 'BUKLOD_CHARACTER_R25D_THUMB_VIEWPORT' 'src/components/points/BuklodCharacterItemThumb.tsx'
          grep -F 'viewportWidth={Math.max(44, Math.round(size * 0.92))}' 'src/components/points/BuklodCharacterItemThumb.tsx'

      - name: TypeScript QA
        run: npx tsc --noEmit

      - name: Persist R25D source fix
        shell: bash
        run: |
          if git diff --quiet -- \
            'src/components/points/BuklodCharacterLayeredArt.tsx' \
            'src/components/points/BuklodProfileCharacterCard.tsx' \
            'src/components/points/BuklodCharacterItemThumb.tsx'; then
            echo 'R25D source already committed.'
          else
            git config user.name 'BUKLOD Production Bot'
            git config user.email 'actions@users.noreply.github.com'
            git add \
              'src/components/points/BuklodCharacterLayeredArt.tsx' \
              'src/components/points/BuklodProfileCharacterCard.tsx' \
              'src/components/points/BuklodCharacterItemThumb.tsx'
            git commit -m 'Fix Character compact preview width contract'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Expo credential preflight
        id: expo
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx eas-cli@latest whoami --non-interactive
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Publish Android production OTA
        if: steps.expo.outputs.ready == 'true'
        run: |
          npx eas-cli@latest update \
            --channel production \
            --platform android \
            --environment production \
            --message 'BUKLOD Character R25D Context Viewport' \
            --non-interactive

      - name: Deploy production web
        if: steps.expo.outputs.ready == 'true'
        shell: bash
        env:
          NODE_ENV: production
          EXPO_PUBLIC_APP_ENV: production
        run: npx eas-cli@latest deploy --prod --non-interactive

      - name: Final status
        shell: bash
        env:
          EXPO_READY: ${{ steps.expo.outputs.ready }}
        run: |
          if [ "$EXPO_READY" = 'true' ]; then
            echo 'BUKLOD Character R25D Web + Android OTA complete.'
          else
            echo 'R25D source + QA complete; deploy pending because EXPO_TOKEN is unavailable.'
          fi
