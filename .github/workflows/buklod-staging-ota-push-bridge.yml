name: BUKLOD Isolated Staging OTA Dispatch Bridge
# GitHub connector has no workflow_dispatch action. This workflow can be
# initiated by a scoped push to this file on the isolated integration branch.
on:
  push:
    branches:
      - dev/nav2-wall-stability-integration-20261113
    paths:
      - .github/workflows/buklod-staging-ota-push-bridge.yml
permissions:
  contents: read
concurrency:
  group: buklod-nav2-staging-ota-bridge
  cancel-in-progress: false
jobs:
  staging-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_VARIANT: staging
      EXPO_PUBLIC_APP_ENV: staging
      BUKLOD_APP_TARGET: main
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify isolated branch and staging-only target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev/nav2-wall-stability-integration-20261113"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node <<'NODE'
          const assert=require('node:assert/strict');
          const eas=require('./eas.json');
          const app=require('./app.config.js')({config:{}});
          assert.equal(eas.build['staging-user'].channel,'staging-user');
          assert.equal(eas.build['staging-user'].environment,'preview');
          assert.equal(app.android.package,'org.mzbministry.buklod.staging');
          assert.equal(app.runtimeVersion,'1.3.2');
          assert.equal(app.extra.appEnvironment,'staging');
          NODE
      - name: Locked dependencies and focused source checks
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node --experimental-strip-types scripts/navigation-v2-route-audit.mjs
          node --experimental-strip-types --test tests/navigation-v2-*.test.mjs tests/marites-wall-scroll-video-navigation-20261113.test.mjs
          npx tsc --noEmit
      - name: Release gate - fail closed, no device evidence fabrication
        shell: bash
        run: |
          set -euo pipefail
          node scripts/navigation-v2-staging-gate.mjs --prepublish --commit="$GITHUB_SHA" --evidence=release/navigation-v2-staging-evidence.json
      - name: No automatic OTA publish without approved RC
        run: |
          echo 'Preflight passed. This bridge deliberately does not publish OTA.'
          echo 'Use existing staging-only publish workflow once its immutable RC and safety gates are satisfied.'
