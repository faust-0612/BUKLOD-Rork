name: BUKLOD Formation AI Play + APK Release

# Release retrigger: 2026-09-09 current canonical main
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/formation_ai_play_apk_release.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript QA
        run: npx tsc --noEmit

      - name: Verify production identity and Expo credentials
        shell: bash
        run: |
          grep -F "'org.mzbministry.buklod');" app.config.js
          grep -F '"google-play-internal"' eas.json
          grep -F '"track": "internal"' eas.json
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo 'EXPO_TOKEN repository secret is missing.'
            exit 1
          fi
          npx eas-cli@latest whoami --non-interactive

      - name: Build production AAB and submit to Google Play internal
        id: play
        shell: bash
        run: |
          set -o pipefail
          npx eas-cli@latest build \
            --platform android \
            --profile production \
            --auto-submit-with-profile google-play-internal \
            --non-interactive \
            --wait \
            --json > eas-play-build.json
          cat eas-play-build.json

      - name: Build production downloadable APK
        id: apk
        shell: bash
        run: |
          set -o pipefail
          npx eas-cli@latest build \
            --platform android \
            --profile production-apk \
            --non-interactive \
            --wait \
            --json > eas-apk-build.json
          cat eas-apk-build.json

      - name: Summarize release artifacts
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          function first(path) {
            const x = JSON.parse(fs.readFileSync(path, 'utf8'));
            return Array.isArray(x) ? x[0] : x;
          }
          const play = first('eas-play-build.json');
          const apk = first('eas-apk-build.json');
          const apkUrl = apk?.artifacts?.buildUrl || apk?.artifacts?.applicationArchiveUrl || '';
          if (!apkUrl) throw new Error('APK artifact URL missing.');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `## BUKLOD Formation AI Release\n\n` +
            `- Play AAB build ID: ${play?.id || ''}\n` +
            `- Play AAB status: ${play?.status || ''}\n` +
            `- APK build ID: ${apk?.id || ''}\n` +
            `- APK status: ${apk?.status || ''}\n` +
            `- APK: ${apkUrl}\n`);
          console.log(`APK_URL=${apkUrl}`);
          NODE

      - name: Preserve release metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buklod-formation-ai-release-${{ github.run_number }}
          path: |
            eas-play-build.json
            eas-apk-build.json
          if-no-files-found: ignore
