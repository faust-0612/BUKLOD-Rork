name: One-time deploy BUKLOD Performance R4 Android OTA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one_time_deploy_performance_r4_android_ota.yml'

permissions:
  contents: write

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript QA
        run: npx tsc --noEmit

      - name: Verify R4 wiring
        shell: bash
        run: |
          grep -F "createBuklodR4RequestShield" src/lib/supabase.ts
          grep -F "buklod_cluster_home_notices" src/lib/buklodR4RequestShield.ts
          grep -F "buklod_scope_social_feed_v1" src/lib/buklodR4RequestShield.ts

      - name: Verify Expo authentication
        shell: bash
        run: |
          test -n "$EXPO_TOKEN"
          npx eas-cli@latest whoami --non-interactive

      - name: Publish production Android OTA
        shell: bash
        run: |
          npx eas-cli@latest update \
            --channel production \
            --platform android \
            --environment production \
            --message "BUKLOD Performance R4 request shield" \
            --non-interactive

      - name: Record OTA success and remove workflow
        shell: bash
        run: |
          git config user.name "BUKLOD Automation"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/one_time_deploy_performance_r4_android_ota.yml
          git add .github/workflows/one_time_deploy_performance_r4_android_ota.yml
          git commit -m "chore: confirm BUKLOD Performance R4 Android OTA"
          git pull --rebase origin main
          git push origin HEAD:main
