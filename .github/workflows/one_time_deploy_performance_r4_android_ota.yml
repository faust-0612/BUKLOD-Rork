name: One-time deploy BUKLOD Performance R4 Android OTA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one_time_deploy_performance_r4_android_ota.yml'

permissions:
  contents: write

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript QA
        run: npx tsc --noEmit

      - name: Verify R4 wiring
        shell: bash
        run: |
          grep -F "createBuklodR4RequestShield" src/lib/supabase.ts
          grep -F "buklod_cluster_home_notices" src/lib/buklodR4RequestShield.ts
          grep -F "buklod_scope_social_feed_v1" src/lib/buklodR4RequestShield.ts

      - name: Publish production Android OTA
        id: ota
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "status=missing_expo_token" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! npx eas-cli@latest whoami --non-interactive; then
            echo "status=expo_auth_failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          npx eas-cli@latest update \
            --channel production \
            --platform android \
            --environment production \
            --message "BUKLOD Performance R4 request shield" \
            --non-interactive
          code=$?
          set -e

          if [ "$code" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=eas_update_failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Record OTA result and remove workflow
        if: always()
        shell: bash
        env:
          OTA_STATUS: ${{ steps.ota.outputs.status }}
        run: |
          git config user.name "BUKLOD Automation"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/one_time_deploy_performance_r4_android_ota.yml
          git add .github/workflows/one_time_deploy_performance_r4_android_ota.yml
          git commit -m "chore: BUKLOD Performance R4 Android OTA ${OTA_STATUS:-workflow_failed}"
          git pull --rebase origin main
          git push origin HEAD:main
