name: BUKLOD Recover Account Route Web Hotfix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/recover_account_route_web_hotfix.yml'

permissions:
  contents: read

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  EXPO_PUBLIC_APP_ENV: production

jobs:
  qa-export-deploy-web-only:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source-locked recovery route hotfix
        uses: actions/checkout@v4
        with:
          ref: cb66898c54c634976f896283cd3f498c47091514

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify Recover Account route contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F '<Stack.Screen name="forgot-password" />' 'src/app/(auth)/_layout.tsx'
          grep -F "router.push(" 'src/app/(auth)/login.tsx' >/dev/null
          test -s 'src/app/(auth)/forgot-password.tsx'

      - name: TypeScript QA
        run: npx tsc --noEmit

      - name: Expo credential preflight
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}"
          npx eas-cli@latest whoami --non-interactive >/dev/null

      - name: Pull protected production public environment
        shell: bash
        run: |
          set -euo pipefail
          rm -f .env.local
          npx eas-cli@latest env:pull --environment production --path .env.local --non-interactive
          test -s .env.local
          set -a
          . ./.env.local
          set +a
          test "$EXPO_PUBLIC_SUPABASE_URL" = 'https://yhanxndaqbmuzbdqlblu.supabase.co'
          while IFS='=' read -r name _; do
            case "$name" in
              EXPO_PUBLIC_*)
                value="${!name-}"
                {
                  echo "${name}<<__BUKLOD_ENV__"
                  printf '%s\n' "$value"
                  echo '__BUKLOD_ENV__'
                } >> "$GITHUB_ENV"
                ;;
            esac
          done < <(grep -E '^[A-Za-z_][A-Za-z0-9_]*=' .env.local)

      - name: Export production web
        shell: bash
        env:
          NODE_ENV: production
          EXPO_PUBLIC_APP_ENV: production
        run: |
          set -euo pipefail
          rm -rf dist
          npx expo export --platform web --output-dir dist --clear
          test -s dist/index.html

      - name: Deploy production web only
        shell: bash
        env:
          NODE_ENV: production
          EXPO_PUBLIC_APP_ENV: production
        run: |
          set -euo pipefail
          npx eas-cli@latest deploy --prod --environment production --non-interactive

      - name: Confirm web-only release
        run: echo 'WEB ONLY COMPLETE. No Android OTA, APK, AAB, or iOS release was invoked.'
