name: BUKLOD Daily Bible R23A APK Failure Diagnosis

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/daily_bible_r23a_web_apk_deploy.yml'

concurrency:
  group: buklod-daily-bible-r23a-production
  cancel-in-progress: false

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  CI: '1'

permissions:
  contents: read

jobs:
  apk-diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Expo credential preflight
        run: |
          test -n "$EXPO_TOKEN"
          npx eas-cli@latest whoami --non-interactive

      - name: Fetch failed EAS build metadata
        shell: bash
        run: |
          npx eas-cli@latest build:view ef2c2aee-ca46-44ff-a397-53e78b09f28b --json > build-view.json
          node <<'NODE'
          const fs = require('fs');
          const build = JSON.parse(fs.readFileSync('build-view.json','utf8'));
          console.log('BUILD_ID=' + (build.id || ''));
          console.log('STATUS=' + (build.status || ''));
          console.log('ERROR_CODE=' + (build.error?.errorCode || build.error?.code || ''));
          console.log('ERROR_MESSAGE=' + (build.error?.message || ''));
          const raw = Array.isArray(build.logFiles) ? build.logFiles : [];
          const urls = raw.map(x => typeof x === 'string' ? x : (x?.url || x?.downloadUrl || '')).filter(Boolean);
          fs.writeFileSync('log-urls.txt', urls.join('\n'));
          console.log('LOG_FILE_COUNT=' + urls.length);
          NODE

      - name: Download EAS logs and print failure evidence
        shell: bash
        run: |
          mkdir -p eas-logs
          n=0
          while IFS= read -r url; do
            test -n "$url" || continue
            n=$((n+1))
            curl -fsSL "$url" -o "eas-logs/log-$n.txt" || true
          done < log-urls.txt
          echo '--- FAILURE EVIDENCE ---'
          grep -R -i -E 'error|failed|failure|google-services|google services|firebase|gradle|exception' eas-logs | tail -n 120 || true

      - name: Upload diagnostic logs
        uses: actions/upload-artifact@v4
        with:
          name: BUKLOD-R23A-EAS-APK-failure-diagnostics
          path: |
            build-view.json
            eas-logs/
          retention-days: 7
