name: BUKLOD Production Web Deploy

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/igpat_production_web_deploy.yml'
      - 'src/app/igpat/**'
      - 'src/components/BuklodHomeReelsExtension.tsx'
      - 'docs/BUKLOD_MINIGAME_QUALITY_STANDARD.md'
      - 'src/components/motion/**'
      - 'src/components/points/BuklodCharacterStage.tsx'
      - 'src/components/points/BuklodLivingCharacter.tsx'
      - 'src/components/points/BuklodPointsStage.tsx'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  qa-export-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact production trigger
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify exact trigger SHA
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "Expected trigger SHA: ${GITHUB_SHA}"
          echo "Checked out SHA:      ${actual}"
          test "${actual}" = "${GITHUB_SHA}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript QA
        run: npx tsc --noEmit

      - name: Verify IGPAT release anchors
        shell: bash
        run: |
          test -f 'src/app/igpat/index.tsx'
          test -f 'src/app/igpat/create.tsx'
          grep -F 'BUKLOD IGPAT' 'src/components/BuklodHomeReelsExtension.tsx'
          grep -F 'An Instant Bond.' 'src/components/BuklodHomeReelsExtension.tsx'
          grep -F "router.push('/igpat' as any)" 'src/components/BuklodHomeReelsExtension.tsx'
          grep -F "router.push('/igpat/create' as any)" 'src/components/BuklodHomeReelsExtension.tsx'
          grep -F "get_buklod_igpat_feed_v2" 'src/app/igpat/index.tsx'
          if grep -F "get_buklod_reels_v1" 'src/app/igpat/index.tsx'; then
            echo 'Legacy Reels feed RPC is still active in IGPAT.'
            exit 1
          fi
          grep -F "create_buklod_reel_v1" 'src/app/igpat/create.tsx'
          grep -F 'QUALITY FIRST. GRAPHICS FIRST. SOUND + ANIMATION REQUIRED.' 'docs/BUKLOD_MINIGAME_QUALITY_STANDARD.md'

      - name: Verify Live Motion release anchors
        shell: bash
        run: |
          test -f 'src/components/motion/BuklodAmbientSurface.tsx'
          test -f 'src/components/motion/BuklodLiveSceneBackdrop.tsx'
          test -f 'src/components/motion/BuklodRiveSceneOverlay.tsx'
          test -f 'src/components/motion/BuklodRiveSceneOverlay.native.tsx'
          grep -F 'BuklodAmbientSurface' 'src/components/points/BuklodPointsStage.tsx'
          grep -F 'BuklodLiveSceneBackdrop' 'src/components/points/BuklodCharacterStage.tsx'
          grep -F 'BuklodRiveSceneOverlay' 'src/components/points/BuklodCharacterStage.tsx'
          if grep -F '@rive-app/react-native' 'src/components/motion/BuklodRiveSceneOverlay.tsx'; then
            echo 'Native Rive dependency leaked into web fallback.'
            exit 1
          fi

      - name: Preserve Character release contract
        run: npm run character:contract

      - name: Expo credential preflight
        shell: bash
        run: |
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo 'EXPO_TOKEN repository secret is missing.'
            exit 1
          fi

      - name: Export production web
        run: npx expo export --platform web --output-dir dist

      - name: Deploy production web
        id: deploy
        shell: bash
        run: |
          set -o pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          npx eas-cli@latest deploy --prod --non-interactive 2>&1 | tee web-deploy-output.txt

      - name: Preserve deploy result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buklod-production-web-deploy-output-${{ github.run_number }}
          path: web-deploy-output.txt
          if-no-files-found: ignore

      - name: Deployment status
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.deploy.outcome }}" != "success" ]; then
            echo 'BUKLOD production web deployment did not succeed.'
            exit 1
          fi
          echo "BUKLOD production web deployment succeeded for ${GITHUB_SHA}."
