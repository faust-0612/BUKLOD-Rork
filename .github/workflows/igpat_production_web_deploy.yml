name: BUKLOD IGPAT Production Web Deploy

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/igpat_production_web_deploy.yml'
      - 'src/app/igpat/**'
      - 'src/components/BuklodHomeReelsExtension.tsx'
      - 'docs/BUKLOD_MINIGAME_QUALITY_STANDARD.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  qa-export-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript QA
        run: npx tsc --noEmit

      - name: Verify IGPAT release anchors
        shell: bash
        run: |
          test -f 'src/app/igpat/index.tsx'
          test -f 'src/app/igpat/create.tsx'
          grep -F 'BUKLOD IGPAT' 'src/components/BuklodHomeReelsExtension.tsx'
          grep -F 'An Instant Bond.' 'src/components/BuklodHomeReelsExtension.tsx'
          grep -F "router.push('/igpat' as any)" 'src/components/BuklodHomeReelsExtension.tsx'
          grep -F "router.push('/igpat/create' as any)" 'src/components/BuklodHomeReelsExtension.tsx'
          grep -F "get_buklod_reels_v1" 'src/app/igpat/index.tsx'
          grep -F "create_buklod_reel_v1" 'src/app/igpat/create.tsx'
          grep -F 'QUALITY FIRST. GRAPHICS FIRST. SOUND + ANIMATION REQUIRED.' 'docs/BUKLOD_MINIGAME_QUALITY_STANDARD.md'

      - name: Expo credential preflight
        shell: bash
        run: |
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo 'EXPO_TOKEN repository secret is missing.'
            exit 1
          fi

      - name: Export production web
        run: npx expo export --platform web --output-dir dist

      - name: Deploy production web
        id: deploy
        shell: bash
        run: |
          set -o pipefail
          npx eas-cli@latest deploy --prod --non-interactive 2>&1 | tee igpat-deploy-output.txt

      - name: Preserve deploy result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buklod-igpat-web-deploy-output-${{ github.run_number }}
          path: igpat-deploy-output.txt
          if-no-files-found: ignore

      - name: Deployment status
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.deploy.outcome }}" != "success" ]; then
            echo 'BUKLOD IGPAT web deployment did not succeed.'
            exit 1
          fi
          echo 'BUKLOD IGPAT web deployment succeeded.'
