# No EAS publication here. Source-only independent production RC gate.
name: BUKLOD Nov15 Production RC Android Source QA - No Publish
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.buklod/scopes/nov15-consolidated-video-ad-production.json'
      - '.github/workflows/buklod-nov15-prod-android-rc-qa.yml'
permissions:
  contents: read
jobs:
  production-android-qa-only:
    if: ${{ github.repository == 'faust-0612/BUKLOD-Rork' && github.head_ref == 'release/buklod-nov15-video-ad-prod-rc' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_VARIANT: production
      EXPO_PUBLIC_APP_ENV: production
      BUKLOD_APP_TARGET: main
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Lock source and production signed runtime identity
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          node <<'NODE'
          const a=require('node:assert/strict'),fs=require('node:fs');
          const config=require('./app.config.js')({config:{}});
          const eas=require('./eas.json');
          const m=JSON.parse(fs.readFileSync('.buklod/scopes/nov15-consolidated-video-ad-production.json'));
          a.equal(config.android.package,'org.mzbministry.buklod');
          a.equal(config.runtimeVersion,'1.3.2');
          a.equal(config.extra.appEnvironment,'production');
          a.equal(eas.build.production.channel,'production');
          a.equal(m.baseRef,'main');
          a.ok(!m.allowedPaths.some(p=>p.startsWith('supabase/') || p.startsWith('android/') || p.startsWith('ios/')));
          NODE
      - name: Verify 14 video/ad source blobs exactly equal staged immutable candidate
        run: |
          set -euo pipefail
          STAGE=74645fa89be1a40334f1725103ecd58cdc191230
          git cat-file -e "$STAGE^{commit}" || { echo 'Staging source not reachable; do not promote'; exit 1; }
          for path in \
            'src/app/(tabs)/buklod.tsx' \
            'src/app/(tabs)/hub.tsx' \
            'src/app/(tabs)/messages.tsx' \
            'src/components/BuklodCommunityInlineAd.android.tsx' \
            'src/components/BuklodCommunityInlineAd.tsx' \
            'src/components/BuklodCommunitySponsoredAd.tsx' \
            'src/components/BuklodExclusiveScopeCommunity.tsx' \
            'src/components/BuklodMaritesBoard.tsx' \
            'src/components/BuklodNativeSponsoredCard.android.tsx' \
            'src/components/BuklodNativeSponsoredCard.tsx' \
            'src/hooks/useBuklodCommunityAdViewability.ts' \
            'src/lib/buklodMaritesPlayback.ts' \
            'src/lib/buklodVideoFrameVisibility.ts' \
            'src/lib/buklodVideoScrollSignal.ts'
          do
            test "$(git hash-object "$path")" = "$(git rev-parse "$STAGE:$path")" || { echo "Stage parity mismatch: $path"; exit 1; }
          done
      - name: Preserve approved AdMob/Points, Wall, scoped playback, IGPAT and Profile rank regression
        run: |
          node --test \
            tests/nov15-prod-android-ota-release-guard-20261115.test.mjs \
            tests/admob-native-video-prefetch-20261114.test.mjs \
            tests/navigation-video-scroll-stop-20261114.test.mjs \
            tests/nov14-scroll-pauses-all-videos.test.mjs \
            tests/nov14-video-scroll-stop-native-prefetch.test.mjs \
            tests/nov15-android-native-prefetch-gate.test.mjs \
            tests/protected-feature-lock-video-scope-20261114.test.mjs \
            tests/scope-video-scroll-autoplay-20261114.test.mjs \
            tests/ad-native-lifecycle-retention-20261115.test.mjs \
            tests/nov14-profile-top-ten-ranked-list-20261114.test.mjs \
            tests/buklod-ads-appwide-permanent-lock-20261111.test.mjs \
            tests/buklod-igpat-retirement-release-marker-20261111.test.mjs
      - name: Source-locked install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Production Android typecheck and Hermes export, never publish
        run: |
          npx tsc --noEmit
          EXPO_MAX_WORKERS=2 npx expo export --platform android --output-dir /tmp/buklod-nov15-conso-prod-rc --clear
          test -s /tmp/buklod-nov15-conso-prod-rc/metadata.json
          test -z "$(git status --porcelain --untracked-files=no)"
          echo 'PRODUCTION SOURCE RC ONLY. NO EAS UPDATE OR LIVE PROD RELEASE.'
