name: Infinix loading and session QA
on:
  push:
    branches: [codex/infinix-loading-session-ptt]
  workflow_dispatch:
concurrency:
  group: infinix-loading-session-qa
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        id: dependencies
        run: npm ci --no-audit --no-fund
      - name: Install isolated test tools
        run: npm install --no-save --package-lock=false --ignore-scripts jest@29.7.0 jest-expo@57.0.4 @testing-library/react-native@13.3.3 react-test-renderer@19.2.3
      - run: npx --no-install tsc --noEmit
      - name: Focused Infinix regression tests
        if: "!cancelled() && steps.dependencies.outcome == 'success'"
        run: >-
          npm test -- --watchAll=false --watchman=false --runTestsByPath
          __tests__/buklodMaritesDedicatedReader.test.ts
          __tests__/buklodPttHoldLifecycle.test.ts
          __tests__/buklodQuizSessionDelay.test.ts
          __tests__/buklodConnectFacesFirst.test.ts
          __tests__/buklodAvatarPersistence.test.ts
      - name: Full regression suite
        if: "!cancelled() && steps.dependencies.outcome == 'success'"
        run: npm test -- --watchAll=false --watchman=false
      - name: Character contract
        if: "!cancelled() && steps.dependencies.outcome == 'success'"
        run: npm run character:contract
      - name: Game contract
        if: "!cancelled() && steps.dependencies.outcome == 'success'"
        run: npm run game:contract
      - name: Dedicated story permissions and paging fixtures
        if: "!cancelled() && steps.dependencies.outcome == 'success'"
        env:
          PGPASSWORD: fixture-only
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f scripts/sql/buklod_marites_feed_fixture.sql
      - name: Inspect live Quiz client capability without creating a session
        if: "!cancelled() && steps.dependencies.outcome == 'success'"
        run: node scripts/inspect-quiz-handoff.mjs
