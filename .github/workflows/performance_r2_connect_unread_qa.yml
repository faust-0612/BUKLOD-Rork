name: BUKLOD Performance R2 Connect Unread QA

on:
  push:
    branches:
      - perf/r2-connect-unread-shared-realtime
    paths:
      - 'src/hooks/useBuklodConnectUnread.ts'
      - '.github/workflows/performance_r2_connect_unread_qa.yml'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: perf/r2-connect-unread-shared-realtime

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript QA
        run: npx tsc --noEmit

      - name: Verify smallest targeted contract
        shell: bash
        run: |
          set -euo pipefail
          f='src/hooks/useBuklodConnectUnread.ts'
          grep -F "acquireSharedRealtimeSubscription" "$f"
          grep -F "buklod_connect_direct_messages" "$f"
          grep -F "buklod_connect_scope_messages" "$f"
          grep -F "event: 'INSERT'" "$f"
          grep -F "UNREAD_FALLBACK_POLL_MS" "$f"
          grep -F "releaseRealtime();" "$f"
          if grep -F "const sessionKey" "$f"; then
            echo 'Random per-mount unread realtime sessionKey still present.'
            exit 1
          fi
          test "$(git diff --name-only HEAD^ HEAD | wc -l | tr -d ' ')" -eq 1
          git diff --check HEAD^ HEAD

      - name: No deploy marker
        run: echo 'QA ONLY — NO DEPLOY / NO OTA / NO APK / NO AAB / NO DB CHANGE'
