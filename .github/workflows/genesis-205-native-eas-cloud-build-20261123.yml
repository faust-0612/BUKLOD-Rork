name: BUKLOD Genesis 2.0.5 FULL Native Expo EAS Cloud STAGING APK
# Preflight retry after correcting 2.0.4 compatibility test process-env isolation.
# The previous attempt failed before any EAS cloud request or paid build.
on:
  push:
    branches:
      - dev/genesis-godot-launch-recovery-20261123
    paths:
      - '.github/workflows/genesis-205-native-eas-cloud-build-20261123.yml'
permissions:
  contents: read
concurrency:
  group: buklod-genesis-205-one-expo-cloud-build
  cancel-in-progress: false
jobs:
  gated-eas-cloud-staging:
    if: github.repository == 'faust-0612/BUKLOD-Rork' && startsWith(github.event.head_commit.message, 'GENESIS_GODOT_205_EXPO_CLOUD_BUILD:')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      BUKLOD_APP_TARGET: main
      APP_VARIANT: staging
      EXPO_PUBLIC_APP_ENV: staging
      EXPO_PUBLIC_BUKLOD_SEASON2_GENESIS_PREVIEW: 'true'
      EXPO_PUBLIC_BUKLOD_ARENA_GODOT_ENABLED: 'true'
      EXPO_PUBLIC_BUKLOD_GENESIS_GODOT_WORLDS: 'true'
      EXPO_PUBLIC_BUKLOD_ARENA_LIBRARY_BUNDLE: 'true'
      EXPO_PUBLIC_BUKLOD_GENESIS_GODOT_V205: 'true'
      EXPO_PUBLIC_BUKLOD_SOS_NATIVE_R3: 'true'
      EXPO_PUBLIC_BUKLOD_ARENA_EXPERIMENTAL: 'true'
      EXPO_PUBLIC_BUKLOD_ARENA_RANKED_ENABLED: 'false'
      EXPO_PUBLIC_BUKLOD_GENESIS_SHARED_BACKEND_REVIEW: 'true'
      EXPO_PUBLIC_STREAM_ANDROID_PUSH_PROVIDER_NAME: firebase-video-staging
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GODOT_PACK: /tmp/buklod-genesis-205-native-pack.zip
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prove original installed 2.0.4 OTA ancestry and preserve unaffected native modules
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          git merge-base --is-ancestor 63f97c4092c1214c8f0b0eb5558d1183c6f189d4 HEAD
          git diff --quiet 63f97c4092c1214c8f0b0eb5558d1183c6f189d4 HEAD -- package.json package-lock.json assets/season2/arena plugins/withBuklodPttHardwareFoundation.js plugins/withBuklodWebRTC.js
          echo 'SIGNED_204_BASELINE_AND_205_NATIVE_SCOPE_PASS'
      - name: Validate Expo identity, native splash, Godot pack, AdMob, security and TS
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/genesis-205-native-release-gate.mjs
          node scripts/genesis-prepare-skia-binaries.mjs
          node scripts/genesis-assert-native-autolinking.mjs
          node --test tests/genesis-godot-native-first-crash-recovery-20261123.test.mjs tests/genesis-godot-game-runtime-guard-20261123.test.mjs tests/genesis-godot-game-release-identity-20261123.test.mjs tests/genesis-library-native-runtime-release-20261122.test.mjs tests/arena-library-godot-native-20261122.test.mjs tests/arena-library-modes-audio-20261122.test.mjs tests/dashboard-ad-navigation-prewarm-20261116.test.mjs tests/ad-dashboard-focus-performance-20261116.test.mjs
          npm run release:gate
          npm run genesis:theme:gate
          npx tsc --noEmit
      - name: Rebuild inspect all bundled Godot worlds plus native splash and audio
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-empire-godot-pack.mjs --out="$GODOT_PACK"
          test -s "$GODOT_PACK"
          unzip -t "$GODOT_PACK" | tail -n 2
          for expected in project.godot scenes/Arena.tscn scenes/WorldPreview.tscn splash/buklod-green-b.png data/catalog.json world-art/kingdom.webp world-art/community.webp world-art/house.webp world-audio/navigation.wav scripts/arena_root.gd; do
            unzip -Z1 "$GODOT_PACK" | grep -Fxq "$expected" || { echo "BLOCK missing Godot $expected"; exit 1; }
          done
          unzip -p "$GODOT_PACK" data/catalog.json > /tmp/buklod-205-catalog.json
          node <<'NODE'
          const a=require('node:assert/strict'),fs=require('node:fs'),cp=require('node:child_process');
          const cat=JSON.parse(fs.readFileSync('/tmp/buklod-205-catalog.json','utf8'));
          a.equal(Object.keys(cat.heroes).length,13);
          a.equal(cat.pickups.length,300);
          a.equal(new Set(cat.pickups.map(x=>x.id)).size,300);
          a.equal(cat.arena,'OFFLINE_PRACTICE');
          const names=cp.execFileSync('unzip',['-Z1',process.env.GODOT_PACK],{encoding:'utf8'}).split('\n');
          a.equal(names.filter(x=>/^audio\/sfx\/.*\.wav$/.test(x)).length,70);
          a.equal(names.filter(x=>/^art\/fullbody\/.*\.png$/.test(x)).length,52);
          a.equal(names.filter(x=>/^art\/sprite\/.*\.png$/.test(x)).length,13);
          console.log('BUKLOD_GENESIS_205_FOUR_WORLD_NATIVE_ASSET_COUNT_PASS');
          NODE
      - name: Real Godot 4.7.2 native project and ZIP main-scene headless startup smoke
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 --connect-timeout 20 --max-time 240 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/buklod-godot472.zip
          mkdir -p /tmp/buklod-godot472
          unzip -q /tmp/buklod-godot472.zip -d /tmp/buklod-godot472
          GODOT="$(find /tmp/buklod-godot472 -type f -name 'Godot_*linux.x86_64' -print -quit)"
          test -n "$GODOT"
          chmod +x "$GODOT"
          mkdir -p godot/empire-arena/splash
          cp assets/season2/genesis/genesis-green-b-transparent.png godot/empire-arena/splash/buklod-green-b.png
          timeout 120s "$GODOT" --headless --path godot/empire-arena --editor --import --quit
          timeout 120s "$GODOT" --headless --main-pack "$GODOT_PACK" --quit-after 15
          echo 'BUKLOD_GODOT_HEADLESS_LAUNCH_PASS'
      - name: Prepare exact staging Firebase client and require EAS signer/runtime/identity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const a=require('node:assert/strict'),fs=require('node:fs');
          const google=JSON.parse(fs.readFileSync('google-services.production.json','utf8'));
          google.client=google.client.filter(x=>x.client_info?.android_client_info?.package_name==='org.mzbministry.buklod.staging');
          a.equal(google.client.length,1);
          fs.writeFileSync('google-services.staging.json',JSON.stringify(google));
          const c=require('./app.config.js')({config:{}}),p=require('./eas.json').build['season2-genesis-launch-recovery-staging'];
          a.equal(c.android.package,'org.mzbministry.buklod.staging');
          a.equal(c.android.versionCode,17);
          a.equal(c.runtimeVersion,'2.0.5-genesis-godot-launch');
          a.equal(p.channel,'season2-genesis-library-205-preview');
          a.equal(p.android.credentialsSource,'remote');
          a.equal(p.autoIncrement,false);
          console.log('BUKLOD_205_SIGNED_EXPO_BUILD_INPUT_PASS');
          NODE
      - name: Submit ONE signed Android Expo EAS Cloud APK build, NEVER Play or OTA
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@27.9.0 whoami --non-interactive >/dev/null
          npx --yes eas-cli@27.9.0 build --platform android --profile season2-genesis-launch-recovery-staging --non-interactive --no-wait --json > /tmp/buklod-205-expo-build.json
          node <<'NODE'
          const a=require('node:assert/strict'),fs=require('node:fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/buklod-205-expo-build.json','utf8'));
          const b=Array.isArray(raw)?raw[0]:raw;
          a.match(b?.id||'',/^[0-9a-fA-F-]{36}$/,'Provider did not return real Expo build ID');
          const receipt={expoBuildId:b.id,status:b.status||'SUBMITTED',
            source:process.env.GITHUB_SHA,profile:'season2-genesis-launch-recovery-staging',
            channel:'season2-genesis-library-205-preview',runtime:'2.0.5-genesis-godot-launch',
            package:'org.mzbministry.buklod.staging',versionCode:17,expoUrl:b.url||b.buildUrl||null,
            nativeWorlds:['arena','kingdom','community','house'],dualNativeSplash:'BUKLOD_GREEN_B',
            packSmoke:'HEADLESS_PASSED',physicalDeviceQA:'SKIPPED_PER_OWNER',
            buildFinished:false,signedApkVerified:false,productionOtaPublished:false};
          fs.writeFileSync('buklod-genesis-205-expo-cloud-submission.json',JSON.stringify(receipt,null,2)+'\n');
          console.log('BUKLOD_GENESIS_205_EXPO_CLOUD_BUILD_SUBMITTED '+JSON.stringify(receipt));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: buklod-genesis-205-expo-cloud-submission-receipt
          path: buklod-genesis-205-expo-cloud-submission.json
          if-no-files-found: ignore
          retention-days: 14
