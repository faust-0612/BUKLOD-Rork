name: BUKLOD P0 R4 Web Deploy

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/p0_r4_web_deploy.yml'
      - '__tests__/buklodFoundationBootstrapP0.test.ts'
      - 'src/lib/buklodFoundationFast.ts'
      - 'src/lib/buklodPermissionSnapshotFetch.ts'
      - 'src/providers/BuklodFoundationProvider.tsx'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buklod-production-web
  cancel-in-progress: false

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  qa-export-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Focused P0 bootstrap test
        shell: bash
        run: |
          set -euo pipefail
          if [ -x node_modules/.bin/jest ]; then
            npx jest __tests__/buklodFoundationBootstrapP0.test.ts --runInBand
          else
            echo 'Jest is not installed; continuing to TypeScript/export gates.'
          fi

      - name: TypeScript QA
        run: npx tsc --noEmit

      - name: Pull EAS production public environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}"
          npx eas-cli@latest whoami --non-interactive >/dev/null
          rm -f .env.local
          npx eas-cli@latest env:pull --environment production --path .env.local --non-interactive
          test -s .env.local
          set -a
          . ./.env.local
          set +a
          test "${EXPO_PUBLIC_SUPABASE_URL:-}" = 'https://yhanxndaqbmuzbdqlblu.supabase.co'
          while IFS='=' read -r name _; do
            case "$name" in
              EXPO_PUBLIC_*)
                value="${!name-}"
                {
                  echo "${name}<<__BUKLOD_ENV__"
                  printf '%s\n' "$value"
                  echo '__BUKLOD_ENV__'
                } >> "$GITHUB_ENV"
                ;;
            esac
          done < <(grep -E '^[A-Za-z_][A-Za-z0-9_]*=' .env.local)

      - name: Export production web
        shell: bash
        env:
          NODE_ENV: production
          EXPO_PUBLIC_APP_ENV: production
        run: |
          set -euo pipefail
          test "${EXPO_PUBLIC_SUPABASE_URL:-}" = 'https://yhanxndaqbmuzbdqlblu.supabase.co'
          rm -rf dist
          npx expo export --platform web --output-dir dist
          test -s dist/index.html
          grep -RFl --include='*.js' 'yhanxndaqbmuzbdqlblu.supabase.co' dist/_expo/static/js/web >/dev/null

      - name: Deploy production web
        shell: bash
        env:
          NODE_ENV: production
          EXPO_PUBLIC_APP_ENV: production
        run: |
          set -euo pipefail
          npx eas-cli@latest deploy --prod --environment production --non-interactive
