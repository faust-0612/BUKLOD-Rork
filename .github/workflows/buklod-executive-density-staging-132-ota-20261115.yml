# Executive-density owner-authorized STAGING ONLY; no production, Play or web.
# Exact-source trigger after reviewed UI and governance scope; never a production change.
# Corrected user-facing back navigation and natural narration chunk boundaries.
# Owner-authorized upgrade to already verified BUKLOD Kids staging, native runtime 1.3.2.
# Fails closed if staging was updated by any other release; NEVER publishes production.
name: BUKLOD Executive Density Android Staging 1.3.2 OTA - NO PROD
on:
  push:
    branches: [dev/executive-density-staging-20261115]
    paths: [.github/workflows/buklod-executive-density-staging-132-ota-20261115.yml]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: buklod-executive-density-132-staging-only
  cancel-in-progress: false
jobs:
  verify-and-publish-android-staging:
    if: ${{ github.repository == 'faust-0612/BUKLOD-Rork' && github.ref == 'refs/heads/dev/executive-density-staging-20261115' && startsWith(github.event.head_commit.message, 'BUKLOD_EXECUTIVE_STAGING_132_PUBLISH:') }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      APP_VARIANT: staging
      EXPO_PUBLIC_APP_ENV: staging
      BUKLOD_APP_TARGET: main
      EXPO_PUBLIC_STREAM_ANDROID_PUSH_PROVIDER_NAME: firebase-video-staging
      EVIDENCE_DIR: /tmp/buklod-executive-staging-132
      EXPORT_DIR: /tmp/buklod-executive-android-export
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require frozen source draft PR and both exact SHA CI gates
        uses: actions/github-script@v7
        with:
          script: |
            const expectedBase='ab864a2b17e6078252be8ff8c7ce067043c7ce1c';
            const required=['Engineering Accountability','BUKLOD Main - Report Door and Legacy Integration PR QA','BUKLOD Live Motion R1 QA'];
            for(let attempt=0;attempt<48;attempt++){
              const {data:pr}=await github.rest.pulls.get({...context.repo,pull_number:830});
              if(pr.state!=='open'||!pr.draft||pr.head.sha!==context.sha||
                pr.head.ref!=='dev/executive-density-staging-20261115'||
                pr.base.sha!==expectedBase||
                pr.base.ref!=='feature/sunday-school-continuous-stories-20261115')
                throw Error('Exact reviewed draft PR #826 no longer matches frozen baseline');
              const {data}=await github.rest.actions.listWorkflowRunsForRepo({...context.repo,head_sha:context.sha,per_page:100});
              const runs=required.map(name=>data.workflow_runs.find(r=>r.name===name&&r.head_sha===context.sha&&r.event==='pull_request'));
              if(runs.some(r=>r?.status==='completed'&&r.conclusion!=='success'))
                throw Error('Exact-source CI failed. Staging OTA blocked.');
              if(runs.every(r=>r?.conclusion==='success')){
                core.info('Reviewed exact-source pull request and CI gates passed');
                return;
              }
              await new Promise(done=>setTimeout(done,10000));
            }
            throw Error('Exact SHA CI not complete; no OTA');
      - name: Verify exact reviewed executive UI and regression contracts
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/executive-density-staging-132-policy.mjs source "$GITHUB_SHA" "$EVIDENCE_DIR"
          node --test tests/buklod-dark-contrast-spacing-20261115.test.mjs tests/executive-navigation-cluster-kingdom-20261115.test.mjs tests/executive-connect-dark-20261115.test.mjs tests/executive-qmp-ad-reward-20261115.test.mjs tests/executive-density-staging-release-20261115.test.mjs
          node --test tests/children-stories-contract.test.mjs tests/children-stories-navigation-ad-safety.test.mjs tests/ad-native-lifecycle-retention-20261115.test.mjs tests/nov14-scroll-pauses-all-videos.test.mjs
          npx tsc --noEmit
      - name: Fetch signed staging APK and both EAS channel identities
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}" || { echo "Missing Expo credential, no OTA"; exit 1; }
          mkdir -p "$EVIDENCE_DIR"
          npx --yes eas-cli@27.9.0 build:view bc4be208-bfb0-42f3-95cb-358353d0600f --json > "$EVIDENCE_DIR/build.json"
          npx --yes eas-cli@27.9.0 channel:view staging-user --json --non-interactive > "$EVIDENCE_DIR/staging-channel-before.json"
          npx --yes eas-cli@27.9.0 channel:view production --json --non-interactive > "$EVIDENCE_DIR/production-channel-before.json"
          npx --yes eas-cli@27.9.0 update:list --branch staging-user --limit 20 --json --non-interactive > "$EVIDENCE_DIR/staging-updates-before.json"
          node scripts/executive-density-staging-132-policy.mjs preflight "$GITHUB_SHA" "$EVIDENCE_DIR"
      - name: Export exact preview Android bundle for existing 1.3.2 runtime
        run: |
          set -euo pipefail
          npx --yes eas-cli@27.9.0 env:pull --environment preview --path /tmp/buklod-executive-preview.env --non-interactive >/dev/null
          test -s /tmp/buklod-executive-preview.env
          set -a
          . /tmp/buklod-executive-preview.env
          set +a
          export APP_VARIANT=staging EXPO_PUBLIC_APP_ENV=staging BUKLOD_APP_TARGET=main
          export EXPO_PUBLIC_STREAM_ANDROID_PUSH_PROVIDER_NAME=firebase-video-staging
          npx expo config --json > "$EVIDENCE_DIR/expo-config.json"
          node <<'NODE'
          const a=require('node:assert/strict'),fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync(process.env.EVIDENCE_DIR+'/expo-config.json','utf8'));
          a.equal(c.runtimeVersion,'1.3.2');
          a.equal(c.android.package,'org.mzbministry.buklod.staging');
          a.equal(c.extra.appEnvironment,'staging');
          a.equal(c.extra.appTarget,'main');
          a.equal(c.extra.eas.projectId,'23dad7d0-389a-406e-8dec-08965dab85d8');
          a.match(process.env.EXPO_PUBLIC_SUPABASE_URL||'',/^https:\/\/[a-z0-9]+\.supabase\.co$/);
          a.ok(process.env.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY);
          NODE
          EXPO_MAX_WORKERS=2 npx expo export --platform android --output-dir "$EXPORT_DIR" --clear
          test -s "$EXPORT_DIR/metadata.json"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Recheck live staging and production immediately before OTA
        run: |
          set -euo pipefail
          npx --yes eas-cli@27.9.0 update:list --branch staging-user --limit 20 --json --non-interactive > "$EVIDENCE_DIR/staging-updates-recheck.json"
          node scripts/executive-density-staging-132-policy.mjs recheck "$GITHUB_SHA" "$EVIDENCE_DIR"
      - name: Publish exactly one Android update to staging-user ONLY
        run: |
          set -euo pipefail
          npx --yes eas-cli@27.9.0 update --channel staging-user --platform android --environment preview \
            --skip-bundler --input-dir "$EXPORT_DIR" --non-interactive --json \
            --message "BUKLOD_EXECUTIVE_STAGING_132_${GITHUB_SHA}" > "$EVIDENCE_DIR/publish.json"
          node <<'NODE'
          const fs=require('node:fs');
          const d=process.env.EVIDENCE_DIR,j=JSON.parse(fs.readFileSync(d+'/publish.json','utf8'));
          if(!Array.isArray(j)||j.length!==1||!j[0].group)throw Error('Invalid EAS publication receipt; no automatic retry');
          fs.writeFileSync(d+'/new-group.txt',j[0].group);
          NODE
          npx --yes eas-cli@27.9.0 update:view "$(cat "$EVIDENCE_DIR/new-group.txt")" --json > "$EVIDENCE_DIR/update-view.json"
      - name: Independently verify staging manifest and unchanged production update
        run: |
          set -euo pipefail
          npx --yes eas-cli@27.9.0 channel:view staging-user --json --non-interactive > "$EVIDENCE_DIR/staging-channel-after.json"
          npx --yes eas-cli@27.9.0 channel:view production --json --non-interactive > "$EVIDENCE_DIR/production-channel-after.json"
          node scripts/executive-density-staging-132-policy.mjs postpublish "$GITHUB_SHA" "$EVIDENCE_DIR"
          cat "$EVIDENCE_DIR/verification.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve nonsecret exact-source release receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buklod-executive-staging-132-${{ github.sha }}
          path: |
            /tmp/buklod-executive-staging-132/build.json
            /tmp/buklod-executive-staging-132/preflight.json
            /tmp/buklod-executive-staging-132/update-view.json
            /tmp/buklod-executive-staging-132/verification.json
          retention-days: 14
          if-no-files-found: ignore
