# Release trigger: 2026-10-22 remove Wall Public CONNECT/EXPLORE chips + Dugtong icon
name: BUKLOD Production Android OTA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/production_android_ota.yml'
      - 'src/components/BuklodCommunityPostEngagement.tsx'
      - 'src/components/BuklodCommunityPostEngagement.web.tsx'
      - 'src/app/admin/kabihasnang-ligaw.tsx'
      - 'src/lib/kabihasnang-ligaw/**'
      - 'src/components/kabihasnang-ligaw/**'
      - 'src/lib/kabihasnangLigawPublishing.ts'
      - 'assets/kabihasnang-ligaw/**'
      - 'supabase/migrations/*kl_reader*'
      - 'src/components/BuklodTodayCard.tsx'
      - 'src/lib/buklodDailyEngagement.ts'
      - 'supabase/functions/buklod-community-daily-engagement/**'
      - 'src/components/BuklodConnectThread.tsx'
      - 'src/components/BuklodCommunityCommentComposer.tsx'
