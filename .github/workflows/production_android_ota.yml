name: BUKLOD Production Android OTA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/production_android_ota.yml'
      - 'src/app/(auth)/register.tsx'
      - 'src/app/(auth)/forgot-password.tsx'
      - 'src/app/account/recovery-pin.tsx'
      - 'src/app/account/security.tsx'
      - 'src/app/admin/account-recovery.tsx'
      - 'src/app/scope/index.tsx'
      - 'src/components/BuklodClusterHomeCommandCenter.tsx'
      - 'src/components/BuklodClusterHomeCommandCenterImpl.tsx'
      - 'src/lib/buklodClusterFormationGate.ts'

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

permissions:
  contents: read

jobs:
  qa-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript QA
        run: npx tsc --noEmit

      - name: Verify production safety anchors
        shell: bash
        run: |
          grep -F "buklod_registration_version:" 'src/app/(auth)/register.tsx'
          grep -F "createAccountInFlight.current" 'src/app/(auth)/register.tsx'
          grep -F "buklod_complete_registration_v1" 'src/app/(auth)/register.tsx'
          grep -F "account-recovery-v3" 'src/app/(auth)/forgot-password.tsx'
          grep -F "I forgot my login too" 'src/app/(auth)/forgot-password.tsx'
          grep -F "recover_with_admin_code" 'src/app/(auth)/forgot-password.tsx'
          grep -F "recovery_status" 'src/app/account/recovery-pin.tsx'
          grep -F "admin_reject_request" 'src/app/admin/account-recovery.tsx'
          grep -F "MANAGE CLUSTER" 'src/components/BuklodClusterHomeCommandCenter.tsx'
          grep -F "constrainContextToOrganization" 'src/lib/buklodClusterFormationGate.ts'

      - name: Expo credential preflight
        id: expo
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Expo OTA not published: repository secret EXPO_TOKEN is not configured."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx eas-cli@latest whoami --non-interactive
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Publish production Android OTA
        if: steps.expo.outputs.ready == 'true'
        shell: bash
        run: |
          npx eas-cli@latest update \
            --channel production \
            --platform android \
            --environment production \
            --message "BUKLOD MZB hierarchy + Cluster Admin Home R1" \
            --non-interactive

      - name: Deployment status
        shell: bash
        env:
          EXPO_READY: ${{ steps.expo.outputs.ready }}
        run: |
          if [ "$EXPO_READY" = "true" ]; then
            echo "BUKLOD production Android OTA published successfully."
          else
            echo "BUKLOD source QA passed; OTA remains pending only because EXPO_TOKEN is unavailable."
          fi