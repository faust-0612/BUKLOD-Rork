name: BUKLOD Genesis 2.0.5 Native Godot Crash Recovery DEV QA
on:
  push:
    branches:
      - dev/genesis-godot-launch-recovery-20261123
    paths:
      - '.github/workflows/genesis-godot-v205-crash-recovery-dev-qa-20261123.yml'
permissions:
  contents: read
jobs:
  static-dev-qa:
    if: github.repository == 'faust-0612/BUKLOD-Rork' && startsWith(github.event.head_commit.message, 'GENESIS_GODOT_V205_CRASH_RECOVERY_DEV_QA:')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Native Godot startup, crash-loop, runtime and regression source tests
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/genesis-godot-native-first-crash-recovery-20261123.test.mjs tests/genesis-godot-game-runtime-guard-20261123.test.mjs tests/genesis-godot-game-release-identity-20261123.test.mjs tests/genesis-library-native-runtime-release-20261122.test.mjs tests/dashboard-ad-navigation-prewarm-20261116.test.mjs tests/ad-dashboard-focus-performance-20261116.test.mjs
          npm run release:gate
          npm run genesis:theme:gate
          npx tsc --noEmit
          echo 'GODOT_V205_DEV_SOURCE_TESTS_PASS; DEVICE_LOGCAT_STILL_REQUIRED'
      - name: Keep release explicit and blocked until device Godot smoke
        run: |
          echo 'DEV_ONLY=1'
          echo 'ANDROID_DEVICE_GODOT_LAUNCH=UNVERIFIED'
          echo 'SIGNED_205_APK=NOT_BUILT'
          echo 'OTA_PUBLISHED=FALSE'
          echo 'PRODUCTION_UNTOUCHED=TRUE'
