name: BUKLOD Nov15 Staging Parity Production Android QA - NO PUBLISH
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'supabase/**'
      - '.buklod/scopes/nov15-stage-parity-production-rc-20261115.json'
      - '.github/workflows/buklod-nov15-stage-parity-prod-android-qa.yml'
permissions:
  contents: read
jobs:
  parity-android-qa-only:
    if: ${{ github.repository == 'faust-0612/BUKLOD-Rork' && github.head_ref == 'release/nov15-stage-parity-production-rc-20261115' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_VARIANT: production
      EXPO_PUBLIC_APP_ENV: production
      BUKLOD_APP_TARGET: main
      EXPO_NO_TELEMETRY: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Lock exact verified staging source tree and production runtime
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD:src)" = "28cc91dbd9111b999a0e1fc5598ec7e2a845f560"
          node <<'NODE'
          const assert=require('node:assert/strict');
          const config=require('./app.config.js')({config:{}});
          const eas=require('./eas.json');
          assert.equal(config.android.package,'org.mzbministry.buklod');
          assert.equal(config.runtimeVersion,'1.3.2');
          assert.equal(config.extra.appEnvironment,'production');
          assert.equal(eas.build.production.channel,'production');
          NODE
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify children, LIFE privacy, executive density, Connect and ad/video regression
        run: |
          node --experimental-strip-types --test \
            tests/nov15-stage-parity-production-rc.test.mjs \
            tests/children-stories-contract.test.mjs \
            tests/children-stories-navigation-ad-safety.test.mjs \
            tests/sunday-school-full-story-contract.test.mjs \
            tests/life-human-first-auth-security-20261115.test.mjs \
            tests/buklod-dark-contrast-spacing-20261115.test.mjs \
            tests/executive-navigation-cluster-kingdom-20261115.test.mjs \
            tests/executive-connect-dark-20261115.test.mjs \
            tests/executive-qmp-ad-reward-20261115.test.mjs \
            tests/sponsor-ad-video-fast-start-20261114.test.mjs \
            tests/nov14-profile-top-ten-ranked-list-20261114.test.mjs \
            tests/nov14-connect-green-profile-posts-ota.test.mjs \
            tests/admob-native-video-prefetch-20261114.test.mjs \
            tests/navigation-video-scroll-stop-20261114.test.mjs \
            tests/buklod-igpat-retirement-release-marker-20261111.test.mjs
          node scripts/test-marites-release.cjs
          node scripts/game-kingdom-release-contract.mjs
      - name: TypeScript and Android production Hermes export (never publish)
        run: |
          npx tsc --noEmit
          EXPO_MAX_WORKERS=2 npx expo export --platform android --output-dir /tmp/buklod-nov15-stage-parity-prod-android --clear
          test -s /tmp/buklod-nov15-stage-parity-prod-android/metadata.json
          test -z "$(git status --porcelain --untracked-files=no)"
          echo 'PASS: SOURCE QA ONLY. NOT AN OTA RECEIPT; NO PRODUCTION PUBLISH.'
