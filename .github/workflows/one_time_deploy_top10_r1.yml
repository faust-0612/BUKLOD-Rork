name: One-time deploy restored Top 10 ranking R1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one_time_deploy_top10_r1.yml'

permissions:
  contents: read

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  EXPO_PUBLIC_APP_ENV: production

jobs:
  qa-web-ota:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify restored Top 10 source anchors
        shell: bash
        run: |
          grep -F "const [leaderboardOpen, setLeaderboardOpen] = useState(true);" 'src/app/points/index.tsx'
          grep -F "RESTORE_TOP10_VISIBLE_R1" 'src/app/points/index.tsx'
          grep -F "loadLeaderboard('all_time')" 'src/app/points/index.tsx'
          grep -F "Top 10 Members" 'src/app/points/index.tsx'
          grep -F "p_limit: 10" 'src/app/points/index.tsx'

      - name: TypeScript QA
        run: npx tsc --noEmit

      - name: Expo credential preflight
        run: |
          test -n "$EXPO_TOKEN"
          npx eas-cli@latest whoami --non-interactive

      - name: Export production web
        env:
          NODE_ENV: production
        run: |
          npx expo export --platform web --output-dir dist
          node scripts/inject-adsense-web-head.cjs dist

      - name: Deploy production web
        env:
          NODE_ENV: production
        run: npx eas-cli@latest deploy --prod --non-interactive

      - name: Publish production Android OTA
        run: |
          npx eas-cli@latest update \
            --channel production \
            --platform android \
            --environment production \
            --message "BUKLOD Top 10 Ranking Restore R1" \
            --non-interactive

      - name: Deployment status
        run: |
          echo "BUKLOD Top 10 Ranking Restore R1: WEB + Android OTA published successfully."
