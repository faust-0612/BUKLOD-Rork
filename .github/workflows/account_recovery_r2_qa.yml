name: BUKLOD Account Recovery R2 QA

on:
  push:
    branches:
      - fix/account-recovery-r2-excellent
    paths:
      - 'src/app/(auth)/forgot-password.tsx'
      - 'src/app/account/recovery-pin.tsx'
      - 'src/app/account/security.tsx'
      - 'src/app/admin/account-recovery.tsx'
      - 'supabase/functions/account-recovery-v3/**'
      - '.github/workflows/account_recovery_r2_qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript QA
        run: npx tsc --noEmit

      - name: Verify recovery R2 anchors
        shell: bash
        run: |
          grep -F "account-recovery-v3" 'src/app/(auth)/forgot-password.tsx'
          grep -F "resetPasswordForEmail" 'src/app/(auth)/forgot-password.tsx'
          grep -F "I forgot my login too" 'src/app/(auth)/forgot-password.tsx'
          grep -F "recover_with_admin_code" 'src/app/(auth)/forgot-password.tsx'
          grep -F "recovery_status" 'src/app/account/recovery-pin.tsx'
          grep -F "admin_reject_request" 'src/app/admin/account-recovery.tsx'
          grep -F "code_lookup_hash" 'supabase/functions/account-recovery-v3/index.ts'
          if grep -Fq "account-recovery-v2" 'src/app/(auth)/forgot-password.tsx' 'src/app/account/recovery-pin.tsx' 'src/app/admin/account-recovery.tsx'; then
            echo "R2 STOPPED: old v2 endpoint remains in active recovery UI"
            exit 1
          fi
