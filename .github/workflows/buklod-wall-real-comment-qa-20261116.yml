name: BUKLOD Real Recent Comment QA
on:
  push:
    branches: [fix/wall-actual-recent-comment-20261116]
    paths:
      - 'src/app/(tabs)/buklod.tsx'
      - 'src/components/BuklodExclusiveScopeCommunity.tsx'
      - 'src/components/BuklodCommunityPostEngagement.tsx'
      - 'src/components/BuklodCommunityPostEngagement.web.tsx'
      - 'src/lib/buklodPostCommentPreviews.ts'
      - 'src/lib/communityWallHydration.ts'
      - 'tests/wall-real-recent-comment-preview-20261116.test.mjs'
      - 'tests/community-fullscreen-video-ota-20261111.test.mjs'
      - '.github/workflows/buklod-wall-real-comment-qa-20261116.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/app/(tabs)/buklod.tsx'
      - 'src/components/BuklodExclusiveScopeCommunity.tsx'
      - 'src/components/BuklodCommunityPostEngagement.tsx'
      - 'src/components/BuklodCommunityPostEngagement.web.tsx'
      - 'src/lib/buklodPostCommentPreviews.ts'
      - 'src/lib/communityWallHydration.ts'
      - 'tests/wall-real-recent-comment-preview-20261116.test.mjs'
      - 'tests/community-fullscreen-video-ota-20261111.test.mjs'
permissions:
  contents: read
jobs:
  wall-preview-source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Actual comment preview and photo/video regressions
        run: |
          node --experimental-strip-types --test \
            tests/wall-real-recent-comment-preview-20261116.test.mjs \
            tests/community-wall-media-hydration-state.test.mjs \
            tests/community-fullscreen-video-ota-20261111.test.mjs
