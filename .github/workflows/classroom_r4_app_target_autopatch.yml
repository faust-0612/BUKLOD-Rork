name: BUKLOD Classroom R4 App Target Autopatch

on:
  push:
    branches:
      - feature/classroom-harmonized-r4-current-main-20260908
    paths:
      - 'scripts/patch-classroom-r4-app-target.cjs'
      - '.github/workflows/classroom_r4_app_target_autopatch.yml'

permissions:
  contents: write

jobs:
  guarded-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: feature/classroom-harmonized-r4-current-main-20260908
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Baseline fingerprints
        shell: bash
        run: |
          sha256sum app.config.js eas.json > /tmp/classroom-app-target-before.sha256
          git status --short
      - name: Apply guarded app-target patch
        run: node scripts/patch-classroom-r4-app-target.cjs
      - name: Diff safety gate
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 3
          printf '%s\n' "$changed" | grep -Fx 'app.config.js'
          printf '%s\n' "$changed" | grep -Fx 'eas.json'
          printf '%s\n' "$changed" | grep -Fx '.github/workflows/classroom_r4_qa.yml'
          if printf '%s\n' "$changed" | grep -Eq '(^|/)(\.env|google-services|GoogleService-Info)|supabase/migrations|src/'; then
            echo 'Protected/unexpected file changed' >&2
            exit 1
          fi
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Main config gate
        run: npx expo config --type public --json > /tmp/main-config.json
      - name: Classroom identity gate
        shell: bash
        run: |
          BUKLOD_APP_TARGET=classroom APP_VARIANT=production EXPO_PUBLIC_APP_ENV=production npx expo config --type public --json > /tmp/classroom-config.json
          node <<'NODE'
          const fs=require('fs');
          const assert=require('node:assert/strict');
          const main=JSON.parse(fs.readFileSync('/tmp/main-config.json','utf8'));
          const classroom=JSON.parse(fs.readFileSync('/tmp/classroom-config.json','utf8'));
          assert.equal(main.name,'BUKLOD');
          assert.equal(main.slug,'buklod');
          assert.equal(main.android.package,'org.mzbministry.buklod');
          assert.equal(main.extra.eas.projectId,'23dad7d0-389a-406e-8dec-08965dab85d8');
          assert.equal(classroom.name,'BUKLOD Classroom');
          assert.equal(classroom.slug,'buklod-classroom');
          assert.equal(classroom.android.package,'org.mzbministry.buklod.classroom');
          assert.equal(classroom.extra.eas.projectId,'14100ed1-7f25-4551-9627-09d280498241');
          if (classroom.android.googleServicesFile) throw new Error('Classroom unexpectedly inherited a Google services file');
          console.log('APP_TARGET_CONFIG_GATE=PASS');
          NODE
      - name: TypeScript gate
        run: npx tsc --noEmit
      - name: Commit guarded patch
        shell: bash
        run: |
          git config user.name 'BUKLOD Classroom Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add app.config.js eas.json .github/workflows/classroom_r4_qa.yml
          git commit -m 'classroom: isolate standalone app target identity'
          git push origin HEAD:feature/classroom-harmonized-r4-current-main-20260908
