name: BUKLOD Classroom R4 QA

on:
  push:
    branches:
      - feature/classroom-harmonized-r4-current-main-20260908
  pull_request:
    branches:
      - main
    paths:
      - 'src/app/profile/buklod-classroom*.tsx'
      - 'src/app/profile/buklod-faculty-live-review.tsx'
      - 'src/components/classroom/**'
      - 'src/lib/education/classroomLiveState*'
      - 'src/lib/education/classroomTransfer.ts'
      - 'supabase/functions/buklod-classroom-stream-access/**'
      - 'supabase/migrations/2026090800*_classroom*.sql'
      - '.github/workflows/classroom_r4_qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-web-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Expo public config
        run: npx expo config --type public --json > /tmp/buklod-r4-expo-config.json
      - name: Web export
        env:
          EXPO_NO_TELEMETRY: '1'
        run: npx expo export --platform web --output-dir dist-classroom-r4-qa
      - name: Classroom R4 anchors
        shell: bash
        run: |
          test ! -e __placeholder__
          grep -F "uploadClassroomObject" src/lib/education/classroomTransfer.ts
          grep -F "desiredStudentMedia" src/lib/education/classroomLiveState.ts
          grep -F "ignores stale, duplicate and cross-session commands" src/lib/education/classroomLiveState.test.ts
          grep -F "BuklodAcceptedCallContent" src/components/classroom/ClassroomLiveView.native.tsx
          grep -F "ClassroomLiveAutomationLayer" src/components/classroom/ClassroomLiveView.native.tsx
          grep -F "CameraView" src/components/classroom/ClassroomLiveView.native.tsx
          grep -F "create_breakouts" src/components/classroom/ClassroomLiveView.native.tsx
          grep -F "NO_RESPONSE_NETWORK_REVIEW" src/components/classroom/ClassroomLiveAutomationLayer.tsx
          grep -F "BUKLOD_CLASSROOM_NATIVE_ROLLING" src/components/classroom/ClassroomLiveAutomationLayer.tsx
          grep -F "sustained_degraded" src/components/classroom/ClassroomLiveAutomationLayer.tsx
          grep -F "buklod_classroom_live_policy_v1" src/components/classroom/ClassroomLiveAutomationLayer.tsx
          grep -F "NoiseCancellationProvider" src/components/classroom/ClassroomLiveAutomationLayer.tsx
          grep -F "saveClassroomFileToDevice" src/app/profile/buklod-classroom-materials.tsx
          grep -F "uploadClassroomObject" src/app/profile/buklod-classroom-work.tsx
          grep -F "buklod_classroom_finalize_live_attendance_v1" src/app/profile/buklod-faculty-live-review.tsx
          grep -F "buklod_classroom_live_attendance_proposals_v1" supabase/migrations/20260908001000_classroom_live_native_completion_r4.sql
          grep -F "buklod_classroom_interaction_reviews_v1" supabase/migrations/20260908002000_classroom_interaction_review_queue_r4.sql
          grep -F "buklod_classroom_finalize_live_attendance_v1" supabase/migrations/20260908003000_classroom_live_attendance_finalize_r4.sql
          grep -F "proposal_only" supabase/migrations/20260908004000_classroom_live_attendance_isolation_r4.sql
          grep -F "buklod_classroom_live_policy_v1" supabase/migrations/20260908005000_classroom_live_policy_r4.sql
          grep -F "create_breakouts" supabase/functions/buklod-classroom-stream-access/index.ts
