          grep -F "AUTO_SCORE = 0.90" supabase/functions/buklod-classroom-roster-import/index.ts
          grep -F "AUTO_MARGIN = 0.10" supabase/functions/buklod-classroom-roster-import/index.ts
          grep -F "legacyDocText" supabase/functions/buklod-classroom-roster-import/index.ts
