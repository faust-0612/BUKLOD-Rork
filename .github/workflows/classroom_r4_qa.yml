          grep -F "buklod_classroom_roster_profile_arrival_sync_r4" supabase/migrations/20260908033000_classroom_roster_name_sync_r4.sql
          grep -F "NEEDS_REVIEW" supabase/migrations/20260908033000_classroom_roster_name_sync_r4.sql
