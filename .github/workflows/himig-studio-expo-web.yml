name: Himig Studio - Standalone Expo Hosting

on:
  push:
    branches:
      - himig/expo-web-hosting-20261114
    paths:
      - 'himig-studio/**'
      - '.github/workflows/himig-studio-expo-web.yml'

permissions:
  contents: read

concurrency:
  group: himig-expo-web-production
  cancel-in-progress: false

jobs:
  build-test-and-deploy:
    if: github.ref == 'refs/heads/himig/expo-web-hosting-20261114'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CI: '1'
      EAS_NO_VCS: '1'
      EXPO_NO_TELEMETRY: '1'
    defaults:
      run:
        working-directory: himig-studio
    steps:
      - name: Checkout exact Himig branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: checkout-buklod

      - name: Materialize Himig outside BUKLOD Metro workspace
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p himig-studio
          cp -a checkout-buklod/himig-studio/. himig-studio/
          test -f himig-studio/package.json
          test ! -f metro.config.js
          echo 'HIMIG_ISOLATED_WORKSPACE=PASS'

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install standalone project dependencies
        run: npm install --no-audit --no-fund

      - name: Prevent accidental BUKLOD project reuse
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const cfg=require('./app.json').expo;
          const manifest=require('./package.json');
          if(cfg.slug!=='himig-studio'||cfg.name!=='Himig Studio'||cfg.web?.output!=='static')throw Error('Not the standalone Himig Expo app');
          if(!manifest.dependencies?.['expo-router'])throw Error('Expo Router required');
          if(cfg.extra?.eas?.projectId!=='05e7dab7-a7fd-490c-af52-a54a3609ec35')throw Error('Himig EAS project identity drift');
          console.log('HIMIG_IDENTITY=PASS, BUKLOD_PROJECTS=PROTECTED');
          NODE

      - name: Compile and type-check Expo Web
        run: npm run check

      - name: Verify upload scroll and Expo project isolation
        run: node --test tests/mobile-upload.test.cjs

      - name: Validate measured QC and fail-closed original fallback
        run: node --test tests/quality-gates.test.cjs

      - name: Verify renderer, explicitly NOT music-quality acceptance
        run: node verify-worker.cjs

      - name: Verify real owned-song acceptance evidence exists
        shell: bash
        run: |
          node - <<'NODE'
          const a=require('./reports/real-song-acceptance.json');
          if(a.verified_real_source_songs>0 && !a.known_bad_outputs)throw Error('Invalid acceptance manifest');
          console.log('REAL_SONG_TEST_SET='+a.verified_real_source_songs+'/'+a.required_consent_owned_songs);
          console.log('AUDIO_MASTER_CERTIFIED=NO');
          console.log('QUALITY_BACKEND_DEMUCS=NOT_IMPLEMENTED');
          console.log('LYRIC_ASR_WHISPER=NOT_IMPLEMENTED');
          NODE

      - name: Confirm existing Expo secret without printing it
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then echo 'BLOCKER: repository EXPO_TOKEN unavailable'; exit 1; fi
          npx --yes eas-cli@27.9.0 whoami --non-interactive

      - name: Create separate Himig EAS project under existing Expo account
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@27.9.0 project:init --account faust_0612 --non-interactive
          node <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('app.json','utf8')).expo;
          const id=cfg.extra?.eas?.projectId;
          if(cfg.slug!=='himig-studio'||!id)throw Error('Missing unique Himig EAS project identity');
          if(id!=='05e7dab7-a7fd-490c-af52-a54a3609ec35')throw Error('REFUSE EAS project mismatch');
          console.log('HIMIG_EXPO_PROJECT_ID='+id);
          NODE

      - name: Publish only Himig Studio to Expo Hosting
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@27.9.0 deploy --prod --non-interactive --dev-domain himig-studio --export-dir dist 2>&1 | tee "$RUNNER_TEMP/himig-deploy.log"
          URL=$(grep -Eo 'https://[A-Za-z0-9.-]+[.]expo[.]app' "$RUNNER_TEMP/himig-deploy.log" | tail -n1 || true)
          if [ -z "$URL" ]; then echo 'BLOCKER: No verifiable Expo URL in deployment output'; exit 1; fi
          printf 'HIMIG_EXPO_URL=%s\n' "$URL"
          echo "HIMIG_EXPO_URL=$URL" >> "$GITHUB_ENV"

      - name: Verify deployed Expo site and bundled audio worker
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HIMIG_EXPO_URL:-}"
          curl --fail --silent --show-error --location --retry 3 --max-time 25 "$HIMIG_EXPO_URL/" -o "$RUNNER_TEMP/himig-live.html"
          test -s "$RUNNER_TEMP/himig-live.html"
          grep -Eq 'Himig Studio|_expo/static/' "$RUNNER_TEMP/himig-live.html"
          curl --fail --silent --show-error --location --retry 3 --max-time 25 "$HIMIG_EXPO_URL/audio-worker.js" -o "$RUNNER_TEMP/himig-live-worker.js"
          test "$(wc -c < "$RUNNER_TEMP/himig-live-worker.js")" -gt 5000
          echo 'EXPO_HOSTING_RUNTIME_SMOKE=PASS'
          echo 'WEB_EXPERIMENTAL_QC_RELEASE_ONLY=YES'
          echo 'STUDIO_MASTER_ACCEPTANCE=NOT_PASSED'

      - name: Explicit production isolation statement
        if: always()
        run: echo 'No BUKLOD Android OTA, native release, Main production web, Supabase, or production repo branch was modified.'
