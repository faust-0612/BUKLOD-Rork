name: BUKLOD V24 Native Compile QA

on:
  pull_request:
    branches:
      - main

jobs:
  android-native-compile:
    if: github.head_ref == 'feature/v24-native-consolidation-r1'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BUKLOD_APP_TARGET: main
      APP_VARIANT: production
      EXPO_PUBLIC_APP_ENV: production
      ADMOB_ANDROID_APP_ID: ca-app-pub-3940256099942544~3347511713
      GOOGLE_MAPS_ANDROID_API_KEY: AIzaSyBuklodNativeCompileOnly000000000000000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild Android
        run: npx expo prebuild --platform android --clean --no-install

      - name: Compile Android Kotlin
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --stacktrace --no-daemon

      - name: Generate merged Android manifest
        working-directory: android
        run: ./gradlew :app:processDebugMainManifest --no-daemon

      - name: Verify consolidated native manifest
        run: |
          MANIFEST="android/app/build/intermediates/merged_manifests/debug/processDebugMainManifest/AndroidManifest.xml"
          if [ ! -f "$MANIFEST" ]; then
            MANIFEST="$(find android/app/build/intermediates -path '*merged_manifest*' -o -path '*merged_manifests*' | grep 'AndroidManifest.xml' | head -n 1)"
          fi
          test -f "$MANIFEST"
          grep -q 'android.permission.BLUETOOTH_SCAN' "$MANIFEST"
          grep -q 'android.permission.BLUETOOTH_ADVERTISE' "$MANIFEST"
          grep -q 'android.permission.BLUETOOTH_CONNECT' "$MANIFEST"
          grep -q 'android.permission.NEARBY_WIFI_DEVICES' "$MANIFEST"
          grep -q 'android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE' "$MANIFEST"
          grep -q 'android.permission.FOREGROUND_SERVICE_MICROPHONE' "$MANIFEST"
          grep -q 'org.mzbministry.buklod.nearbyptt.BuklodNearbyPttService' "$MANIFEST"
          grep -Eq 'foregroundServiceType="[^"]*connectedDevice' "$MANIFEST"
          grep -Eq 'foregroundServiceType="[^"]*microphone' "$MANIFEST"
          echo "V24_NATIVE_MANIFEST=PASS"
