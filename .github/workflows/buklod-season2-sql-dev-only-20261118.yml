name: Season 2 Isolated SQL Contract - DEV Only
on:
  pull_request:
    paths:
      - 'docs/season2/sql/BUKLOD_S2_ISOLATED_REWARD_CORE_DRAFT_NOT_DEPLOY.sql'
      - 'tests/season2-local-postgres-*.sql'
      - 'tests/buklod-season2-*.test.mjs'
      - '.github/workflows/buklod-season2-sql-dev-only-20261118.yml'
permissions:
  contents: read
jobs:
  season2-database-isolation:
    if: github.event_name == 'pull_request' && (github.event.pull_request.base.ref == 'staging/season2-rise-together-preview-20261118' || github.event.pull_request.base.ref == 'staging/season2-all-updates-20261119')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Ensure this is never connected to live Supabase
        shell: bash
        run: |
          set -euo pipefail
          test "$PGHOST" = "127.0.0.1"
          test "$PGDATABASE" = "postgres"
          test -z "$(printenv SUPABASE_DB_URL || true)"
          psql --version
      - name: Create synthetic local Main source tables and roles
        run: psql -v ON_ERROR_STOP=1 -f tests/season2-local-postgres-fixture-20261118.sql
      - name: Compile and transactionally install dormant S2 candidate in disposable Postgres
        run: psql -v ON_ERROR_STOP=1 -f docs/season2/sql/BUKLOD_S2_ISOLATED_REWARD_CORE_DRAFT_NOT_DEPLOY.sql
      - name: Verify real SQL behavior without real accounts, services or production
        run: psql -v ON_ERROR_STOP=1 -f tests/season2-local-postgres-behavior-20261118.sql
      - name: Simulate two devices racing to claim the same token source
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          insert into auth.users(id)
            values('cccccccc-cccc-4ccc-8ccc-cccccccccccc');
          insert into public.community_posts(id,user_id,category,body,created_at)
            values('99999999-9999-4999-8999-999999999999',
              'cccccccc-cccc-4ccc-8ccc-cccccccccccc','discussion',
              'A concurrent source with a unique body for real row-lock and ledger verification.',
              now()-interval '1 minute');
          SQL
          psql -v ON_ERROR_STOP=1 -c "set role service_role; select buklod_s2.credit_main_source('cccccccc-cccc-4ccc-8ccc-cccccccccccc','wall_original_post','99999999-9999-4999-8999-999999999999')" >/tmp/s2-double-a.log &
          first=$!
          psql -v ON_ERROR_STOP=1 -c "set role service_role; select buklod_s2.credit_main_source('cccccccc-cccc-4ccc-8ccc-cccccccccccc','wall_original_post','99999999-9999-4999-8999-999999999999')" >/tmp/s2-double-b.log &
          second=$!
          wait "$first"
          wait "$second"
          psql -v ON_ERROR_STOP=1 -Atc "select case when (select count(*) from buklod_s2.source_receipt where user_id='cccccccc-cccc-4ccc-8ccc-cccccccccccc')=1 and (select balance from buklod_s2.wallet where user_id='cccccccc-cccc-4ccc-8ccc-cccccccccccc')=2 and (select coalesce(sum(amount),0) from buklod_s2.token_ledger where user_id='cccccccc-cccc-4ccc-8ccc-cccccccccccc')=2 then 1 else 0 end" | grep -qx 1
      - name: Competing cosmetic purchases can debit wallet only once
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          insert into auth.users(id)
            values('12121212-1212-4212-8212-121212121212');
          insert into buklod_s2.wallet(user_id,earned,balance)
            values('12121212-1212-4212-8212-121212121212',80,80);
          SQL
          psql -v ON_ERROR_STOP=1 -c "set role service_role; select buklod_s2.buy_cosmetic('12121212-1212-4212-8212-121212121212','accessory_finish_emerald','91111111-1111-4111-8111-111111111111')" >/tmp/s2-purchase-a.log &
          first=$!
          psql -v ON_ERROR_STOP=1 -c "set role service_role; select buklod_s2.buy_cosmetic('12121212-1212-4212-8212-121212121212','accessory_finish_emerald','92222222-2222-4222-8222-222222222222')" >/tmp/s2-purchase-b.log &
          second=$!
          wait "$first"
          wait "$second"
          psql -v ON_ERROR_STOP=1 -Atc "select case when (select count(*) from buklod_s2.purchases where user_id='12121212-1212-4212-8212-121212121212')=1 and (select count(*) from buklod_s2.inventory where user_id='12121212-1212-4212-8212-121212121212')=1 and (select balance from buklod_s2.wallet where user_id='12121212-1212-4212-8212-121212121212')=50 and (select sum(amount) from buklod_s2.token_ledger where user_id='12121212-1212-4212-8212-121212121212')=-30 then 1 else 0 end" | grep -qx 1
      - name: Deny authenticated account direct table access
        shell: bash
        run: |
          set -euo pipefail
          if psql -v ON_ERROR_STOP=1 -c "set role authenticated; select * from buklod_s2.wallet limit 1" >/tmp/s2-rls-attempt.log 2>&1; then
            echo "S2 security failure: authenticated could read S2 wallet."
            exit 1
          fi
          grep -Eiq 'permission denied|schema.*does not exist' /tmp/s2-rls-attempt.log
      - name: Final invariant - no public/client grants and no Season1 financial tables
        run: |
          psql -v ON_ERROR_STOP=1 -Atc "select case when has_schema_privilege('anon','buklod_s2','USAGE') or has_schema_privilege('authenticated','buklod_s2','USAGE') then 1 else 0 end" | grep -qx 0
          psql -v ON_ERROR_STOP=1 -Atc "select case when to_regclass('public.buklod_points_ledger') is not null or to_regclass('public.buklod_pf_monthly_points_v3') is not null then 1 else 0 end" | grep -qx 0
