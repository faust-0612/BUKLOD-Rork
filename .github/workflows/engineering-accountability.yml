name: Engineering Accountability
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  objective-scope-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve explicit comparison ref
        run: git branch main refs/remotes/origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select isolated workstream scope manifest
        shell: bash
        env:
          PR_HEAD: ${{ github.head_ref || github.ref_name }}
        run: |
          case "$PR_HEAD" in
            fix/offline-connect-faith-20261027)
              echo "BUKLOD_SCOPE_MANIFEST=.buklod/scopes/offline-connect-faith-20261027.json" >> "$GITHUB_ENV";;
            feat/community-fair-video-20261027)
              echo "BUKLOD_SCOPE_MANIFEST=.buklod/scopes/community-fair-video-20261027.json" >> "$GITHUB_ENV";;
            fix/marites-video-blank-recovery-20261027)
              echo "BUKLOD_SCOPE_MANIFEST=.buklod/scopes/marites-video-blank-recovery-20261027.json" >> "$GITHUB_ENV";;
            fix/scoped-comments-ux-20261027)
              echo "BUKLOD_SCOPE_MANIFEST=.buklod/scopes/scoped-comments-ux-20261027.json" >> "$GITHUB_ENV";;
            fix/cluster-notification-home-sys500-20261027)
              echo "BUKLOD_SCOPE_MANIFEST=.buklod/scopes/cluster-notification-home-20261027.json" >> "$GITHUB_ENV";;
            fix/referral-lookup-race-20261027)
              echo "BUKLOD_SCOPE_MANIFEST=.buklod/scopes/referral-lookup-race-20261027.json" >> "$GITHUB_ENV";;
            fix/backend-performance-consolidation-20261026)
              echo "BUKLOD_SCOPE_MANIFEST=.buklod/scopes/backend-performance-consolidation-20261026.json" >> "$GITHUB_ENV";;
            consolidate/convo-connect-avatar-map-home-20261026)
              echo "BUKLOD_SCOPE_MANIFEST=.buklod/scopes/convo-connect-avatar-map-home-20261026.json" >> "$GITHUB_ENV";;
            fix/community-media-fast-visible-20261026)
              echo "BUKLOD_SCOPE_MANIFEST=.buklod/scopes/community-media-auth-ptt-20261026.json" >> "$GITHUB_ENV";;
            dev/scoped-community-ota-consolidation-20261025)
              echo "BUKLOD_SCOPE_MANIFEST=.buklod/scopes/cumulative-ota-20261025.json" >> "$GITHUB_ENV";;
            dev/cumulative-ota-20261025)
              echo "BUKLOD_SCOPE_MANIFEST=.buklod/scopes/cumulative-ota-20261025.json" >> "$GITHUB_ENV";;
            fix/native-nav-concurrency-20261025)
              echo "BUKLOD_SCOPE_MANIFEST=.buklod/scopes/native-nav-concurrency.json" >> "$GITHUB_ENV";;
            fix/web-nav-tap-feedback-20261024)
              echo "BUKLOD_SCOPE_MANIFEST=.buklod/scopes/web-nav-tap-feedback.json" >> "$GITHUB_ENV";;
            fix/cluster-back-wall-current-main-20261024)
              echo "BUKLOD_SCOPE_MANIFEST=.buklod/scopes/cluster-back-wall.json" >> "$GITHUB_ENV";;
            fix/web-global-bottom-nav-20261024)
              echo "BUKLOD_SCOPE_MANIFEST=.buklod/scopes/web-global-bottom-nav.json" >> "$GITHUB_ENV";;
            fix/video-stale-signed-url-20261024)
              echo "BUKLOD_SCOPE_MANIFEST=.buklod/scopes/video-stale-signed-url.json" >> "$GITHUB_ENV";;
            fix/home-real-tools-wall-cleanup-20261024)
              echo "BUKLOD_SCOPE_MANIFEST=.buklod/scopes/home-real-tools-wall-cleanup.json" >> "$GITHUB_ENV";;
            codex/cluster-clean-layout-20261024)
              echo "BUKLOD_SCOPE_MANIFEST=.buklod/scopes/cluster-clean-layout.json" >> "$GITHUB_ENV";;
            fix/home-cards-wall-isolation-20261024)
              echo "BUKLOD_SCOPE_MANIFEST=.buklod/scopes/home-cards-wall-isolation.json" >> "$GITHUB_ENV";;
            codex/nav-home-wall-isolation-20261024)
              echo "BUKLOD_SCOPE_MANIFEST=.buklod/scopes/navigation-home-wall.json" >> "$GITHUB_ENV";;
            chore/production-performance-isolation-gates-20261024)
              echo "BUKLOD_SCOPE_MANIFEST=.buklod/scopes/performance-isolation-checklist.json" >> "$GITHUB_ENV";;
            fix/per-workstream-scope-gate-20261024)
              echo "BUKLOD_SCOPE_MANIFEST=.buklod/scopes/scope-gate-isolation.json" >> "$GITHUB_ENV";;
            fix/staging-production-isolation-20261024)
              echo "BUKLOD_SCOPE_MANIFEST=.buklod/scopes/staging-production-isolation.json" >> "$GITHUB_ENV";;
          esac
      - name: Verify scope contract
        run: node scripts/engineering-accountability-gate.mjs
      - name: Verify fair discovery and independent video candidate selection
        if: github.head_ref == 'feat/community-fair-video-20261027'
        run: node --test tests/fairDiscovery.test.cjs tests/videoDiscovery.test.cjs tests/videoFeedRpcContract.test.cjs
      - name: Verify approved pending client and rollback recovery
        if: github.head_ref == 'fix/pending-client-reconciliation-20261027-r1'
        run: node scripts/test-pending-client-reconciliation-20261027.cjs
      - name: Verify cumulative Show Faith migration contract
        if: github.head_ref == 'dev/scoped-community-ota-consolidation-20261025'
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const sql = fs.readFileSync('supabase/migrations/20261025190000_show_faith_legacy_report_leadership_guard.sql', 'utf8');
          const required = [
            'buklod_scope_faith_monitoring_summary_v1',
            'buklod_scope_faith_monitoring_summary_v2',
            'buklod_scope_faith_monitoring_summary_v3',
            'buklod_is_exact_scope_admin_v1',
            'buklod_user_has_functional_approver_role',
            "errcode = ''42501''",
            "auth.uid() is null",
            "SECURITY DEFINER",
          ];
          const missing = required.filter(x => !sql.includes(x));
          if (missing.length) { console.error('SHOW FAITH CONTRACT BLOCK:', missing.join(', ')); process.exit(1); }
          if (/\\b(?:drop\\s+function|revoke\\s+execute|grant\\s+execute)\\b/i.test(sql)) {
            console.error('SHOW FAITH CONTRACT BLOCK: unexpected legacy RPC privilege mutation'); process.exit(1);
          }
          console.log('SHOW FAITH STATIC CONTRACT PASS (live role tests still required)');
          NODE
      - name: Verify navigation and scope transitions
        if: github.head_ref == 'codex/nav-home-wall-isolation-20261024' || github.ref_name == 'codex/nav-home-wall-isolation-20261024'
        run: node scripts/test-navigation-home-wall.cjs
      - name: Verify media signed URL cache
        if: github.head_ref == 'fix/video-stale-signed-url-20261024'
        run: node scripts/test-media-signed-cache.cjs

      - name: Verify bottom navigation concurrency
        run: node scripts/test-bottom-nav-concurrency.cjs

      - name: Verify Community media cache and fallback limits
        run: |
          node scripts/test-media-signed-cache.cjs
          node scripts/test-media-sign-fallback.cjs

      - name: Verify offline Connect and Faith cache contract
        if: github.head_ref == 'fix/offline-connect-faith-20261027'
        run: node --test tests/offline-connect-faith.test.cjs tests/daily-reading-offline.test.cjs

      - name: Verify referral lookup race and error handling
        if: github.head_ref == 'fix/referral-lookup-race-20261027'
        run: node --test tests/referral-lookup.test.cjs

