name: BUKLOD Classroom E2E UI Fix Production Promotion

on:
  push:
    branches: [dev/classroom-live-e2e-fixes-20261109]
    paths: ['.github/workflows/classroom-live-e2e-fix-production-20261109.yml']

permissions: { contents: read }
concurrency:
  group: buklod-classroom-e2e-production-release
  cancel-in-progress: false

jobs:
  promote-verified-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      BUKLOD_APP_TARGET: classroom
      APP_VARIANT: production
      EXPO_PUBLIC_APP_ENV: production
      EXPO_NO_TELEMETRY: '1'
      PREVIEW: https://buklod-classroom--0g49qf2xe0.expo.app
      PROD: https://buklod-classroom.expo.app
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Verify exact app identity, unchanged source and 31 regression tests
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/dev/classroom-live-e2e-fixes-20261109'
          test "$(git hash-object classroom-web/index.html)" = 'b85ccfbeed6a6a1d29006f14b05df343c104f719'
          test "$(git hash-object classroom-web/src/gemini-live.js)" = 'f24e7c4560fd5f9572e20c8a1d97bc02aecb1951'
          test "$(git hash-object classroom-web/tests/gemini-live-coverage.test.mjs)" = 'b1370607274b40d0786cc278be72606dfe12c629'
          node <<'NODE'
          const assert=require('node:assert/strict');
          const c=require('./app.config.js')({config:{extra:{}}});
          assert.equal(c.slug,'buklod-classroom');
          assert.equal(c.extra.eas.projectId,'14100ed1-7f25-4551-9627-09d280498241');
          assert.equal(c.extra.appTarget,'classroom');
          NODE
          node --test classroom-web/tests/*.test.mjs
          echo SOURCE_LOCK_AND_REGRESSION_GATE=PASS
      - name: Verify exact immutable Preview HTML and authenticated JS bundle
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --max-time 35 "$PREVIEW/?verification=0g49qf2xe0" -o /tmp/preview.html
          grep -Fq 'classroomSecureBootGuard' /tmp/preview.html
          grep -Fq 'id="drawerBackdrop" class="drawer-backdrop"' /tmp/preview.html
          if grep -Fq 'id="drawerBackdrop" class="drawer-backdrop open"' /tmp/preview.html; then exit 1; fi
          asset="$(grep -oE '/assets/index-[^"]+\.js' /tmp/preview.html | head -1)"
          test -n "$asset"
          curl -fsSL --retry 2 --max-time 35 "$PREVIEW$asset" -o /tmp/preview.js
          grep -Fq 'buklod_classroom_context_v1' /tmp/preview.js
          grep -Fq 'authorizedFaculty' /tmp/preview.js
          grep -Fq 'buklod_education_classroom_comments' /tmp/preview.js
          echo EXACT_IMMUTABLE_EXPO_PREVIEW=PASS
      - name: Install Expo CLI prerequisites
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          test -n "$EXPO_TOKEN"
      - name: Promote exactly the tested Classroom Expo deployment
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@21.7.0 deploy:alias --prod --id=0g49qf2xe0 --non-interactive --json
          echo EXACT_CLASSROOM_PROMOTION_ACCEPTED=0g49qf2xe0
      - name: Verify canonical live alias serves identical Gemini assets
        shell: bash
        run: |
          set -euo pipefail
          verified=0
          for n in 1 2 3 4 5 6; do
            if curl -fsSL --max-time 35 "$PROD/?verify=0g49qf2xe0-$n" -o /tmp/live.html; then
              p_asset="$(grep -oE '/assets/index-[^"]+\.js' /tmp/live.html | head -1)"
              source_asset="$(grep -oE '/assets/index-[^"]+\.js' /tmp/preview.html | head -1)"
              if [ "$p_asset" = "$source_asset" ] && cmp -s /tmp/live.html /tmp/preview.html; then
                if curl -fsSL --max-time 35 "$PROD$p_asset" -o /tmp/live.js && cmp -s /tmp/live.js /tmp/preview.js; then
                  verified=1
                  break
                fi
              fi
            fi
            sleep 5
          done
          if [ "$verified" -ne 1 ]; then
            echo 'FAIL: Expo production differs from tested Classroom preview'
            exit 1
          fi
          echo 'EXPO_CLASSROOM_PRODUCTION_VERIFIED=https://buklod-classroom.expo.app/'
          echo 'IMMUTABLE_EXPO_DEPLOYMENT=0g49qf2xe0'
