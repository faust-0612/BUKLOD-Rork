name: Season 2 Governance Drift
on:
  pull_request:
    paths:
      - 'contracts/season2-*.json'
      - 'contracts/season2-proposals/**'
      - 'scripts/season2-governance.cjs'
      - 'src/lib/buklodSeason*.ts'
      - 'src/lib/season2/**'
      - 'src/app/admin/season2-readiness.tsx'
      - 'scripts/seasonal-constitution*.cjs'
      - 'src/components/points/BuklodSeason*.tsx'
      - 'supabase/**'
      - 'tests/season2-governance-contract.test.mjs'
      - '.github/workflows/buklod-season2-*.yml'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  season2-policy-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify owner review from GitHub identity (not proposal self-claim)
        if: github.event_name == 'pull_request'
        id: owner_review
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              ...context.repo, pull_number: pr.number, per_page: 100
            });
            const owner = reviews.filter(r => r.user?.login === 'faust-0612').at(-1);
            const approved = owner?.state === 'APPROVED' && owner?.commit_id === pr.head.sha;
            core.setOutput('verified', String(Boolean(approved)));
      - name: Validate contract and actual behavior
        env:
          BUKLOD_OWNER_REVIEW_VERIFIED: ${{ steps.owner_review.outputs.verified || 'false' }}
          BUKLOD_CI_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}
        run: |
          node scripts/season2-governance.cjs validate
          node scripts/seasonal-constitution.test.cjs
          node --experimental-strip-types --test tests/season2-governance-contract.test.mjs tests/season2-governance-production-release-gate.test.mjs tests/buklod-season2-carryover-contract-20261119.test.mjs
          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            node scripts/season2-governance.cjs ci
          fi
      - name: Evidence disclaimer
        if: always()
        run: echo "Pure DEV/source check only; no live telemetry, Android device QA, server rewards or production deployment" >> "$GITHUB_STEP_SUMMARY"
