name: BUKLOD Mentor Hotfix Live Production Baseline - READ ONLY

on:
  push:
    branches:
      - release/mentor-submit-pinned-baseline-20261120
    paths:
      - .github/workflows/mentor-hotfix-live-baseline-check-20261120.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-baseline:
    if: github.ref == 'refs/heads/release/mentor-submit-pinned-baseline-20261120'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify current production Android 1.3.2 manifest without credentials or publication
        env:
          EXPECTED_LIVE_UPDATE_ID: 01a1f3f0-11f0-7ba7-a0d2-8dbebdf97ae3
          EXPECTED_RUNTIME: 1.3.2
          EXPO_PROJECT_ID: 23dad7d0-389a-406e-8dec-08965dab85d8
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          (async () => {
            const controller = AbortSignal.timeout(30000);
            const res = await fetch('https://u.expo.dev/' + process.env.EXPO_PROJECT_ID, {
              headers: {
                'expo-platform': 'android',
                'expo-runtime-version': process.env.EXPECTED_RUNTIME,
                'expo-channel-name': 'production'
              },
              signal: controller
            });
            assert.equal(res.status, 200, 'Production manifest must return HTTP 200');
            const raw = await res.text();
            let data;
            try { data = JSON.parse(raw); }
            catch {
              const line = raw.split(/\r?\n/).find(x=>x.startsWith('{"id"'));
              assert.ok(line, 'Cannot parse Expo manifest'); data=JSON.parse(line);
            }
            assert.equal(data.runtimeVersion, process.env.EXPECTED_RUNTIME, 'Runtime mismatch');
            assert.match(res.headers.get('expo-manifest-filters') || '', /branchname="production"/, 'Wrong channel');
            assert.match(data.id || '', /^[0-9a-f-]{36}$/i, 'Invalid update ID');
            assert.ok(data.launchAsset?.hash, 'Missing live JS bundle identity');
            console.log('LIVE PRODUCTION MANIFEST (read-only)', JSON.stringify({
              updateId: data.id, runtime: data.runtimeVersion,
              bundleHash: data.launchAsset.hash,
              expectedUpdateId: process.env.EXPECTED_LIVE_UPDATE_ID
            }));
            assert.equal(data.id, process.env.EXPECTED_LIVE_UPDATE_ID,
              'Live production changed after the last verified 2026-11-19 OTA; STOP and reconcile exact source');
          })().catch(e => { console.error('ISOLATED HOTFIX BASELINE BLOCKED:', e.message); process.exitCode=1; });
          NODE
