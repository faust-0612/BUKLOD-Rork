# Strict read-only main-like release preflight. No OTA EAS publish or merge action.
name: BUKLOD Train A Raw Native Baseline QA (NO OTA)
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/android-ota-rc.cjs'
      - 'tests/buklod-native-package-script-gate-20261118.test.mjs'
      - '.buklod/scopes/train-a-prod-raw-native-rc-20261118.json'
      - '.github/workflows/buklod-train-a-prod-raw-native-rc-qa-20261118.yml'
permissions:
  contents: read
jobs:
  baseline-source-proof:
    if: github.repository == 'faust-0612/BUKLOD-Rork' && github.head_ref == 'fix/train-a-prod-raw-v28-blob-20261118'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      APP_VARIANT: production
      EXPO_PUBLIC_APP_ENV: production
      BUKLOD_APP_TARGET: main
      EXPO_PUBLIC_STREAM_ANDROID_PUSH_PROVIDER_NAME: firebase-video-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Raw Git signed baseline and negative dependency tamper tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/buklod-native-package-script-gate-20261118.test.mjs
          node --test tests/native-expo-config-compat.test.cjs
          node --experimental-strip-types --test tests/kingdom-native-cinematic-ota-20261114.test.mjs tests/kingdom-premium-gameplay-staging-20261114.test.mjs tests/kingdom-production-ota-r12.test.mjs tests/kingdom-r9-39-cinematic-scenes-staging-20261114.test.mjs
          GITHUB_REF=refs/heads/main GITHUB_SHA="$(git rev-parse HEAD)" node scripts/buklod-season2-production-embargo.cjs --production
          git diff --exit-code
      - name: Run exact read-only production manifest/native baseline preflight - NO publish
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_REF=refs/heads/main GITHUB_SHA="$(git rev-parse HEAD)" node scripts/android-ota-rc.cjs baseline
          test -f ota-evidence/baseline.json
          node - <<'NODE'
          const fs=require('node:fs'),a=require('node:assert/strict');
          const d=JSON.parse(fs.readFileSync('ota-evidence/baseline.json','utf8'));
          a.equal(d.source,process.env.GITHUB_SHA || require('node:child_process').execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim());
          a.equal(d.runtime,'1.3.2');
          a.match(d.id,/^[0-9a-f-]{36}$/i);
          NODE
          echo 'Native baseline read-only preflight PASS, no EAS production update was published.'
