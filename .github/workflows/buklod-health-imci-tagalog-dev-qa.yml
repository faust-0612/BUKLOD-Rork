name: BUKLOD Health IMCI Tagalog DEV QA
on:
  pull_request:
    paths:
      - 'src/app/profile/buklod-health.tsx'
      - 'src/components/health/BuklodImciTagalogGuide.tsx'
      - 'src/lib/buklodImciTagalog.ts'
      - 'tests/nov14-imci-health-flow.test.mjs'
      - 'tests/health-center-consultation-card-20261110.test.mjs'
      - '.github/workflows/buklod-health-imci-tagalog-dev-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guided-health-source-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify IMCI triage and preserved Health Center access (no package install)
        run: |
          node --test tests/nov14-imci-health-flow.test.mjs tests/health-center-consultation-card-20261110.test.mjs
