name: BUKLOD Genesis 2.0.5 Expo Cloud Native Build READ-ONLY Receipt
# Read-only observer refresh for strict native scene QA source 4979302c0a0ffbf99b71858101e175a1846ba437.
on:
  pull_request:
    paths:
      - '.github/workflows/genesis-205-expo-cloud-readonly-receipt-20261123.yml'
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: github.repository == 'faust-0612/BUKLOD-Rork' && github.head_ref == 'dev/genesis-godot-launch-recovery-20261123'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SOURCE: acbb93103568ddb749c0fcef2bf6e3e1ce3ff30e
    steps:
      - name: Fetch exact cloud build trigger and its actual CI step results without retry
        run: |
          node <<'NODE'
          const a=require('node:assert/strict');
          const base='https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY;
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','User-Agent':'buklod-cloud-build-source-receipt'};
          async function query(path){const r=await fetch(base+path,{headers});a.equal(r.status,200,path);return r.json()}
          (async()=>{
            const d=await query('/actions/runs?event=push&branch=dev%2Fgenesis-godot-launch-recovery-20261123&per_page=100');
            const found=(d.workflow_runs||[]).find(x=>x.head_sha===process.env.EXPECTED_SOURCE &&
              String(x.path||'').includes('genesis-205-native-eas-cloud-build-20261123.yml'));
            if(!found){console.log('GENESIS_205_EXPO_CLOUD_BUILD_NOT_FOUND_FOR_PUSH_SHA');return}
            const strict=(d.workflow_runs||[]).find(x=>String(x.path||'').includes('genesis-205-godot-strict-headless-qa-20261123.yml'));
            if(strict){
              const strictJobs=await query('/actions/runs/'+strict.id+'/jobs?per_page=100');
              console.log('BUKLOD_GENESIS_205_GODOT_STRICT_QA_RECEIPT '+JSON.stringify({
                sha:strict.head_sha,id:strict.id,url:strict.html_url,
                status:strict.status,conclusion:strict.conclusion,
                jobs:(strictJobs.jobs||[]).map(j=>({id:j.id,status:j.status,conclusion:j.conclusion,
                  fail:(j.steps||[]).filter(s=>s.conclusion==='failure').map(s=>s.name),
                  active:(j.steps||[]).filter(s=>s.status==='in_progress').map(s=>s.name)}))
              }));
            }
            const local=(d.workflow_runs||[]).find(x=>x.head_sha==='435e071da41c83071f545c9b209acb562863f7d2' &&
              String(x.path||'').includes('genesis-205-local-eas-signed-apk-20261123.yml'));
            if(!local) console.log('BUKLOD_GENESIS_205_EAS_LOCAL_SIGNED_NOT_FOUND_FOR_EXACT_SOURCE');
            else {
              const localJobs=await query('/actions/runs/'+local.id+'/jobs?per_page=100');
              const localArts=await query('/actions/runs/'+local.id+'/artifacts?per_page=100');
              console.log('BUKLOD_GENESIS_205_EAS_LOCAL_ORIGINAL_SIGNED_RECEIPT '+JSON.stringify({
                sourceSha:local.head_sha,runId:local.id,url:local.html_url,status:local.status,
                conclusion:local.conclusion,
                jobs:(localJobs.jobs||[]).map(j=>({id:j.id,status:j.status,conclusion:j.conclusion,
                  running:(j.steps||[]).filter(s=>s.status==='in_progress').map(s=>s.name),
                  failed:(j.steps||[]).filter(s=>s.conclusion==='failure').map(s=>s.name)})),
                artifacts:(localArts.artifacts||[]).map(a=>({id:a.id,name:a.name,bytes:a.size_in_bytes,expired:a.expired})),
                productionOta:false
              }));
            }
            const jobs=await query('/actions/runs/'+found.id+'/jobs?per_page=100');
            const arts=await query('/actions/runs/'+found.id+'/artifacts?per_page=100');
            console.log('BUKLOD_GENESIS_205_EXPO_CLOUD_BUILD_SOURCE_RECEIPT '+JSON.stringify({
              source:found.head_sha,runId:found.id,url:found.html_url,
              status:found.status,conclusion:found.conclusion,
              jobs:(jobs.jobs||[]).map(j=>({id:j.id,status:j.status,conclusion:j.conclusion,
                steps:(j.steps||[]).filter(s=>s.status==='in_progress'||s.conclusion==='failure').map(s=>s.name)})),
              artifacts:(arts.artifacts||[]).map(x=>({name:x.name,size:x.size_in_bytes,expired:x.expired})),
              publishedOta:false,production:false
            }));
          })().catch(e=>{console.error('CLOUD_BUILD_READBACK_FAILED',e.message);process.exitCode=1});
          NODE
