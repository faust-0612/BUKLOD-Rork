name: Genesis Original Guide + Real Entry Ad DEV Verification (NO OTA)
on:
  push:
    branches:
      - dev/genesis-portrait-guide-real-ads-20261121
permissions:
  contents: read
concurrency:
  group: genesis-original-guide-ad-verification
  cancel-in-progress: true
jobs:
  source-and-android:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      APP_VARIANT: staging
      BUKLOD_APP_TARGET: main
      EXPO_PUBLIC_APP_ENV: staging
      EXPO_PUBLIC_BUKLOD_SEASON2_GENESIS_PREVIEW: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Owner map + AdMob + navigation + guide regressions
        run: |
          node --test tests/genesis-original-guide-ad-20261121.test.mjs tests/genesis-dimensional-entry-map-motion-20261121.test.mjs \
            tests/season2-approved-portrait-art-20261121.test.mjs tests/genesis-world-navigation-regression-20261121.test.mjs \
            tests/season2-one-tap-kingdom-guide-20261121.test.mjs tests/season2-premium-ad-navigation-guard-20261121.test.mjs \
            tests/ad-dashboard-focus-performance-20261116.test.mjs tests/dashboard-ad-navigation-prewarm-20261116.test.mjs
          node scripts/genesis-map-reconstruction-preflight.mjs
      - name: Existing immutable app dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full app TypeScript
        run: npx tsc --noEmit
      - name: Native Android JS and asset export
        run: node scripts/season2-android-bundle-compatibility.mjs --compile
      - name: No deployment
        run: echo 'DEV CI only. No staging OTA, APK, Play, Supabase or production writes.'
