name: One-time Home leaderboard period fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one_time_fix_home_leaderboard_period_r1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Canonicalize Home weekly leaderboard period
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/app/(tabs)/home.tsx')
          text = path.read_text(encoding='utf-8')
          old = "p_period: 'week',"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected one Home week period call, found {count}')
          text = text.replace(old, "p_period: 'weekly',", 1)
          path.write_text(text, encoding='utf-8')
          print('Home weekly leaderboard now uses canonical weekly period')
          PY
      - name: Install dependencies
        run: npm ci
      - name: TypeScript QA
        run: npx tsc --noEmit
      - name: Commit source fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name "BUKLOD Automation"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/one_time_fix_home_leaderboard_period_r1.yml
          git add 'src/app/(tabs)/home.tsx' .github/workflows/one_time_fix_home_leaderboard_period_r1.yml
          git commit -m "fix(points): keep Home weekly leaderboard visible"
          git push origin HEAD:main
