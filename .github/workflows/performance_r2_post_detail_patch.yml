name: BUKLOD Performance R2 Post Detail Patch

on:
  push:
    branches:
      - perf/r2-post-detail-shared-realtime
    paths:
      - '.github/workflows/performance_r2_post_detail_patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: perf/r2-post-detail-shared-realtime
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply exact post detail realtime patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/post/[id].tsx')
          s = p.read_text(encoding='utf-8-sig')

          import_anchor = "import {supabase} from '@/lib/supabase';\n"
          import_line = "import { acquireSharedRealtimeSubscription } from '@/lib/performance';\n"
          if s.count(import_anchor) != 1:
              raise SystemExit(f'import anchor count={s.count(import_anchor)}')
          if import_line not in s:
              s = s.replace(import_anchor, import_anchor + import_line, 1)

          old = """ useEffect(()=>{if(!id)return;const ch=supabase.channel(`post:${id}`)\n  .on('postgres_changes',{event:'*',schema:'public',table:'comments',filter:`post_id=eq.${id}`},()=>load())\n  .on('postgres_changes',{event:'*',schema:'public',table:'reactions',filter:`post_id=eq.${id}`},()=>load())\n  .on('postgres_changes',{event:'*',schema:'public',table:'post_share_requests',filter:`post_id=eq.${id}`},()=>load()).subscribe();\n  return()=>{supabase.removeChannel(ch)}},[id,load]);\n"""

          new = """ useEffect(()=>{\n  if(!id)return;\n\n  return acquireSharedRealtimeSubscription(\n   `post-detail:${id}`,\n   ()=>{void load()},\n   emit=>{\n    const ch=supabase.channel(`post:${id}`)\n     .on('postgres_changes',{event:'*',schema:'public',table:'comments',filter:`post_id=eq.${id}`},()=>emit(undefined))\n     .on('postgres_changes',{event:'*',schema:'public',table:'reactions',filter:`post_id=eq.${id}`},()=>emit(undefined))\n     .on('postgres_changes',{event:'*',schema:'public',table:'post_share_requests',filter:`post_id=eq.${id}`},()=>emit(undefined))\n     .subscribe();\n\n    return()=>{void supabase.removeChannel(ch)};\n   }\n  );\n },[id,load]);\n"""

          if s.count(old) != 1:
              raise SystemExit(f'old realtime block count={s.count(old)}')
          s = s.replace(old, new, 1)

          if "acquireSharedRealtimeSubscription" not in s:
              raise SystemExit('shared realtime import/use missing')
          if "`post-detail:${id}`" not in s:
              raise SystemExit('deterministic post detail registry key missing')
          if "table:'comments'" not in s or "table:'reactions'" not in s or "table:'post_share_requests'" not in s:
              raise SystemExit('required realtime table contract missing')

          p.write_text(s, encoding='utf-8')
          PY

      - name: TypeScript QA
        run: npx tsc --noEmit

      - name: Exact diff guard
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | wc -l | tr -d ' ')" -eq 1
          test "$(git diff --name-only)" = "src/app/post/[id].tsx"
          git diff -- src/app/post/'[id].tsx'

      - name: Commit targeted patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'faust-0612'
          git config user.email 'efmagaj@gmail.com'
          git add 'src/app/post/[id].tsx'
          git commit -m 'perf: share post detail realtime channel'
          git push origin HEAD:perf/r2-post-detail-shared-realtime

      - name: No deploy marker
        run: echo 'PATCH + QA ONLY — NO DEPLOY / NO OTA / NO APK / NO AAB / NO DB CHANGE'
