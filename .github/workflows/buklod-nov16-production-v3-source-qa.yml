# Production RC source, signed runtime, and compatibility QA; never publishes.
name: BUKLOD Nov16 V3 Consolidated Production Android RC QA - NO PUBLISH
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.buklod/scopes/nov16-production-staging-parity-rc.json'
      - '.github/workflows/buklod-nov16-production-v3-source-qa.yml'
permissions:
  contents: read
jobs:
  exact-android-production-qa:
    if: ${{ github.repository == 'faust-0612/BUKLOD-Rork' && github.head_ref == 'integration/nov16-production-parity-rc-132' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      APP_VARIANT: production
      EXPO_PUBLIC_APP_ENV: production
      BUKLOD_APP_TARGET: main
      EXPO_PUBLIC_STREAM_ANDROID_PUSH_PROVIDER_NAME: firebase-video-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Freeze production candidate to verified staging app src tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD:src)" = "4f5359021732b39e3771a1ac2f25b1f8c1a898b0" || { echo 'NOT exact staged Android app source'; exit 1; }
          git diff --exit-code HEAD:app.config.js 51b9b35af1302ce1f6d1a20ba12c2dc8068a80f2:app.config.js
          git diff --exit-code HEAD:eas.json 51b9b35af1302ce1f6d1a20ba12c2dc8068a80f2:eas.json
          git diff --exit-code HEAD:package-lock.json 51b9b35af1302ce1f6d1a20ba12c2dc8068a80f2:package-lock.json
          node - <<'NODE'
          const a=require('node:assert/strict');
          const app=require('./app.config.js')({config:{}}),e=require('./eas.json');
          a.equal(app.runtimeVersion,'1.3.2');
          a.equal(app.android.package,'org.mzbministry.buklod');
          a.equal(app.extra.appEnvironment,'production');
          a.equal(e.build.production.channel,'production');
          a.equal(app.extra.eas.projectId,'23dad7d0-389a-406e-8dec-08965dab85d8');
          NODE
      - name: Install pinned dependencies and run main + staging critical regressions
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/nov16-production-v3-source-release-gate.test.mjs \
            tests/henry-natural-filipino-20261116.test.cjs \
            tests/bible-132-complete-storytelling-20261116.test.mjs \
            tests/bible-study-sources.test.cjs \
            tests/buklod-bible-v4-quiz-security-20261116.test.mjs \
            tests/children-story-narration-20261115.test.mjs \
            tests/bible-dark-mode-20261116.test.mjs \
            tests/notifications-dark-contrast-executive-20261115.test.mjs \
            tests/nov16-connect-profile-geometry.test.mjs \
            tests/nov16-profile-navigation-character-guard.test.mjs \
            tests/buklod-ads-appwide-permanent-lock-20261111.test.mjs \
            tests/buklod-ads-production-release-contract-20261111.test.mjs \
            tests/buklod-admob-fill-finance-release-20261111.test.mjs \
            tests/ad-dashboard-focus-performance-20261116.test.mjs \
            tests/production-ota-ads-regression.test.mjs \
            tests/navigation-video-scroll-stop-20261114.test.mjs \
            tests/community-video-playback-recovery.test.mjs
          node scripts/buklod-ad-surface-audit.mjs --summary
          npx tsc --noEmit
      - name: Authenticated read-only EAS production and staging identity preflight
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN" || { echo 'EXPO_TOKEN absent; no release'; exit 1; }
          mkdir -p /tmp/buklod-nov16-prod-v3-qa
          npx --yes eas-cli@27.9.0 channel:view production --json --non-interactive > /tmp/buklod-nov16-prod-v3-qa/channel-production.json
          npx --yes eas-cli@27.9.0 channel:view staging-user --json --non-interactive > /tmp/buklod-nov16-prod-v3-qa/channel-staging.json
          npx --yes eas-cli@27.9.0 update:list --branch staging-user --limit 6 --json --non-interactive > /tmp/buklod-nov16-prod-v3-qa/stage-updates.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import fs from 'node:fs';
          import {manifest,verifyChannels} from './scripts/navigation-v2-owner-staging-policy.mjs';
          const dir='/tmp/buklod-nov16-prod-v3-qa';
          verifyChannels(JSON.parse(fs.readFileSync(dir+'/channel-staging.json')),JSON.parse(fs.readFileSync(dir+'/channel-production.json')));
          const stage=await manifest('staging-user'),prod=await manifest('production');
          assert.equal(stage.id,'01a1e0fe-45da-7be9-a6f5-107d43bad4b3','Staging source moved: STOP');
          assert.equal(stage.extra?.expoClient?.android?.package,'org.mzbministry.buklod.staging');
          assert.equal(prod.extra?.expoClient?.android?.package,'org.mzbministry.buklod');
          assert.equal(prod.id,'01a1dff8-7563-790b-a714-22c316f56590','Prod advanced: STOP');
          const list=JSON.parse(fs.readFileSync(dir+'/stage-updates.json')),row=(list.currentPage??list)[0];
          assert.equal(row.group,'662f220d-a373-420e-87ba-70a7e49ec26e');
          assert.equal(row.runtimeVersion,'1.3.2');
          console.log('PRODUCTION_RC_SERVER_PREFLIGHT_ONLY',{
            stagingId:stage.id,productionId:prod.id,source:'bf8e82019297dc6642b92748bf8f3498cf15ae67'
          });
          NODE
      - name: Build production-identity Android Hermes bundle with real EAS env (NO publish)
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@27.9.0 env:pull --environment production --path /tmp/buklod-nov16-prod-v3-qa/production.env --non-interactive >/dev/null
          test -s /tmp/buklod-nov16-prod-v3-qa/production.env
          set -a
          . /tmp/buklod-nov16-prod-v3-qa/production.env
          set +a
          export APP_VARIANT=production EXPO_PUBLIC_APP_ENV=production BUKLOD_APP_TARGET=main EXPO_PUBLIC_STREAM_ANDROID_PUSH_PROVIDER_NAME=firebase-video-production
          npx expo config --json > /tmp/buklod-nov16-prod-v3-qa/config.json
          node - <<'NODE'
          const a=require('node:assert/strict'),f=require('node:fs');
          const c=JSON.parse(f.readFileSync('/tmp/buklod-nov16-prod-v3-qa/config.json','utf8'));
          a.equal(c.runtimeVersion,'1.3.2');a.equal(c.android.package,'org.mzbministry.buklod');
          a.equal(c.extra.appEnvironment,'production');
          a.match(process.env.EXPO_PUBLIC_SUPABASE_URL||'',/^https:\/\/[a-z0-9]+\.supabase\.co$/);
          a.ok(process.env.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY);
          NODE
          EXPO_MAX_WORKERS=2 npx expo export --platform android --output-dir /tmp/buklod-nov16-prod-v3-qa/android --clear
          test -s /tmp/buklod-nov16-prod-v3-qa/android/metadata.json
          test -z "$(git status --porcelain --untracked-files=no)"
          echo 'PRODUCTION ANDROID 1.3.2 RC QA ONLY. NO EAS PUBLISH.'
