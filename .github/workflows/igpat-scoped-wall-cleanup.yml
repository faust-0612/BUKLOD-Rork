name: IGPAT Scoped Community Contract Cleanup

on:
  push:
    branches:
      - work/igpat-scoped-wall-cleanup-scratch
    paths:
      - .github/workflows/igpat-scoped-wall-cleanup.yml

permissions:
  contents: write

jobs:
  patch-scoped-community:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/igpat-scoped-wall-cleanup-scratch
          fetch-depth: 0

      - name: Patch exact-scope Community contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/BuklodExclusiveScopeCommunity.tsx')
          text = path.read_text(encoding='utf-8')
          original = text

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {count}')
              text = text.replace(old, new, 1)

          if "from 'expo-router'" not in text:
              replace_once(
                  "} from 'react';\n\nimport {\n  ActivityIndicator,",
                  "} from 'react';\nimport { router } from 'expo-router';\n\nimport {\n  ActivityIndicator,",
                  'expo-router import',
              )

          replace_once(
              """                        Posts, Reels, reactions,
                        comments and replies stay""",
              """                        Posts, photos, reactions,
                        comments and replies stay""",
              'scope notice copy',
          )

          reels_toggle = """          <Pressable
            onPress={() => {
              setMode(
                'reels'
              );
              setWallVideo(
                null
              );
              setPhotos(
                []
              );
              setCommunityGif(null);
            }}
            style={[
              styles.modeButton,
              mode ===
                'reels' &&
                styles.modeButtonOn,
            ]}
          >
            <MaterialCommunityIcons
              name=\"movie-play-outline\"
              size={19}
              color={
                mode ===
                  'reels'
                  ? colors.white
                  : colors.greenDark
              }
            />

            <Text
              style={[
                styles.modeText,
                mode ===
                  'reels' &&
                  styles.modeTextOn,
              ]}
            >
              REELS
            </Text>
          </Pressable>"""
          igpat_toggle = """          <Pressable
            onPress={() =>
              router.push('/igpat' as any)
            }
            style={
              styles.modeButton
            }
            accessibilityRole=\"button\"
            accessibilityLabel=\"Open BUKLOD IGPAT\"
          >
            <MaterialCommunityIcons
              name=\"movie-play-outline\"
              size={19}
              color={
                colors.greenDark
              }
            />

            <Text
              style={
                styles.modeText
              }
            >
              BUKLOD IGPAT
            </Text>
          </Pressable>"""
          replace_once(reels_toggle, igpat_toggle, 'replace scoped Reels toggle')

          gif_video_buttons = """                <Pressable
                  disabled={busy}
                  onPress={() => {
                    clearMedia();
                    setCommunityGifPickerOpen(true);
                  }}
                  style={styles.mediaButton}
                >
                  <MaterialCommunityIcons
                    name=\"file-gif-box\"
                    size={19}
                    color={colors.greenDark}
                  />
                  <Text style={styles.mediaButtonText}>
                    {communityGif ? 'GIF Ready' : 'Add GIF'}
                  </Text>
                </Pressable>

                <Pressable
                  disabled={
                    busy ||
                    wallVideoBusy
                  }
                  onPress={() =>
                    void pickWallVideo()
                  }
                  style={
                    styles.mediaButton
                  }
                >
                  <MaterialCommunityIcons
                    name=\"video-outline\"
                    size={19}
                    color={
                      colors.greenDark
                    }
                  />
                  <Text
                    style={
                      styles.mediaButtonText
                    }
                  >
                    {wallVideoBusy
                      ? 'Preparing...'
                      : wallVideo
                      ? 'Video Ready'
                      : 'Add Video'}
                  </Text>
                </Pressable>"""
          igpat_button = """                <Pressable
                  disabled={busy}
                  onPress={() =>
                    router.push('/igpat/create' as any)
                  }
                  style={
                    styles.mediaButton
                  }
                  accessibilityRole=\"button\"
                  accessibilityLabel=\"Create in BUKLOD IGPAT\"
                >
                  <MaterialCommunityIcons
                    name=\"video-outline\"
                    size={19}
                    color={
                      colors.greenDark
                    }
                  />
                  <Text
                    style={
                      styles.mediaButtonText
                    }
                  >
                    BUKLOD IGPAT
                  </Text>
                </Pressable>"""
          replace_once(gif_video_buttons, igpat_button, 'replace GIF/video composer controls')

          publish_start = """      if (
        !user?.id
      ) {
        return;
      }

      const cleanBody ="""
          publish_guard = """      if (
        !user?.id
      ) {
        return;
      }

      if (
        mode === 'reels' ||
        !!reel ||
        !!wallVideo ||
        !!communityGif
      ) {
        Alert.alert(
          'Community',
          'Community accepts text and photos only. Post videos through BUKLOD IGPAT.'
        );
        return;
      }

      const cleanBody ="""
          replace_once(publish_start, publish_guard, 'publish contract guard')

          replace_once(
              "'Write a message, add a GIF, photos, or a video first.'",
              "'Write a message or add photos first.'",
              'empty composer copy',
          )

          if text == original:
              raise SystemExit('No scoped Community changes were produced.')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify scoped Community contract markers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('src/components/BuklodExclusiveScopeCommunity.tsx').read_text(encoding='utf-8')
          required = [
              "router.push('/igpat' as any)",
              "router.push('/igpat/create' as any)",
              'BUKLOD IGPAT',
              'Community accepts text and photos only',
              "'Write a message or add photos first.'",
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Missing required contract markers: {missing}')
          forbidden_reachable = [
              "setMode(\n                'reels'\n              )",
              "{communityGif ? 'GIF Ready' : 'Add GIF'}",
              "? 'Video Ready'\n                      : 'Add Video'",
          ]
          remaining = [item for item in forbidden_reachable if item in text]
          if remaining:
              raise SystemExit(f'Reachable scoped Community media entrypoint remains: {remaining}')
          PY

      - name: Commit scoped Community cleanup
        shell: bash
        run: |
          if git diff --quiet -- 'src/components/BuklodExclusiveScopeCommunity.tsx'; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'BUKLOD isolated automation'
          git config user.email 'actions@users.noreply.github.com'
          git add 'src/components/BuklodExclusiveScopeCommunity.tsx'
          git commit -m 'Route scoped Community video creation to IGPAT'
          git push origin HEAD:work/igpat-scoped-wall-cleanup-scratch
