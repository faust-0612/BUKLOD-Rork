name: Isolated IGPAT Wall Contract Cleanup

on:
  push:
    branches:
      - feature/igpat-r8-isolated-current-main
    paths:
      - .github/workflows/igpat-wall-contract-cleanup.yml

permissions:
  contents: write

jobs:
  patch-public-wall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/igpat-r8-isolated-current-main
          fetch-depth: 0

      - name: Enforce Public Community text/photo-only composer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app/(tabs)/buklod.tsx')
          text = path.read_text(encoding='utf-8')
          original = text

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "router.push(\n       '/reels' as any\n      )",
              "router.push(\n       '/igpat' as any\n      )",
              'canonical IGPAT route',
          )
          replace_once(
              'BUKLOD REELS',
              'BUKLOD IGPAT',
              'canonical IGPAT label',
          )

          replace_once(
              """        const imageRows = normalized.filter(\n          (row: any) =>\n            row?.contentType === 'image' &&\n            typeof row?.contentUri === 'string' &&\n            row.contentUri.length > 0\n        );\n\n        const videoRows = normalized.filter(\n          (row: any) =>\n            row?.contentType === 'video' &&\n            typeof row?.contentUri === 'string' &&\n            row.contentUri.length > 0\n        );""",
              """        const gifRows = normalized.filter(\n          (row: any) =>\n            row?.contentType === 'image' &&\n            String(row?.contentMimeType ?? '').toLowerCase() === 'image/gif' &&\n            typeof row?.contentUri === 'string' &&\n            row.contentUri.length > 0\n        );\n\n        const imageRows = normalized.filter(\n          (row: any) =>\n            row?.contentType === 'image' &&\n            String(row?.contentMimeType ?? '').toLowerCase() !== 'image/gif' &&\n            typeof row?.contentUri === 'string' &&\n            row.contentUri.length > 0\n        );\n\n        const videoRows = normalized.filter(\n          (row: any) =>\n            row?.contentType === 'video' &&\n            typeof row?.contentUri === 'string' &&\n            row.contentUri.length > 0\n        );""",
              'incoming share media classification',
          )

          replace_once(
              """        if (\n          !sharedText.length &&\n          !imageRows.length &&\n          !videoRows.length\n        ) {\n          throw new Error(\n            'This shared item type is not supported by BUKLOD yet.'\n          );\n        }\n\n        if (imageRows.length && videoRows.length) {\n          throw new Error(\n            'BUKLOD Community accepts either photos or one video in a post, not both.'\n          );\n        }\n\n        if (videoRows.length > 1) {\n          throw new Error(\n            'BUKLOD Community accepts one video per post.'\n          );\n        }""",
              """        if (\n          !sharedText.length &&\n          !imageRows.length &&\n          !gifRows.length &&\n          !videoRows.length\n        ) {\n          throw new Error(\n            'This shared item type is not supported by BUKLOD yet.'\n          );\n        }\n\n        if (gifRows.length) {\n          incomingShare187A.clearSharedPayloads();\n          Alert.alert(\n            'Community',\n            'Community accepts text and still photos only. GIF posting is not available.'\n          );\n          return;\n        }\n\n        if (videoRows.length) {\n          incomingShare187A.clearSharedPayloads();\n          Alert.alert(\n            'BUKLOD IGPAT',\n            'Videos belong in BUKLOD IGPAT. Opening the IGPAT creator.'\n          );\n          router.push('/igpat/create' as any);\n          return;\n        }""",
              'incoming share Community contract',
          )

          replace_once(
              """ const publish=async()=>{\n  if(!user)return;""",
              """ const publish=async()=>{\n  if(!user)return;\n\n  if(wallVideo186O || communityGif){\n   return Alert.alert(\n    'Community',\n    'Community accepts text and photos only. Post videos through BUKLOD IGPAT.'\n   );\n  }""",
              'publish contract guard',
          )

          replace_once(
              """    <Pressable\n     style={s.tool}\n     disabled={busy}\n     onPress={()=>{\n      setPhotos([]);\n      setWallVideo186O(null);\n      setCommunityGifPickerOpen(true);\n     }}\n    >\n     <MaterialCommunityIcons name=\"file-gif-box\" size={17} color={colors.green}/>\n     <Text style={s.toolText}>{communityGif?'GIF Ready':'Add GIF'}</Text>\n    </Pressable>\n    <Pressable\n     style={s.tool}\n     disabled={\n      busy||\n      videoBusy186O\n     }\n     onPress={()=>\n      void pickWallVideo186O()\n     }\n    >\n     <MaterialCommunityIcons\n      name=\"video-outline\"\n      size={17}\n      color={colors.green}\n     />\n     <Text style={s.toolText}>\n      {videoBusy186O\n       ? 'Preparing...'\n       : wallVideo186O\n        ? 'Video Ready'\n        : 'Add Video'}\n     </Text>\n    </Pressable>""",
              """    <Pressable\n     style={s.tool}\n     disabled={busy}\n     onPress={()=>\n      router.push('/igpat/create' as any)\n     }\n    >\n     <MaterialCommunityIcons\n      name=\"video-outline\"\n      size={17}\n      color={colors.green}\n     />\n     <Text style={s.toolText}>BUKLOD IGPAT</Text>\n    </Pressable>""",
              'remove Wall GIF/video composer entrypoints',
          )

          replace_once(
              """      Up to {COMMUNITY_MAX_PHOTOS} photos per post. Posting continues in the background so you can keep using BUKLOD.\n      {photos.length""",
              """      Up to {COMMUNITY_MAX_PHOTOS} photos per post. Videos are posted through BUKLOD IGPAT. Posting continues in the background so you can keep using BUKLOD.\n      {photos.length""",
              'Community composer helper copy',
          )

          if text == original:
              raise SystemExit('No Public Community changes were produced.')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify forbidden Public Wall creation labels are gone
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('src/app/(tabs)/buklod.tsx').read_text(encoding='utf-8')
          required = ["router.push('/igpat/create' as any)", 'BUKLOD IGPAT', 'Community accepts text and photos only']
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Missing required contract markers: {missing}')
          for forbidden in ['>Add GIF<', "'Add GIF'", ">Add Video<", "'Add Video'", 'BUKLOD REELS']:
              if forbidden in text:
                  raise SystemExit(f'Forbidden Public Wall creation label remains: {forbidden}')
          PY

      - name: Commit isolated Public Wall cleanup
        shell: bash
        run: |
          if git diff --quiet -- 'src/app/(tabs)/buklod.tsx'; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'BUKLOD isolated automation'
          git config user.email 'actions@users.noreply.github.com'
          git add 'src/app/(tabs)/buklod.tsx'
          git commit -m 'Reserve Community Wall for text and photos'
          git push origin HEAD:feature/igpat-r8-isolated-current-main
