name: BUKLOD Web Desktop R2 QA

on:
  push:
    branches:
      - fix/web-desktop-shell-r2-call

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: TypeScript QA
        run: npx tsc --noEmit
      - name: Web export QA
        run: |
          npx expo export --platform web
          test -f dist/index.html
      - name: Verify Web Desktop R2 anchors
        shell: bash
        run: |
          grep -F 'BUKLOD_WEB_DESKTOP_SHELL_R2' 'src/components/BuklodNavSafeShell.web.tsx'
          grep -F 'BuklodSponsorSlot' 'src/components/BuklodNavSafeShell.web.tsx'
          grep -F 'BUKLOD_WEB_DIRECT_VOICE_CALL_R2' 'src/components/connect/ConnectThreadHeader.web.tsx'
          grep -F 'buklod-web-direct-audio-call' 'src/components/connect/ConnectThreadHeader.web.tsx'
          if grep -F 'buklod-direct-video-call' 'src/components/connect/ConnectThreadHeader.web.tsx'; then
            echo 'Unexpected video call control on web.'
            exit 1
          fi
