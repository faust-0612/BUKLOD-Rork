name: PTT Connect candidate verification
on:
  push:
    branches: [codex/ptt-connect-call-isolation]
    paths: ['.github/workflows/ptt_connect_candidate.yml']
permissions:
  contents: read
concurrency:
  group: ptt-connect-candidate
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPO_PUBLIC_APP_ENV: production
      EXPO_PUBLIC_STREAM_ANDROID_PUSH_PROVIDER_NAME: firebase-video-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify exact product identity
        run: |
          echo '1dc701fddfc56875769f3f67e4316941e93ae79708664c55828b887680c61efb  src/utils/setPushConfig.ts' | sha256sum -c -
          git rev-parse HEAD
      - run: node --test tests/buklod-ptt-call-isolation.test.cjs
      - run: npm ci --ignore-scripts
      - name: Verify targeted delta against published production source
        run: |
          git fetch --depth=1 origin 74a20a47bee6b1284f899f76dd16af212051e391
          git diff --name-only 74a20a47bee6b1284f899f76dd16af212051e391 HEAD > /tmp/ptt-delta.txt
          cat /tmp/ptt-delta.txt
          if grep -Ev '^(src/utils/setPushConfig.ts|tests/buklod-ptt-call-isolation.test.cjs|.buklod/work-scope.json|release/PTT_CONNECT_ISOLATION_SOURCE_20261023.json|.github/workflows/ptt_connect_candidate.yml)
      - name: Preserve production Home overlay
        run: node scripts/patch-home-identity-action-row.cjs
      - run: npx tsc --noEmit
      - name: Android JavaScript export
        run: npx expo export --platform android --output-dir dist-ptt --no-bytecode
      - name: Verify Android bundle and PTT configuration
        run: |
          test -f dist-ptt/metadata.json
          test -n "$(find dist-ptt -type f -name '*.js' -print -quit)"
          grep -RE 'enableOngoingCalls:(!1|false)' dist-ptt/_expo/static/js/android >/dev/null
      - name: Read latest production OTA identity
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli@25.3.0 channel:view production --json --non-interactive
          npx eas-cli@25.3.0 update:list --branch production --platform android --runtime-version 1.3.2 --limit 1 --json --non-interactive
      - name: Record verified candidate
        run: |
          git rev-parse HEAD
          git diff --stat
          find dist-ptt -type f -name '*.js' -exec sha256sum {} +
 /tmp/ptt-delta.txt; then
            echo 'Unexpected change outside PTT scope'; exit 1
          fi
          git diff --exit-code 74a20a47bee6b1284f899f76dd16af212051e391 HEAD -- src/components/points src/features/games assets package.json package-lock.json app.config.js
          node scripts/community-help-sos-release-contract.mjs
      - name: Preserve production Home overlay
        run: node scripts/patch-home-identity-action-row.cjs
      - run: npx tsc --noEmit
      - name: Android JavaScript export
        run: npx expo export --platform android --output-dir dist-ptt --no-bytecode
      - name: Compiled Character contract
        run: node scripts/character-release-contract.mjs --dist dist-ptt
      - name: Record verified candidate
        run: |
          git rev-parse HEAD
          git diff --stat
          find dist-ptt -type f -name '*.js' -exec sha256sum {} +
