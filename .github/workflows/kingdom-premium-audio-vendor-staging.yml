name: Kingdom Premium CC0 Audio Staging Vendor
on:
  push:
    branches:
      - dev/kingdom-premium-audio-staging-20261114
    paths:
      - '.github/workflows/kingdom-premium-audio-vendor-staging.yml'
      - 'scripts/vendor-kingdom-premium-audio.sh'
      - 'assets/sounds/kingdom-premium/manifest.json'
      - 'tests/kingdom-premium-audio-staging-20261114.test.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kingdom-premium-audio-staging-vendor
  cancel-in-progress: false

jobs:
  vendor-audio:
    if: github.repository == 'faust-0612/BUKLOD-Rork' && github.ref == 'refs/heads/dev/kingdom-premium-audio-staging-20261114'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      APP_VARIANT: staging
      EXPO_PUBLIC_APP_ENV: staging
      BUKLOD_APP_TARGET: main
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: compile-only-not-a-real-publishable-key
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Vendor CC0 audio and verify exact Git hashes
        run: bash scripts/vendor-kingdom-premium-audio.sh
      - name: Run focused assets and audio behavior contract
        run: |
          node --test tests/kingdom-premium-audio-staging-20261114.test.mjs
          node scripts/rork-media-contract-test.mjs
      - name: Commit exact verified audio to DEV branch (not main or OTA)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/sounds/kingdom-premium/*.ogg assets/sounds/kingdom-premium/*.wav
          if ! git diff --cached --quiet; then
            git commit -m "assets(kingdom): vendor SHA-verified CC0 orchestral music and SFX"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: TypeScript and stage runtime / channel validation
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npx tsc --noEmit
          node - <<'NODE'
          const a = require('node:assert/strict');
          const conf = require('./app.config.js')({config:{}});
          const eas = require('./eas.json');
          a.equal(conf.android.package,'org.mzbministry.buklod.staging');
          a.equal(conf.runtimeVersion,'1.3.2');
          a.equal(eas.build['staging-user'].channel,'staging-user');
          NODE
      - name: Bundle Android JavaScript and offline audio assets (nonpublishing)
        run: |
          set -euo pipefail
          EXPO_MAX_WORKERS=2 npx expo export --platform android --output-dir /tmp/buklod-kingdom-premium-audio-android --clear
          test -s /tmp/buklod-kingdom-premium-audio-android/metadata.json
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "Verified stage-source Android export: ${GITHUB_SHA}. No OTA or Play publication." >> "$GITHUB_STEP_SUMMARY"
