name: Formation Reader Targeted Patch

on:
  push:
    branches:
      - fix/formation-pipeline-20260911
    paths:
      - '.github/workflows/formation_reader_targeted_patch.yml'

permissions:
  contents: write

jobs:
  patch-reader:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/formation-pipeline-20260911
          fetch-depth: 0

      - name: Remove inverted Daily Reading submission gate only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/app/bible/read.tsx')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r"\n\s*/\* DAILY_BIBLE_REFLECTION_SUBMISSION_GATE_V2 \*/\s*\n"
              r"\s*if \(source === 'daily_plan'\) \{.*?\n\s*setMarking\(true\);",
              re.S,
          )
          replacement = "\n      /* DAILY_READING_COMPLETION_INDEPENDENT_OF_SUBMISSION_V1 */\n      // Reading completion is a lifecycle fact. Reflection/submission is validated\n      // separately by the existing Daily Bible response and Formation approval flow.\n      setMarking(true);"
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected exactly one Daily Bible gate block; found {count}')
          if "SUBMIT REFLECTION FIRST" in updated:
              raise SystemExit('Legacy inverted completion gate still present')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Verify targeted diff
        shell: bash
        run: |
          git diff --check
          git diff -- src/app/bible/read.tsx
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "1"
          test "$(git diff --name-only)" = "src/app/bible/read.tsx"

      - name: Commit targeted reader repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/bible/read.tsx
          git commit -m "fix(formation): decouple reading completion from submission"
          git push origin HEAD:fix/formation-pipeline-20260911
