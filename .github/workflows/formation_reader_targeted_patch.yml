name: Formation Reader Targeted Patch

on:
  push:
    branches:
      - fix/formation-pipeline-20260911
    paths:
      - '.github/workflows/formation_reader_targeted_patch.yml'

permissions:
  contents: write

jobs:
  patch-reader:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/formation-pipeline-20260911
          fetch-depth: 0

      - name: Remove inverted Daily Reading submission gate only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app/bible/read.tsx')
          text = path.read_text(encoding='utf-8')
          marker = '/* DAILY_BIBLE_REFLECTION_SUBMISSION_GATE_V2 */'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('Daily Bible gate marker not found')
          end_token = 'setMarking(true);'
          end = text.find(end_token, start)
          if end < 0:
              raise SystemExit('marking boundary not found after Daily Bible gate')
          end += len(end_token)
          replacement = '''/* DAILY_READING_COMPLETION_INDEPENDENT_OF_SUBMISSION_V1 */
      // Reading completion is a lifecycle fact. Reflection/submission is validated
      // separately by the existing Daily Bible response and Formation approval flow.
      setMarking(true);'''
          updated = text[:start] + replacement + text[end:]
          if marker in updated or 'SUBMIT REFLECTION FIRST' in updated:
              raise SystemExit('Legacy inverted gate still present after targeted replacement')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Verify targeted diff
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "1"
          test "$(git diff --name-only)" = "src/app/bible/read.tsx"
          grep -q "DAILY_READING_COMPLETION_INDEPENDENT_OF_SUBMISSION_V1" src/app/bible/read.tsx
          ! grep -q "DAILY_BIBLE_REFLECTION_SUBMISSION_GATE_V2" src/app/bible/read.tsx
          ! grep -q "SUBMIT REFLECTION FIRST" src/app/bible/read.tsx
          grep -q "complete_bible_reading_session" src/app/bible/read.tsx

      - name: Commit targeted reader repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/bible/read.tsx
          git commit -m "fix(formation): decouple reading completion from submission"
          git push origin HEAD:fix/formation-pipeline-20260911
