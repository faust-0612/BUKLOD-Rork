name: BUKLOD R22-B Exact Scope Release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/r22b_exact_scope_release.yml'

concurrency:
  group: buklod-r22b-exact-scope-release
  cancel-in-progress: false

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  CI: '1'

permissions:
  contents: read

jobs:
  qa-web-android-ota:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify R22-B source and protected backend identity anchors
        shell: bash
        run: |
          test -f src/components/BuklodFormationEntryScopeTracker.tsx
          test -f src/app/scope/formation-approvals.tsx
          test -f supabase/migrations/20260907073000_context_scope_formation_approval_r22b.sql
          test -f supabase/migrations/20260907074000_context_scope_formation_approval_r22b_hardening.sql
          grep -F 'buklod_set_formation_entry_scope_v1' src/components/BuklodFormationEntryScopeTracker.tsx
          grep -F 'buklod_scope_formation_approval_queue_v2' src/app/scope/formation-approvals.tsx
          grep -F 'buklod_review_scope_formation_approval_v2' src/app/scope/formation-approvals.tsx
          grep -F 'buklod_scope_faith_monitoring_summary_v2' src/lib/buklodScopeFaithMonitoring.ts

      - name: TypeScript QA
        run: npx tsc --noEmit

      - name: Expo credential preflight
        run: |
          test -n "$EXPO_TOKEN"
          npx eas-cli@latest whoami --non-interactive

      - name: Export production web with EAS production environment
        shell: bash
        run: |
          npx eas-cli@latest env:exec production \
            'rm -rf dist && npx expo export --platform web --output-dir dist --clear && node scripts/inject-adsense-web-head.cjs dist' \
            --non-interactive

      - name: Verify production web bundle identity and R22-B
        shell: bash
        run: |
          test -f dist/index.html
          grep -R -aF 'yhanxndaqbmuzbdqlblu' dist/_expo/static/js/web >/dev/null
          grep -R -aF 'buklod_set_formation_entry_scope_v1' dist/_expo/static/js/web >/dev/null
          grep -R -aF 'buklod_scope_formation_approval_queue_v2' dist/_expo/static/js/web >/dev/null
          grep -R -aF 'buklod_review_scope_formation_approval_v2' dist/_expo/static/js/web >/dev/null
          grep -R -aF 'buklod_scope_faith_monitoring_summary_v2' dist/_expo/static/js/web >/dev/null

      - name: Deploy production web
        run: npx eas-cli@latest deploy --prod --non-interactive

      - name: Verify live web R22-B and Main backend
        shell: bash
        run: |
          node <<'NODE'
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          async function verify() {
            for (let attempt = 1; attempt <= 12; attempt++) {
              const html = await fetch('https://buklod.expo.app', { cache: 'no-store' }).then(r => {
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                return r.text();
              });
              const srcs = [...html.matchAll(/<script[^>]+src=["']([^"']+)["']/g)].map(m => m[1]);
              const bodies = [];
              for (const src of srcs) {
                const url = new URL(src, 'https://buklod.expo.app').href;
                try {
                  bodies.push(await fetch(url, { cache: 'no-store' }).then(r => r.ok ? r.text() : ''));
                } catch {}
              }
              const all = html + '\n' + bodies.join('\n');
              const ok = all.includes('yhanxndaqbmuzbdqlblu') &&
                all.includes('buklod_set_formation_entry_scope_v1') &&
                all.includes('buklod_scope_formation_approval_queue_v2') &&
                all.includes('buklod_review_scope_formation_approval_v2');
              if (ok) {
                console.log(`LIVE WEB R22-B VERIFIED on attempt ${attempt}`);
                return;
              }
              console.log(`Live verification attempt ${attempt} not yet propagated.`);
              await sleep(10000);
            }
            throw new Error('Live web did not expose R22-B anchors within verification window.');
          }
          verify().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Export Android JS bundle in production environment
        shell: bash
        run: |
          npx eas-cli@latest env:exec production \
            'rm -rf .buklod-r22b-android && npx expo export --platform android --output-dir .buklod-r22b-android --clear' \
            --non-interactive
          grep -R -aF 'yhanxndaqbmuzbdqlblu' .buklod-r22b-android >/dev/null
          grep -R -aF 'buklod_set_formation_entry_scope_v1' .buklod-r22b-android >/dev/null
          grep -R -aF 'buklod_scope_formation_approval_queue_v2' .buklod-r22b-android >/dev/null
          grep -R -aF 'buklod_review_scope_formation_approval_v2' .buklod-r22b-android >/dev/null

      - name: Publish production Android OTA to current APK
        shell: bash
        run: |
          npx eas-cli@latest update \
            --channel production \
            --platform android \
            --environment production \
            --message 'BUKLOD R22-B Exact Scope Formation Approval' \
            --non-interactive

      - name: Final release status
        run: |
          echo 'WEB: DEPLOYED + LIVE R22-B VERIFIED'
          echo 'ANDROID APK USERS: PRODUCTION OTA PUBLISHED'
          echo 'NATIVE APK REBUILD: NOT REQUIRED FOR THIS JS/DB PATCH'
