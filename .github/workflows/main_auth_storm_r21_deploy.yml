name: BUKLOD Main Auth Storm R21 + Concurrency R32 Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/main_auth_storm_r21_deploy.yml'
      - 'src/lib/buklodAuthResilience.ts'
      - 'src/lib/buklodR4RequestShield.ts'
      - 'src/lib/supabase.ts'

permissions:
  contents: read

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  EXPO_PUBLIC_APP_ENV: production

jobs:
  qa-web-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify auth + concurrency hardening markers
        shell: bash
        run: |
          grep -F 'BUKLOD_MAIN_AUTH_STORM_R21' 'src/lib/buklodAuthResilience.ts'
          grep -F 'passwordSignInInFlight' 'src/lib/buklodAuthResilience.ts'
          grep -F 'AUTH_FRESH_SIGN_IN_USER_TTL_MS' 'src/lib/buklodAuthResilience.ts'
          grep -F 'BUKLOD_MAIN_AUTH_STORM_R21' 'src/lib/supabase.ts'
          grep -F "Platform.OS !== 'web'" 'src/lib/supabase.ts'
          grep -F 'BUKLOD_MASS_CONCURRENCY_R32' 'src/lib/buklodR4RequestShield.ts'
          grep -F 'get_buklod_public_community_feed_v7_page' 'src/lib/buklodR4RequestShield.ts'
          grep -F 'get_buklod_post_media_v1' 'src/lib/buklodR4RequestShield.ts'
          grep -F 'buklod_my_permission_snapshot_v1' 'src/lib/buklodR4RequestShield.ts'

      - name: TypeScript QA
        run: npx tsc --noEmit

      - name: Expo credential preflight
        id: expo
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "R32 QA passed, but deploy is pending because EXPO_TOKEN is unavailable."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx eas-cli@latest whoami --non-interactive
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Export production web
        if: steps.expo.outputs.ready == 'true'
        shell: bash
        env:
          NODE_ENV: production
          EXPO_PUBLIC_APP_ENV: production
        run: npx expo export --platform web --output-dir dist

      - name: Deploy production web
        if: steps.expo.outputs.ready == 'true'
        shell: bash
        env:
          NODE_ENV: production
          EXPO_PUBLIC_APP_ENV: production
        run: npx eas-cli@latest deploy --prod --non-interactive

      - name: Publish production Android OTA
        if: steps.expo.outputs.ready == 'true'
        shell: bash
        run: |
          npx eas-cli@latest update \
            --channel production \
            --platform android \
            --environment production \
            --message "BUKLOD Main Concurrency R32" \
            --non-interactive

      - name: Deployment status
        shell: bash
        env:
          EXPO_READY: ${{ steps.expo.outputs.ready }}
        run: |
          if [ "$EXPO_READY" = "true" ]; then
            echo "BUKLOD Main R32 production web + Android OTA completed."
          else
            echo "BUKLOD Main R32 source QA passed; deployment is pending only because EXPO_TOKEN is unavailable."
          fi
