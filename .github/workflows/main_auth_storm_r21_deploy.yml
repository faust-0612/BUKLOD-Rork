name: BUKLOD Main Auth Storm R21 + Concurrency R32 QA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/main_auth_storm_r21_deploy.yml'
      - 'src/lib/buklodAuthResilience.ts'
      - 'src/lib/buklodR4RequestShield.ts'
      - 'src/lib/supabase.ts'

permissions:
  contents: read

jobs:
  verify-concurrency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify auth + concurrency hardening markers
        shell: bash
        run: |
          grep -F 'BUKLOD_MAIN_AUTH_STORM_R21' 'src/lib/buklodAuthResilience.ts'
          grep -F 'passwordSignInInFlight' 'src/lib/buklodAuthResilience.ts'
          grep -F 'AUTH_FRESH_SIGN_IN_USER_TTL_MS' 'src/lib/buklodAuthResilience.ts'
          grep -F 'BUKLOD_MAIN_AUTH_STORM_R21' 'src/lib/supabase.ts'
          grep -F "Platform.OS !== 'web'" 'src/lib/supabase.ts'
          grep -F 'BUKLOD_MASS_CONCURRENCY_R32' 'src/lib/buklodR4RequestShield.ts'
          grep -F 'get_buklod_public_community_feed_v7_page' 'src/lib/buklodR4RequestShield.ts'
          grep -F 'get_buklod_post_media_v1' 'src/lib/buklodR4RequestShield.ts'
          grep -F 'buklod_my_permission_snapshot_v1' 'src/lib/buklodR4RequestShield.ts'

      - name: TypeScript QA
        run: npx tsc --noEmit


      # Canonical Android production publisher is production_android_ota.yml.
      # This independent auth/concurrency contract never publishes a second OTA
      # or deploys a duplicate web bundle from the same main push.
