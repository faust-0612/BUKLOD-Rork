name: BUKLOD Empire — protected owner-signed DEV APK
on:
  push:
    branches:
      - dev/buklod-empire-standalone-native-20261124
    paths:
      - '.buklod/requests/buklod-empire-owner-signed-dev.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: buklod-empire-owner-signed-dev
  cancel-in-progress: false
jobs:
  native-empire:
    if: github.ref == 'refs/heads/dev/buklod-empire-standalone-native-20261124'
    environment: buklod-empire-dev
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BUKLOD_GENESIS_PREMIUM_3D: 'true'
      BUKLOD_EMPIRE_OTA_CHANNEL: dev
      BUKLOD_EMPIRE_OTA_PUBLIC_KEY: ${{ vars.BUKLOD_EMPIRE_OTA_PUBLIC_KEY }}
      BUKLOD_EMPIRE_APK_CERT_SHA256: ${{ vars.BUKLOD_EMPIRE_APK_CERT_SHA256 }}
      BUKLOD_EMPIRE_REQUIRE_RELEASE_SIGNING: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require durable trust and existing DEV storage before spending build credits
        env:
          KEYSTORE_B64: ${{ secrets.BUKLOD_EMPIRE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BUKLOD_EMPIRE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$BUKLOD_EMPIRE_OTA_PUBLIC_KEY"
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          [[ "$BUKLOD_EMPIRE_APK_CERT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          # The exact public signed canary and storage endpoint are verified against the built baseline before Gradle.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Source, engine and assets
        run: |
          set -euo pipefail
          node --test tests/buklod-empire-standalone-contract.test.mjs tests/buklod-empire-ota.test.mjs tests/buklod-empire-release-trust.test.mjs
          node scripts/genesis-import-verified-3d.mjs
          node scripts/build-buklod-empire-standalone.mjs
          mkdir -p /tmp/empire-godot
          curl -fLsS --retry 2 --connect-timeout 20 --max-time 240 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/empire-godot.zip
          unzip -q /tmp/empire-godot.zip -d /tmp/empire-godot
          GODOT="$(find /tmp/empire-godot -type f -name 'Godot_*linux.x86_64' -print -quit)"
          chmod +x "$GODOT"
          bash scripts/verify-buklod-empire-ota-godot.sh "$GODOT"
      - name: Verify signed canary on exact APK baseline before native build
        run: node scripts/verify-buklod-empire-public-canary.mjs
      - name: Owner-signed native APK — exact certificate and trust root
        env:
          KEYSTORE_B64: ${{ secrets.BUKLOD_EMPIRE_KEYSTORE_B64 }}
          BUKLOD_EMPIRE_KEYSTORE_PASSWORD: ${{ secrets.BUKLOD_EMPIRE_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export BUKLOD_EMPIRE_KEYSTORE_FILE="$RUNNER_TEMP/empire-owner.p12"
          trap 'rm -f "$BUKLOD_EMPIRE_KEYSTORE_FILE"' EXIT
          printf %s "$KEYSTORE_B64" | base64 -d > "$BUKLOD_EMPIRE_KEYSTORE_FILE"
          unset KEYSTORE_B64
          export BUKLOD_EMPIRE_KEY_ALIAS=empire
          export BUKLOD_EMPIRE_KEY_PASSWORD="$BUKLOD_EMPIRE_KEYSTORE_PASSWORD"
          gradle -p apps/buklod-empire :app:assembleRelease --no-daemon
          APK=apps/buklod-empire/app/build/outputs/apk/release/app-release.apk
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          TOOLS="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$TOOLS/apksigner" verify --print-certs "$APK" > build/buklod-empire/signing.txt
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' build/buklod-empire/signing.txt)"
          test "$actual" = "$BUKLOD_EMPIRE_APK_CERT_SHA256"
          "$TOOLS/aapt" dump badging "$APK" > build/buklod-empire/apk-badging.txt
          grep -F "package: name='org.mzbministry.buklod.empire'" build/buklod-empire/apk-badging.txt
          unzip -Z1 "$APK" > build/buklod-empire/apk-entries.txt
          grep -E '^lib/arm64-v8a/.*godot.*\.so$' build/buklod-empire/apk-entries.txt
          if grep -Ei 'assets/.*(private.*\.pem|\.p12|\.jks)$|assets/index.android.bundle|lib/[^/]+/libhermes.so' build/buklod-empire/apk-entries.txt; then exit 1; fi
          unzip -p "$APK" assets/empire-ota/config.json > /tmp/empire-public-config.json
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          import {createHash,createPublicKey} from 'node:crypto';
          import assert from 'node:assert/strict';
          const cfg=JSON.parse(readFileSync('/tmp/empire-public-config.json'));
          const receipt=JSON.parse(readFileSync('build/buklod-empire/ota-baseline.json'));
          assert.equal(cfg.channel,'dev');assert.equal(cfg.base,receipt.base);
          assert.equal(createHash('sha256').update(createPublicKey(cfg.key).export({type:'spki',format:'der'})).digest('hex'),receipt.keyFingerprint);
          assert.equal(createPublicKey(cfg.key).export({type:'spki',format:'der'}).toString('hex'),createPublicKey(process.env.BUKLOD_EMPIRE_OTA_PUBLIC_KEY).export({type:'spki',format:'der'}).toString('hex'));
          JS
          sha256sum "$APK" > build/buklod-empire/apk-sha256.txt
          stat -c %s "$APK" > build/buklod-empire/apk-bytes.txt
      - name: KVM and frame inspection
        run: |
          python3 -m pip install --disable-pip-version-check Pillow
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android gameplay verification
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/verify-buklod-empire-owner-android.sh
      - name: Owner-signed DEV candidate — remote OTA canary still required before this artifact; verified above
        uses: actions/upload-artifact@v4
        with:
          name: BUKLOD-Empire-owner-signed-DEV-candidate
          path: |
            apps/buklod-empire/app/build/outputs/apk/release/app-release.apk
            build/buklod-empire/content-receipt.json
            build/buklod-empire/ota-baseline.json
            build/buklod-empire/signing.txt
            build/buklod-empire/apk-sha256.txt
            build/buklod-empire/apk-badging.txt
            build/buklod-empire/apk-bytes.txt
            build/buklod-empire/android-qa/
            build/buklod-empire/remote-canary.json
            build/buklod-empire/remote-ota-qa/
          retention-days: 7
          if-no-files-found: error
