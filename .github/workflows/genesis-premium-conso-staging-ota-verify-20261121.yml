name: BUKLOD Premium Genesis Consolidated Staging OTA - Independent READ ONLY Verification
on:
  push:
    branches: [release/genesis-premium-conso-staging-ota-candidate-20261121]
    paths: [.github/workflows/genesis-premium-conso-staging-ota-verify-20261121.yml]
permissions:
  contents: read
concurrency:
  group: buklod-genesis-staging-ota-receipt-verification
  cancel-in-progress: false
jobs:
  verify-expo-staging-receipt:
    if: ${{ github.repository == 'faust-0612/BUKLOD-Rork' && github.ref == 'refs/heads/release/genesis-premium-conso-staging-ota-candidate-20261121' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_NO_TELEMETRY: '1'
      CI: '1'
      RELEASE_SHA: 0ad1ddb3d6c45972fe8074eb246379c009335b2a
      RELEASE_ID: 01a1fd0c-7b70-7f4f-a033-caf9c0e9e318
      RELEASE_GROUP: 5241d78b-e42d-4c25-b895-c8146c35e250
      RELEASE_RUNTIME: 2.0.0-genesis-preview
      RELEASE_CHANNEL: season2-genesis-preview
      PROD_CHANNEL_ID: 019feb59-2686-7665-89da-3c3f662ff782
      EAS_PROJECT_ID: 23dad7d0-389a-406e-8dec-08965dab85d8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify published source is immutable and no second publication is triggered
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$RELEASE_SHA" HEAD
          CHANGED="$(git diff --name-only "$RELEASE_SHA" HEAD)"
          test "$CHANGED" = ".github/workflows/genesis-premium-conso-staging-ota-verify-20261121.yml"
          test -n "${EXPO_TOKEN:-}" || { echo 'No read-only EAS credential'; exit 1; }
          node scripts/season2-premium-staging-ota-gate.mjs --source
          node scripts/season2-native-apk-source-parity.mjs
          test ! -e src/app/games/empire-arena.tsx
          echo "No EAS publish command is included in this read-only job."
      - name: Query Expo published group and the current staging/production channel state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/genesis-ota-verification
          npm ci --ignore-scripts --no-audit --no-fund
          npx --yes eas-cli@27.9.0 update:view "$RELEASE_GROUP" --json > /tmp/genesis-ota-verification/update.json
          npx --yes eas-cli@27.9.0 channel:view "$RELEASE_CHANNEL" --json --non-interactive > /tmp/genesis-ota-verification/staging.json
          npx --yes eas-cli@27.9.0 channel:view production --json --non-interactive > /tmp/genesis-ota-verification/production.json
      - name: Verify exact OTA source/runtime/group plus live EAS channel mappings
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const dir='/tmp/genesis-ota-verification';
          const read=n=>JSON.parse(fs.readFileSync(dir+'/'+n+'.json','utf8'));
          const updates=read('update');
          assert.ok(Array.isArray(updates)&&updates.length===1,'Expected one Android update from EAS group');
          const u=updates[0];
          assert.equal(u.id,process.env.RELEASE_ID);
          assert.equal(u.group,process.env.RELEASE_GROUP);
          assert.equal(u.gitCommitHash,process.env.RELEASE_SHA);
          assert.equal(u.runtimeVersion,process.env.RELEASE_RUNTIME);
          assert.equal(u.branch,process.env.RELEASE_CHANNEL);
          assert.equal(u.platform,'android');
          assert.equal(u.isRollBackToEmbedded,false);
          const channel=n=>{
            const raw=read(n),c=raw.currentPage??raw;
            const m=typeof c.branchMapping==='string'?JSON.parse(c.branchMapping):c.branchMapping;
            assert.equal(m?.data?.length,1,'EAS channel must have one stable branch mapping');
            const b=c.updateBranches?.find(x=>x.id===m.data[0].branchId);
            assert.ok(b?.id&&b?.name);
            return {c,b};
          };
          const stage=channel('staging'),prod=channel('production');
          assert.equal(stage.c.name,process.env.RELEASE_CHANNEL);
          assert.equal(stage.b.name,process.env.RELEASE_CHANNEL);
          assert.equal(prod.c.id,process.env.PROD_CHANNEL_ID);
          assert.equal(prod.c.name,'production');
          assert.equal(prod.b.name,'production');
          assert.notEqual(stage.b.id,prod.b.id,'Staging and production mapped to same branch');
          const byGroup=b=>b.updateGroups.flatMap(arr=>arr);
          const current=byGroup(stage.b);
          assert.ok(current.some(x=>x.id===u.id&&x.group===u.group&&x.gitCommitHash===u.gitCommitHash),
            'Exact published Android update missing from current staging channel');
          const liveProduction=byGroup(prod.b);
          assert.ok(liveProduction[0]?.group,'Production update branch must remain accessible');
          assert.notEqual(current[0]?.group,liveProduction[0]?.group);
          const summary={status:'VERIFIED_SERVER_SIDE_STAGING_OTA',source:u.gitCommitHash,
            updateId:u.id,groupId:u.group,createdAt:u.createdAt,runtime:u.runtimeVersion,
            platform:u.platform,channel:stage.c.name,package:'org.mzbministry.buklod.staging',
            mappedProductionBranchUnchanged:true,productionUpdateUnchanged:true,
            physicalDeviceAcceptance:'WAIVED_UNVERIFIED'};
          fs.writeFileSync(dir+'/verified.json',JSON.stringify(summary,null,2));
          console.log('EAS_SERVER_RECEIPT_VERIFIED',JSON.stringify(summary));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'### Genesis staging OTA verification\n\n'+
            'Exact EAS group: '+u.group+'\n\nRuntime: '+u.runtimeVersion+
            '\n\nProduction branch and latest update unchanged.\n\nNo second OTA sent.\n');
          NODE
      - name: Independently query the Expo Updates live Android manifest
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const url='https://u.expo.dev/'+process.env.EAS_PROJECT_ID;
          const response=await fetch(url,{headers:{
            'expo-platform':'android',
            'expo-runtime-version':process.env.RELEASE_RUNTIME,
            'expo-channel-name':process.env.RELEASE_CHANNEL,
            'expo-protocol-version':'1',
            accept:'multipart/mixed,application/expo+json,application/json',
            'cache-control':'no-cache'
          },signal:AbortSignal.timeout(30000)});
          assert.equal(response.status,200,'Expo update server did not provide the staged runtime');
          const body=await response.text();
          const ct=response.headers.get('content-type')??'';
          let m;
          if(ct.toLowerCase().includes('multipart/')){
            const boundary=/boundary="?([^";\s]+)/i.exec(ct)?.[1];
            assert.ok(boundary,'Missing multipart boundary');
            for(const part of body.split('--'+boundary)){
              const at=part.indexOf('\r\n\r\n');
              if(at<0)continue;
              try{
                const x=JSON.parse(part.slice(at+4).trim());
                if(x.id&&x.launchAsset){m=x;break;}
              }catch{}
            }
          }else m=JSON.parse(body);
          assert.ok(m?.launchAsset?.url,'Expo returned no JS launch asset');
          assert.equal(m.id,process.env.RELEASE_ID,'Live Expo manifest is not the published Genesis OTA');
          assert.equal(m.runtimeVersion,process.env.RELEASE_RUNTIME);
          assert.equal(m.extra?.expoClient?.android?.package,'org.mzbministry.buklod.staging');
          console.log('LIVE_EXPO_MANIFEST_VERIFIED',m.id,m.runtimeVersion);
          NODE
      - name: No deployment; retain only sanitized receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-premium-staging-ota-verified-receipt-${{ github.sha }}
          path: /tmp/genesis-ota-verification/verified.json
          if-no-files-found: ignore
          retention-days: 14
