name: BUKLOD Profile Organization Quick Card R24 Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/profile_org_quick_card_r24_fix.yml'

permissions:
  contents: read
  actions: write

jobs:
  verify-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify Profile Organization quick card
        shell: bash
        run: |
          grep -F "PATCH_ORG_PROFILE_QUICK_CARD_R24" 'src/app/(tabs)/me.tsx'
          grep -F "router.push('/organizations' as any);" 'src/app/(tabs)/me.tsx'
          if grep -A20 -F "const openUserOrganization" 'src/app/(tabs)/me.tsx' | grep -F "section: 'home'"; then
            echo 'Organization quick card still opens organization home.' >&2
            exit 1
          fi
          if grep -A20 -F "const openUserOrganization" 'src/app/(tabs)/me.tsx' | grep -F "enterScopedWorkspace"; then
            echo 'Organization quick card still auto-enters an organization scope.' >&2
            exit 1
          fi

      - name: Verify current desktop-shell compatibility anchor
        shell: bash
        run: |
          grep -F 'BUKLOD_DESKTOP_WEB_SHELL_R3' 'src/components/BuklodDesktopWebShell.tsx'
          grep -F 'BUKLOD_DESKTOP_FULL_SCREEN_R4' 'src/components/BuklodDesktopWebShell.tsx'

      - name: Dispatch production web
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run production_web_deploy.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Dispatch production Android OTA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run production_android_ota.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Summary
        run: |
          echo 'Verified Profile Organization quick card -> /organizations.'
          echo 'Verified latest main contains the desktop-shell compatibility anchors.'
          echo 'Production web and Android OTA workflows dispatched from latest main.'
