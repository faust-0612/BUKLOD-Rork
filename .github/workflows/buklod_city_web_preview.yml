name: BUKLOD City Web Preview

on:
  push:
    branches:
      - feature/buklod-city-home-web-r1-20260915
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-export:
    name: Expo web export only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated integration branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify native release files are not changed versus main
        shell: bash
        run: |
          git fetch origin main --depth=1
          CHANGED="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$CHANGED"
          FORBIDDEN='^(app\.json|app\.config\.|eas\.json|android/|ios/|package\.json|package-lock\.json|src/app/\(tabs\)/buklod\.tsx$)'
          if printf '%s\n' "$CHANGED" | grep -E "$FORBIDDEN"; then
            echo 'Forbidden native/release-sensitive file changed in web-only phase.' >&2
            exit 1
          fi

      - name: Export Expo web only
        env:
          CI: '1'
        run: npx expo export --platform web --output-dir dist-web

      - name: Verify web export exists
        shell: bash
        run: |
          test -f dist-web/index.html
          find dist-web -maxdepth 2 -type f | sort | head -80

      - name: Upload web export artifact
        uses: actions/upload-artifact@v4
        with:
          name: buklod-city-web-preview
          path: dist-web
          if-no-files-found: error
          retention-days: 7
