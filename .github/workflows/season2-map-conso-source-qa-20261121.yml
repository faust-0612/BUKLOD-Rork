name: "Season 2 map-first DEV source gates (NO OTA)"
on:
  pull_request:
    branches:
      - dev/season2-conso-reconciliation-hold-20261121
    paths:
      - 'tests/genesis-arena-auth-boundary-20261121.test.mjs'
      - 'src/app/games/empire-arena.tsx'
      - 'src/features/games/empire/**'
      - 'src/features/season2/genesis/GenesisKingdomPortal.tsx'
      - 'experiments/empire-arena-v2/**'
      - 'scripts/ingest-buklod-visual-baseline.mjs'
      - 'tests/empire-arena-v2-inapp-visual-baseline-20261121.test.mjs'
      - 'tests/kingdom-empire-arena-inapp-regression-20261121.test.mjs'
      - 'tests/empire-arena-v2-presentation-20261121.test.mjs'
      - 'src/app/buklod-map.tsx'
      - 'src/app/index.tsx'
      - 'src/app/_layout.tsx'
      - 'src/app/(tabs)/_layout.tsx'
      - 'src/components/BuklodNavSafeShell.tsx'
      - 'src/features/season2/genesis/**'
      - 'scripts/genesis-map-reconstruction-preflight.mjs'
      - 'tests/genesis-world-navigation-regression-20261121.test.mjs'
      - 'tests/season2-map-first-conso-intake-20261121.test.mjs'
      - 'tests/genesis-valley-asset-interaction-20261121.test.mjs'
      - 'tests/genesis-valley-audio-focus-20261121.test.mjs'
      - 'src/features/games/runtime/rorkAudio.ts'
      - 'assets/season2/genesis/world/**'
      - '.github/workflows/season2-map-conso-source-qa-20261121.yml'
  push:
    branches:
      - dev/season2-map-first-conso-intake-20261121
    paths:
      - 'tests/genesis-arena-auth-boundary-20261121.test.mjs'
      - 'src/app/games/empire-arena.tsx'
      - 'src/features/games/empire/**'
      - 'src/features/season2/genesis/GenesisKingdomPortal.tsx'
      - 'experiments/empire-arena-v2/**'
      - 'scripts/ingest-buklod-visual-baseline.mjs'
      - 'tests/empire-arena-v2-inapp-visual-baseline-20261121.test.mjs'
      - 'tests/kingdom-empire-arena-inapp-regression-20261121.test.mjs'
      - 'tests/empire-arena-v2-presentation-20261121.test.mjs'
      - 'src/app/buklod-map.tsx'
      - 'src/app/index.tsx'
      - 'src/app/_layout.tsx'
      - 'src/app/(tabs)/_layout.tsx'
      - 'src/components/BuklodNavSafeShell.tsx'
      - 'src/features/season2/genesis/**'
      - 'scripts/genesis-map-reconstruction-preflight.mjs'
      - 'tests/genesis-world-navigation-regression-20261121.test.mjs'
      - 'tests/season2-map-first-conso-intake-20261121.test.mjs'
      - '.github/workflows/season2-map-conso-source-qa-20261121.yml'
permissions:
  contents: read
jobs:
  source-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protected map/nav/ad/audio source preflight (not OTA verification)
        run: node scripts/genesis-map-reconstruction-preflight.mjs
      - name: Genesis preview and existing World regression checks
        run: node --test tests/season2-map-first-conso-intake-20261121.test.mjs tests/genesis-world-navigation-regression-20261121.test.mjs tests/genesis-valley-asset-interaction-20261121.test.mjs tests/genesis-valley-audio-focus-20261121.test.mjs
      - name: In-app offline Arena V2 deterministic source/logic acceptance (NO OTA)
        run: |
          node --check experiments/empire-arena-v2/arena-v2-engine.mjs
          node --test tests/empire-arena-v2-inapp-visual-baseline-20261121.test.mjs tests/kingdom-empire-arena-inapp-regression-20261121.test.mjs tests/empire-arena-v2-presentation-20261121.test.mjs tests/genesis-arena-auth-boundary-20261121.test.mjs
