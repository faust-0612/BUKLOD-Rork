name: BUKLOD Report Dashboard QA

on:
  push:
    branches:
      - work/buklod-report-dashboard-20260915

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout dashboard branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Expo web export
        run: npx expo export --platform web --output-dir dist-report-dashboard-qa
