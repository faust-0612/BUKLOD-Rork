name: BUKLOD Main V30 Production AAB
on:
  push:
    branches: [main]
    paths: ['.github/workflows/buklod-v30-aab-production-20261108.yml']
permissions:
  contents: read
concurrency:
  group: buklod-v30-main-aab
  cancel-in-progress: false
env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  APP_VARIANT: production
  EXPO_PUBLIC_APP_ENV: production
  BUKLOD_APP_TARGET: main
  EXPO_PUBLIC_STREAM_ANDROID_PUSH_PROVIDER_NAME: firebase-video-production
jobs:
  signed-v30-aab:
    if: github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'BUKLOD_V30_AAB_BUILD_20261108')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout exact main release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact production commit and EAS production AAB profile
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git merge-base --is-ancestor d67e805879e3398cbff8a4383c6c7e05039ed9f7 "$GITHUB_SHA" || { echo 'STOP: not built from verified live BUKLOD source'; exit 1; }
          git diff --exit-code
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const c = require('./app.config.js')({config:{}});
          const e = JSON.parse(fs.readFileSync('eas.json','utf8'));
          assert.equal(c.version,'1.3.6');
          assert.equal(c.android.versionCode,30);
          assert.equal(c.runtimeVersion, '1.3.2');
          assert.equal(c.android.package,'org.mzbministry.buklod');
          assert.equal(c.extra.eas.projectId,'23dad7d0-389a-406e-8dec-08965dab85d8');
          assert.equal(e.cli.appVersionSource,'local');
          assert.equal(e.build.production.channel,'production');
          assert.equal(e.build.production.android.buildType,'app-bundle');
          assert.notEqual(e.build.production.autoIncrement,true);
          assert.ok(c.android.blockedPermissions.includes('android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE'));
          assert.ok(!fs.readFileSync('plugins/withBuklodPttHardwareFoundation.js','utf8').includes("['android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE'"));
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Locked install and comprehensive V28/V30 runtime compatibility
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node --test tests/native-expo-config-compat.test.cjs tests/android-v29-runtime-compat-release-20261108.test.cjs tests/android-v30-runtime-compat-release-20261108.test.cjs
          npx tsc --noEmit
          node scripts/game-kingdom-release-contract.mjs
      - name: Validate released features from production source
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/admin-music-multiselect-motion-drawer-20261108.test.mjs tests/cluster-connect-notifications-points-20261108.test.mjs tests/wall-media-navigation-polish-20261108.test.mjs
          node --test tests/production-ota-ads-regression.test.mjs
      - name: Check EAS production credentials, production DB and AdMob
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          npx eas-cli@latest whoami --non-interactive >/dev/null
          npx eas-cli@latest env:pull --environment production --path .env.local --non-interactive
          test -s .env.local
          set -a
          . ./.env.local
          set +a
          test "$EXPO_PUBLIC_SUPABASE_URL" = 'https://yhanxndaqbmuzbdqlblu.supabase.co'
          test -n "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
          npx eas-cli@latest env:exec production 'node scripts/verify-production-ads-env.cjs'
          npx expo config --json > /tmp/v30-config.json
          node <<'NODE'
          const c = JSON.parse(require('node:fs').readFileSync('/tmp/v30-config.json','utf8'));
          const a = require('node:assert/strict');
          a.equal(c.android.versionCode,30);
          a.equal(c.version,'1.3.6');
          a.equal(c.runtimeVersion,'1.3.2');
          a.equal(c.android.package,'org.mzbministry.buklod');
          a.equal(c.extra?.eas?.projectId,'23dad7d0-389a-406e-8dec-08965dab85d8');
          a.equal(c.updates.url,'https://u.expo.dev/23dad7d0-389a-406e-8dec-08965dab85d8');
          NODE
      - name: EAS build signed Android App Bundle V30 only (no APK/OTA/Play submission)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          npx eas-cli@latest build --platform android --profile production --non-interactive --wait --json > eas-v30-aab.json
          test -s eas-v30-aab.json
      - name: Verify finished EAS AAB and release metadata
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const a = require('node:assert/strict');
          const fs = require('node:fs');
          const j = JSON.parse(fs.readFileSync('eas-v30-aab.json','utf8'));
          const b = Array.isArray(j)?j[0]:j;
          a.ok(b && typeof b==='object');
          a.equal(String(b.status).toLowerCase(),'finished');
          a.equal(String(b.platform).toLowerCase(),'android');
          if(b.appVersion!=null)a.equal(String(b.appVersion),'1.3.6');
          if(b.appBuildVersion!=null)a.equal(String(b.appBuildVersion),'30');
          if(b.gitCommitHash)a.equal(String(b.gitCommitHash).toLowerCase(),process.env.GITHUB_SHA.toLowerCase());
          const url=b.artifacts?.buildUrl||b.artifacts?.applicationArchiveUrl;
          a.ok(typeof url==='string' && url.startsWith('https://'));
          a.match(new URL(url).pathname,/\.aab$/i);
          const summary=[
            '# BUKLOD Main Android V30 AAB',
            '- Source commit: '+process.env.GITHUB_SHA,
            '- App version: 1.3.6',
            '- Play versionCode: 30',
            '- OTA runtime: 1.3.2',
            '- Channel: production',
            '- EAS build ID: '+b.id,
            '- AAB: '+url,
            '- Google Play submission: NOT performed',
            '- OTA/web publication: NOT performed',
          ].join('\n')+'\n';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,summary);
          console.log('VERIFIED BUKLOD V30 AAB BUILD_ID='+b.id);
          console.log('VERIFIED BUKLOD V30 AAB_URL='+url);
          NODE
      - name: Verify final signed AAB manifest excludes connectedDevice (not just config)
        shell: bash
        run: |
          set -euo pipefail
          AAB_URL="$(node -e "const j=require('./eas-v30-aab.json');const b=Array.isArray(j)?j[0]:j; process.stdout.write(b.artifacts?.buildUrl||b.artifacts?.applicationArchiveUrl||'')")"
          test -n "$AAB_URL"
          curl -fL --retry 2 --max-time 900 "$AAB_URL" -o /tmp/buklod-v30.aab
          test "$(stat -c '%s' /tmp/buklod-v30.aab)" -gt 1000000
          curl -fsSL --retry 2 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o /tmp/bundletool.jar
          java -jar /tmp/bundletool.jar dump manifest --bundle=/tmp/buklod-v30.aab --module=base > /tmp/buklod-v30-manifest.xml
          grep -q 'org.mzbministry.buklod' /tmp/buklod-v30-manifest.xml
          if grep -qi 'FOREGROUND_SERVICE_CONNECTED_DEVICE\|foregroundServiceType="[^"]*connectedDevice' /tmp/buklod-v30-manifest.xml; then
            echo 'BLOCKED: connectedDevice permission or service type still in final AAB' >&2
            exit 1
          fi
          grep -q 'FOREGROUND_SERVICE_MICROPHONE' /tmp/buklod-v30-manifest.xml
          grep -q 'FOREGROUND_SERVICE_CAMERA' /tmp/buklod-v30-manifest.xml
          echo 'PASS: verified final base manifest excludes connectedDevice foreground service while preserving camera and microphone calls'
      - name: Archive build metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buklod-v30-aab-${{ github.sha }}
          path: eas-v30-aab.json
          retention-days: 30
          if-no-files-found: ignore
