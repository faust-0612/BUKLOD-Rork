name: Genesis 207 DEV — actual Godot Android bootstrap gate
on:
  push:
    branches:
      - dev/genesis-207-native-bootstrap-recovery-20261124
    paths:
      - '.github/workflows/genesis-207-native-bootstrap-android-qa.yml'
      - 'godot/empire-arena/**'
      - 'modules/buklod-genesis-godot/**'
      - 'tests/android-godot-bootstrap/**'
      - 'scripts/genesis-207-android-bootstrap-qa.sh'
permissions:
  contents: read
concurrency:
  group: genesis-207-native-bootstrap-dev-qa
  cancel-in-progress: false
jobs:
  android-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Source gates and exact public game content
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/genesis-207-bootstrap-contract.test.mjs
          node --test tests/genesis-full-staging-godot-ota-native-206.test.mjs tests/genesis-unified-godot-native-contract-20261122.test.mjs
          node scripts/genesis-import-verified-3d.mjs
          ASSETS=tests/android-godot-bootstrap/app/src/main/assets
          mkdir -p "$ASSETS/godot"
          BUKLOD_GENESIS_PREMIUM_3D=false node scripts/build-empire-godot-pack.mjs --native-bootstrap --out="$ASSETS/godot/empire-arena.zip"
          BUKLOD_GENESIS_PREMIUM_3D=true node scripts/build-empire-godot-pack.mjs --out="$ASSETS/qa-content.zip"
          unzip -p "$ASSETS/godot/empire-arena.zip" project.godot | grep -F 'run/main_scene="res://scenes/NativeBootstrap.tscn"'
          unzip -p "$ASSETS/qa-content.zip" project.godot | grep -F 'run/main_scene="res://scenes/Arena.tscn"'
          if unzip -Z1 "$ASSETS/qa-content.zip" | grep -E '^(scripts/native_bootstrap.gd|scenes/NativeBootstrap.tscn)$'; then echo 'Trusted bootstrap leaked into OTA'; exit 1; fi
          unzip -t "$ASSETS/qa-content.zip" | tail -2
          cp modules/buklod-genesis-godot/android/src/main/java/expo/modules/buklodgenesisgodot/GenesisGodotActivity.java tests/android-godot-bootstrap/app/src/main/java/expo/modules/buklodgenesisgodot/
          echo 'No production data, Expo, signing secrets, or full application build'
      - name: Compile isolated release AAR test host
        run: gradle -p tests/android-godot-bootstrap :app:assembleRelease --no-daemon
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual Android render — embedded, downloaded, all worlds, repeat and rejection
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/genesis-207-android-bootstrap-qa.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genesis-207-android-scene-receipts
          path: build/genesis-207-android-qa/
          if-no-files-found: ignore
          retention-days: 7
  application-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Full application source, protected ads and navigation
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node --experimental-strip-types --test \
            tests/genesis-207-bootstrap-contract.test.mjs \
            tests/genesis-premium-world-content-ota-20261123.test.mjs \
            tests/genesis-206-3d-import.test.mjs \
            tests/genesis-full-staging-godot-ota-native-206.test.mjs \
            tests/buklod-ads-appwide-permanent-lock-20261111.test.mjs \
            tests/ad-dashboard-focus-performance-20261116.test.mjs \
            tests/dashboard-ad-navigation-prewarm-20261116.test.mjs \
            tests/genesis-206-staging-points-readonly-20261124.test.mjs
          npm run release:gate
          npm run genesis:theme:gate
          npx tsc --noEmit
