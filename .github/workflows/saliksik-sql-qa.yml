name: SALIKSIK Isolated Postgres Reward QA
on:
  pull_request:
    paths:
      - "supabase/migrations/20261112221000_saliksik_private_vault_objective_mastery_r1.sql"
      - "supabase/migrations/20261113221000_saliksik_written_master_reward_r2.sql"
      - "supabase/migrations/20261124035000_saliksik_complete_manuscript_unlock_r3.sql"
      - "supabase/migrations/20261124051000_saliksik_r4_auto_research_corpus.sql"
      - "supabase/migrations/20261124052000_saliksik_r4_independent_master_grade.sql"
      - "supabase/functions/saliksik-auto-v1/**"
      - "src/components/BuklodSaliksikResearchLab.tsx"
      - "tests/saliksik-auto-research-e2e-20261124.test.mjs"
      - "tests/saliksik-cluster-faith-auto-research-20261124.test.mjs"
      - "tests/fixtures/saliksik_r4_auto_pg_integration.sql"
      - "supabase/functions/saliksik-manuscript-v1/**"
      - "supabase/tests/saliksik_written_master_r2.sql"
      - "supabase/tests/saliksik_complete_manuscript_unlock_r3.sql"
      - "tests/saliksik-manuscript-unlock-20261124.test.mjs"
      - "tests/saliksik-cluster-faith-manuscript-20261124.test.mjs"
      - "src/lib/saliksikClient.ts"
      - "src/app/scope/saliksik.tsx"
      - "src/app/admin/saliksik-library.tsx"
      - "supabase/tests/saliksik_private_vault_objective_mastery_r1.sql"
      - "tests/fixtures/saliksik_pg_*.sql"
      - ".github/workflows/saliksik-sql-qa.yml"
  workflow_dispatch:
jobs:
  postgres-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: saliksik_qa
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: saliksik_qa
    steps:
      - uses: actions/checkout@v4
      - name: Verify member download source contracts
        run: node --test tests/saliksik-manuscript-unlock-20261124.test.mjs tests/saliksik-cluster-faith-manuscript-20261124.test.mjs tests/saliksik-auto-research-e2e-20261124.test.mjs tests/saliksik-cluster-faith-auto-research-20261124.test.mjs
      - name: Seed isolated BUKLOD contract
        run: psql -v ON_ERROR_STOP=1 -f tests/fixtures/saliksik_pg_seed.sql
      - name: Apply unchanged SALIKSIK release migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261112221000_saliksik_private_vault_objective_mastery_r1.sql
      - name: Verify private access, rollout off and schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/saliksik_private_vault_objective_mastery_r1.sql
      - name: Apply auditable written Master R2 migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261113221000_saliksik_written_master_reward_r2.sql
      - name: Verify written Master schema, rewards and rollout guards
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/saliksik_written_master_r2.sql
      - name: Execute real Postgres admin/member/ledger workflow
        run: psql -v ON_ERROR_STOP=1 -f tests/fixtures/saliksik_pg_integration.sql
      - name: Apply completion-gated manuscript unlock migration R3
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261124035000_saliksik_complete_manuscript_unlock_r3.sql
      - name: Test member entitlement, rights gates, original privacy and no changed Points
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/saliksik_complete_manuscript_unlock_r3.sql
      - name: Apply R4 canonical corpus research migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261124051000_saliksik_r4_auto_research_corpus.sql
      - name: Apply R4 independent written Master / academic evidence migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261124052000_saliksik_r4_independent_master_grade.sql
      - name: Run member-to-research-to-automatic-Master-to-manuscript E2E
        run: psql -v ON_ERROR_STOP=1 -f tests/fixtures/saliksik_r4_auto_pg_integration.sql
