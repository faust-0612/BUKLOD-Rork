name: BUKLOD V28 runtime132 fast RC SQL gate
on:
  push:
    branches: [audit/v28-runtime132-gate-fast-20261022]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: fixture-only }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - name: Runtime and TypeScript
        run: |
          grep -F "runtimeVersion: isClassroom ? '1.3.0' : '1.3.2'" app.config.js
          npx --no-install tsc --noEmit
      - name: Privacy and filtered pagination SQL
        env: { PGPASSWORD: fixture-only }
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f scripts/sql/buklod_marites_feed_fixture.sql
      - name: Protected native-independent contracts
        run: |
          npm run character:contract
          npm run game:contract
          node --test __tests__/buklodActionFeedbackContract.test.js
