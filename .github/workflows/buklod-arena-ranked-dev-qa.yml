name: BUKLOD Arena Ranked — Isolated Security QA
on:
  pull_request:
    paths:
      - 'supabase/changesets/arena_v2_ranked_private_schema_DEV_ONLY.sql'
      - 'tests/sql/arena_ranked_*'
      - 'services/empire-arena/**'
      - '.github/workflows/buklod-arena-ranked-dev-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authoritative-server-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated pinned Arena server dependencies
        run: npm ci --prefix services/empire-arena --ignore-scripts --no-audit --no-fund
      - name: Test real WebSocket handshake, ranked seat binding, anti-replay and session recovery
        run: node --test services/empire-arena/tests/core.test.mjs services/empire-arena/tests/gateway.test.mjs tests/empire-arena-v2-ranked-reconnect-20261121.test.mjs
  isolated-postgres-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-only
          POSTGRES_DB: arena_isolated
        options: >-
          --health-cmd "pg_isready -U postgres -d arena_isolated"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: disposable-only
      PGDATABASE: arena_isolated
    steps:
      - uses: actions/checkout@v4
      - name: Run REAL disposable PostgreSQL RLS and ledger tests
        run: |
          command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
          psql -v ON_ERROR_STOP=1 -f tests/sql/arena_ranked_disposable_setup.sql
          psql -v ON_ERROR_STOP=1 -f supabase/changesets/arena_v2_ranked_private_schema_DEV_ONLY.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/arena_ranked_private_integrity.sql
          echo "Isolated PostgreSQL checks passed. NO BUKLOD production or staging SQL was applied."
