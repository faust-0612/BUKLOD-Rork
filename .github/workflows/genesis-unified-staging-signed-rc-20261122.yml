name: BUKLOD Unified Genesis SIGNED Staging RC (MANUAL / FAIL CLOSED / NO OTA)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: buklod-unified-genesis-signed-rc-only
  cancel-in-progress: false
jobs:
  guarded-signed-staging:
    if: ${{ github.repository == 'faust-0612/BUKLOD-Rork' && github.ref == 'refs/heads/integration/genesis-unified-godot-native-staging-20261122' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      APP_VARIANT: staging
      EXPO_PUBLIC_APP_ENV: staging
      BUKLOD_APP_TARGET: main
      EXPO_PUBLIC_BUKLOD_SEASON2_GENESIS_PREVIEW: 'true'
      EXPO_PUBLIC_BUKLOD_ARENA_GODOT_ENABLED: 'true'
      EXPO_PUBLIC_BUKLOD_GENESIS_GODOT_WORLDS: 'true'
      EXPO_PUBLIC_BUKLOD_SOS_NATIVE_R3: 'true'
      EXPO_PUBLIC_BUKLOD_ARENA_RANKED_ENABLED: 'false'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      STAGING_FIREBASE_JSON_B64: ${{ secrets.STAGING_FIREBASE_JSON_B64 }}
      STAGING_SIGNING_CERT_SHA256: ${{ secrets.STAGING_SIGNING_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Preflight BEFORE paid EAS build; abort on incomplete game or unisolated backend
        shell: bash
        run: |
          set -euo pipefail
          node scripts/genesis-unified-signed-stage-preflight.mjs --signed
          [[ "${STAGING_SIGNING_CERT_SHA256:-}" =~ ^[a-fA-F0-9]{64}$ ]] || { echo 'BLOCK: no pinned existing EAS staging APK signing certificate'; exit 1; }
          printf '%s' "$STAGING_FIREBASE_JSON_B64" | base64 -d > google-services.staging.json
          node <<'NODE'
          const a=require('node:assert/strict');
          const c=require('./google-services.staging.json');
          a.equal(c.client.filter(x=>x.client_info?.android_client_info?.package_name==='org.mzbministry.buklod.staging').length,1);
          NODE
      - name: Install audited Expo native dependencies and exact source test
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/genesis-prepare-skia-binaries.mjs
          node --test tests/genesis-unified-godot-native-contract-20261122.test.mjs tests/genesis-unified-production-runtime-isolation-20261122.test.mjs
          npx tsc --noEmit
      - name: Inject isolated public staging config into runner-only EAS build profile
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs'),a=require('node:assert/strict');
          const p='eas.json',data=JSON.parse(fs.readFileSync(p,'utf8'));
          const stage=data.build['season2-genesis-unified-worlds-staging'];
          a.equal(stage.env.EXPO_PUBLIC_SUPABASE_URL,undefined);
          stage.env.EXPO_PUBLIC_SUPABASE_URL=process.env.STAGING_SUPABASE_URL;
          stage.env.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=process.env.STAGING_SUPABASE_PUBLISHABLE_KEY;
          data.cli.appVersionSource='remote';
          fs.writeFileSync(p,JSON.stringify(data,null,2)+'\n');
          console.log('Isolated staging public configuration injected for remote build only.');
          NODE
      - name: EAS signed APK — same registered staging package, distinct 2.0.3 runtime
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@27.9.0 whoami --non-interactive > /dev/null
          npx --yes eas-cli@27.9.0 build --platform android --profile season2-genesis-unified-worlds-staging --non-interactive --wait --json > /tmp/buklod-unified-eas-signed.json
          node <<'NODE'
          const a=require('node:assert/strict'),fs=require('node:fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/buklod-unified-eas-signed.json','utf8'));
          const b=Array.isArray(raw)?raw[0]:raw;
          a.equal(String(b.status).toLowerCase(),'finished');
          a.equal(String(b.platform).toLowerCase(),'android');
          a.match(String(b.artifacts?.buildUrl||b.artifacts?.applicationArchiveUrl||''),/^https:\/\//);
          a.equal(b.gitCommitHash,process.env.GITHUB_SHA,'EAS source differs from signed RC');
          a.equal(b.runtime?.version,'2.0.3-genesis-unified-godot','EAS built wrong native runtime');
          a.equal(b.updateChannel?.name,'season2-genesis-unified-preview','EAS built wrong OTA channel');
          fs.writeFileSync('buklod-genesis-unified-eas-build-receipt.json',JSON.stringify({
            sourceSha:process.env.GITHUB_SHA,buildSourceSha:b.gitCommitHash,buildRuntime:b.runtime.version,
            buildProfile:'season2-genesis-unified-worlds-staging',
            buildId:b.id,status:b.status,package:'org.mzbministry.buklod.staging',
            runtime:'2.0.3-genesis-unified-godot',channel:'season2-genesis-unified-preview',
            artifactUrl:b.artifacts?.buildUrl||b.artifacts?.applicationArchiveUrl,
            deviceQA:'PENDING',otaPublished:false,
            productionChanged:false,
          },null,2));
          NODE
      - name: Verify actual EAS-signed APK, Godot resources and signing continuity
        shell: bash
        run: |
          set -euo pipefail
          node scripts/genesis-unified-verify-signed-apk.mjs \
            --receipt=buklod-genesis-unified-eas-build-receipt.json \
            --output=buklod-genesis-unified-verified-apk.json
          test -s buklod-genesis-unified-verified-apk.json
      - name: Retain verified binary receipt only, do not publish OTA or production
        uses: actions/upload-artifact@v4
        with:
          name: buklod-genesis-unified-signed-staging-receipt
          path: buklod-genesis-unified-verified-apk.json
          if-no-files-found: error
          retention-days: 14
