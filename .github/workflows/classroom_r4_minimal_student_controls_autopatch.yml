name: BUKLOD Classroom R4 Minimal Student Controls Autopatch

on:
  push:
    branches:
      - feature/classroom-harmonized-r4-current-main-20260908
    paths:
      - 'scripts/patch-classroom-r4-minimal-student-controls.cjs'
      - '.github/workflows/classroom_r4_minimal_student_controls_autopatch.yml'

permissions:
  contents: write

jobs:
  guarded-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: feature/classroom-harmonized-r4-current-main-20260908
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply guarded Classroom-only patch
        run: node scripts/patch-classroom-r4-minimal-student-controls.cjs

      - name: Diff safety gate
        shell: bash
        run: |
          git diff --check
          test -n "$(git status --porcelain -- src/components/classroom/ClassroomLiveView.native.tsx)"
          test -z "$(git status --porcelain -- . ':(exclude)src/components/classroom/ClassroomLiveView.native.tsx')"
          git diff -- src/components/classroom/ClassroomLiveView.native.tsx

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript gate before commit
        run: npx tsc --noEmit

      - name: Commit guarded patch
        shell: bash
        run: |
          git config user.name "BUKLOD Classroom Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/classroom/ClassroomLiveView.native.tsx
          git commit -m "classroom: add minimal student safety controls"
          git push origin HEAD:feature/classroom-harmonized-r4-current-main-20260908
