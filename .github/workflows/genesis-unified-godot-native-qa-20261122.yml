name: BUKLOD Genesis Unified Godot Native Source/Android QA (NO OTA / PROD)
on:
  push:
    branches:
      - integration/genesis-unified-godot-native-staging-20261122
    paths:
      - .github/workflows/genesis-unified-godot-native-qa-20261122.yml
permissions:
  contents: read
concurrency:
  group: buklod-genesis-unified-godot-dev-20261122
  cancel-in-progress: false
jobs:
  unified-godot-android-compile:
    if: ${{ github.repository == 'faust-0612/BUKLOD-Rork' && github.ref == 'refs/heads/integration/genesis-unified-godot-native-staging-20261122' && startsWith(github.event.head_commit.message, 'BUKLOD_UNIFIED_GODOT_QA:') }}
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      APP_VARIANT: staging
      EXPO_PUBLIC_APP_ENV: staging
      BUKLOD_APP_TARGET: main
      EXPO_PUBLIC_BUKLOD_SEASON2_GENESIS_PREVIEW: 'true'
      EXPO_PUBLIC_BUKLOD_ARENA_GODOT_ENABLED: 'true'
      EXPO_PUBLIC_BUKLOD_GENESIS_GODOT_WORLDS: 'true'
      EXPO_PUBLIC_BUKLOD_SOS_NATIVE_R3: 'true'
      EXPO_PUBLIC_BUKLOD_ARENA_EXPERIMENTAL: 'true'
      EXPO_PUBLIC_BUKLOD_ARENA_RANKED_ENABLED: 'false'
      EXPO_PUBLIC_SUPABASE_URL: https://genesis-unified-offline.invalid
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_OFFLINE_UNIFIED_NOT_REAL
      EXPO_PUBLIC_STREAM_ANDROID_PUSH_PROVIDER_NAME: firebase-video-staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Ensure exact staging-only identity and test AdMob without live account access
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const a=require('./app.config.js')({config:{extra:{}}});
          assert.equal(a.android.package,'org.mzbministry.buklod.staging');
          assert.equal(a.runtimeVersion,'2.0.3-genesis-unified-godot');
          assert.equal(a.version,'2.0.3');
          assert.equal(a.plugins.find(p=>Array.isArray(p)&&p[0]==='react-native-google-mobile-ads')[1].androidAppId,'ca-app-pub-3940256099942544~3347511713');
          assert.equal(process.env.EXPO_PUBLIC_SUPABASE_URL,'https://genesis-unified-offline.invalid');
          assert.equal(process.env.EXPO_PUBLIC_BUKLOD_ARENA_RANKED_ENABLED,'false');
          assert.ok(a.plugins.includes('./plugins/withBuklodGodotArenaPack.js'));
          const fb=JSON.parse(fs.readFileSync('google-services.production.json','utf8'));
          fb.client=(fb.client||[]).filter(c=>c.client_info?.android_client_info?.package_name===a.android.package);
          assert.equal(fb.client.length,1,'No registered staging Firebase client');
          fs.writeFileSync('google-services.staging.json',JSON.stringify(fb));
          NODE
      - name: Source, ranked safety, existing arena/ads and new native-world regression gates
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/genesis-unified-godot-native-contract-20261122.test.mjs tests/arena-godot-native-migration-20261122.test.mjs tests/arena-full-functionality-audit-20261121.test.mjs tests/empire-arena-v2-presentation-20261121.test.mjs
          node --test tests/dashboard-ad-navigation-prewarm-20261116.test.mjs tests/ad-dashboard-focus-performance-20261116.test.mjs
          npx tsc --noEmit
      - name: Build deterministic packed world with original approved artwork and sound
        run: |
          set -euo pipefail
          node scripts/build-empire-godot-pack.mjs --out=/tmp/buklod-unified-godot.zip
          unzip -t /tmp/buklod-unified-godot.zip | tail -2
          mkdir -p /tmp/buklod-unified-project
          unzip -q /tmp/buklod-unified-godot.zip -d /tmp/buklod-unified-project
          for name in kingdom community house; do
            test -s "/tmp/buklod-unified-project/world-art/${name}.webp"
          done
      - name: Real Godot 4.7.2 GDScript parse, gameplay, art and world-media tests
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 --connect-timeout 20 --max-time 240 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot-4.7.2.zip
          mkdir -p /tmp/godotbin
          unzip -q /tmp/godot-4.7.2.zip -d /tmp/godotbin
          GODOT=$(find /tmp/godotbin -type f -name 'Godot_*linux.x86_64' -print -quit)
          test -n "$GODOT"
          chmod +x "$GODOT"
          "$GODOT" --headless --path /tmp/buklod-unified-project --editor --quit 2>&1 | tee /tmp/godot-parse.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|Failed to load script' /tmp/godot-parse.log; then exit 1; fi
          for spec in smoke art_smoke world_smoke; do
            "$GODOT" --headless --path /tmp/buklod-unified-project --script "res://tests/${spec}.gd" > "/tmp/godot-${spec}.log" 2>&1 || { cat "/tmp/godot-${spec}.log"; exit 1; }
            cat "/tmp/godot-${spec}.log" | tail -8
          done
          grep -F BUKLOD_GODOT_SMOKE_PASS /tmp/godot-smoke.log
          grep -F BUKLOD_GODOT_ART_PASS /tmp/godot-art_smoke.log
          grep -F BUKLOD_GENESIS_GODOT_WORLDS_PASS /tmp/godot-world_smoke.log
      - name: Compile same Expo MAIN app with four Godot native scenes (arm64 debug ONLY)
        run: |
          set -euo pipefail
          node scripts/genesis-prepare-skia-binaries.mjs
          node scripts/genesis-assert-native-autolinking.mjs
          npx expo prebuild --platform android --clean --no-install
          cmp /tmp/buklod-unified-godot.zip android/app/src/main/assets/godot/empire-arena.zip
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a
      - name: Verify APK signature/identity, native engine and exact bundled audio/world assets
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -Z -1 "$APK" | grep -E '^lib/arm64-v8a/.*godot.*\.so$'
          unzip -p "$APK" assets/godot/empire-arena.zip > /tmp/from-unified-apk.zip
          cmp /tmp/buklod-unified-godot.zip /tmp/from-unified-apk.zip
          BT=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/aapt" dump badging "$APK" | grep "package: name='org.mzbministry.buklod.staging'"
          sha256sum "$APK" > godot-unified-apk-sha256.txt
          node -e 'require("fs").writeFileSync("godot-unified-receipt.json",JSON.stringify({sourceSha:process.env.GITHUB_SHA,runtime:"2.0.3-genesis-unified-godot",package:"org.mzbministry.buklod.staging",engine:"4.7.2",worlds:["arena","kingdom","community","house"],functionalBackend:false,productionUnchanged:true,deviceTested:false,releaseReady:false,otaPublished:false},null,2))'
      - name: Keep offline non-EAS artifact for native engineering verification only
        uses: actions/upload-artifact@v4
        with:
          name: buklod-unified-godot-native-offline-arm64-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            godot-unified-apk-sha256.txt
            godot-unified-receipt.json
          if-no-files-found: error
          retention-days: 7
