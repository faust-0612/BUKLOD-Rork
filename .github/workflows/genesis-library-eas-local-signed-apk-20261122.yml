name: BUKLOD MAIN Genesis 2.0.4 Local EAS Signed Staging APK
on:
  push:
    branches:
      - dev/genesis-unified-arena-library-apk-20261122
    paths:
      - '.github/workflows/genesis-library-eas-local-signed-apk-20261122.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: buklod-genesis-local-eas-signing-20261122
  cancel-in-progress: false
jobs:
  local-eas-signed:
    if: github.repository == 'faust-0612/BUKLOD-Rork' && startsWith(github.event.head_commit.message, 'BUKLOD_GENESIS_2_0_4_LOCAL_SIGNED_BUILD:')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      APP_VARIANT: staging
      EXPO_PUBLIC_APP_ENV: staging
      BUKLOD_APP_TARGET: main
      EXPO_PUBLIC_BUKLOD_SEASON2_GENESIS_PREVIEW: 'true'
      EXPO_PUBLIC_BUKLOD_SOS_NATIVE_R3: 'true'
      EXPO_PUBLIC_BUKLOD_ARENA_GODOT_ENABLED: 'true'
      EXPO_PUBLIC_BUKLOD_GENESIS_GODOT_WORLDS: 'true'
      EXPO_PUBLIC_BUKLOD_ARENA_LIBRARY_BUNDLE: 'true'
      EXPO_PUBLIC_BUKLOD_ARENA_EXPERIMENTAL: 'true'
      EXPO_PUBLIC_BUKLOD_ARENA_RANKED_ENABLED: 'false'
      EXPO_PUBLIC_BUKLOD_GENESIS_SHARED_BACKEND_REVIEW: 'true'
      EXPO_PUBLIC_STREAM_ANDROID_PUSH_PROVIDER_NAME: firebase-video-staging
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      NATIVE_PROOF_SHA: ab54ae08cd4bc27abcae2fe6bb9679466d05a9f0
      NATIVE_PROOF_RUN: '44995660935'
      SIGNED_APK: /tmp/buklod-genesis-2.0.4-local-eas-signed.apk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Require same native sources and previously successful embedded Godot compile
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          git diff --quiet "$NATIVE_PROOF_SHA" HEAD -- app.config.js eas.json godot/empire-arena scripts/build-empire-godot-pack.mjs scripts/arena-library-audio-pack.mjs modules/buklod-genesis-godot plugins/withBuklodGodotArenaPack.js
          node <<'NODE'
          const a=require('node:assert/strict');
          (async()=>{
            const url='https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+process.env.NATIVE_PROOF_RUN;
            const r=await fetch(url,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','User-Agent':'buklod-local-signing-verification'}});
            a.equal(r.status,200);
            const j=await r.json();
            a.equal(j.head_sha,process.env.NATIVE_PROOF_SHA);
            a.equal(j.status,'completed');
            a.equal(j.conclusion,'success');
            console.log('EXACT_NATIVE_PROOF_PASS',j.id);
          })().catch(e=>{console.error('NATIVE_PROOF_BLOCK',e.message);process.exitCode=1});
          NODE
      - name: Locked native and AdMob/tab navigation regression checks
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/genesis-prepare-skia-binaries.mjs
          node scripts/genesis-assert-native-autolinking.mjs
          node --test tests/genesis-library-native-runtime-release-20261122.test.mjs tests/arena-library-godot-native-20261122.test.mjs tests/arena-library-modes-audio-20261122.test.mjs tests/dashboard-ad-navigation-prewarm-20261116.test.mjs tests/ad-dashboard-focus-performance-20261116.test.mjs
          npm run release:gate
          npm run genesis:theme:gate
          npx tsc --noEmit
      - name: Runner-only staging account credentials, original keystore and installable versionCode
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs'),a=require('node:assert/strict');
          const file='eas.json',e=JSON.parse(fs.readFileSync(file,'utf8'));
          const p=e.build['season2-genesis-library-staging'];
          a.equal(p.extends,'season2-genesis-unified-worlds-staging');
          a.equal(p.channel,'season2-genesis-library-preview');
          a.equal(p.android.buildType,'apk');
          a.equal(p.env.EXPO_PUBLIC_BUKLOD_ARENA_RANKED_ENABLED,'false');
          a.equal(p.env.EXPO_PUBLIC_SUPABASE_URL,undefined);
          const existing=e.build['season2-genesis-preview'].env;
          a.equal(existing.EXPO_PUBLIC_SUPABASE_URL,'https://yhanxndaqbmuzbdqlblu.supabase.co');
          a.match(existing.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY,/^sb_publishable_[a-zA-Z0-9_-]+$/);
          p.env.EXPO_PUBLIC_SUPABASE_URL=existing.EXPO_PUBLIC_SUPABASE_URL;
          p.env.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=existing.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY;
          p.env.EXPO_PUBLIC_BUKLOD_GENESIS_SHARED_BACKEND_REVIEW='true';
          p.env.EXPO_PUBLIC_BUKLOD_ARENA_RANKED_ENABLED='false';
          p.android.credentialsSource='remote';
          p.autoIncrement=false;
          e.cli.appVersionSource='local';
          fs.writeFileSync(file,JSON.stringify(e,null,2)+'\n');
          const filename='app.config.js',source=fs.readFileSync(filename,'utf8');
          const from='versionCode: isStaging ? undefined : (isClassroom ? 28 : 30),';
          a.equal(source.split(from).length,2,'Version code source anchor changed');
          fs.writeFileSync(filename,source.replace(from,
            'versionCode: isStaging ? (libraryArenaNativePreview ? 16 : undefined) : (isClassroom ? 28 : 30),'));
          const cfg=require('./app.config.js')({config:{}});
          a.equal(cfg.android.package,'org.mzbministry.buklod.staging');
          a.equal(cfg.runtimeVersion,'2.0.4-genesis-library-godot');
          a.equal(cfg.version,'2.0.4');
          a.equal(cfg.android.versionCode,16);
          a.equal(cfg.extra.appTarget,'main');
          a.equal(cfg.plugins.find(p=>Array.isArray(p)&&p[0]==='react-native-google-mobile-ads')[1].androidAppId,'ca-app-pub-3940256099942544~3347511713');
          a.equal(e.build.production.channel,'production');
          const google=JSON.parse(fs.readFileSync('google-services.production.json','utf8'));
          google.client=google.client.filter(x=>x.client_info?.android_client_info?.package_name==='org.mzbministry.buklod.staging');
          a.equal(google.client.length,1);
          fs.writeFileSync('google-services.staging.json',JSON.stringify(google));
          console.log('STAGING_LOCAL_SIGNATURE_SOURCE_PASS: remote managed keystore, local versionCode16, unchanged production');
          NODE
      - name: Locally compile and EAS-sign complete Android APK WITHOUT cloud build credits
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@27.9.0 whoami --non-interactive >/dev/null
          npx --yes eas-cli@27.9.0 build --platform android --profile season2-genesis-library-staging --local --non-interactive --output="$SIGNED_APK"
          test -s "$SIGNED_APK"
      - name: Verify original EAS certificate, versionCode, four worlds and APK provenance
        shell: bash
        run: |
          set -euo pipefail
          node scripts/genesis-library-verify-local-signed-apk.mjs --apk="$SIGNED_APK" --output=buklod-genesis-2.0.4-local-signed-receipt.json
          sha256sum "$SIGNED_APK" > buklod-genesis-2.0.4-signed-apk.sha256
          echo 'LOCAL SIGNED APK ACCEPTANCE PASS; not auto-published or device-verified.'
      - name: Upload install candidate and verification receipt without Play/OTA publication
        uses: actions/upload-artifact@v4
        with:
          name: buklod-genesis-2.0.4-eas-local-signed-staging-apk
          path: |
            /tmp/buklod-genesis-2.0.4-local-eas-signed.apk
            buklod-genesis-2.0.4-signed-apk.sha256
            buklod-genesis-2.0.4-local-signed-receipt.json
          if-no-files-found: error
          retention-days: 14
