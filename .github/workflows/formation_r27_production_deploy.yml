name: BUKLOD Formation R27 Production Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/formation_r27_production_deploy.yml'
      - 'scripts/patch-formation-r27.cjs'
      - 'supabase/migrations/20260907143000_formation_auto_validation_notifications_reminders_r27.sql'
      - 'supabase/migrations/20260911050000_formation_daily_pipeline_repair_r1.sql'
      - 'supabase/functions/buklod-ai-validate-response/**'
      - 'src/lib/buklodAiResponseValidation.ts'
      - 'src/components/LearningQuestionResponse.tsx'
      - 'src/app/learn/lesson.tsx'
      - 'src/app/bible/index.tsx'
      - 'src/app/reflection/**'

permissions:
  contents: read

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  EXPO_PUBLIC_APP_ENV: production
  EXPO_PUBLIC_STREAM_ANDROID_PUSH_PROVIDER_NAME: firebase-video-production

jobs:
  qa-web-android-ota:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify protected baseline before R27
        shell: bash
        run: |
          grep -F 'BUKLOD_LEGACY_VERIFICATION_REMOVAL_R22' 'src/app/index.tsx'
          grep -F 'HIGH_CONCURRENCY_LOGIN_R1' 'src/app/(auth)/login.tsx'
          grep -F 'BUKLOD_MAIN_AUTH_STORM_R21' 'src/lib/buklodAuthResilience.ts'
          test -f supabase/migrations/20260907074000_context_scope_formation_approval_r22b_hardening.sql
          test -f supabase/migrations/20260907143000_formation_auto_validation_notifications_reminders_r27.sql
          test -f supabase/migrations/20260911050000_formation_daily_pipeline_repair_r1.sql
          test -f supabase/functions/buklod-ai-validate-response/index.ts

      - name: Apply deterministic R27 client patch
        run: node scripts/patch-formation-r27.cjs

      - name: Verify R27 runtime anchors
        shell: bash
        run: |
          grep -F 'BUKLOD_FORMATION_AI_R27' 'src/lib/buklodAiResponseValidation.ts'
          grep -F "buklod-ai-validate-response" 'src/lib/buklodAiResponseValidation.ts'
          grep -F 'wasAutoApproved' 'src/components/LearningQuestionResponse.tsx'
          grep -F 'PENDING REVIEW' 'src/app/learn/lesson.tsx'
          grep -F 'PENDING SCOPE REVIEW' 'src/app/bible/index.tsx'
          grep -F 'SUBMIT FOR REVIEW' 'src/app/bible/index.tsx'
          grep -F 'submit_devotional_for_bayanihan' 'src/app/reflection/[id].tsx'
          grep -F 'buklod_try_auto_approve_lesson_v1' 'supabase/migrations/20260907143000_formation_auto_validation_notifications_reminders_r27.sql'
          grep -F 'buklod-formation-daily-reminders-r27' 'supabase/migrations/20260907143000_formation_auto_validation_notifications_reminders_r27.sql'
          grep -F 'buklod_is_formation_scope_approver_v1' 'supabase/migrations/20260911050000_formation_daily_pipeline_repair_r1.sql'

      - name: Verify no native or protected config drift
        shell: bash
        run: |
          if ! git diff --quiet -- package.json package-lock.json app.config.js eas.json .env.example .env.production.example .env.staging.example; then
            echo 'Protected native/config drift detected.'
            git diff -- package.json package-lock.json app.config.js eas.json .env.example .env.production.example .env.staging.example
            exit 1
          fi

      - name: TypeScript QA
        run: npx tsc --noEmit

      - name: Expo credential preflight
        shell: bash
        run: |
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo 'EXPO_TOKEN repository secret is missing.'
            exit 1
          fi
          npx eas-cli@latest whoami --non-interactive

      - name: Export production web
        run: npx expo export --platform web --output-dir dist

      - name: Deploy production web
        id: web_deploy
        shell: bash
        run: |
          set -o pipefail
          npx eas-cli@latest deploy --prod --non-interactive 2>&1 | tee r27-web-deploy.txt

      - name: Publish production Android OTA
        id: android_ota
        shell: bash
        run: |
          set -o pipefail
          npx eas-cli@latest update \
            --channel production \
            --platform android \
            --environment production \
            --message "BUKLOD Formation pipeline repair - Daily Reading and Devotion" \
            --non-interactive 2>&1 | tee r27-android-ota.txt

      - name: Preserve deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buklod-formation-r27-deploy-${{ github.run_number }}
          path: |
            r27-web-deploy.txt
            r27-android-ota.txt
          if-no-files-found: ignore

      - name: Deployment status
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.web_deploy.outcome }}" != "success" ]; then
            echo 'R27 web deployment failed.'
            exit 1
          fi
          if [ "${{ steps.android_ota.outcome }}" != "success" ]; then
            echo 'R27 Android OTA deployment failed.'
            exit 1
          fi
          echo 'BUKLOD_FORMATION_R27_PRODUCTION_DEPLOY=PASS'
