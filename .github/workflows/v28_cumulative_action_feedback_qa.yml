name: BUKLOD V28 Runtime132 Cumulative Feedback QA

on:
  push:
    branches: [codex/v28-action-feedback-cumulative132-20261022]
  pull_request:
    branches: [main]
    paths:
      - 'src/components/BuklodActionFeedback.tsx'
      - 'src/app/clusters/create.tsx'
      - 'src/app/organizations/create.tsx'
      - 'src/app/organizations/suborganizations.tsx'
      - 'src/app/admin/groups.tsx'
      - 'src/app/(auth)/register.tsx'
      - '__tests__/buklodActionFeedbackContract.test.js'
      - '.github/workflows/v28_cumulative_action_feedback_qa.yml'

permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Validate APK runtime remains 1.3.2
        run: |
          grep -F "runtimeVersion: isClassroom ? '1.3.0' : '1.3.2'" app.config.js
          grep -F "versionCode: isStaging ? undefined : 28" app.config.js
      - name: TypeScript compile
        run: npx tsc --noEmit
      - name: Creation feedback contract
        run: node --test __tests__/buklodActionFeedbackContract.test.js
