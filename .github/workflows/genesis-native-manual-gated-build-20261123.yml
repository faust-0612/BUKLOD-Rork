name: Genesis native Android — manual gated build (DEV only)

on:
  workflow_dispatch:
    inputs:
      build_apk:
        description: "Attempt native signed APK ONLY after every readiness gate passes"
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: genesis-native-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-preflight:
    if: github.ref_name == 'dev/genesis-manual-github-native-build-20261123'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source regressions (no SDK, no Godot download)
        run: |
          node --test tests/genesis-native-local-only-gate-20261123.test.mjs tests/genesis-native-android-host-20261123.test.mjs
      - name: Fail-closed feature and asset readiness check
        id: gate
        env:
          GENESIS_NATIVE_STAGING_SUPABASE_URL: ${{ secrets.GENESIS_NATIVE_STAGING_SUPABASE_URL }}
          GENESIS_NATIVE_STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.GENESIS_NATIVE_STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import {auditLocalNative} from './scripts/genesis-native-local-only-gate.mjs';
          import {appendFileSync} from 'node:fs';
          const result=await auditLocalNative(undefined,{checkTools:false});
          const ready=result.ok;
          appendFileSync(process.env.GITHUB_OUTPUT, 'ready='+String(ready)+'\n');
          console.log('Native source ready:',ready);
          for(const error of result.errors) console.log('BLOCK:',error);
          if(!ready) console.log('No Godot/SDK downloads or APK build will be attempted.');
          NODE

  signed-apk:
    needs: source-preflight
    if: ${{ inputs.build_apk && needs.source-preflight.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      GENESIS_NATIVE_STAGING_SUPABASE_URL: ${{ secrets.GENESIS_NATIVE_STAGING_SUPABASE_URL }}
      GENESIS_NATIVE_STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.GENESIS_NATIVE_STAGING_SUPABASE_PUBLISHABLE_KEY }}
      GENESIS_NATIVE_KEYSTORE_PASSWORD: ${{ secrets.GENESIS_NATIVE_KEYSTORE_PASSWORD }}
      GENESIS_NATIVE_KEY_ALIAS: ${{ secrets.GENESIS_NATIVE_KEY_ALIAS }}
      GENESIS_NATIVE_KEY_PASSWORD: ${{ secrets.GENESIS_NATIVE_KEY_PASSWORD }}
      GENESIS_NATIVE_SIGNING_CERT_SHA256: ${{ secrets.GENESIS_NATIVE_SIGNING_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Check required owner signing material before any compilation
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.GENESIS_NATIVE_SIGNING_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          for key in SIGNING_KEYSTORE_B64 GENESIS_NATIVE_KEYSTORE_PASSWORD GENESIS_NATIVE_KEY_ALIAS GENESIS_NATIVE_KEY_PASSWORD GENESIS_NATIVE_SIGNING_CERT_SHA256; do
            test -n "${!key:-}" || { echo "BLOCK: missing signing material: $key"; exit 1; }
          done
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/genesis-owner.jks"
          chmod 600 "$RUNNER_TEMP/genesis-owner.jks"
          echo "GENESIS_NATIVE_KEYSTORE_PATH=$RUNNER_TEMP/genesis-owner.jks" >> "$GITHUB_ENV"
      - name: Require trusted Godot 4.7.2 executable and export templates
        run: |
          echo 'BLOCK: Godot 4.7.2 binary/templates provenance and export preset not yet integrated.'
          echo 'No APK may be built from a substitute Godot version or preview-only content.'
          exit 1
      # Once approved Godot binaries/templates and the complete app exist,
      # add pack export, gradle :app:assembleRelease, APK verifier and 1-day artifact.
      # Do not upload an incomplete or unverified binary.

  blocked-summary:
    needs: source-preflight
    if: ${{ always() && needs.source-preflight.result == 'success' && needs.source-preflight.outputs.ready != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo 'BLOCKED BEFORE BUILD — source parity/assets/backend incomplete. No APK, no deployment.'
