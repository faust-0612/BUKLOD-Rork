name: BUKLOD Nov17 Follow and Messenger Consolidated Staging OTA Android 1.3.2
on:
  push:
    branches:
      - release/nov17-follow-connect-all-pending-staging132
permissions:
  contents: read
  actions: read
concurrency:
  group: buklod-nov17-all-pending-rc132
  cancel-in-progress: false
jobs:
  staging-android-only:
    if: ${{ github.repository == 'faust-0612/BUKLOD-Rork' && github.ref == 'refs/heads/release/nov17-follow-connect-all-pending-staging132' }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      APP_VARIANT: staging
      EXPO_PUBLIC_APP_ENV: staging
      BUKLOD_APP_TARGET: main
      EXPO_PUBLIC_STREAM_ANDROID_PUSH_PROVIDER_NAME: firebase-video-staging
      APK_SOURCE: c6804e5b6b72e6bb7658f5b13e32dd8a5d1de9fd
      RELEASE_MAIN_SHA: d9b6a5ba57a7fbc8b3b05b3bc37c5385425546d6
      ART_BASE: https://yhanxndaqbmuzbdqlblu.supabase.co/storage/v1/object/public/buklod-character-art-v1
      EVIDENCE_DIR: /tmp/buklod-nov17-follow-connect-rc132
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require exact canonical main and merged review proofs without altered app source
        env:
          ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/release/nov17-follow-connect-all-pending-staging132 | cut -f1)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$RELEASE_MAIN_SHA" "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$RELEASE_MAIN_SHA" || { echo 'Main moved during staged release'; exit 1; }
          git diff --exit-code "$RELEASE_MAIN_SHA" "$GITHUB_SHA" -- src/ assets/ supabase/ android/ ios/ plugins/ package.json package-lock.json app.config.js eas.json babel.config.js google-services.staging.json scripts/
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const repo=process.env.GITHUB_REPOSITORY;
          const sha=process.env.GITHUB_SHA;
          const main=process.env.RELEASE_MAIN_SHA;
          const requiredChanged=[
            '.buklod/scopes/nov17-follow-connect-staging-release.json',
            '.github/workflows/buklod-nov17-follow-connect-staging-ota.yml',
            'tests/nov17-follow-connect-staging-release.test.mjs',
          ].sort();
          const changed=execFileSync('git',['diff','--name-only',main,sha],{encoding:'utf8'}).trim().split('\n').filter(Boolean).sort();
          assert.deepEqual(changed,requiredChanged,'Release must have no extra app/release modifications');
          const get=async path=>{
            const res=await fetch('https://api.github.com/repos/'+repo+path,{
              headers:{authorization:'Bearer '+process.env.ACCESS_TOKEN,accept:'application/vnd.github+json'},
              signal:AbortSignal.timeout(20000)
            });
            assert.equal(res.status,200,'Required review proof unavailable: '+path);
            return res.json();
          };
          const reviews=[
            {number:900,head:'730c811cda97d106339f14fae04fb4b8890b0ed2',merge:'47eefd0c685f0c639227e9a887b1e1dda29b05e7',required:[
              'Engineering Accountability','BUKLOD Compact Layout Source QA (No OTA)',
              'BUKLOD Character R31-R40 Recovery QA','BUKLOD Performance R1 QA',
              'BUKLOD Main - Report Door and Legacy Integration PR QA','BUKLOD R38 Economy QA',
              'BUKLOD Real Recent Comment QA','BUKLOD Nov16 Consolidated Android Bundle QA (No OTA)'
            ]},
            {number:905,head:'bc257b59bec0ce3a315510c8bf9e2a472ff73939',merge:'1a90d0413efccae0bd850a8887fbf97c15d31e29',required:[
              'Engineering Accountability','BUKLOD Performance R1 QA',
              'BUKLOD Main - Report Door and Legacy Integration PR QA'
            ]},
            {number:906,head:'dcf3e16908a826f8be4b77fc6d1d8c4ef1a40d8d',merge:'59f896612e4c4cd60ea85763252cc96db5f0dc35',required:[
              'Engineering Accountability','BUKLOD Performance R1 QA',
              'BUKLOD Main - Report Door and Legacy Integration PR QA'
            ]},
            {number:910,head:'630107516446ebd3b6efef85b34dd3d3981e0b27',merge:'1e93d819170d04542503f58455c162d68f2e925a',required:[
              'Engineering Accountability','BUKLOD Performance R1 QA','BUKLOD Real Recent Comment QA'
            ]},
            {number:912,head:'e5d6facd6fc58d2d1e8d97f1b757b41900f46851',merge:'66614852ea3163b6cb9eafdad2db3c02a8f7558a',required:[
              'Engineering Accountability','BUKLOD Performance R1 QA','BUKLOD Compact Layout Source QA (No OTA)'
            ]}
            ,{number:913,head:'ef1e3d8187a1158694c1def3bb6d655d43ccc599',merge:'d9b6a5ba57a7fbc8b3b05b3bc37c5385425546d6',required:['Engineering Accountability','BUKLOD Compact Layout Source QA (No OTA)','BUKLOD Performance R1 QA','BUKLOD Main - Report Door and Legacy Integration PR QA','BUKLOD Real Recent Comment QA']},
            {number:914,head:'264a6632ba6cf68eb67780b569a6ec2053829b08',merge:'91508c2f2dfadd90682d992c0ce88c7e65fd99b7',required:['Engineering Accountability','BUKLOD Compact Layout Source QA (No OTA)','BUKLOD Performance R1 QA','BUKLOD Main - Report Door and Legacy Integration PR QA','BUKLOD Real Recent Comment QA']}
          ];
          for (const item of reviews) {
            const pr=await get('/pulls/'+item.number);
            assert.equal(pr.merged,true,'Required fix PR is not merged');
            assert.equal(pr.head.sha,item.head,'Expected fix source changed');
            assert.equal(pr.merge_commit_sha,item.merge,'Reviewed main ancestry changed');
            const runs=(await get('/actions/runs?head_sha='+item.head+'&per_page=100')).workflow_runs;
            for(const name of item.required) assert.ok(runs.some(r=>
              r.name===name&&r.event==='pull_request'&&r.head_sha===item.head&&r.conclusion==='success'
            ),'Exact merged PR source CI missing: '+item.number+' / '+name);
          }
          const ad=readFileSync('src/components/BuklodCommunityInlineAd.android.tsx','utf8');
          const connect=readFileSync('src/components/BuklodConnectThread.tsx','utf8');
          const wall=readFileSync('src/app/(tabs)/buklod.tsx','utf8');
          const character=readFileSync('src/lib/buklodCharacterCollectibles.ts','utf8');
          const player=readFileSync('src/components/CommunityVideo.tsx','utf8');
          const feedback=readFileSync('src/lib/buklodUserFeedback.ts','utf8');
          const messenger=readFileSync('src/app/(tabs)/messages.tsx','utf8');
          const bubbles=readFileSync('src/components/BuklodCommunityWallProfileBubbles.tsx','utf8');
          assert.ok(wall.includes("alignItems:'flex-end',flexShrink:0,gap:2")&&wall.includes('toggleAuthorFollow('),'Latest author Follow right-rail placement missing');
          assert.ok(wall.includes("openReport('post', item.id)"),'Wall Report placement/handler missing');
          assert.ok(messenger.includes('<ConnectInboxTabs')&&messenger.includes('BuklodFirstViewAd'),'Messenger-style Connect inbox or protected first-view ads missing');
          assert.ok(bubbles.includes('noteZoneEmpty'),'Dynamic Wall Notes cannot reserve empty height');
          assert.ok(wall.includes('const target=index>=0?wallVideoPosts[index]:tappedPost;'),'Tapped video fullscreen fallback missing');
          assert.ok(player.includes('pointerEvents="none"')&&player.includes('Full screen'),'Android video tap/fullscreen action missing');
          assert.ok(feedback.includes('trackBuklodFeedbackEvent'),'Network feedback code missing');
          assert.ok(ad.includes('preferBannerAfterNativeFailures')&&ad.includes('getBuklodDashboardAdPreloadState'),'Exact reviewed main fixes missing: Wall ad recovery + prewarm');
          assert.ok(connect.includes('connectOlderPrependScrollOffset')&&connect.includes('userMomentumRef'),'Exact reviewed main fixes missing: Connect scroll');
          assert.ok(wall.includes('pickCommunityPhotos')||wall.includes('pickCommunity'),'Exact reviewed main fixes missing: gallery');
          assert.ok(character.includes('collectible'),'Exact reviewed main fixes missing: Character art');
          const m=JSON.parse(readFileSync('.buklod/scopes/nov17-follow-connect-staging-release.json','utf8'));
          assert.equal(m.baseRef,main);
          assert.equal(m.contractVersion,2);
          console.log('Main frozen, seven merged PRs verified, source unmodified and three release files only',sha);
          NODE
      - name: Verify unchanged signed native baseline, Android staging identity and compact/Character QA
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$APK_SOURCE" "$GITHUB_SHA" -- app.config.js eas.json package-lock.json android/ ios/ plugins/ google-services.staging.json babel.config.js
          node <<'NODE'
          const a=require('node:assert/strict'),cp=require('node:child_process');
          const prior=JSON.parse(cp.execFileSync('git',['show',process.env.APK_SOURCE+':package.json'],{encoding:'utf8'}));
          const current=require('./package.json');
          a.deepEqual(current.dependencies,prior.dependencies,'No unverified native deps in OTA');
          a.deepEqual(current.devDependencies,prior.devDependencies,'Lockfile/deps parity required');
          const app=require('./app.config.js')({config:{}});
          const eas=require('./eas.json');
          a.equal(app.android.package,'org.mzbministry.buklod.staging');
          a.equal(app.runtimeVersion,'1.3.2');
          a.equal(app.extra.appEnvironment,'staging');
          a.equal(app.extra.appTarget,'main');
          a.equal(eas.build['staging-user'].channel,'staging-user');
          a.equal(eas.build['staging-user'].environment,'preview');
          a.notEqual(eas.build.production.channel,eas.build['staging-user'].channel);
          NODE
          npm ci --ignore-scripts --no-audit --no-fund
          npx tsc --noEmit
          npm run character:contract
          npm run compact:contract
          npm run release:base-gate
          node --experimental-strip-types --test \
            tests/buklod-character-art-contract-20261116.test.mjs \
            tests/buklod-character-art-release-contract-20261116.test.mjs \
            tests/appwide-compact-density-20261116.test.mjs \
            tests/nov16-wall-connect-dynamic-note-rail.test.mjs \
            tests/dashboard-ad-navigation-prewarm-20261116.test.mjs \
            tests/wall-gallery-navigation-recovery-20261117.test.mjs \
            tests/connect-latest-scroll-rebound-20261117.test.mjs \
            tests/connect-scroll-read-cursor-and-ads-isolation-20261117.test.mjs \
            tests/buklod-wall-ad-stability.test.mjs \
            tests/nov17-follow-connect-staging-release.test.mjs \
            tests/wall-header-navigation-20261117.test.mjs \
            tests/nov16-wall-identity-navigation.test.cjs \
            tests/nov16-wall-author-date-avatar-privacy.test.cjs \
            tests/messenger-inbox-density-20261117.test.mjs \
            tests/messenger-wall-nav-density-20261117.test.mjs \
            tests/messenger-navigation-scroll-20261117.test.mjs \
            tests/marites-swipe-video-fullscreen.test.mjs \
            tests/wall-video-fullscreen-navigation-20261117.test.mjs \
            tests/wall-network-feedback-20261117.test.mjs \
            tests/wall-network-navigation-20261117.test.mjs \
            tests/offline-global-sync-quiet-20261117.test.cjs \
            tests/nov17-consolidated-staging-release-gate.test.mjs \
            tests/nov16-wall-nav-ads-prewarm-integration.test.mjs \
            tests/wall-media-density-20261116.test.mjs \
            tests/character-density-20261116.test.mjs \
            tests/compact-ota-release-20261116.test.mjs \
            tests/nov16-compact-art-staging-release.test.mjs \
            tests/buklod-ads-appwide-permanent-lock-20261111.test.mjs \
            tests/ad-dashboard-focus-performance-20261116.test.mjs \
            tests/navigation-scroll-density-20261116.test.mjs
      - name: Verify public artwork manifest and publication marker before bundling
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import {createHash} from 'node:crypto';
          const base=process.env.ART_BASE,sha=b=>createHash('sha256').update(b).digest('hex');
          async function file(path) {
            const res=await fetch(base+'/'+path,{headers:{'cache-control':'no-cache'},signal:AbortSignal.timeout(20000)});
            assert.equal(res.status,200,'Art unavailable: '+path);
            return Buffer.from(await res.arrayBuffer());
          }
          const m=await file('collectible-art-manifest.json');
          const marker=JSON.parse((await file('published-v1.json')).toString('utf8'));
          const manifest=JSON.parse(m.toString('utf8'));
          assert.equal(marker.ready,true);assert.equal(marker.total,1300);
          assert.equal(marker.manifest_sha256,sha(m));
          assert.equal(manifest.catalogue_version,'BUKLOD_CHARACTER_R31_R40_1300');
          assert.equal(manifest.items.length,1300);
          const seen=new Set();
          for (const item of manifest.items) {
            assert.match(item.path,/^character-collectibles\/(phan|quin|van|christian|lhen|ace|ellusur|jawo|mitch|niel|angel|vhen|trudice)\/l(0[1-9]|1[0-9]|20)-i0[1-5]\.webp$/);
            assert.ok(!seen.has(item.path));seen.add(item.path);
          }
          for(let i=0;i<manifest.items.length;i+=100){
            const item=manifest.items[i];assert.equal(sha(await file(item.path)),item.sha256,'Public art mismatch: '+item.path);
          }
          console.log('Public readback/marker SHA and 13 deterministic character samples PASS');
          NODE
      - name: Verify existing signed staging APK and production baseline
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          mkdir -p "$EVIDENCE_DIR"
          npx --yes eas-cli@27.9.0 build:view bc4be208-bfb0-42f3-95cb-358353d0600f --json > "$EVIDENCE_DIR/build.json"
          npx --yes eas-cli@27.9.0 channel:view staging-user --json --non-interactive > "$EVIDENCE_DIR/staging-channel.json"
          npx --yes eas-cli@27.9.0 channel:view production --json --non-interactive > "$EVIDENCE_DIR/production-channel.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          import {verifyBuild,verifyChannels,manifest} from './scripts/navigation-v2-owner-staging-policy.mjs';
          const d=process.env.EVIDENCE_DIR,read=f=>JSON.parse(fs.readFileSync(d+'/'+f,'utf8'));
          verifyBuild(read('build.json'));
          const stage=verifyChannels(read('staging-channel.json'),read('production-channel.json'));
          const prod=await manifest('production');
          assert.equal(prod.extra?.expoClient?.android?.package,'org.mzbministry.buklod');
          fs.writeFileSync(d+'/preflight.json',JSON.stringify({sourceSha:process.env.GITHUB_SHA,stagingBranch:stage,productionUpdateId:prod.id,physicalDeviceVerified:false},null,2));
          NODE
      - name: Expo Android Hermes preview export (exact release commit)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@27.9.0 env:pull --environment preview --path /tmp/buklod-nov17-preview.env --non-interactive > /dev/null
          set -a; . /tmp/buklod-nov17-preview.env; set +a
          export APP_VARIANT=staging EXPO_PUBLIC_APP_ENV=staging BUKLOD_APP_TARGET=main
          export EXPO_PUBLIC_BUKLOD_CHARACTER_ART_BASE_URL="$ART_BASE"
          npx expo config --json > /tmp/buklod-nov17-config.json
          node <<'NODE'
          const a=require('node:assert/strict'),c=require('/tmp/buklod-nov17-config.json');
          a.equal(c.android.package,'org.mzbministry.buklod.staging');
          a.equal(c.runtimeVersion,'1.3.2');
          a.equal(c.extra.appEnvironment,'staging');
          NODE
          EXPO_MAX_WORKERS=2 npx expo export --platform android --output-dir /tmp/buklod-nov17-android --clear
          test -s /tmp/buklod-nov17-android/metadata.json
      - name: Idempotent publish to staging-user Android only
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@27.9.0 update:list --branch staging-user --limit 50 --json --non-interactive > "$EVIDENCE_DIR/prior.json"
          node <<'NODE'
          const a=require('node:assert/strict'),fs=require('node:fs'),d=process.env.EVIDENCE_DIR;
          const raw=JSON.parse(fs.readFileSync(d+'/prior.json','utf8')),rows=raw.currentPage??raw;
          a.ok(Array.isArray(rows));
          const prior=rows.find(x=>x.message==='BUKLOD_NOV17_FOLLOW_CONNECT_'+process.env.GITHUB_SHA);
          fs.writeFileSync(d+'/existing-group',prior?.group||'');
          NODE
          if [ ! -s "$EVIDENCE_DIR/existing-group" ]; then
            npx --yes eas-cli@27.9.0 update --channel staging-user --platform android --environment preview --skip-bundler --input-dir /tmp/buklod-nov17-android --non-interactive --json --message "BUKLOD_NOV17_FOLLOW_CONNECT_$GITHUB_SHA" > "$EVIDENCE_DIR/publish.json"
            node <<'NODE'
          const a=require('node:assert/strict'),fs=require('node:fs'),d=process.env.EVIDENCE_DIR;
          const updates=JSON.parse(fs.readFileSync(d+'/publish.json','utf8'));
          a.ok(Array.isArray(updates)&&updates.length===1&&updates[0].group);
          fs.writeFileSync(d+'/existing-group',updates[0].group);
          NODE
          fi
          npx --yes eas-cli@27.9.0 update:view "$(cat "$EVIDENCE_DIR/existing-group")" --json > "$EVIDENCE_DIR/update-view.json"
      - name: Verify staging manifest ID, exact runtime, and production unchanged
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@27.9.0 channel:view staging-user --json --non-interactive > "$EVIDENCE_DIR/staging-channel-after.json"
          npx --yes eas-cli@27.9.0 channel:view production --json --non-interactive > "$EVIDENCE_DIR/production-channel-after.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          import {verifyChannels,verifyUpdate,manifest} from './scripts/navigation-v2-owner-staging-policy.mjs';
          const d=process.env.EVIDENCE_DIR,read=f=>JSON.parse(fs.readFileSync(d+'/'+f,'utf8'));
          const pre=read('preflight.json');
          const u=verifyUpdate(read('update-view.json'),pre.sourceSha,pre.stagingBranch.name);
          const stage=verifyChannels(read('staging-channel-after.json'),read('production-channel-after.json'));
          assert.equal(stage.id,pre.stagingBranch.id);
          const liveStage=await manifest('staging-user');
          assert.equal(liveStage.id.toLowerCase(),u.id.toLowerCase());
          assert.equal(liveStage.extra?.expoClient?.android?.package,'org.mzbministry.buklod.staging');
          assert.equal(liveStage.extra?.expoClient?.extra?.appEnvironment,'staging');
          const production=await manifest('production');
          assert.equal(production.id,pre.productionUpdateId,'Production changed during staging OTA');
          const proof={status:'VERIFIED STAGING OTA',commit:pre.sourceSha,channel:'staging-user',runtime:'1.3.2',androidPackage:'org.mzbministry.buklod.staging',stagingUpdateId:u.id,groupId:u.group,productionUnchanged:production.id,physicalDeviceVerified:false};
          fs.writeFileSync(d+'/verification.json',JSON.stringify(proof,null,2)+'\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,JSON.stringify(proof,null,2)+'\n');
          NODE
      - name: Archive evidence without exposing secrets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buklod-nov17-follow-connect-staging-${{ github.sha }}
          path: /tmp/buklod-nov17-follow-connect-rc132/*.json
          retention-days: 14
          if-no-files-found: ignore
