name: BUKLOD Classroom R4 Integration QA

on:
  push:
    branches:
      - feature/classroom-student-native-r4
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-and-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/classroom-student-native-r4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Apply surgical Classroom R4 wiring
        shell: python
        run: |
          from pathlib import Path
          import re

          # 1) BUKLOD Main Profile: remove student My Classrooms quick action only.
          p = Path('src/app/(tabs)/me.tsx')
          s = p.read_text(encoding='utf-8')
          before = s
          pattern = re.compile(r"\n\s*\{\s*\n\s*key:\s*'classrooms',\s*\n\s*icon:\s*'google-classroom',\s*\n\s*label:\s*'My Classrooms',\s*\n\s*onPress:\s*\(\)\s*=>\s*router\.push\('/profile/buklod-classrooms'\s+as\s+any\),\s*\n\s*\},", re.M)
          s, n = pattern.subn('', s, count=1)
          if n == 0 and "key: 'classrooms'" in s:
              raise SystemExit('Could not safely remove My Classrooms quick action')
          if s != before:
              p.write_text(s, encoding='utf-8')

          # 2) Faculty class: add Academic Control Center without removing Faculty interaction room.
          p = Path('src/app/profile/buklod-faculty-class.tsx')
          s = p.read_text(encoding='utf-8')
          marker = 'BUKLOD_CLASSROOM_R4_ACADEMIC_CONTROL'
          anchor = '        {/* BUKLOD_CLASSROOM_R1_FACULTY_ENTRY */}'
          if marker not in s:
              if anchor not in s:
                  raise SystemExit('Faculty Classroom anchor moved')
              block = '''        {/* BUKLOD_CLASSROOM_R4_ACADEMIC_CONTROL */}
        <Pressable
          onPress={() =>
            router.push({
              pathname: '/profile/buklod-faculty-academic-control' as any,
              params: { id: classroomId, classroomId, name: classroomName },
            })
          }
          style={({ pressed }) => [styles.academicControl, pressed && { opacity: 0.84 }]}
        >
          <View style={styles.academicControlIcon}>
            <MaterialCommunityIcons name="school-outline" size={27} color="#1f7a3f" />
          </View>
          <View style={{ flex: 1 }}>
            <Text style={styles.academicControlTitle}>Academic Control Center</Text>
            <Text style={styles.academicControlText}>Program-adaptive setup, Prelim–Finals weights, syllabus/course flow, RLE/OJT, monitoring, interventions and grade governance.</Text>
          </View>
          <MaterialCommunityIcons name="chevron-right" size={23} color="#fff" />
        </Pressable>

'''
              s = s.replace(anchor, block + anchor, 1)
              style_anchor = "  sectionHeader: { flexDirection: 'row', justifyContent: 'space-between', alignItems: 'center' },"
              if style_anchor not in s:
                  raise SystemExit('Faculty class style anchor moved')
              styles = "  academicControl: { backgroundColor: '#17311f', borderRadius: 18, padding: 16, marginBottom: 10, flexDirection: 'row', alignItems: 'center', gap: 12 },\n  academicControlIcon: { width: 48, height: 48, borderRadius: 15, backgroundColor: '#e7f4e9', alignItems: 'center', justifyContent: 'center' },\n  academicControlTitle: { color: '#fff', fontWeight: '900', fontSize: 17 },\n  academicControlText: { color: '#d4e5d8', lineHeight: 17, fontSize: 11, marginTop: 3 },\n"
              s = s.replace(style_anchor, styles + style_anchor, 1)
              p.write_text(s, encoding='utf-8')

          # 3) Student grade details: term -> categories instead of flattening term records.
          p = Path('apps/buklod-classroom/app/class/[id]/[section].tsx')
          s = p.read_text(encoding='utf-8')
          old_start = "  if(section==='grades'){const h=data?.health||{};return <><View style={s.hero}>"
          next_anchor = "  if(section==='attendance')return"
          if 'TERM BREAKDOWN R4' not in s:
              start = s.find(old_start)
              end = s.find(next_anchor)
              if start < 0 or end < 0 or end <= start:
                  raise SystemExit('Student grade block anchor moved')
              new_block = '''  if(section==='grades'){const h=data?.health||{};const termMode=h.mode==='TERM_WEIGHTED';return <><View style={s.hero}><Text style={s.heroBig}>{h.current_percent==null?'—':`${Number(h.current_percent).toFixed(2)}%`}</Text><Text style={s.heroTitle}>{String(h.standing||'NOT YET COMPUTABLE').replaceAll('_',' ')}</Text><Text style={s.heroSub}>Passing: {h.passing_percent??75}% • {h.pending_requirements??0} pending • {h.overdue_requirements??0} overdue</Text><Text style={s.projection}>Released records only • projection is not a guaranteed final grade</Text></View>{/* TERM BREAKDOWN R4 */}{termMode?(h.breakdown??[]).map((term:any,i:number)=><View key={String(term.term_key??i)} style={s.termCard}><View style={s.termHead}><View><Text style={s.termTitle}>{term.term_label||term.term_key}</Text><Text style={s.meta}>{Number(term.term_weight||0).toFixed(1)}% of course • {term.complete?'complete components':'in progress'}</Text></View><Text style={s.termPercent}>{term.term_percent==null?'—':`${Number(term.term_percent).toFixed(2)}%`}</Text></View>{(term.categories??[]).map((b:any,j:number)=><View key={String(b.category_id??j)} style={s.categoryLine}><View style={{flex:1}}><Text style={s.cardTitle}>{b.category_name||'Component'}</Text><Text style={s.meta}>{Number(b.weight_percent||0).toFixed(1)}% within term • {b.possible>0?`${b.earned}/${b.possible}`:'no released score yet'}</Text></View><Text style={s.value}>{b.category_percent==null?'—':`${Number(b.category_percent).toFixed(1)}%`}</Text></View>)}</View>):(h.breakdown??[]).map((b:any,i:number)=><View key={String(b.category_id??i)} style={s.line}><View><Text style={s.cardTitle}>{b.category_name||b.name||'Component'}</Text><Text style={s.meta}>{b.weight_percent}% weight</Text></View><Text style={s.value}>{b.category_percent==null?'—':`${Number(b.category_percent).toFixed(1)}%`}</Text></View>)}<Text style={s.section}>Released grade items</Text>{(data?.items??[]).map((g:any)=><View key={g.grade_item_id} style={s.line}><View style={{flex:1}}><Text style={s.cardTitle}>{g.title}</Text><Text style={s.meta}>{[g.term_key,g.category_name,g.source_system].filter(Boolean).join(' • ')}</Text></View><Text style={s.value}>{g.score}/{g.points_possible}</Text></View>)}</>}
'''
              s = s[:start] + new_block + s[end:]
              style_anchor = "const s=StyleSheet.create({"
              if style_anchor not in s:
                  raise SystemExit('Student section style anchor moved')
              # inject styles immediately after object start
              inject = "const s=StyleSheet.create({projection:{fontSize:10,color:'#5f7465',marginTop:8},termCard:{backgroundColor:'#fff',borderRadius:18,padding:14,marginBottom:12,borderWidth:1,borderColor:'#dfe8e1'},termHead:{flexDirection:'row',justifyContent:'space-between',alignItems:'flex-start',gap:12,marginBottom:8},termTitle:{fontSize:16,fontWeight:'900',color:'#203828'},termPercent:{fontSize:20,fontWeight:'900',color:'#1f7a3f'},categoryLine:{flexDirection:'row',alignItems:'center',gap:10,paddingVertical:10,borderTopWidth:1,borderTopColor:'#edf1ed'},"
              s = s.replace(style_anchor, inject, 1)
              p.write_text(s, encoding='utf-8')

      - name: Static integration anchors
        run: |
          ! grep -q "key: 'classrooms'" "src/app/(tabs)/me.tsx"
          grep -q "BUKLOD_CLASSROOM_R4_ACADEMIC_CONTROL" src/app/profile/buklod-faculty-class.tsx
          grep -q "buklod-faculty-academic-control" src/app/profile/buklod-faculty-class.tsx
          grep -q "TERM BREAKDOWN R4" "apps/buklod-classroom/app/class/[id]/[section].tsx"
          grep -q "buklod_classroom_student_released_grade_items_v2" apps/buklod-classroom/src/core.ts || true

      - name: TypeScript - BUKLOD Main
        run: npx tsc --noEmit

      - name: TypeScript - BUKLOD Classroom student app
        run: npx tsc -p apps/buklod-classroom/tsconfig.json --noEmit

      - name: Commit safe wiring
        run: |
          if git diff --quiet; then
            echo "No integration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "src/app/(tabs)/me.tsx" src/app/profile/buklod-faculty-class.tsx "apps/buklod-classroom/app/class/[id]/[section].tsx"
          git commit -m "feat(classroom): separate student app and wire faculty academic control"
          git push origin HEAD:feature/classroom-student-native-r4
