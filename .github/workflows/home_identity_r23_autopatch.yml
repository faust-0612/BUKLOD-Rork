name: BUKLOD Home Identity R23 Auto Patch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/home_identity_r23_autopatch.yml'
      - 'scripts/apply-home-identity-r23.cjs'
  workflow_dispatch:

permissions:
  contents: write

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  EXPO_PUBLIC_APP_ENV: production
  CI: '1'

jobs:
  patch-test-commit-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply Home identity R23
        run: node scripts/apply-home-identity-r23.cjs

      - name: Verify exact scope
        shell: bash
        run: |
          git diff --exit-code -- . ':!src/app/(tabs)/home.tsx' ':!src/components/BuklodPublicWordShortcut.tsx' || {
            echo 'R23 changed an unexpected file.'
            exit 1
          }
          grep -F 'BUKLOD_HOME_IDENTITY_R23_CLEAN_TWO_ROW' 'src/app/(tabs)/home.tsx'
          grep -F 'BUKLOD_HOME_IDENTITY_R23_EQUAL_SHORTCUTS' 'src/components/BuklodPublicWordShortcut.tsx'
          grep -F "router.push('/profile/buklod-classrooms' as any)" 'src/components/BuklodPublicWordShortcut.tsx'
          if grep -F 'PATCH_191I_A_MY_CLUSTER_COMPACT_HOME_TILE' 'src/app/(tabs)/home.tsx'; then
            echo 'Old oversized My Cluster block remains.'
            exit 1
          fi

      - name: TypeScript QA
        run: npx tsc --noEmit

      - name: Commit patched source to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'src/app/(tabs)/home.tsx' 'src/components/BuklodPublicWordShortcut.tsx'
          if git diff --cached --quiet; then
            echo 'R23 is already present on main.'
          else
            git commit -m 'Fix Home identity card layout R23'
            git push origin HEAD:main
          fi

      - name: Expo credential preflight
        id: expo
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo 'EXPO_TOKEN is unavailable; source is committed but deploy cannot run.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx eas-cli@latest whoami --non-interactive
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Export production web
        if: steps.expo.outputs.ready == 'true'
        env:
          NODE_ENV: production
        run: |
          rm -rf dist
          npx expo export --platform web --output-dir dist --clear
          node scripts/inject-adsense-web-head.cjs dist

      - name: Deploy production web
        if: steps.expo.outputs.ready == 'true'
        env:
          NODE_ENV: production
        run: npx eas-cli@latest deploy --prod --non-interactive

      - name: Publish Android production OTA
        if: steps.expo.outputs.ready == 'true'
        run: |
          npx eas-cli@latest update \
            --channel production \
            --platform android \
            --environment production \
            --message 'BUKLOD Home Identity R23 Clean Layout' \
            --non-interactive

      - name: Final status
        shell: bash
        run: |
          echo 'BUKLOD HOME R23 COMPLETE'
          echo 'Full-width name + horizontal rank + equal bottom action row.'
          echo 'My Classroom route preserved; Quiz SSO untouched.'
