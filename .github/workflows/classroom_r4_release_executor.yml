name: BUKLOD Classroom Standalone Android Identity Release

on:
  push:
    branches:
      - release/classroom-r4-assets-20260908-r1
    paths:
      - '.github/workflows/classroom_r4_release_executor.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  CI: '1'
  EXPECTED_SOURCE_SHA: b2b96b0d7ca0fe6333d89183de7c1ff6b07a3930
  BUKLOD_APP_TARGET: classroom
  EXPO_PUBLIC_BUKLOD_APP_TARGET: classroom
  APP_VARIANT: production
  EXPO_PUBLIC_APP_ENV: production
  CLASSROOM_GOOGLE_SERVICES_FILE: ./google-services.classroom.json

jobs:
  android-classroom-identity-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact locked Classroom source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          fetch-depth: 1

      - name: Prove exact source
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          echo "CLASSROOM_SOURCE_SHA=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED_SOURCE_SHA"
          test -f .classroom-source-lock

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Expo credential preflight
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}"
          npx eas-cli@latest whoami --non-interactive

      - name: Permanent Classroom identity guard
        shell: bash
        run: |
          set -euo pipefail
          EAS_BUILD_PROFILE=classroom-production-apk node scripts/verify-classroom-identity.mjs
          npx expo config --type public --json > /tmp/classroom-config.json
          node <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const c=JSON.parse(fs.readFileSync('/tmp/classroom-config.json','utf8'));
          assert.equal(c.name,'BUKLOD Classroom');
          assert.equal(c.slug,'buklod-classroom');
          assert.equal(c.scheme,'buklod-classroom');
          assert.equal(c.android.package,'org.mzbministry.buklod.classroom');
          assert.equal(c.extra?.appTarget,'classroom');
          assert.equal(c.extra?.eas?.projectId,'14100ed1-7f25-4551-9627-09d280498241');
          assert.equal(c.android.googleServicesFile,'./google-services.classroom.json');
          assert.equal(c.icon,'./assets/classroom/app-icon.png');
          assert.equal(c.android.adaptiveIcon.foregroundImage,'./assets/classroom/adaptive-icon.png');
          console.log('CLASSROOM_EXPO_CONFIG=PASS');
          NODE

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Clean Android prebuild and native identity audit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          npx expo prebuild --platform android --clean --no-install
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/res/values/strings.xml
          test -f android/app/google-services.json
          grep -Fq 'namespace "org.mzbministry.buklod.classroom"' android/app/build.gradle
          grep -Fq 'applicationId "org.mzbministry.buklod.classroom"' android/app/build.gradle
          grep -Fq '<string name="app_name">BUKLOD Classroom</string>' android/app/src/main/res/values/strings.xml
          node <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const g=JSON.parse(fs.readFileSync('android/app/google-services.json','utf8'));
          const packages=(g.client||[]).map(x=>x?.client_info?.android_client_info?.package_name).filter(Boolean);
          assert.ok(packages.includes('org.mzbministry.buklod.classroom'));
          console.log('GENERATED_FIREBASE_CLASSROOM_CLIENT=PASS');
          NODE
          ! grep -Fq '<string name="app_name">BUKLOD</string>' android/app/src/main/res/values/strings.xml
          echo 'ANDROID_PREBUILD_CLASSROOM_IDENTITY=PASS'

      - name: TypeScript after prebuild
        run: npx tsc --noEmit

      - name: Build exact Classroom production APK
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli@latest build --platform android --profile classroom-production-apk --non-interactive 2>&1 | tee /tmp/eas-build.log

      - name: Resolve and download newest exact Classroom APK
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli@latest build:list --platform android --limit 10 --json --non-interactive > /tmp/builds.json
          EXPECTED="$EXPECTED_SOURCE_SHA" node <<'NODE'
          const fs=require('node:fs');
          const builds=JSON.parse(fs.readFileSync('/tmp/builds.json','utf8'));
          const expected=process.env.EXPECTED;
          const matches=builds.filter(b =>
            b.status === 'FINISHED' &&
            b.platform === 'ANDROID' &&
            b.buildProfile === 'classroom-production-apk' &&
            (!b.gitCommitHash || b.gitCommitHash === expected) &&
            b.artifacts?.buildUrl
          );
          if(!matches.length) throw new Error('No finished exact Classroom APK build found');
          const b=matches[0];
          fs.writeFileSync('/tmp/build-url.txt',b.artifacts.buildUrl);
          fs.writeFileSync('/tmp/build-id.txt',b.id);
          fs.writeFileSync('/tmp/build-meta.json',JSON.stringify(b,null,2));
          console.log(`CLASSROOM_BUILD_ID=${b.id}`);
          NODE
          curl -L --fail --retry 5 --retry-delay 3 "$(cat /tmp/build-url.txt)" -o /tmp/BUKLOD-Classroom.apk
          test -s /tmp/BUKLOD-Classroom.apk
          sha256sum /tmp/BUKLOD-Classroom.apk | tee /tmp/apk-sha256.txt

      - name: Verify final APK package label version and signature
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name aapt -print | sort -V | tail -1)"
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner -print | sort -V | tail -1)"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          "$AAPT" dump badging /tmp/BUKLOD-Classroom.apk > /tmp/apk-badging.txt
          cat /tmp/apk-badging.txt | head -40
          grep -Fq "package: name='org.mzbministry.buklod.classroom'" /tmp/apk-badging.txt
          grep -Fq "application-label:'BUKLOD Classroom'" /tmp/apk-badging.txt
          "$APKSIGNER" verify --verbose /tmp/BUKLOD-Classroom.apk | tee /tmp/apksigner.txt
          echo 'FINAL_CLASSROOM_APK_IDENTITY=PASS'

      - name: Install and launch APK in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r /tmp/BUKLOD-Classroom.apk
            adb shell pm list packages | grep -F 'package:org.mzbministry.buklod.classroom'
            adb shell monkey -p org.mzbministry.buklod.classroom -c android.intent.category.LAUNCHER 1
            sleep 18
            adb shell dumpsys window windows > /tmp/window.txt || true
            grep -Fq 'org.mzbministry.buklod.classroom' /tmp/window.txt
            adb shell uiautomator dump /sdcard/classroom-window.xml >/dev/null || true
            adb pull /sdcard/classroom-window.xml /tmp/classroom-window.xml >/dev/null || true
            test -s /tmp/classroom-window.xml
            grep -Fq 'BUKLOD Classroom' /tmp/classroom-window.xml
            ! grep -Fq 'Samahang Binuklod ng Pag-ibig' /tmp/classroom-window.xml
            adb exec-out screencap -p > /tmp/classroom-runtime.png
            echo 'INSTALLED_CLASSROOM_RUNTIME=PASS'

      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buklod-classroom-standalone-android-${{ github.run_number }}
          path: |
            /tmp/eas-build.log
            /tmp/build-meta.json
            /tmp/apk-sha256.txt
            /tmp/apk-badging.txt
            /tmp/apksigner.txt
            /tmp/classroom-window.xml
            /tmp/classroom-runtime.png
          if-no-files-found: ignore
