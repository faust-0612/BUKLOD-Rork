name: BUKLOD Genesis Unified Signed APK Binary Proof DEV (NO EAS / OTA / PROD)
on:
  push:
    branches:
      - dev/genesis-unified-signed-apk-evidence-20261122
    paths:
      - .github/workflows/genesis-unified-eas-binary-proof-dev-20261122.yml
      - .github/workflows/genesis-unified-staging-signed-rc-20261122.yml
      - scripts/genesis-unified-verify-signed-apk.mjs
      - tests/genesis-unified-verify-signed-apk-20261122.test.mjs
      - .buklod/scopes/genesis-unified-eas-signature-guard-20261122.json

permissions:
  contents: read

jobs:
  exact-source-apk-release-guard:
    if: ${{ github.repository == 'faust-0612/BUKLOD-Rork' && github.ref == 'refs/heads/dev/genesis-unified-signed-apk-evidence-20261122' && startsWith(github.event.head_commit.message, 'BUKLOD_GODOT_CERT_EVIDENCE_QA:') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject invalid EAS verification code and missing audited release scope
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/genesis-unified-verify-signed-apk.mjs
          node --test tests/genesis-unified-verify-signed-apk-20261122.test.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const scope=JSON.parse(readFileSync('.buklod/scopes/genesis-unified-eas-signature-guard-20261122.json'));
          assert.equal(scope.contractVersion,2);
          assert.equal(scope.baseRef,'integration/genesis-unified-godot-native-staging-20261122');
          assert.equal(scope.releaseMode,'DEV_ONLY_NO_EAS_NO_OTA_NO_PRODUCTION');
          const required=[
            'scripts/genesis-unified-verify-signed-apk.mjs',
            'tests/genesis-unified-verify-signed-apk-20261122.test.mjs',
            '.github/workflows/genesis-unified-staging-signed-rc-20261122.yml',
            '.github/workflows/genesis-unified-eas-binary-proof-dev-20261122.yml'
          ];
          for(const f of required)assert.ok(scope.allowedPaths.includes(f),'Undeclared protected release change: '+f);
          console.log('SIGNED_APK_BINARY_PROOF_SOURCE=PASS; no EAS build was attempted');
          NODE
      - name: Preserve deliberate signed staging hold (no costly remote build)
        run: node scripts/genesis-unified-signed-stage-preflight.mjs
      - name: End without distributing any APK or changing backend
        run: echo 'Source proof only. NO EAS build, NO signed RC, NO OTA, NO prod or Google Play.'
