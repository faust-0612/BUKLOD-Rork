name: BUKLOD Nov15 Read-only Release Receipt Audit
on:
  push:
    branches: [audit/nov15-conso-ota-receipt-readonly]
    paths: [.github/workflows/buklod-nov15-conso-release-receipt-audit.yml]
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  report-stage-receipt:
    if: ${{ github.repository == 'faust-0612/BUKLOD-Rork' && startsWith(github.event.head_commit.message, 'BUKLOD_READONLY_NOV15_RECEIPT_AUDIT:') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Report actual GitHub Actions staging release run IDs without publishing
        uses: actions/github-script@v7
        with:
          script: |
            const head='d1c39f1688d8b0f2059f750a327589603e7d372b';
            const wanted='BUKLOD Nov15 Consolidated Staging Android OTA Publish';
            const {data}=await github.rest.actions.listWorkflowRunsForRepo({
              ...context.repo, per_page:100, branch:'integration/buklod-nov15-conso-video-ads-staging-rc'
            });
            const exact=data.workflow_runs.filter(r=>r.name===wanted && r.head_sha===head);
            let lines=[
              '<!-- nov15-conso-readonly-release-receipt-audit -->',
              '### Read-only Nov15 consolidated Android OTA release audit',
              'Trigger source: `'+head+'`',
              'Matches: '+exact.length,
            ];
            for(const r of exact){
              lines.push('- [Staging release run #'+r.id+']('+r.html_url+') — '+r.status+' / '+(r.conclusion||'pending')+', event='+r.event);
              const artifacts=await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo, run_id:r.id, per_page:100
              });
              for(const a of artifacts.data.artifacts){
                lines.push('  - Evidence artifact '+a.id+': '+a.name+' (expired='+a.expired+')');
              }
            }
            if(!exact.length)lines.push('No matching staging publish workflow run was returned; do not assume an OTA was published.');
            lines.push('No EAS publication or mutation was performed by this read-only audit.');
            await github.rest.issues.createComment({...context.repo,issue_number:817,body:lines.join('\n')});
