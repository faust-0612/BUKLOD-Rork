name: Kingdom Native Lab - isolated Android APK (manual only)

# Single opt-in build request, scoped to an exact isolated DEV branch.
# No schedule, OTA, production or EAS deployment.
on:
  workflow_dispatch:
  push:
    branches:
      - dev/kingdom-native-lab-isolated-20261114
    paths:
      - .buklod/build-requests/kingdom-native-lab-once-20261114.json

permissions:
  contents: write

concurrency:
  group: kingdom-native-lab-android-manual
  cancel-in-progress: false

jobs:
  isolated-debug-apk:
    if: github.repository == 'faust-0612/BUKLOD-Rork' && github.ref == 'refs/heads/dev/kingdom-native-lab-isolated-20261114'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: '1'
      BUKLOD_APP_TARGET: kingdom-native-lab
      APP_VARIANT: staging
      EXPO_PUBLIC_APP_ENV: staging
      EXPO_PUBLIC_KINGDOM_NATIVE_LAB: '1'
      EXPO_PUBLIC_SUPABASE_URL: https://buklod-kingdom-native-lab.invalid
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: isolated-lab-no-real-supabase-key
      EXPO_NO_TELEMETRY: '1'
      EXPO_MAX_WORKERS: '2'
    steps:
      - name: Checkout exact isolated branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact source identity before installing dependencies
        run: |
          test "$GITHUB_REF_NAME" = 'dev/kingdom-native-lab-isolated-20261114'
          test "$BUKLOD_APP_TARGET" = 'kingdom-native-lab'
          git diff --quiet
          git diff --cached --quiet
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Run source safety tests without any native download
        run: |
          node scripts/kingdom-lab/make-offline-firebase.cjs
          node scripts/kingdom-lab/preflight.cjs --build
          node --test tests/kingdom-native-lab-isolation-20261114.test.mjs
          node --test tests/kingdom-godot-zero-assets-20261114.test.mjs
          node --experimental-strip-types --test tests/kingdom-zero-cost-living-world-20261114.test.mjs
          node --test tests/kingdom-zero-cost-village-diorama-20261114.test.mjs
        env:
          KINGDOM_LAB_GOOGLE_SERVICES_FILE: ./google-services.kingdomlab.offline.json
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install pinned repository dependencies
        run: npm ci --no-audit --no-fund
      - name: Local no-EAS Android APK (standalone third identity)
        run: bash scripts/kingdom-lab/build-local.sh
      - name: Verify built APK package, fail if not the third app
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$AAPT"
          PACKAGE="$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          test "$PACKAGE" = 'org.mzbministry.buklod.kingdomlab' || {
            echo 'Refusing unsafe package: '"$PACKAGE"
            exit 1
          }
          sha256sum "$APK" > kingdom-native-lab-apk.sha256
          echo 'APK package: '"$PACKAGE" >> "$GITHUB_STEP_SUMMARY"
          echo 'Source head: '"$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Offline-only experimental APK. No staging-user or production OTA.' >> "$GITHUB_STEP_SUMMARY"
      - name: Keep only isolated APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: buklod-kingdom-native-lab-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            kingdom-native-lab-apk.sha256
          if-no-files-found: error
          retention-days: 3
      - name: Record exact APK build outcome in isolated DEV branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: dev/kingdom-native-lab-isolated-20261114
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const data={
            reportKind:'BUKLOD_KINGDOM_NATIVE_LAB_BUILD',
            source_sha:process.env.SOURCE_SHA,
            run_id:Number(process.env.RUN_ID),
            branch:process.env.BRANCH,
            job_status:process.env.RESULT,
            package_id:'org.mzbministry.buklod.kingdomlab',
            runtime:'1.4.0-kingdom-native-lab.1',
            published_to_staging:false,
            published_to_production:false,
            apk_artifact_expected:process.env.RESULT==='success'
          };
          fs.writeFileSync('/tmp/kingdom-native-lab-report.json',JSON.stringify(data,null,2)+'\n');
          NODE
          # Write to the isolated DEV branch only. This path never retriggers
          # the workflow; neither OTA nor main/staging-user is touched.
          ENCODED="$(base64 -w0 /tmp/kingdom-native-lab-report.json)"
          gh api --method PUT "repos/${{ github.repository }}/contents/.buklod/reports/kingdom-native-lab-last-build.json" \
            -f branch="$BRANCH" \
            -f message="ci(lab): record isolated Android source build outcome" \
            -f content="$ENCODED" >/dev/null
