name: BUKLOD Report - Manual Web Production Release

on:
  push:
    branches:
      - work/buklod-report-modernization-20260912
    paths:
      - '.github/workflows/buklod_report_web_manual_release.yml'

permissions:
  contents: read

env:
  CI: '1'
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  BUKLOD_APP_TARGET: report
  EXPO_PUBLIC_APP_ENV: production
  APP_VARIANT: production
  REPORT_RELEASE_TARGET: web
  REPORT_EAS_PROJECT_ID: cc69b3c0-a5df-4b69-a84c-887c36242fdd
  EXPO_PUBLIC_REPORT_EAS_PROJECT_ID: cc69b3c0-a5df-4b69-a84c-887c36242fdd
  EXPO_PUBLIC_SUPABASE_URL: https://yhanxndaqbmuzbdqlblu.supabase.co
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_RWvrYHzgLMvBousgwn4dTg_QawYzwRS

jobs:
  release-report-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Report release branch
        uses: actions/checkout@v4
        with:
          ref: work/buklod-report-modernization-20260912

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Enforce Report-only branch and Expo identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/work/buklod-report-modernization-20260912"
          test -n "${EXPO_TOKEN:-}"
          npx expo config --type public --json > /tmp/report-config.json
          node - <<'NODE'
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync('/tmp/report-config.json','utf8'));
          const exp = raw.expo || raw;
          const expectedProject = 'cc69b3c0-a5df-4b69-a84c-887c36242fdd';
          if (exp.name !== 'BUKLOD Report') throw new Error(`Wrong app name: ${exp.name}`);
          if (exp.slug !== 'buklod-report') throw new Error(`Wrong slug: ${exp.slug}`);
          if (exp.extra?.appTarget !== 'report') throw new Error(`Wrong app target: ${exp.extra?.appTarget}`);
          if (exp.extra?.eas?.projectId !== expectedProject) throw new Error(`Wrong EAS project: ${exp.extra?.eas?.projectId}`);
          if (exp.android?.package !== 'org.mzbministry.buklod.report') throw new Error(`Wrong package: ${exp.android?.package}`);
          if (exp.web?.output !== 'static') throw new Error(`Report web output must be static, got ${exp.web?.output}`);
          console.log('REPORT_IDENTITY_GATE_PASS', { name: exp.name, slug: exp.slug, projectId: exp.extra.eas.projectId });
          NODE

      - name: Production Report preflight
        run: node scripts/production-preflight.mjs

      - name: Verify production migration inventory
        run: |
          mkdir -p release
          node scripts/verify-production-migrations.mjs > release/PRODUCTION_MIGRATION_HASHES.json
          node -e "const x=require('./release/PRODUCTION_MIGRATION_HASHES.json'); if(x.migration_count!==45) process.exit(1); console.log('REPORT_MIGRATION_GATE_PASS',x.migration_count)"

      - name: TypeScript - standalone Report graph only
        run: npx tsc -p tsconfig.report.json --noEmit

      - name: Export standalone Report web only
        run: |
          rm -rf dist-report-production
          npx expo export --platform web --output-dir dist-report-production
          test -f dist-report-production/index.html

      - name: Verify EAS account and dedicated Report project
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli@latest whoami --non-interactive
          npx eas-cli@latest project:info --non-interactive | tee report-project-info.txt
          grep -F 'cc69b3c0-a5df-4b69-a84c-887c36242fdd' report-project-info.txt

      - name: Deploy standalone Report web to production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli@latest deploy --prod --environment production --export-dir dist-report-production --non-interactive 2>&1 | tee report-web-deploy-output.txt

      - name: Preserve Report release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buklod-report-web-release-${{ github.run_number }}
          path: |
            report-project-info.txt
            report-web-deploy-output.txt
            release/PRODUCTION_MIGRATION_HASHES.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Final release assertion
        shell: bash
        run: |
          test "${{ steps.deploy.outcome }}" = "success"
          echo 'BUKLOD_REPORT_WEB_PRODUCTION_RELEASE_PASS'
          echo 'BUKLOD_MAIN_NOT_DEPLOYED'
