name: BUKLOD Empire Arena Godot Native QA and Offline APK
on:
  push:
    branches:
      - dev/arena-godot-native-migration-20261122
    paths:
      - .github/workflows/arena-godot-native-dev-qa-20261122.yml
      - godot/empire-arena/**
      - scripts/build-empire-godot-pack.mjs
      - plugins/withBuklodGodotArenaPack.js
      - modules/buklod-genesis-godot/**
      - tests/arena-godot-native-migration-20261122.test.mjs
      - src/app/games/empire-arena.tsx
      - app.config.js

permissions:
  contents: read
concurrency:
  group: buklod-empire-godot-native-offline-20261122
  cancel-in-progress: true

jobs:
  godot-android-offline:
    if: github.repository == 'faust-0612/BUKLOD-Rork' && github.ref == 'refs/heads/dev/arena-godot-native-migration-20261122' && startsWith(github.event.head_commit.message, 'BUKLOD_GODOT_ARENA_RC:')
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      APP_VARIANT: staging
      EXPO_PUBLIC_APP_ENV: staging
      BUKLOD_APP_TARGET: main
      EXPO_PUBLIC_BUKLOD_SEASON2_GENESIS_PREVIEW: 'true'
      EXPO_PUBLIC_BUKLOD_ARENA_GODOT_ENABLED: 'true'
      EXPO_PUBLIC_BUKLOD_SOS_NATIVE_R3: 'true'
      EXPO_PUBLIC_BUKLOD_ARENA_EXPERIMENTAL: 'true'
      EXPO_PUBLIC_BUKLOD_ARENA_RANKED_ENABLED: 'false'
      EXPO_PUBLIC_SUPABASE_URL: https://genesis-godot-offline.invalid
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_OFFLINE_GODOT_NOT_REAL
      EXPO_PUBLIC_STREAM_ANDROID_PUSH_PROVIDER_NAME: firebase-video-staging
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify staging identity, offline isolation, and stage Firebase client
        run: |
          set -euo pipefail
          node <<'NODE'
          const a=require('node:assert/strict');
          const app=require('./app.config.js')({config:{}});
          a.equal(app.android.package,'org.mzbministry.buklod.staging');
          a.equal(app.runtimeVersion,'2.0.2-genesis-godot-arena');
          a.equal(app.version,'2.0.2');
          a.equal(process.env.EXPO_PUBLIC_BUKLOD_ARENA_RANKED_ENABLED,'false');
          a.equal(process.env.EXPO_PUBLIC_SUPABASE_URL,'https://genesis-godot-offline.invalid');
          a.equal(app.plugins.includes('./plugins/withBuklodGodotArenaPack.js'),true);
          a.equal(app.plugins.find(p=>Array.isArray(p)&&p[0]==='react-native-google-mobile-ads')[1].androidAppId,
            'ca-app-pub-3940256099942544~3347511713');
          const fs=require('node:fs'),fb=JSON.parse(fs.readFileSync('google-services.production.json','utf8'));
          fb.client=(fb.client||[]).filter(c=>c.client_info?.android_client_info?.package_name===app.android.package);
          a.equal(fb.client.length,1,'Staging Firebase registration required');
          fs.writeFileSync('google-services.staging.json',JSON.stringify(fb));
          console.log('OFFLINE ONLY / NO LIVE BACKEND / NO RANKED LEDGER / NO PRODUCTION');
          NODE
      - name: Canonical parity, static tests, TypeScript and ZIP extraction
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/arena-godot-native-migration-20261122.test.mjs
          node --test tests/arena-300-match-pickups-20261122.test.mjs tests/arena-library-starter-character-integration-20261122.test.mjs
          npx tsc --noEmit
          node scripts/build-empire-godot-pack.mjs --out=/tmp/buklod-empire-arena.zip
          unzip -t /tmp/buklod-empire-arena.zip
          mkdir -p /tmp/buklod-godot-project
          unzip -q /tmp/buklod-empire-arena.zip -d /tmp/buklod-godot-project
      - name: Actual Godot 4.7.2 headless scene and game checks
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 --connect-timeout 20 --max-time 240 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot-4.7.2.zip
          mkdir -p /tmp/godotbin
          unzip -q /tmp/godot-4.7.2.zip -d /tmp/godotbin
          GODOT=$(find /tmp/godotbin -type f -name 'Godot_*linux.x86_64' -print -quit)
          test -n "$GODOT"
          chmod +x "$GODOT"
          "$GODOT" --version | grep -F '4.7.2'
          "$GODOT" --headless --path /tmp/buklod-godot-project --editor --quit 2>&1 | tee /tmp/godot-source.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|Failed to load script' /tmp/godot-source.log; then exit 1; fi
          "$GODOT" --headless --path /tmp/buklod-godot-project --script res://tests/smoke.gd 2>&1 | tee /tmp/godot-smoke.log
          grep -F 'BUKLOD_GODOT_SMOKE_PASS' /tmp/godot-smoke.log
      - name: Build Android native project and confirm embedded Godot archive
        run: |
          set -euo pipefail
          node scripts/genesis-prepare-skia-binaries.mjs
          node scripts/genesis-assert-native-autolinking.mjs
          npx expo prebuild --platform android --clean --no-install
          test -s android/app/src/main/assets/godot/empire-arena.zip
          cmp /tmp/buklod-empire-arena.zip android/app/src/main/assets/godot/empire-arena.zip
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Inspect binary, Godot engine, pack parity, signature and package
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -Z -1 "$APK" | grep -Ei '^lib/arm64-v8a/.*godot.*\.so$'
          unzip -Z -1 "$APK" | grep -Fx 'assets/godot/empire-arena.zip'
          unzip -p "$APK" assets/godot/empire-arena.zip > /tmp/apk-bundled-godot.zip
          cmp /tmp/buklod-empire-arena.zip /tmp/apk-bundled-godot.zip
          BT=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          test -x "$BT/aapt"
          test -x "$BT/apksigner"
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/aapt" dump badging "$APK" | grep -F "package: name='org.mzbministry.buklod.staging'"
          sha256sum "$APK" | tee godot-staging-apk-sha256.txt
          node -e 'const fs=require("fs");fs.writeFileSync("godot-staging-apk-receipt.json",JSON.stringify({sha:process.env.GITHUB_SHA,package:"org.mzbministry.buklod.staging",runtime:"2.0.2-genesis-godot-arena",engine:"4.7.2",godotHeadlessTested:true,backend:"INVALID_OFFLINE_ENDPOINT",ranked:false,apkSignature:"DEBUG_NOT_EAS",deviceTested:false,otaPublished:false,productionUnchanged:true},null,2))'
      - name: Preserve APK and check evidence (offline debug only)
        uses: actions/upload-artifact@v4
        with:
          name: buklod-empire-godot-offline-arm64-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            godot-staging-apk-sha256.txt
            godot-staging-apk-receipt.json
          if-no-files-found: error
          retention-days: 7
