name: BUKLOD Genesis R2 Android-safe portrait asset conversion (DEV ONLY)
on:
  push:
    branches:
      - fix/genesis-r2-portrait-android-fallback-20261121
    paths:
      - .github/workflows/genesis-r2-convert-portrait-webp-to-jpeg-20261121.yml
permissions:
  contents: write
concurrency:
  group: genesis-r2-portrait-dev-asset-convert
  cancel-in-progress: false
jobs:
  convert-canonical-art-only:
    if: github.repository == 'faust-0612/BUKLOD-Rork' && github.ref == 'refs/heads/fix/genesis-r2-portrait-android-fallback-20261121'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Convert EXISTING owner approved bytes to Android JPEG; embed offline rescue
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow==11.3.0
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64, hashlib, io
          directory=Path('assets/season2/genesis/world')
          outputs=[
            ('buklod-genesis-portrait-welcome-720x995', (720,995),
             'e8a2ee3f7d6f00b2ce657f0d4662dfd0258da018f4131d740e90414b56076f1a'),
            ('buklod-genesis-portrait-9doors-720x670',(720,670),
             'eff12f78b11b7d45286647a128a438a0065fe61777e5fe39cc1f3d18ff7123d4'),
          ]
          module=Path('src/features/season2/genesis/genesisPortraitFallback.generated.ts')
          content=["/** Offline JPEG fallback from SHA-verified owner-approved illustration. Do not modify by hand. */"]
          for prefix,dimensions,sha in outputs:
            raw=(directory/(prefix+'.webp')).read_bytes()
            assert hashlib.sha256(raw).hexdigest()==sha,'Approved original changed: '+prefix
            img=Image.open(io.BytesIO(raw)).convert('RGB')
            assert img.size==dimensions,(prefix,img.size)
            jpg=directory/(prefix+'.jpg')
            img.save(jpg,'JPEG',quality=86,optimize=True,subsampling=1,progressive=False)
            assert jpg.read_bytes()[:3]==b'\xff\xd8\xff'
            rescue=io.BytesIO()
            img.save(rescue,'JPEG',quality=70,optimize=True,subsampling=2,progressive=False)
            b64=base64.b64encode(rescue.getvalue()).decode('ascii')
            name='GENESIS_PORTRAIT_RESCUE_URI' if dimensions==(720,995) else 'GENESIS_COMPACT_RESCUE_URI'
            content.append("export const "+name+"='data:image/jpeg;base64,"+b64+"';")
            print(prefix,'jpeg',jpg.stat().st_size,'offline rescue',len(b64),'verified',sha)
          module.write_text('\n'.join(content)+'\n')
          PY
      - name: Enforce isolated asset outputs and commit DEV binaries
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/fix/genesis-r2-portrait-android-fallback-20261121"
          git add assets/season2/genesis/world/buklod-genesis-portrait-welcome-720x995.jpg \
                  assets/season2/genesis/world/buklod-genesis-portrait-9doors-720x670.jpg \
                  src/features/season2/genesis/genesisPortraitFallback.generated.ts
          python - <<'PY'
          import subprocess
          paths=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          expected={'assets/season2/genesis/world/buklod-genesis-portrait-welcome-720x995.jpg',
                    'assets/season2/genesis/world/buklod-genesis-portrait-9doors-720x670.jpg',
                    'src/features/season2/genesis/genesisPortraitFallback.generated.ts'}
          assert paths==expected,(paths,expected)
          PY
          git config user.name "buklod-genesis-ci"
          git config user.email "buklod-genesis-ci@users.noreply.github.com"
          git commit -m "fix(genesis): bundle Android JPEG and inline offline fallback of approved portrait"
          git push origin HEAD:fix/genesis-r2-portrait-android-fallback-20261121
