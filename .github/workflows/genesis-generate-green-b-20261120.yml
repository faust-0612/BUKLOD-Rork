name: BUKLOD Genesis Canonical Transparent B Asset - DEV No Build No OTA
on:
  push:
    branches:
      - dev/genesis-silent-ota-native-integration-20261120
    paths:
      - scripts/genesis-extract-transparent-mark.py
      - .github/workflows/genesis-generate-green-b-20261120.yml
permissions:
  contents: read
jobs:
  cutout-transparent-green-b:
    if: ${{ github.repository == 'faust-0612/BUKLOD-Rork' && startsWith(github.event.head_commit.message, 'BUKLOD_GENESIS_GENERATE_MARK:') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Extract exact canonical green B with true transparent alpha
        run: |
          python3 scripts/genesis-extract-transparent-mark.py --emit-base64
      - name: No remote image generation, backend, release or OTA
        run: echo 'Generated deterministic brand-only PNG; never deployed or altered production.'
