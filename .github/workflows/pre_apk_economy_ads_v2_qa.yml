name: BUKLOD Pre-APK Economy Ads V2 QA

on:
  push:
    branches:
      - codex/pre-apk-economy-ads-v2-20260928
  pull_request:
    branches:
      - web-map-life-combined-20260928

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify live-web ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 0c4991462c2564e6ab4430140d97f06ba0600c5a HEAD
          echo "LIVE_WEB_RC_ANCESTRY=PASS"
          echo "HEAD=$(git rev-parse HEAD)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Targeted contract tests
        shell: bash
        run: |
          set -euo pipefail
          if [ -x node_modules/.bin/jest ]; then
            npx jest --runInBand \
              __tests__/buklodAdMonetizationPolicy.test.ts \
              __tests__/buklodCommunityContribution*.test.ts \
              --passWithNoTests
          fi

      - name: Web export regression gate
        env:
          EXPO_PUBLIC_APP_ENV: production
        run: npx expo export --platform web --output-dir dist-pre-apk-economy-v2

      - name: Android JS export regression gate
        env:
          EXPO_PUBLIC_APP_ENV: production
          APP_VARIANT: production
          BUKLOD_APP_TARGET: main
        run: npx expo export --platform android --output-dir dist-pre-apk-android-v2 --clear

      - name: Verify protected release identity
        shell: bash
        run: |
          set -euo pipefail
          grep -F "'org.mzbministry.buklod'" app.config.js
          grep -F 'versionCode: isStaging ? undefined : 22' app.config.js
          grep -F '"production-apk"' eas.json
          grep -F '"buildType": "apk"' eas.json
          grep -F "BUKLOD_COMMUNITY_FEED_MODES_ALL_R2" 'src/app/(tabs)/buklod.tsx'
          grep -F "BUKLOD_COMMUNITY_AUTHOR_FOLLOW_ALL_R2" 'src/app/(tabs)/buklod.tsx'
          grep -F "get_my_buklod_community_contribution_v2" src/lib/buklodCommunityContributionEconomy.ts
          grep -F "Legacy revenue split is read-only" src/lib/buklodRewards.ts
          grep -F "org_wall_feed" src/components/BuklodCommunityInlineAd.tsx
          grep -F "cluster_wall_feed" src/components/BuklodCommunityInlineAd.tsx
          grep -F "placementId: stablePlacementId" src/components/BuklodAdMobBanner.tsx
          echo "PRE_APK_QA=PASS"
