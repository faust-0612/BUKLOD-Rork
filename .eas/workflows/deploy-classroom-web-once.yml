name: BUKLOD Classroom Web Production Deploy

# One-shot Expo/EAS production web release for the current canonical main.
# WEB ONLY: no Android/iOS build, no OTA update, no backend migration.
on:
  push:
    branches: ['main']
    paths:
      - '.eas/workflows/deploy-classroom-web-once.yml'

jobs:
  deploy_web:
    name: Verify and deploy BUKLOD Classroom web
    type: deploy
    environment: production
    hooks:
      after_install_node_modules:
        - name: TypeScript QA
          run: npx tsc --noEmit
        - name: Verify Classroom web release anchors
          run: |
            set -euo pipefail
            grep -F 'BUKLOD_CLASSROOM_ACCOUNT_ISOLATION_R2' 'src/app/profile/buklod-classrooms.tsx'
            grep -F 'buklod_classroom_start_live_v1' 'src/app/profile/buklod-classroom.tsx'
            grep -F "key: 'quickcheck'" 'src/lib/education/facultyAutopilot.ts'
            grep -F 'BUKLOD_WEB_RESPONSIVE_SPLIT_R3' 'src/components/BuklodNavSafeShell.web.tsx'
    params:
      prod: true
