name: BUKLOD Community Feed Modes Web Release

# One-shot WEB ONLY release gate for Community Wall feed modes.
# No Android/iOS build. No OTA update. No database migration.
on:
  push:
    branches: ['main']
    paths:
      - '.eas/workflows/deploy-community-feed-modes-once.yml'
    if: ${{ contains(github.commit_message, '[web-only]') }}

jobs:
  qa:
    name: Verify Community web release
    steps:
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: |
          grep -F "type FeedMode='for_you'|'following'|'latest';" 'src/app/(tabs)/buklod.tsx'
          grep -F "p_mode: feedMode" 'src/app/(tabs)/buklod.tsx'
          grep -F "BUKLOD_COMMUNITY_FEED_MODES_R1" 'src/app/(tabs)/buklod.tsx'
          grep -F "BUKLOD_COMMUNITY_AUTHOR_FOLLOW_R1" 'src/app/(tabs)/buklod.tsx'
          grep -F "buklod_user_follows" 'src/app/(tabs)/buklod.tsx'

  deploy_web:
    name: Deploy BUKLOD web production
    needs: [qa]
    type: deploy
    environment: production
    params:
      prod: true
