plugins { id 'com.android.application' }
def ownerSigning = System.getenv('BUKLOD_EMPIRE_KEYSTORE_FILE')
def requireSigning = System.getenv('BUKLOD_EMPIRE_REQUIRE_RELEASE_SIGNING') == 'true'
if (requireSigning && !ownerSigning) throw new GradleException('Durable Empire keystore required')
android {
 namespace 'org.mzbministry.buklod.empire'
 compileSdk 35
 defaultConfig {
  applicationId 'org.mzbministry.buklod.empire'
  minSdk 24
  targetSdk 35
  versionCode 3
  versionName '0.1.2-dev'
  ndk { abiFilters 'arm64-v8a', 'x86_64' }
 }
 signingConfigs {
  if (ownerSigning) {
   owner {
    storeFile file(ownerSigning)
    storePassword System.getenv('BUKLOD_EMPIRE_KEYSTORE_PASSWORD')
    keyAlias System.getenv('BUKLOD_EMPIRE_KEY_ALIAS')
    keyPassword System.getenv('BUKLOD_EMPIRE_KEY_PASSWORD')
   }
  }
 }
 buildTypes {
  release {
   // Preserve all Godot JNI bindings in this dedicated game host.
   minifyEnabled false
   signingConfig (ownerSigning ? signingConfigs.owner : signingConfigs.debug)
   proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
  }
 }
}
dependencies {
 implementation 'org.godotengine:godot:4.7.2.stable'
 implementation 'androidx.fragment:fragment:1.8.9'
}
